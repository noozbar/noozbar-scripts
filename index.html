touche de tir, le MOD se coupe instantanément.\n**Cas d'usage idéal :** Utile pour caler un assist de visée en phase de repérage sans interférer avec le contrôle du recul lors du tir."}]},{"id":"act-fire-only","titre":"💥 FIRE Only *(Tir au jugé exclusif / Hip-fire)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD s'active **uniquement** quand vous tirez au jugé sans viser. Si vous appuyez sur la touche de visée, le MOD s'arrête immédiatement.\n**Cas d'usage idéal :** Parfait pour un Drop Shot ou un Jump Shot destiné uniquement aux combats au jugé au très proche corps-à-corps."}]},{"id":"vibrations-adt","titre":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨","blocs":[{"type":"texte","style":"h2","contenu":"⚠️ Réglages indispensables dans la console / plateforme ET dans le jeu :"},{"type":"texte","style":"p","contenu":"Les vibrations et les gâchettes adaptatives *(réglées sur Standard / Normal)* doivent **obligatoirement être activées** à la fois dans les paramètres système de votre console ou plateforme et dans les menus d'options internes de votre jeu.\n\n*Pourquoi ?* Plusieurs fonctionnalités avancées du script (notamment la détection automatique des véhicules, du tir et des états d'armes) s'appuient directement sur ces signaux pour fonctionner."},{"type":"carte","couleur":"jaune","contenu":"💡 **Astuce si vous n'aimez pas les vibrations :** Si vous ne souhaitez pas ressentir les secousses physiques dans les mains, **ne les coupez pas dans la console ou le jeu** ! Désactivez-les directement depuis le menu OLED **Controller** du script."},{"type":"texte","style":"h1","contenu":"🛠️ Chemins d'accès aux paramètres par plateforme :"},{"type":"texte","style":"h2","contenu":"🎮 PlayStation 5 (PS5)","couleurHex":"#3d9bff","fondCouleur":"#3d9bff","fondOpacite":14},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Paramètres de la console","contenu":"*Paramètres* ➔ *Accessoires* ➔ *Manette (Général)*"},{"titre":"Réglages à appliquer","blocs":[{"type":"liste","contenu":"- **Intensité des vibrations** ➔ **Standard (forte)**\n- **Intensité de l'effet gâchette** ➔ **Standard (forte)**"}]},{"titre":"Dans le jeu","contenu":"Rendez-vous dans les paramètres audio/manette de votre jeu et vérifiez que les **Vibrations** et la **Fonction gâchette adaptative** sont réglées sur **Oui / Activé**."}]},{"type":"texte","style":"h2","contenu":"🎮 Xbox (Xbox Series X/S & Xbox One)","couleurHex":"#4ade5a","fondCouleur":"#4ade5a","fondOpacite":14},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Paramètres de la console","contenu":"Appuyez sur le bouton Xbox ➔ *Profil et système* ➔ *Paramètres* ➔ *Accessibilité* ➔ *Manette* *(ou via l'application accessoires Xbox)*."},{"titre":"Réglage à appliquer","blocs":[{"type":"liste","contenu":"- Cochez la case **Activer les vibrations**."}]},{"titre":"Dans le jeu","contenu":"Rendez-vous dans le menu options/manette de votre jeu et activez l'option **Vibrations**."}]},{"type":"texte","style":"h2","contenu":"💻 PC (Joueurs Steam)","couleurHex":"#ff9f43","fondCouleur":"#ff9f43","fondOpacite":14},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Paramètres Steam","contenu":"Ouvrez Steam ➔ En haut à gauche, cliquez sur *Steam* ➔ *Paramètres* (Settings/Preferences) ➔ *Manette* (Controller)."},{"titre":"Réglages à appliquer","blocs":[{"type":"liste","contenu":"- Activer l'option **Steam Input** pour les manettes associées.\n- Dans *Paramètres généraux de la manette*, assurez-vous que les **Vibrations** (Rumble) sont bien activées."}]},{"titre":"Dans le jeu","contenu":"Dans les options de votre jeu sur PC, veillez à ce que le **Retour de force / Vibrations** soit sur **Activé**."}]}],"fiche":{"colonnes":[{"titre":"Comprendre","liens":[{"titre":"⚠️ Pourquoi les activer ?","de":0,"a":2}]},{"titre":"Activer sur votre plateforme","liens":[{"titre":"🎮 PlayStation 5","de":4,"a":5},{"titre":"🎮 Xbox","de":6,"a":7},{"titre":"💻 PC (Steam)","de":8,"a":9}]}]}},{"id":"quick-toggle","titre":"⏱️ Le menu Quick Toggle (Raccourcis en Jeu)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les Quick Toggles et comment fonctionnent-ils ?"},{"type":"texte","style":"p","contenu":"Les **Quick Toggles** vous permettent d'attribuer des combinaisons de touches personnalisées sur votre manette pour activer ou désactiver un MOD à la volée en plein combat, sans jamais ouvrir le menu du script sur l'écran OLED."},{"type":"texte","style":"h2","contenu":"🛠️ Configuration dans le menu"},{"type":"texte","style":"p","contenu":"Dans le menu **Quick Toggle**, vous pouvez paramétrer jusqu'à **4 raccourcis indépendants** :"},{"type":"liste","contenu":"**Ligne 1 (Raccourci) :** Choisissez l'une des 4 combinaisons de touches disponibles.\n**Ligne 2 (MOD attribué) :** Sélectionnez le MOD que vous souhaitez lier à ce raccourci parmi la liste des MODs disponibles."},{"type":"texte","style":"h2","contenu":"⚙️ Comment exécuter un Quick Toggle en jeu ?"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Activation / Désactivation","contenu":"En plein jeu, maintenez la combinaison de touches choisie pendant **1 à 2 secondes**."},{"titre":"Confirmation visuelle","contenu":"Maintenez la pression jusqu'à ce que le nouvel état du MOD (*Enabled* ou *Disabled*) s'affiche directement sur l'écran OLED de votre Cronus Zen."}]}],"fiche":{"colonnes":[{"titre":"Comprendre les Quick Toggles","liens":[{"titre":"❓ Qu'est-ce que les Quick Toggles ?","de":0,"a":1}]},{"titre":"Régler et utiliser les Quick Toggles","liens":[{"titre":"🛠️ Configuration dans le menu","de":2,"a":4},{"titre":"⚙️ Comment exécuter un Quick Toggle en jeu ?","de":5,"a":6}]}]}},{"id":"activity-gta6-fishing","titre":"🎣 Fishing (Pêche automatique)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Fishing et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le MOD **Fishing** automatise l'intégralité du processus de pêche. Il gère le moulinage lent pour attirer le poisson, le ferrage instantané dès la touche, et le ramener rapidement au bord. L'écran OLED du Cronus Zen affiche l'état exact de la pêche en temps réel."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Mise en place","contenu":"Équipez votre canne à pêche au bord d'un cours d'eau."},{"titre":"Lancement","contenu":"Ouvrez le menu **Activity** du script et lancez **Fishing** en appuyant sur {CROSS / A}."},{"titre":"Préparation","contenu":"Sélectionnez votre leurre ou votre appât dans le jeu."},{"titre":"Lancer de ligne","contenu":"Maintenez {L2 / LT} puis {R2 / RT}, puis relâchez {R2 / RT} pour jeter la ligne. Relâchez ensuite tous les boutons de la manette.","blocs":[{"type":"liste","contenu":"*Note : Si le lancer ne vous convient pas, appuyez sur* {CIRCLE / B} *pour annuler et relancez votre ligne.*"}]},{"titre":"Gestion automatique par le script","blocs":[{"type":"liste","contenu":"Le script mouline doucement à votre place pour stimuler les poissons.\nDès qu'un poisson mord à l'hameçon, le script le ferre automatiquement.\nLe script bascule en moulinage rapide pour ramener la prise au plus vite."}]},{"titre":"Combats avec le poisson","contenu":"Lorsque le poisson se débat, le script stoppe automatiquement le moulinage. Orientez simplement votre stick pour contrer les déplacements du poisson. Dès qu'il se calme, le script reprend le moulinage rapide."},{"titre":"Fin de prise","contenu":"Choisissez en jeu de garder le poisson ou de le rejeter à l'eau. Remettez un appât si nécessaire et relancez votre ligne."}]}],"scripts":["gta6"],"fiche":{"colonnes":[{"titre":"Comprendre le Fishing","liens":[{"titre":"❓ Qu'est-ce que le Fishing ?","de":0,"a":1}]},{"titre":"Utiliser le Fishing","liens":[{"titre":"⚙️ Procédure étape par étape","de":2,"a":3}]}]}},{"id":"activity-gta6-bench-press","titre":"🏋️ Bench Press (Développé couché)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Bench Press et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le MOD **Bench Press** vous aide à réussir l'activité de musculation du développé couché dans *GTA 6*.\n\nDans cette activité, les deux gâchettes doivent être enfoncées exactement de la même façon, sinon la barre penche à gauche ou à droite. Le script met donc les gâchettes **en miroir** : vous n'en pressez qu'une, et l'autre reproduit exactement le même mouvement, pour une barre toujours parfaitement équilibrée."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Mise en place","contenu":"Installez votre personnage sur le banc de musculation en jeu."},{"titre":"Lancement","contenu":"Dans le menu **Activity** du script, naviguez jusqu'à **Bench Press** et validez en appuyant sur {CROSS / A}."},{"titre":"Gâchettes en miroir","contenu":"Appuyez au choix sur {L2 / LT} ou sur {R2 / RT}. Le script enfonce automatiquement la gâchette opposée, au même moment et avec la même pression :","blocs":[{"type":"liste","contenu":"- Vous appuyez sur {L2 / LT} : {R2 / RT} s'enfonce en même temps.\n- Vous appuyez sur {R2 / RT} : {L2 / LT} s'enfonce en même temps."}]},{"titre":"Suivi à l'écran","contenu":"L'écran OLED du Cronus Zen affiche **PUSH** quand vous appuyez et **LOWER** quand vous relâchez."}]},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Pas de rythme automatique pour l'instant :** c'est vous qui gérez la montée et la descente de la barre. Le script se charge uniquement de garder les deux gâchettes parfaitement identiques. Ce MOD sera prochainement amélioré."}],"scripts":["gta6"],"fiche":{"colonnes":[{"titre":"Comprendre le Bench Press","liens":[{"titre":"❓ Qu'est-ce que le Bench Press ?","de":0,"a":1}]},{"titre":"Utiliser le Bench Press","liens":[{"titre":"⚙️ Procédure étape par étape","de":2,"a":4}]}]}},{"id":"switch-profile","titre":"🔄 Le menu Switch Profile (Script FPS / TPS)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le \"Switch Profile\" ?"},{"type":"texte","style":"p","contenu":"Le **Switch Profile** est un moteur puissant qui vous permet de gérer jusqu'à **3 profils d'armes distincts** en jeu et de définir la méthode exacte pour basculer de l'un à l'autre."},{"type":"texte","style":"h2","contenu":"⚙️ Principe de fonctionnement"},{"type":"texte","style":"p","contenu":"Par défaut, vous commencez avec un seul profil actif (**Primary**).\n\nPour débloquer les profils suivants (**Secondary** et **Custom**), il vous suffit de configurer leur mode de bascule. Une fois débloqué, chaque profil dispose de ses propres réglages indépendants dans le menu **Profile MODs**.\n\nLe menu **Switch Profile** contient 3 options principales :"},{"type":"texte","style":"h2","contenu":"🔀 Prim/Sec BTN","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Définit la méthode pour passer du profil **Primary** au profil **Secondary** (ou pour revenir au dernier profil utilisé après avoir quitté le profil Custom).\n\n**Note :** Configurer cette option débloque automatiquement le profil Secondary dans le menu *Profile MODs*.\n\nModes de bascule disponibles :"},{"type":"liste","contenu":"🔘 **Tap BTN :** Un simple appui sur la touche choisie.\n🔘🔘 **Dbl-tap BTN :** Un double appui rapide sur la touche choisie.\n⏱️ **Hold BTN :** Un appui maintenu sur la touche choisie.\n🔣 **Combination :** Une combinaison de deux touches (maintenir un bouton + appuyer sur un autre)."},{"type":"texte","style":"h2","contenu":"🎯 Custom *(accessible après avoir configuré Prim/Sec)*","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Définit la méthode pour basculer depuis le profil Primary ou Secondary vers le profil **Custom** (idéal pour un pistolet, une arme lourde ou un véhicule).\n\n**Note :** Configurer cette option débloque automatiquement le profil Custom dans le menu *Profile MODs*.\n\nModes de bascule disponibles :"},{"type":"liste","contenu":"🔘🔘 **Dbl-tap BTN :** Un double appui rapide sur la touche choisie.\n⏱️ **Hold BTN :** Un appui maintenu sur la touche choisie.\n🔣 **Combination :** Une combinaison de deux touches (maintenir un bouton + appuyer sur un autre)."},{"type":"texte","style":"h2","contenu":"🔄 Resync Profile *(accessible après avoir configuré Prim/Sec)*","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Permet de resynchroniser vos profils en jeu si un décalage survient (par exemple, si vous avez appuyé sur la touche de changement d'arme pendant une cinématique ou un chargement)."},{"type":"liste","contenu":"🔣 **Combination :** Seul le mode *Combination* est proposé. Il permet de faire défiler les profils en boucle jusqu'à retrouver le profil correspondant à votre arme en main."},{"type":"carte","couleur":"orange","titre":"🛡️ Protection anti-conflit (Gestion automatique des doublons)","contenu":"","blocs":[{"type":"texte","style":"p","contenu":"Pour éviter les erreurs de manipulation et garantir une compatibilité parfaite en jeu, le menu intègre une **sécurité active contre les conflits de touches** : il est impossible d'attribuer la même méthode **et** le même bouton à deux profils différents.\n\n**Comment le menu gère-t-il cela automatiquement ?** Le script filtre les options en temps réel et masque les touches déjà utilisées :"},{"type":"liste","contenu":"**Tap / Dbl-tap / Hold :** Deux profils peuvent utiliser la même méthode (ex. *Dbl-tap* pour Prim/Sec et Custom), mais ils ne pourront pas utiliser la même touche. Si vous choisissez *Dbl-tap + Triangle* pour *Prim/Sec*, la touche *Triangle* disparaîtra automatiquement de la liste des choix si vous sélectionnez *Dbl-tap* pour *Custom*.\n**Combination :** Les combinaisons peuvent partager le même bouton maintenu (*Hold*), à condition que le bouton tapé (*Tap*) soit différent (et inversement)."},{"type":"texte","style":"p","contenu":"💡 **En résumé :** Pas de risque de vous tromper ! Si un bouton n'apparaît pas dans votre menu, c'est qu'il est déjà attribué à une méthode identique sur un autre profil. Cette sécurité s'applique dynamiquement sur **Prim/Sec**, **Custom** et **Resync**."}]}],"scripts":["fps-tps"],"fiche":{"colonnes":[{"titre":"Comprendre le Switch Profile","liens":[{"titre":"❓ Qu'est-ce que le Switch Profile ?","de":0,"a":1},{"titre":"⚙️ Principe de fonctionnement","de":2,"a":3}]},{"titre":"Régler le Switch Profile","liens":[{"titre":"🔀 Prim/Sec BTN","de":4,"a":6},{"titre":"🎯 Custom","de":7,"a":9},{"titre":"🔄 Resync Profile","de":10,"a":13}]}]}},{"id":"online-cheat","titre":"🌐 Le menu Online Action (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu Online Action et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le menu **Online Action** est un MOD d'automatisation des menus d'interaction dans *GTA Online*. Il regroupe **9 manipulations rapides** complexes que vous devriez normalement exécuter manuellement au {D-Pad} en ouvrant le menu d'interaction.\n\nLe script reproduit ces enchaînements en une fraction de seconde pour vous équiper, vous déplacer ou gérer votre matériel sans interrompre vos combats."},{"type":"texte","style":"h2","contenu":"📋 Exemples d'actions automatisées"},{"type":"texte","style":"p","contenu":"Parmi les 9 raccourcis intégrés au script, vous trouverez :"},{"type":"liste","contenu":"**🚁 Sparrow :** Appelle et fait apparaître automatiquement un hélicoptère Sparrow à proximité depuis votre inventaire.\n🥽 **Thermal Vision :** Bascule l'activation du casque à vision thermique en un clin d'œil.\n🚘 **Personal Vehicle :** Demande le livreur ou fait réapparaître votre véhicule personnel à proximité."},{"type":"texte","style":"h2","contenu":"⚙️ Comment exécuter une Online Action ?"},{"type":"texte","style":"p","contenu":"Vous disposez de deux méthodes d'activation au choix :"},{"type":"liste","contenu":"**Depuis l'écran OLED :** Naviguez directement dans le menu **Online Action** du script, sélectionnez l'action désirée et tapez sur {CROSS / A} pour lancer l'action souhaitée.\n**Via une** [**Quick Action**](/gta5/quick-cheat/)*:* Assignez l'action à un raccourci manette personnalisé dans le menu [**Quick Action**](/gta5/quick-cheat/) pour un lancement instantané au cœur de l'action."}],"scripts":["gta5"],"fiche":{"colonnes":[{"titre":"Comprendre le menu Online Action","liens":[{"titre":"❓ Qu'est-ce que le menu Online Action ?","de":0,"a":1}]},{"titre":"Utiliser le menu Online Action","liens":[{"titre":"📋 Exemples d'actions automatisées","de":2,"a":4},{"titre":"⚙️ Comment exécuter une Online Action ?","de":5,"a":7}]}]}},{"id":"story-cheat","titre":"👤 Le menu Story Action (GTA 5 Mode Histoire)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu Story Action et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le menu **Story Action** intègre l'intégralité des codes de triche officiels du mode solo de *GTA 5*. Au lieu de mémoriser et de tapoter de longues combinaisons de touches sur la manette, le script envoie la séquence complète à votre place dès que vous le sélectionnez."},{"type":"texte","style":"h2","contenu":"🗂️ Organisation des codes par catégories"},{"type":"texte","style":"p","contenu":"Tous les codes du jeu sont répertoriés et classés en 4 groupes distincts dans le menu du script :"},{"type":"liste","contenu":"🔫 **Weapon (Armes) :** Obtenir toutes les armes, munitions explosives, balles enflammées, etc.\n🏃 **Character (Personnage) :** Invincibilité temporaire, santé/armure au maximum, super saut, coup de poing explosif (*Super Punch*), courir/nager plus vite.\n🚗 **Vehicle (Véhicules) :** Faire apparaître n'importe quel véhicule du jeu (Buzzard, Comet, Sanchez, Trashmaster, etc.).\n🌀 **Misc (Divers) :** Augmenter ou réduire l'indice de recherche, modifier la météo, gravité lunaire, mode ralenti (*Slow Motion*)."},{"type":"texte","style":"h2","contenu":"⚙️ Comment exécuter une Story Action ?"},{"type":"texte","style":"p","contenu":"Vous disposez de deux méthodes d'activation au choix :"},{"type":"liste","contenu":"**Depuis l'écran OLED :** Naviguez directement dans le menu Story Action du script, sélectionnez l'action désirée et tapez sur {CROSS / A} pour lancer l'action souhaitée.\n**Via une** [**Quick Action**](/gta5/quick-cheat/)*:* Assignez l'action à un raccourci manette personnalisé dans le menu [**Quick Action**](/gta5/quick-cheat/) pour un lancement instantané au cœur de l'action."}],"scripts":["gta5"],"fiche":{"colonnes":[{"titre":"Comprendre le menu Story Action","liens":[{"titre":"❓ Qu'est-ce que le menu Story Action ?","de":0,"a":1}]},{"titre":"Utiliser le menu Story Action","liens":[{"titre":"🗂️ Organisation des codes par catégories","de":2,"a":4},{"titre":"⚙️ Comment exécuter une Story Action ?","de":5,"a":7}]}]}},{"id":"quick-cheat","titre":"🚀 Le menu Quick Action (Raccourcis en jeu)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'une Quick Action et comment fonctionne-t-elle ?"},{"type":"texte","style":"p","contenu":"Les **Quick Actions** fonctionnent sur le même principe que les [**Quick Toggles**](page:quick-toggle). Elles vous permettent d'attribuer une action issue des menus **Online Action** ou **Story Action** à une combinaison de touches dédiée sur votre manette.\n\nAu lieu de devoir ouvrir un menu en plein affrontement, il vous suffit de réaliser votre raccourci pour que l'action s'exécute automatiquement en tâche de fond."},{"type":"texte","style":"h2","contenu":"🛠️ Exemple d'utilisation en jeu"},{"type":"liste","contenu":"**Sur le terrain :** Vous devez quitter rapidement une zone dans *GTA Online*.\n**Action :** Plutôt que d'ouvrir le menu d'interaction pour chercher votre hélicoptère, vous faites simplement votre raccourci **Quick Action** personnalisé.\n**Résultat :** Le script fait apparaître votre **Sparrow** à proximité instantanément, pendant que vous continuez à vous déplacer."},{"type":"carte","couleur":"jaune","contenu":"💡 **Personnalisation :** Vous pouvez configurer vos raccourcis **Quick Action** directement dans le menu du script pour garder vos fonctions préférées (Sparrow, vision thermique, véhicule personnel, Super Jump…) au bout des doigts.\n\n🩹 Les soins et l'armure ne font plus partie des Quick Actions : ils sont désormais disponibles avec le MOD [**Quick Care**](page:global-mods)."}],"scripts":["gta5"],"fiche":{"colonnes":[{"titre":"Comprendre les Quick Actions","liens":[{"titre":"❓ Qu'est-ce qu'une Quick Action ?","de":0,"a":1}]},{"titre":"Utiliser les Quick Actions","liens":[{"titre":"🛠️ Exemple d'utilisation en jeu","de":2,"a":4}]}]}},{"id":"five-finger-fillet","titre":"🔪 5 Finger Fillet (Jeu du couteau)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD 5 Finger Fillet et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Ce MOD mémorise les séquences de touches de vos adversaires au jeu du couteau (*Five Finger Fillet*) et les exécute automatiquement à une vitesse et une précision parfaites, vous garantissant de remporter toutes vos parties sans aucun risque de vous rater."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Mise en place","contenu":"Approchez-vous d'une table de jeu (par exemple à Strawberry). Dans le menu **Activity**, validez **5 Finger Fillet** avec {CROSS / A}, puis asseyez-vous à la table pour démarrer la partie."},{"titre":"Mémorisation de la séquence","blocs":[{"type":"liste","contenu":"- Maintenez {R2 / RT} enfoncé pendant la démonstration de l'adversaire.\n- Tout en maintenant {R2 / RT}, saisissez **les 5 derniers boutons** de la combinaison (ignorez le premier bouton qui est toujours {CROSS / A})."}]},{"titre":"Lancement du tour","contenu":"Quand vient votre tour de jouer, appuyez une fois sur la touche {D-Pad BAS} pour déclencher l'enchaînement automatique."},{"titre":"Arrêt du tour","contenu":"Dès que la séquence est terminée et la manche gagnée, appuyez sur {D-Pad HAUT} pour stopper la boucle."},{"titre":"Manches suivantes","contenu":"Lorsque l'adversaire propose une nouvelle séquence :","blocs":[{"type":"liste","contenu":"- Maintenez {R2 / RT} et appuyez sur {L2 / LT} pour effacer la combinaison précédente.\n- Maintenez à nouveau {R2 / RT} et saisissez la nouvelle séquence de 5 touches."}]}]}],"scripts":["rdr2"],"fiche":{"colonnes":[{"titre":"Comprendre le 5 Finger Fillet","liens":[{"titre":"❓ Qu'est-ce que le 5 Finger Fillet ?","de":0,"a":1}]},{"titre":"Utiliser le 5 Finger Fillet","liens":[{"titre":"⚙️ Procédure étape par étape","de":2,"a":3}]}]}},{"id":"cooking","titre":"🥩 Cooking (Cuisson automatique de viande)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Cooking et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le MOD **Cooking** prend en charge la cuisson en chaîne de vos viandes au feu de camp. Il vous évite de devoir maintenir les touches à la main pendant de longues minutes lorsque vous devez préparer de grands stocks de nourriture pour votre personnage."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Mise en place","contenu":"Positionnez votre personnage devant un feu de camp de manière à ouvrir le menu de cuisine."},{"titre":"Lancement","contenu":"Dans le menu **Activity**, lancez **Cooking** en appuyant sur {CROSS / A}."},{"titre":"Sélection de la viande","contenu":"Choisissez la viande que vous voulez préparer et maintenez {CROSS / A} pendant 1 seconde pour démarrer le processus."},{"titre":"Choix du mode de conservation","blocs":[{"type":"liste","contenu":"- **Ranger en continu :** Appuyez sur {SQUARE / X} pour que le script stocke automatiquement chaque morceau cuit dans votre inventaire (par défaut).\n- **Manger en continu :** Appuyez sur {R2 / RT} pour que votre personnage consomme directement chaque préparation sur place."}]}]}],"scripts":["rdr2"],"fiche":{"colonnes":[{"titre":"Comprendre le Cooking","liens":[{"titre":"❓ Qu'est-ce que le Cooking ?","de":0,"a":1}]},{"titre":"Utiliser le Cooking","liens":[{"titre":"⚙️ Procédure étape par étape","de":2,"a":3}]}]}},{"id":"gta6-activity-test","titre":"Activités en phase de test","scripts":["gta6"],"blocs":[{"type":"carte","couleur":"rouge","contenu":"🧪 **Activités en phase de test :** pour le moment, toutes les activités du script (**Fishing**, **Bench Press** et celles à venir) sont en phase de test. Leurs rythmes et leurs séquences de touches seront affinés et optimisés dès la sortie officielle du jeu."}]},{"id":"activity-rdr2-fishing","titre":"🎣 Fishing (Pêche automatique)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Fishing et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le MOD **Fishing** automatise l'intégralité du processus de pêche. Il gère le moulinage lent pour attirer le poisson, le ferrage instantané dès la touche, et le ramener rapidement au bord. L'écran OLED du Cronus Zen affiche l'état exact de la pêche en temps réel."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Mise en place","contenu":"Équipez votre canne à pêche au bord d'un cours d'eau."},{"titre":"Lancement","contenu":"Ouvrez le menu **Activity** du script et lancez **Fishing** en appuyant sur {CROSS / A}."},{"titre":"Préparation","contenu":"Sélectionnez votre leurre ou votre appât dans le jeu."},{"titre":"Lancer de ligne","contenu":"Maintenez {L2 / LT} puis {R2 / RT}, puis relâchez {R2 / RT} pour jeter la ligne. Relâchez ensuite tous les boutons de la manette.","blocs":[{"type":"liste","contenu":"*Note : Si le lancer ne vous convient pas, appuyez sur* {CIRCLE / B} *pour annuler et relancez votre ligne.*"}]},{"titre":"Gestion automatique par le script","blocs":[{"type":"liste","contenu":"Le script mouline doucement à votre place pour stimuler les poissons.\nDès qu'un poisson mord à l'hameçon, le script le ferre automatiquement.\nLe script bascule en moulinage rapide pour ramener la prise au plus vite."}]},{"titre":"Combats avec le poisson","contenu":"Lorsque le poisson se débat, le script stoppe automatiquement le moulinage. Orientez simplement votre stick pour contrer les déplacements du poisson. Dès qu'il se calme, le script reprend le moulinage rapide."},{"titre":"Fin de prise","contenu":"Choisissez en jeu de garder le poisson ou de le rejeter à l'eau. Remettez un appât si nécessaire et relancez votre ligne."}]}],"scripts":["rdr2"],"fiche":{"colonnes":[{"titre":"Comprendre le Fishing","liens":[{"titre":"❓ Qu'est-ce que le Fishing ?","de":0,"a":1}]},{"titre":"Utiliser le Fishing","liens":[{"titre":"⚙️ Procédure étape par étape","de":2,"a":3}]}]}},{"id":"activity-gta6-intro","titre":"Introduction Activity (GTA 6)","scripts":["gta6"],"blocs":[{"type":"modbody","mod":"gta6-activity-test"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu Activity ?"},{"type":"texte","style":"p","contenu":"Le menu **Activity** regroupe un ensemble de MODs d'automatisation dédiés aux mini-jeux et activités secondaires de *GTA 6*.\n\nCes MODs simplifient ou prennent entièrement en charge les manipulations répétitives (pêche, développé couché) pour vous éviter la fatigue musculaire et vous garantir 100% de réussite."},{"type":"carte","couleur":"jaune","contenu":"💡 **Quitter une activité :** Pour sortir de n'importe quelle activité lancée depuis le menu Activity et revenir au jeu standard, maintenez la touche {CIRCLE / B} enfoncée pendant quelques secondes."},{"type":"texte","style":"p","contenu":"De plus, de **nouvelles activités seront ajoutées au fur et à mesure** que le jeu sera exploré et que de nouveaux mini-jeux seront découverts."}]},{"id":"activity-rdr2-intro","titre":"Introduction Activity (RDR2)","scripts":["rdr2"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu Activity ?"},{"type":"texte","style":"p","contenu":"Le menu **Activity** regroupe un ensemble de MODs d'automatisation dédiés aux mini-jeux et activités secondaires de *Red Dead Redemption II* et *Red Dead Online*.\n\nCes MODs simplifient ou prennent entièrement en charge les manipulations répétitives (pêche, jeu du couteau, cuisson de viande) pour vous éviter la fatigue musculaire et vous garantir 100 % de réussite."},{"type":"carte","couleur":"jaune","contenu":"💡 **Quitter une activité :** Pour sortir de n'importe quelle activité lancée depuis le menu Activity et revenir au jeu standard, maintenez la touche {CIRCLE / B} enfoncée pendant quelques secondes."}]},{"id":"mods-activator","titre":"🔘 MODs Activator","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le \"MODs Activator\" ?"},{"type":"texte","style":"p","contenu":"Le **MODs Activator** est le moteur de conditions du script. Il vous permet de définir avec une précision totale **quand** et **comment** vos MODs doivent s'activer en jeu.\n\nAu lieu d'imposer un comportement rigide, ce système écoute vos touches en temps réel et ne déclenche vos MODs (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) que si la condition exacte que vous avez choisie est remplie."},{"type":"texte","style":"h2","contenu":"⚙️ Principe de fonctionnement"},{"type":"texte","style":"p","contenu":"Chaque joueur a sa propre façon de jouer, et chaque arme a ses contraintes. En associant un mode de déclenchement spécifique à chaque MOD, vous évitez les activations involontaires (par exemple : faire un *Drop Shot* alors que vous vouliez simplement ajuster votre visée de loin).\n\nLe système analyse la combinaison de vos touches principales : la gâchette de visée (**ADS**) et la gâchette de tir (**FIRE**)."},{"type":"texte","style":"h2","contenu":"🛠️ Quels MODs utilisent le MODs Activator ?"},{"type":"texte","style":"p","contenu":"Vous pouvez attribuer un mode d'activation indépendant pour chacun des MODs suivants dans votre profil :"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"texte","style":"h2","contenu":"🎛️ Les modes de déclenchement"},{"type":"texte","style":"p","contenu":"Il y a **5 modes de déclenchement** disponibles. Choisissez pour chaque MOD celui qui correspond à votre façon de jouer :"},{"type":"texte","style":"h3","contenu":"🔀 ADS + FIRE *(Viser + Tirer)*"},{"type":"modbody","mod":"act-ads-fire"},{"type":"texte","style":"h3","contenu":"💥 FIRE *(Tir global)*"},{"type":"modbody","mod":"act-fire"},{"type":"texte","style":"h3","contenu":"💥 FIRE Only *(Tir au jugé exclusif / Hip-fire)*"},{"type":"modbody","mod":"act-fire-only"},{"type":"texte","style":"h3","contenu":"🎯 ADS *(Visée globale)*"},{"type":"modbody","mod":"act-ads"},{"type":"texte","style":"h3","contenu":"🎯 ADS Only *(Visée exclusive)*"},{"type":"modbody","mod":"act-ads-only"},{"type":"carte","couleur":"jaune","contenu":"💡 **En résumé :**\n\nLe MODs Activator offre un contrôle sur-mesure de votre manette. Il s'adapte à votre gameplay au lieu de vous forcer à adapter votre façon de jouer au script."}],"fiche":{"colonnes":[{"titre":"Comprendre le MODs Activator","liens":[{"titre":"❓ Qu'est-ce que le MODs Activator ?","de":0,"a":1},{"titre":"⚙️ Principe de fonctionnement","de":2,"a":3},{"titre":"🛠️ Quels MODs utilisent le MODs Activator ?","de":4,"a":6}]},{"titre":"Régler le MODs Activator","liens":[{"titre":"🎛️ Les modes de déclenchement","de":7,"a":19}]}]}},{"id":"navigation-oled","titre":"🧭 Navigation & Menus OLED","blocs":[{"type":"texte","style":"h2","contenu":"📂 Structure du Menu Principal (Main Menu)"},{"type":"texte","style":"h3","contenu":"Les fonctionnalités sont réparties en 6 catégories distinctes :"},{"type":"liste","contenu":"🔀 **Profile MODs** : Réglages spécifiques à un profil ou à une arme (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). Ces valeurs changent automatiquement quand vous basculez de profil.\n🌍 **Global MODs** : Options actives en permanence, quel que soit le profil sélectionné (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator** : Conditions nécessaires pour déclencher certains *Profile MODs* (ex. : uniquement en visée *ADS Only*, en tir *FIRE*, ou *ADS + FIRE*).\n🎮 **Controller** : Configuration matérielle de votre manette (Sensibilité, Zone morte / *Stick Drift*, Inversion axe Y, Disposition des boutons).\n⚙️ **Misc** : Options système du script (*Auto Save* pour sauvegarder les réglages, *VM Speed* pour la vitesse d'exécution).\n⏱️ **Quick Toggle** : Attributions de raccourcis rapides à la manette pour activer ou désactiver un MOD à la volée."},{"type":"texte","style":"h2","contenu":"🕹️ Menus additionnels spécifiques selon le jeu"},{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA 6)** : MODs d'automatisation dédiés aux mini-jeux et métiers en jeu (*Pêche automatique*, *5 Finger Fillet*, *Cooking*, *Bench Press* et d'autres à venir...) pour réussir à tous les coups sans effort physique.\n🔄 **Switch Profile (FPS / TPS)** : Système de bascule rapide permettant de changer de profil d'arme ou de configuration (Profil 1, Profil 2, Primaire, Secondaire...) à la volée en plein jeu, afin d'adapter instantanément vos MODs et votre *AntiRecoil* à l'arme que vous tenez en main.\n🌐 **Online Action (GTA 5)** : Manipulations rapides pour exécuter instantanément des actions clés du menu Interaction en GTA Online (faire apparaître votre véhicule personnel ou un hélicoptère, activer le mode passif ou la Ghost Organization...).\n👤 **Story Action (GTA 5)** : Exécution automatique des combinaisons de codes de triche officiels réservés au mode Histoire de GTA 5 (santé/armure au max, invincibilité, armes, effets d'environnement...).\n🚀 **Quick Action (GTA 5)** : Attribution de combinaisons de touches rapides sur votre manette (sur le principe des *Quick Toggles*) pour déclencher vos actions GTA 5 favorites en plein jeu à la volée."},{"type":"texte","style":"h2","contenu":"🛑 Sécurité : Le KillSwitch (Coupe-circuit du script)"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention cruciale :** Peu importe que vous soyez dans un jeu de course ou dans un jeu de tir, le script exécute aveuglément les instructions qu'il contient. C'est pourquoi il est **absolument crucial de désactiver votre script** lorsque vous naviguez dans les menus du jeu ou de la console. Un MOD s'exécutant lors d'un simple appui sur un bouton, il serait dommage de supprimer un équipement rare dans votre inventaire ou d'acheter/vendre par erreur parce qu'un MOD s'est déclenché au mauvais moment !"},{"type":"texte","style":"h2","contenu":"💡 Comment activer ou désactiver le KillSwitch (mute total des fonctionnalités du script) :"},{"type":"texte","style":"p","contenu":"Chacune de ces touches **coupe ou réactive** le script. Il se coupe ainsi automatiquement quand vous ouvrez un menu, et se réactive quand vous le refermez :"},{"type":"liste","contenu":"{OPTIONS / MENUS} : coupe le script quand vous ouvrez le menu Pause du jeu, et le réactive quand vous le refermez.\n{PS / XBOX} : coupe le script quand vous ouvrez le menu de votre console, et le réactive quand vous revenez au jeu.\nMaintenir {L2 / LT} + {SHARE / VIEW} : coupe ou réactive le script quand vous le souhaitez."},{"type":"carte","couleur":"jaune","contenu":"💡 **Astuce :** {CIRCLE / B} ne coupe jamais le script : il sert uniquement à le **réactiver**, d'un double appui ou d'un appui maintenu. C'est souvent la méthode la plus simple, car c'est la touche que vous utilisez déjà pour quitter les menus."},{"type":"texte","style":"h2","contenu":"🚪 Entrer et sortir du menu"},{"type":"liste","contenu":"**Ouvrir le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS}.\n**Fermer le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS}.\n> Si l'**Auto Save** est activé (dans Misc), vos modifications sont sauvegardées automatiquement.\n> **Pour sauvegarder manuellement**, quittez le menu en appuyant sur {PS / XBOX}.\n**Accès rapide AntiRecoil :** Maintenez {L2 / LT} et appuyez sur {PS / XBOX} pour ouvrir ou fermer directement les valeurs AntiRecoil du profil actif *(si le MOD AntiRecoil est activé sur ce profil)*."},{"type":"texte","style":"h2","contenu":"🎛️ Naviguer et modifier les valeurs des MODs"},{"type":"texte","style":"h2","contenu":"🧭 Naviguer dans les menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Aide visuelle sur l'écran OLED :**\n\n🧭 **Flèches directionnelles :** *Des flèches apparaissent autour du paramètre pour vous indiquer directement dans quel sens appuyer sur la manette.*"},{"type":"texte","style":"p","contenu":"📜 **Ligne d'instructions :** *Un texte défile sur la dernière ligne de l'écran pour vous guider pas à pas si vous hésitez sur la touche à utiliser.*"},{"type":"liste","contenu":"↕️ **Parcourir une liste ou un menu déroulant :** Utilisez {D-Pad HAUT} ou {BAS} *(menu principal, liste d'actions, choix de réglages...)*.\n📥**Entrer dans un menu / sous-menu :** Appuyez sur {CROSS / A}.\n🔄**Changer de profil à modifier :** Appuyez sur {TRIANGLE / Y} *(uniquement dans le menu Profile MODs)*.\n↔️**Se déplacer entre les MODs :** Utilisez {D-Pad GAUCHE} ou {DROITE}.\n⚙️**Activer/Désactiver un MOD ou changer son type :** Utilisez {D-Pad HAUT} ou {BAS}.\n↩️**Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."},{"type":"texte","style":"h2","contenu":"🔢 Modifier les valeurs numériques *(ex. : force de l'AntiRecoil, cadence du Rapid Fire)*"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Activez le MOD","contenu":"Si le MOD est sur *OFF*, vous n'avez pas accès à ses valeurs ajustables."},{"titre":"Entrer dans le menu d'édition","contenu":"Appuyez sur {CROSS / A}."},{"titre":"Sélectionner le paramètre","contenu":"Utilisez {D-Pad GAUCHE} ou {DROITE} pour naviguer entre les différentes options."},{"titre":"Modifier la valeur","contenu":"Maintenez {R1 / RB} puis appuyez sur {D-Pad DROITE} (ou {HAUT}) pour augmenter, ou {D-Pad GAUCHE} (ou {BAS}) pour diminuer."},{"titre":"Revenir au menu précédent","contenu":"Appuyez sur {CIRCLE / B}."}]}],"fiche":{"colonnes":[{"titre":"Comprendre les menus","liens":[{"titre":"📂 Structure du menu principal","de":0,"a":2},{"titre":"🕹️ Menus additionnels selon le jeu","de":3,"a":4}]},{"titre":"Naviguer dans les menus","liens":[{"titre":"🛑 Le KillSwitch","de":5,"a":10},{"titre":"🚪 Entrer et sortir du menu","de":11,"a":12},{"titre":"🎛️ Naviguer et modifier les valeurs","de":13,"a":19}]}]}},{"id":"gestion-conduite","titre":"🚗 Gestion de la Conduite & des Véhicules","scripts":["gta5","gta6"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que la gestion de la conduite et comment fonctionne-t-elle ?"},{"type":"texte","style":"p","contenu":"Cette fonctionnalité adapte automatiquement le comportement du script lorsque vous pilotez un véhicule (ou que vous vous déplacez les mains nues suivant votre configuration). Elle neutralise instantanément tous les MODs pouvant interférer avec la conduite (comme l'AntiRecoil) pour vous garantir un contrôle total."},{"type":"texte","style":"h2","contenu":"🛠️ Fonctionnement selon votre configuration"},{"type":"liste","contenu":"**🤖 Détection Automatique via ADT (PS5 & PC) :**\n> Lorsque vous jouez sur la version PS5 ou PC du jeu et que les gâchettes adaptatives (ADT) sont activées :\n- **Analyse intelligente :** Le script analyse le retour mécanique des gâchettes pour détecter automatiquement si vous êtes au volant d'un véhicule ou si vous vous déplacez les mains nues sans arme équipée.\n- **Affichage OLED :** L'état **« Unarmed / In vehicle »** s'affiche automatiquement sur l'écran du Cronus Zen et adapte le profil instantanément sans aucune manipulation de votre part.\n**🎮 Gestion Manuelle / Mode Driving (Xbox, PS4 ou ADT désactivées) :**\n> Si vous jouez sur une plateforme sans support ADT (Xbox, PS4) ou si vous avez désactivé les gâchettes adaptatives dans vos menus *(💡 il est toutefois fortement conseillé de toujours laisser les ADT et les vibrations activées dans les options de la console et du jeu)* :\n- **Bascule manuelle** : Appuyez sur la touche {TRIANGLE / Y} pour passer manuellement en mode « **Driving** » (ou pour revenir à votre profil d'arme principal)."},{"type":"texte","style":"h2","contenu":"🔄 Réinitialisation et désynchronisation"},{"type":"texte","style":"p","contenu":"Si un décalage survient en jeu *(par exemple après une cinématique ou une transition de véhicule)*, maintenez la touche {L3 / LS} et appuyez sur {TRIANGLE / Y} pour réinitialiser immédiatement l'état.\n\n*(Note : Ce système de resynchronisation concerne uniquement la gestion manuelle ; la détection automatique via ADT ne peut pas se désynchroniser).*"}],"fiche":{"colonnes":[{"titre":"Comprendre la gestion de la conduite","liens":[{"titre":"❓ Qu'est-ce que la gestion de la conduite ?","de":0,"a":1}]},{"titre":"Utiliser la gestion de la conduite","liens":[{"titre":"🛠️ Fonctionnement selon votre configuration","de":2,"a":3},{"titre":"🔄 Réinitialisation et désynchronisation","de":4,"a":5}]}]}},{"id":"on-horse","titre":"🐎 Gestion des déplacements à cheval","scripts":["rdr2"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le mode « On Horse » et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Appuyer sur la touche {TRIANGLE / Y} fait basculer le script en mode « **On Horse** ».\n\nCet état adapte automatiquement le comportement de vos MODs pour offrir une conduite fluide à cheval sans interférences :"},{"type":"liste","contenu":"**Désactivation des MODs de combat gênants :** Certains MODs à pied sont temporairement neutralisés pour ne pas déranger les déplacements et la caméra à cheval.\n**Gestion du galop :** L'état **« On Horse »** conditionne le fonctionnement des MODs **Horse Gallop** et **Cinema Gallop** afin d'éviter qu'ils ne se déclenchent lorsque vous êtes à pied."},{"type":"texte","style":"h2","contenu":"🔄 Réinitialisation et désynchronisation"},{"type":"texte","style":"p","contenu":"Si votre personnage chute de cheval ou si l'état du script ne correspond plus à votre situation en jeu *(ex. le script pense que vous êtes à cheval alors que vous êtes à pied)* :"},{"type":"carte","couleur":"jaune","contenu":"💡 **Raccourci de resynchronisation :** Maintenez la touche {L3 / LS} et appuyez sur {TRIANGLE / Y} pour réinitialiser instantanément l'état\n« On Horse »."}],"fiche":{"colonnes":[{"titre":"Comprendre le mode On Horse","liens":[{"titre":"❓ Qu'est-ce que le mode On Horse ?","de":0,"a":2}]},{"titre":"Utiliser le mode On Horse","liens":[{"titre":"🔄 Réinitialisation et désynchronisation","de":3,"a":5}]}]}}],"mentions":"noozbar Scripts est un projet indépendant, sans lien avec aucun éditeur ni studio de jeux vidéo, ni avec Collective Minds. Grand Theft Auto, GTA, Red Dead Redemption et RDR sont des marques de Take-Two Interactive Software, Inc. PlayStation, PS4, PS5 et DualSense sont des marques de Sony Interactive Entertainment Inc. Xbox est une marque de Microsoft Corporation. Nintendo Switch est une marque de Nintendo. Steam est une marque de Valve Corporation. Cronus ZEN est une marque de Collective Minds Gaming Co. Ltd. Les autres marques citées appartiennent à leurs propriétaires respectifs et ne sont utilisées qu'à des fins d'identification. L'utilisation de scripts peut être contraire aux conditions d'utilisation de certains jeux : chaque joueur reste responsable de l'usage qu'il en fait."};
</script>
<script>window.SITE_DATA_EN={"nomSite":"noozbar Scripts","titreSite":"noozbar Scripts — Cronus ZEN scripts for GTA 6, GTA 5, RDR2 and FPS/TPS","pied":"© **noozbar** — Premium Scripts for Cronus ZEN · [Discord](https://discord.gg/e2v4NN4fVu) · [Zen Studio Live](https://zenstudio.collectivemindsstore.com/) · [Legal notice](page:mentions-legales)","portail":{"onglets":[{"id":"accueil","titre":"Home","blocs":[{"type":"texte","style":"titre","contenu":"🚀 Expertise, Technology & Innovation"},{"type":"tuiles","id":"expertise","tuiles":[{"icone":"🎓","titre":"Since 2017","contenu":"Recognized expertise, with over 442,000 downloads to date.","blocs":[{"type":"texte","style":"h2","contenu":"🎓 Recognized expertise since 2017"},{"type":"texte","style":"p","contenu":"A GPC developer since **2017** and a pioneer of Cronus development with over **442,000 downloads** on [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/), I'm stepping back into the spotlight after a more discreet period.\n\nI used that quieter pace to start again from scratch: **a fully rewritten menu, new development methods and 100% proprietary code**. Even for the most classic features, **there is no copy-paste: every line was written from A to Z by me, and every MOD was rethought, redesigned and optimized.**"}]},{"icone":"🔬","titre":"Precision","contenu":"An ultra-precise architecture, coded in Polar and optimized for every VM Speed.","blocs":[{"type":"texte","style":"h2","contenu":"🔬 An ultra-precise architecture"},{"type":"liste","contenu":"**Polar encoding:** Everything in my scripts is coded in Polar. It is **327.67 times more precise** than the usual standard, which only allows small values between -100 and +100. This gives my MODs extreme precision.\n**Shared working variables:** In a classic script, each MOD blindly applies its own value, and it is often the last MOD read that overrides the previous ones. Here, every MOD works on and modifies shared variables. Once all the MODs have run, the final values are applied to the sticks and buttons to perform the action. The result? Absolute smoothness, compatibility and precision between all the MODs.\n**VM Speed optimization:** All combo and MOD timings are dynamically recalculated by the script to adapt perfectly to any *VM Speed* chosen in the menu. Not a single millisecond is lost."}]},{"icone":"🤖","titre":"Humanizers","contenu":"Smart Humanizers that give every MOD a natural rhythm to protect your account.","blocs":[{"type":"texte","style":"h2","contenu":"🤖 Smart Humanizers"},{"type":"texte","style":"p","contenu":"On top of the care taken with in-game precision, I built in advanced systems to keep you safe:"},{"type":"liste","contenu":"**Timing Humanizer:** Applied to MODs such as *Turbo Buttons, AIM Abuse* or *Strafe Shot*. It generates micro-variations in the execution timing. This avoids frozen, repeated intervals down to the millisecond, giving button spamming a lively, 100% natural rhythm.\n**Offset Humanizer:** Applied to MODs such as *AntiRecoil, LS/RS Assist, Kinetic AIM* or *Strafe Shot*. It adds slight random variations to the simulated physical movements. The stick trace keeps a subtle human imperfection, making the trajectories impossible to tell apart from manual control.\n**Cycle Humanizer:** Applied to MODs such as *RapidFire and BurstFire*. It produces Hold/Release cycles that constantly differ, while strictly respecting the overall fire rate you have set. Your shots keep a smooth, natural rhythm, removing the frozen or automated feel of classic macros."},{"type":"texte","style":"p","contenu":"These *Humanizers* are designed to never reproduce perfectly mechanical, identical movements or timings, which helps you very effectively stay undetected by anti-cheat systems."}]}]},{"type":"texte","style":"titre","contenu":"📜 My scripts"},{"type":"cartesscripts","partie":"scripts"},{"type":"texte","style":"titre","contenu":"📚 Documentation & VIP Subscription"},{"type":"cartesscripts","partie":"extra"},{"type":"discord","invite":"e2v4NN4fVu","lien":"https://discord.gg/e2v4NN4fVu","image":"/media/discord-gamertagfr-icone.jpg","etiquette":"Join the community","titre":"GamerTagFR Discord","contenu":"GamerTagFR's help server for Cronus Zen players: support, settings advice, update announcements and unlock codes for my scripts.","bouton":"Join the Discord →","membresSecours":"22 000+"},{"type":"partenaire","lien":"https://chaton-script.com/","image":"/media/partenaires/chaton-script.webp","etiquette":"Partner","titre":"Chaton Script","contenu":"Chaton's Cronus Zen scripts and their guides: SPHINX for Apex Legends, JELLY for COD MW4 and Warzone, JAGUAR for BO7 and SERVAL for Rust.","bouton":"Visit the website →"}],"icone":"home","entete":"accueil","grandTitre":"Premium Scripts","sousTitre":"Cronus ZEN scripts by **noozbar** for GTA 6, FPS/TPS games, RDR2 and GTA 5.\nComplete documentation, recommended settings and support.","sommaire":false,"descriptionPartage":"Premium Cronus ZEN scripts by noozbar: GTA 6, Multi FPS/TPS, RDR2 and GTA 5. Documentation, settings and support."},{"id":"guide-cronus-zen","titre":"Technical Guide","blocs":[{"type":"groupe","blocs":[{"type":"depliant","titre":"🔌 Connections and basic checks","blocs":[{"type":"texte","style":"h2","contenu":"❓ What should you check before starting?"},{"type":"texte","style":"p","contenu":"To ensure your Cronus Zen works properly and to avoid unexpected disconnections or detection errors, make sure you meet these essential hardware requirements."},{"type":"texte","style":"h2","contenu":"📋 Pre-flight checklist"},{"type":"liste","contenu":"🔄 **Up-to-date firmware:** Make sure your Cronus Zen is updated to the latest firmware version (see the *Updating your Cronus Zen* section).\n🎛️ **Cable quality:** Use **data transfer cables** (*Data Transfer*) exclusively.\n> ⚠️ **Cable warning:** **Never use charge-only cables** (*Charge-Only*). These cables do not carry control signals and will prevent the console or PC from detecting your hardware."}]},{"type":"depliant","titre":"🔌 Cronus Zen port layout and roles","blocs":[{"type":"texte","style":"h2","contenu":"🖥️ CONSOLE & FIRMWARE port *(on the back)*"},{"type":"liste","contenu":"**Usage:** Connects the Cronus Zen to your console (PS5, PS4, Xbox, Switch) or to your PC for gaming.\n**Other function:** Used to perform firmware updates via [*Zen Studio Live*](https://zenstudio.collectivemindsstore.com/)."},{"type":"texte","style":"h2","contenu":"💻 PROG port *(on the right side)*"},{"type":"liste","contenu":"**Usage:** Connects the Cronus Zen to your laptop or desktop PC.\n**Sole function:** Only used to program, configure and transfer your GPC scripts and GamePacks to the Cronus Zen slots from [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/)."},{"type":"texte","style":"h2","contenu":"🎮 A1 port *(on the left side)*"},{"type":"liste","contenu":"**Usage:** Plug in your **main official controller** (DualSense for PS5, Xbox controller for Xbox, etc.).\n**Role:** Acts as hardware security and authentication with the console."},{"type":"texte","style":"h2","contenu":"⌨️ A2 & A3 ports *(on the front)*"},{"type":"liste","contenu":"**Port A2 (Front right) & Port A3 (Front left):** Used to connect a third-party controller (*Crossover Controller* — for example an Xbox controller to play on PlayStation) or your Keyboard & Mouse peripherals."},{"type":"carte","image":"/media/guide/ports-cronus-zen.webp","titre":"","contenu":""}]},{"type":"depliant","titre":"📡 Output Protocol","blocs":[{"type":"texte","style":"p","contenu":"For peace of mind and absolute compatibility with your platform, it is wise to manually set the **Output Protocol** of your Cronus Zen.\n\nBy default, this setting is on **AUTO**. Although it works in most cases, it can sometimes fail to correctly detect your hardware and block communication. Manually setting your protocol is an excellent practice to prevent any malfunction."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step setup procedure"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your Cronus Zen to your computer via the **PROG** port *(located on the right side of the unit)*."},{"contenu":"Open the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) application."},{"contenu":"Click the **Device Management** tab, then select **Device Settings**."},{"contenu":"In the window that opens, find the **Output Protocol** line."},{"contenu":"Replace the **AUTO** mode by explicitly selecting your console from the list *(PS5, PS4, Xbox Series X/S, PC, Nintendo Switch...)*."},{"contenu":"Close the window to save the setting automatically, then reconnect your Zen to your console or PC."}]}],"ancre":"output-protocol"},{"type":"depliant","titre":"🎮 Switching scripts on the fly (Remote Slot Change)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Setup procedure:"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your Cronus Zen to your computer via the **PROG port** *(right side)*."},{"contenu":"Open the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) application."},{"contenu":"Click the **Device Management** tab, then select **Device Settings**."},{"contenu":"In the window, find the **Remote Slot Change** line."},{"contenu":"Select the desired option from the drop-down menu. *(💡 Hover over the* **\"i\"** *icon next to the field to see the exact control combination on your controller).*"},{"contenu":"Close the window to save your choice."}]},{"type":"carte","couleur":"jaune","contenu":"💡 **In-game use:** Perform the chosen button combination at any time during your session to instantly switch to the next *slot* without interrupting your game."}]},{"type":"depliant","titre":"🏭 Factory Reset (Hard Reset)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning:** The Factory Reset erases the entire memory of your Cronus Zen. All your scripts saved in the *slots* as well as your personal configurations will be permanently deleted."},{"type":"texte","style":"p","contenu":"You have **two methods** to perform a *Factory Reset*:"},{"type":"texte","style":"h2","contenu":"🛠️ Method 1: Hardware reset (P1 and P2 buttons)","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Completely disconnect your Cronus Zen from any power source."},{"contenu":"Press and hold the **P1** and **P2** buttons simultaneously *(the two blue buttons located on each side of the device)*."},{"contenu":"While holding both buttons down, connect your Cronus Zen to your computer *(whichever USB port you use)*."},{"contenu":"A **Red ➔ Green ➔ Blue** light sequence plays on the unit: you can then release the buttons."}]},{"type":"texte","style":"h2","contenu":"💻 Method 2: Software reset (Via [ZEN Studio Live](https://zenstudio.collectivemindsstore.com/))","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your Cronus Zen to your computer using the cable plugged into the **PROG port** *(right side)*."},{"contenu":"In [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/), click the **Device Management** tab, then select **Factory Reset**."},{"contenu":"In the security window that opens, type the word **RESET** in the required field then confirm."},{"contenu":"The **Red ➔ Green ➔ Blue** LED sequence plays on the unit to confirm the operation."}]},{"type":"carte","couleur":"jaune","contenu":"💡 **Check:** After the reset, the OLED screen refreshes to the default home screen and all your memory *slots* appear empty again."}]},{"type":"depliant","titre":"🧹 Full reset","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Complete reset procedure (step by step):"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Connecting to the PC","contenu":"Connect your Cronus Zen to your computer using the cable plugged into the **PROG port** *(right side)*."},{"titre":"Opening the software","contenu":"Launch the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) application."},{"titre":"System purge (Device Management)","contenu":"Click the **Device Management** icon and run the following 3 operations in succession:","blocs":[{"type":"liste","contenu":"- 🗑️ **Erase Memory Slots:** Erases all the scripts and profiles saved in the unit's memories.\n- 📡 **Clear Bluetooth:** Resets wireless pairings and the memories of saved devices.\n- 🔄 **Factory Reset:** Resets the entire hardware configuration."}]},{"titre":"Clean firmware reinstall","blocs":[{"type":"liste","contenu":"- Perform a [**Downgrade**](page:mise-a-jour-zen) to the oldest firmware version available.\n- Once the flash is complete, immediately start an update to the **latest version** (*Update to latest*)."}]}]},{"type":"carte","couleur":"rouge","titre":"🚨 If the problem persists after this procedure:","contenu":"","blocs":[{"type":"liste","contenu":"Make sure to follow the step-by-step installation procedure without skipping any step.\nCheck your USB cables. Only certified **Data Transfer** cables *(data & charge)* allow stable operation.\nChange the USB port on your computer or console. Plug the unit directly into the motherboard or the console *(avoid USB hubs and extension cables)*."}]}]}]},{"type":"carte","image":"/media/guide/guide-cronus-zen-2.webp","titre":"","contenu":""}],"icone":"terminal","sommaire":false,"titrePage":"Cronus ZEN Technical Guide","sousTitre":"Everything technical about your Cronus Zen: connections, port roles, Output Protocol, script switching and resetting."},{"id":"bypass-ps5","titre":"PS5 Connection (Bypass)","blocs":[{"type":"carte","couleur":"orange","contenu":"Because of the PlayStation 5's native security measures, the Cronus Zen requires a specific authentication procedure (called **Bypass**) to work properly without disconnecting after a few minutes of play."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Recommended setting:** Manually set the [**Output Protocol**](page:guide-cronus-zen#output-protocol) to **PLAYSTATION 5** in [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(Device Management > Device Settings)* to avoid any malfunction related to AUTO mode."},{"type":"groupe","blocs":[{"type":"depliant","titre":"⚙️ Initial PS5 console setup *(To be done only once)*","blocs":[{"type":"texte","style":"p","contenu":"Before first use, connect your DualSense or DualSense Edge controller directly to the console (without going through the Cronus Zen) and apply the following settings:"},{"type":"texte","style":"h2","contenu":"Enabling Bluetooth","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Go to **Settings > Accessories > General > Advanced Settings**."},{"contenu":"If the **\"Enable Bluetooth\"** button is displayed, press {CROSS} to enable it (your console will restart)."}]},{"type":"texte","style":"h2","contenu":"Setting up the communication method","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Go to **Settings > Accessories > Controller (General) > Communication Method**."},{"contenu":"Select **\"Use USB Cable\"**."}]},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning:** Remember to check this setting after every PS5 system update, as the console may sometimes reset this choice to its default."},{"type":"texte","style":"h2","contenu":"Preventing your controllers from sleeping or entering rest mode","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Go to **Settings > System > Power Saving**"},{"contenu":"Set the 3 parameters as follows:","blocs":[{"type":"liste","contenu":"*Set time until PS5 enters rest mode:* Set both parameters to **Do Not Put in Rest Mode**\n*Set when controllers turn off =* **Do Not Turn Off**"}]}]},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning:** Your authentication controller going to sleep can cancel your Bypass and cause disconnections."}]},{"type":"depliant","titre":"🛡️ PS5 Bypass procedure (DualSense Standard)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **When to perform this procedure?** You must redo this procedure every time you turn on or restart your console, if you unplug the Cronus Zen from the PS5, or if you unplug the authentication controller from port A1."},{"type":"texte","style":"h2","contenu":"👽 Selecting the Gearhead profile"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your Cronus Zen to the PS5 using the cable plugged into the rear **CONSOLE & FIRMWARE** port."},{"contenu":"Make sure your Cronus Zen is on the **Gearhead** profile *(alien head logo* 👽*)*: if a script is currently loaded, press the big blue button on the right of the Cronus Zen until the Gearhead logo appears on the OLED screen."}]},{"type":"carte","image":"/media/guide/bypass-ps5-1.webp","titre":"","contenu":""},{"type":"texte","style":"h2","contenu":"🛡️ Bypass"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"With the Cronus Zen connected to the PS5, plug your **DualSense** controller into the **A1** port *(located on the left side of your Cronus Zen)*."},{"contenu":"On your PS5, go to **Settings** ➔ **Accessories** ➔ **General** ➔ **Turn Off Accessories** and highlight your controller.\n\n🛑 *Do not click it: it must only stay highlighted on the screen.*"},{"contenu":"Press and hold the {D-Pad RIGHT} button (directional pad right) on your controller and do not release it under any circumstances during the rest of the procedure."},{"contenu":"While holding the D-Pad RIGHT button, click the **Reset** button located under your Cronus Zen."},{"contenu":"Wait **5 seconds** while the Bypass runs, then release the D-Pad RIGHT button."},{"contenu":"Exit the console menus by pressing {CIRCLE}. Your Bypass is active and operational!"}]},{"type":"carte","couleur":"jaune","contenu":"💡 **Good practice — Script activation:** Activate your script only once your game is running in the game (avoid loading the script in the console or game menus).\n\n**Why?** At startup, some scripts automatically detect the state of the adaptive triggers (ADT). If you are still in the console menus, no mechanical data is transmitted, which can block the script's initialization or use."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Warning:** **Under no circumstances** unplug the official controller from port A1 during your gaming session. If it is disconnected, authentication will be lost immediately and you will have to redo the whole connection procedure from the start *(the Bypass on PS5)*."}]},{"type":"depliant","titre":"🛡️ PS5 Bypass procedure (DualSense Edge)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **When to perform this procedure?** You must redo this procedure every time you turn on or restart your console, if you unplug the Cronus Zen from the PS5, or if you unplug the authentication controller from port A1."},{"type":"texte","style":"h2","contenu":"👽 Selecting the Gearhead profile"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your Cronus Zen to the PS5 using the cable plugged into the rear **CONSOLE & FIRMWARE** port."},{"contenu":"Make sure your Cronus Zen is on the **Gearhead** profile *(alien head logo* 👽*)*: if a script is currently loaded, press the big blue button on the right of the Cronus Zen until the Gearhead logo appears on the OLED screen."},{"contenu":"Then unplug your Cronus Zen from the PS5."}]},{"type":"carte","image":"/media/guide/bypass-ps5-1.webp","titre":"","contenu":""},{"type":"texte","style":"h2","contenu":"🛡️ Bypass"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your controller to your console via Bluetooth *(you must be able to navigate your console settings)*."},{"contenu":"Plug your **DualSense Edge** controller into the **A1 port** *(located on the left side of your Cronus Zen)*, **without connecting the Cronus Zen to the PS5** for now."},{"contenu":"On your PS5, go to **Settings** ➔ **Accessories** ➔ **General** ➔ **Turn Off Accessories** and highlight your controller.\n\n🛑 *Do not click it: it must only stay highlighted on the screen.*"},{"contenu":"Press and hold the {D-Pad RIGHT} button (directional pad right) on your controller and **do not release it under any circumstances** during the rest of the procedure."},{"contenu":"While holding the {D-Pad RIGHT} button, plug your Cronus Zen into the USB port on the front of your PS5."},{"contenu":"Wait **5 seconds** while the Bypass runs, then release the {D-Pad RIGHT} button."},{"contenu":"Exit the console menus by pressing {CIRCLE}. Your Bypass is active and operational!"}]},{"type":"carte","couleur":"jaune","contenu":"💡 **Good practice — Script activation:** Activate your script only **once your game is running** in the game (avoid loading the script in the console or game menus).\n\n**Why?** At startup, some scripts automatically detect the state of the adaptive triggers (*ADT*). If you are still in the console menus, no mechanical data is transmitted, which can block the script's initialization or use."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Warning:** **Under no circumstances** unplug the official controller from port A1 during your gaming session. If it is disconnected, authentication will be lost immediately and you will have to redo the whole connection procedure from the start *(the Bypass on PS5)*."}]}]},{"type":"carte","image":"/media/guide/bypass-ps5-2.webp","titre":"","contenu":""},{"type":"carte","couleur":"blue","contenu":"🎮 **Playing with a third-party controller or a keyboard / mouse?** Then follow the [Using a third-party controller](page:manette-tierce) page."}],"icone":"bouclier","sommaire":false,"titrePage":"PS5 Connection (Bypass)","sousTitre":"The authentication procedure you need to use your Cronus Zen on PS5, with a DualSense or a DualSense Edge."},{"id":"connexion-xbox-pc","titre":"Other Platform Connection","titrePage":"Other Platform Connection","icone":"ordinateur","sommaire":false,"descriptionPartage":"Connecting the Cronus ZEN and the controller on Xbox, PS4, Switch, PC and other platforms.","blocs":[{"type":"texte","style":"p","contenu":"This procedure applies to **Xbox, PS4, Switch and PC**. On **PS5**, the connection uses a specific procedure: see [**PS5 Connection (Bypass)**](page:bypass-ps5)."},{"type":"texte","style":"h2","contenu":"🎮 Xbox, PS4, Switch and PC connection"},{"type":"carte","couleur":"orange","contenu":"⚠️ **When to perform this procedure?** You must redo this procedure every time you turn on or restart your console or PC, if you unplug the Cronus Zen from your platform, or if you unplug the authentication controller from port A1."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Recommended setting:** Manually set the [**Output Protocol**](page:guide-cronus-zen#output-protocol) to your platform in [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(Device Management > Device Settings)* to avoid any malfunction related to AUTO mode."},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your Cronus Zen to your console using the cable plugged into the **rear CONSOLE & FIRMWARE port**."},{"contenu":"Plug your **official controller** *(the one matching your console)* into the **A1 port** *(located on the left side of your Cronus Zen)*."}]},{"type":"carte","couleur":"jaune","contenu":"💡 **Good practice — Script activation:** Activate your script only **once your game is running** in the game (avoid loading the script in the console or game menus).\n\n**Why?** At startup, some scripts automatically detect the state of the adaptive triggers (*ADT*). If you are still in the console menus, no mechanical data is transmitted, which can block the script's initialization or use."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Warning:** **Under no circumstances** unplug the official controller from port A1 during your gaming session. If it is disconnected, authentication will be lost immediately and you will have to redo the whole connection procedure from the start *(the Bypass on PS5)*."},{"type":"carte","image":"/media/guide/bypass-ps5-2.webp","titre":"","contenu":""},{"type":"carte","couleur":"blue","contenu":"🎮 **Playing with a third-party controller or a keyboard / mouse?** Then follow the [Using a third-party controller](page:manette-tierce) page."}],"sousTitre":"Connect your Cronus Zen to Xbox, PS4, Switch or PC, and play with the controller or keyboard / mouse of your choice."},{"id":"manette-tierce","titre":"Using a third-party controller","titrePage":"Using a third-party controller","icone":"manette","sommaire":false,"descriptionPartage":"Playing with a third-party controller or a keyboard / mouse plugged into the Cronus ZEN, on PS5, Xbox, PS4, Switch and PC.","sousTitre":"Play with another controller or with a keyboard / mouse, on PS5 as on the other platforms.","blocs":[{"type":"texte","style":"p","contenu":"If you prefer to play with another controller *(e.g. an Xbox controller on PS5, a PS5 controller on Xbox, a third-party pro controller)* or with a Keyboard / Mouse combo, your official controller must stay plugged into the Cronus Zen for authentication."},{"type":"etapes","etiquette":"Step","etapes":[{"icone":"🔐","titre":"Connecting to the console","contenu":"Start by connecting your Cronus Zen to your console: follow the [Bypass](page:bypass-ps5) procedure on PS5, or the [Other Platform Connection](page:connexion-xbox-pc) on Xbox, PS4, Switch and PC.\n\nYour **official controller** *(DualSense / DualSense Edge on PS5)* is then plugged into **port A1** *(located on the left side of your Cronus Zen)*: leave it plugged in at all times, it acts as the hardware authenticator for the console."},{"icone":"🎮","titre":"Gaming devices","contenu":"🎮 **Third-party controller:** Plug it into **port A3** *(front left)* of your Cronus Zen.\n\n⌨️ **Keyboard & Mouse:** Plug them into **ports A2** *(front right)* and **A3** *(front left)* of your Cronus Zen."}]},{"type":"carte","couleur":"rouge","contenu":"🛑 **Warning:** **Under no circumstances** unplug the official controller from port A1 during your gaming session. If it is disconnected, authentication will be lost immediately and you will have to redo the whole connection procedure from the start *(the Bypass on PS5)*."},{"type":"carte","image":"/media/guide/bypass-ps5-2.webp","titre":"","contenu":""}]},{"id":"mise-a-jour-zen","titre":"Cronus Zen Update","blocs":[{"type":"texte","style":"p","contenu":"Updating (*Update*) or rolling back to an earlier version (*Downgrade*) of your Cronus Zen's firmware is done directly from your web browser. This operation ensures absolute compatibility with the latest scripts and fixes any display or detection bugs."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Compatible browser required:** You **must use a Chromium-based browser** (such as **Microsoft Edge**, **Google Chrome** or **Brave**)."},{"type":"etapes","etapes":[{"icone":"🔌","titre":"Connecting to the PC","contenu":"Connect your Cronus Zen to your computer using the **CONSOLE & FIRMWARE port** *(the port located at the back of the unit)*.","images":["/media/guide/mise-a-jour-1.webp"]},{"icone":"🌐","titre":"Accessing the site","contenu":"Open your web browser *(Edge, Chrome or Brave)* and go to this page: [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/)","images":[]},{"icone":"⬆️","titre":"Update Firmware","contenu":"Click the **Update Firmware** button at the bottom of the window.","images":[]},{"icone":"🔵","titre":"Entering Bootloader mode","contenu":"Press and hold the small blue button **under your Cronus Zen** until **\"Zen Bootloader\"** appears on the OLED screen.","images":["/media/guide/mise-a-jour-2.webp"]},{"icone":"🔗","titre":"Connecting the device","contenu":"In the *Firmware Update* window, click the **\"Connect Device\"** button.","images":["/media/guide/mise-a-jour-3.webp"]},{"icone":"🎮","titre":"Selecting the hardware","contenu":"Select your Cronus Zen in the list of detected devices, then click **\"Connect\"**.","images":["/media/guide/mise-a-jour-4.webp"]},{"icone":"💾","titre":"Choosing the version to install","contenu":"⬆️ **To update (Update):** Click the **\"Update to latest\"** button.\n⬇️ **To install an earlier version (Downgrade):** Click **\"Other Versions\"**, select the desired version from the drop-down menu, then click **\"Download and flash\"**.","images":["/media/guide/mise-a-jour-5.webp","/media/guide/mise-a-jour-6.webp"]}],"etiquette":"Step"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning — Hardware error:** If you perform a *downgrade* to unblock your Cronus Zen following an **E3**, **E3001,** **E3002** error code or because of a malfunction, select **the oldest firmware version** available in the drop-down menu."}],"icone":"actualiser","sommaire":false,"sousTitre":"Update your Cronus Zen firmware (or go back to an earlier version) straight from your web browser, in 7 steps."},{"id":"depannage-faq","titre":"Troubleshooting & FAQ","blocs":[{"type":"groupe","blocs":[{"type":"depliant","titre":"❓ What are the main causes of errors and problems?","blocs":[{"type":"texte","style":"h2","contenu":"💻 Software and update issues"},{"type":"liste","contenu":"**Interrupted or incorrectly performed update:**\n> 💡 **Solution:** The best remedy for software malfunctions is to perform a [**downgrade**](page:mise-a-jour-zen) to the **oldest** firmware version, then restart the update to the very latest version. If the problem persists, perform a *Factory Reset (warning: this erases all the scripts saved on the unit)*.\n**Wrong platform detection (Output Protocol):** Even though *AUTO* mode is supposed to recognize your console, automatic detection sometimes fails and blocks communication.\n> 💡 **Solution:** In [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/), go to the **Device Management** tab ➔ **Device Settings**, then force the **Output Protocol** by manually selecting your gaming platform (*PS5, Xbox Series X/S, PS4, PC*...) instead of leaving it on *AUTO*.\n**Blocked by antivirus or firewall:**\n> 💡 **Solution:** Temporarily disable your antivirus or allow [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/) in your Windows firewall if the software refuses to detect the Zen or apply an update.\n**Corrupted script in a memory slot:**\n> 💡 **Solution:** If the Zen crashes or restarts only when you select a particular profile, erase the relevant *slot* in [ZEN Studio](https://zenstudio.collectivemindsstore.com/) then reinstall the script."},{"type":"texte","style":"h2","contenu":"🔌 Hardware and power issues"},{"type":"liste","contenu":"**Insufficient USB power:** The USB ports on your computer or console, or the use of a passive (unpowered) USB *hub*, do not deliver enough power to the Cronus Zen and its peripherals.\n> 💡 **Solution:** Plug the Cronus Zen directly into the main USB ports of your console or the back of your PC. Avoid extension cables and USB power strips without external power.\n**Faulty or incompatible USB cables:**\n> 💡 **Solution:** Only certified **Data Transfer** cables *(charge & data)* work. *Charge-Only* cables do not transmit information and cause detection errors."},{"type":"texte","style":"h2","contenu":"🎮 Controller and compatibility issues"},{"type":"liste","contenu":"**Discharged or unsupported controller:**\n> 💡 **Solution:** Make sure your controller is sufficiently charged before plugging it into the Zen and check its hardware compatibility in the official list.\n**Vibrations or Adaptive Triggers (ADT) disabled:** Some scripts (especially those handling automatic vehicle or profile detection) use vibration and ADT feedback to work properly.\n> 💡 **Solution:** Make sure **Vibrations** and **Adaptive Triggers** are enabled both in your **console's system settings** and in your **game's options menus**."},{"type":"texte","style":"h2","contenu":"🏎️ Incorrect system modes (*Wheel Mode*, *Tournament Mode*)"},{"type":"liste","contenu":"**Accidental mode change:**\n> 💡 **Solution:** In the status bar at the very bottom of the [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/) window *(next to the serial number and version)*, find the clickable text showing the active mode. If it is set to **Wheel** or **Tournament**, click it and set it back to **Normal**."}]},{"type":"depliant","titre":"🚨 Fixing Errors (E3, E3001, E3002)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Resolution procedure (follow in order):"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Simple restart","contenu":"Fully unplug your Cronus Zen from all its USB connections, wait 5 seconds, then plug it back in."},{"titre":"Firmware restoration (Downgrade)","contenu":"If it remains blocked, follow the procedure in the **\"**[**Cronus Zen Updates**](page:mise-a-jour-zen)**\"** guide to perform a **downgrade** by selecting the **oldest** firmware version available, then update your Cronus Zen again to the latest version."},{"titre":"Factory Reset","contenu":"If the error persists, perform a complete *Factory Reset* of the device to wipe the system memory.\n⚠️ **Warning: the factory reset deletes all the scripts stored on the Cronus Zen.**"}]},{"type":"carte","couleur":"jaune","contenu":"💡 **Check:** Once the reset or flash is complete, the error code should disappear and the OLED screen should display the usual startup interface."}]},{"type":"depliant","titre":"🎧 Sound, Mic or Voice Chat issues (Jack port)","blocs":[{"type":"texte","style":"p","contenu":"Do you experience crackling, sound dropouts, loss of the voice channel or an undetected microphone when your headset is plugged into the jack port of the controller connected to the Cronus Zen?"},{"type":"texte","style":"h2","contenu":"⚡ Quick fixes by console"},{"type":"texte","style":"h2","contenu":"🎮 Dedicated PS5 solution","couleurHex":"#3d9bff","fondCouleur":"#3d9bff","fondOpacite":14},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Simply plug your headset into your controller's jack port **BEFORE** performing the [**PS5 Bypass**](page:bypass-ps5) procedure."},{"contenu":"Then start your usual [**PS5 Bypass**](page:bypass-ps5) procedure."}]},{"type":"texte","style":"h2","contenu":"🎮 Dedicated XBOX solution","couleurHex":"#4ade5a","fondCouleur":"#4ade5a","fondOpacite":14},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your Cronus Zen to your Xbox (*no controller should be plugged into the Cronus Zen at this step*)."},{"contenu":"Make sure your Cronus Zen is on the **Gearhead** screen *(alien head logo* 👽*)*."}]},{"type":"carte","couleur":"jaune","contenu":"*💡 If a script is currently loaded on a slot, press the big blue button on the right several times until the Gearhead logo appears on the OLED screen.*"},{"type":"etapes","etiquette":"Step","depart":3,"etapes":[{"contenu":"Plug your jack headset into your Xbox controller."},{"contenu":"Then plug your controller into the **A1** port of your Cronus Zen."},{"contenu":"Once the headset is connected to the controller and the controller plugged into the Zen, briefly press the **Reset** button located under the Cronus Zen unit."}]},{"type":"carte","couleur":"orange","contenu":"⚠️ **Good to know:** The Cronus Zen handles audio signal transit through the jack port of a controller connected to its USB ports very poorly. To keep optimal sound quality and a fully working microphone, it is strongly recommended not to route the audio through the unit."},{"type":"texte","style":"h2","contenu":"🛠️ Still having sound or microphone problems? (3 effective alternatives)"},{"type":"liste","contenu":"**📶
