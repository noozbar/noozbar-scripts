plique des micro-trajectoires géométriques autour du stick de visée."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer d'Offset"},{"type":"texte","style":"p","contenu":"Des trajectoires géométriques parfaitement identiques, répétées en boucle, formeraient une signature mécanique facile à repérer.\n\nPour protéger votre compte, ce MOD est équipé d'un **Humanizer d'Offset**. Il intègre de légères variations aléatoires dans les micro-mouvements simulés : les formes dessinées conservent une subtile imperfection humaine, impossible à distinguer d'un contrôle manuel."},{"type":"texte","style":"h2","contenu":"📐 Les formes géométriques (*Shapes*)"},{"type":"texte","style":"p","contenu":"Chaque joueur et chaque jeu réagit différemment aux trajectoires. Vous pouvez choisir parmi 13 formes géométriques disponibles (classées ici dans l'ordre exact du menu OLED) :"},{"type":"liste","contenu":"**Horiz. Flaire :** Fait des allers-retours horizontaux sur une ligne (gauche / droite)\n**Circular :** Dessine un cercle régulier et fluide\n**Fig. 8 :** Forme un 8 vertical, avec deux boucles l'une au-dessus de l'autre\n**Flat Infinity :** Dessine un sigle infini (∞) aplati, plus large que haut\n**Round Infinity :** Dessine un sigle infini (∞) équilibré, presque aussi haut que large\n**Losange** *(anciennement appelé Sticky)* **:** Suit une trajectoire en carré ou losange (→ ↓ ← ↑)\n**Tall Oval :** Forme un ovale vertical (plus haut que large)\n**Wide Oval :** Forme un ovale horizontal (plus large que haut)\n**Spiral :** Dessine un cercle en spirale dont le rayon augmente puis diminue\n**Helix :** Fait tourner un petit carré/losange autour du centre\n**Helix 2 :** Identique à Helix, mais avec une progression plus lente entre les directions\n**Flower :** Dessine une rosace à plusieurs pétales\n**Vert. Flaire :** Fait des allers-retours verticaux sur une ligne (avant / arrière)","numerote":true},{"type":"texte","style":"h2","contenu":"⚙️ Les paramètres de réglage (*Radius & Step*)"},{"type":"texte","style":"p","contenu":"Chaque configuration repose sur deux variables clés :"},{"type":"liste","contenu":"**Radius (Rad) — Le Rayon :** Définit l'amplitude ou la taille de la forme dessinée.\n> *(⚠️ La valeur du Radius doit impérativement être supérieure à la DeadZone configurée en jeu pour être prise en compte).*\n**Step (Cadence / Vitesse) :** Définit la vitesse du mouvement, quelle que soit la vitesse de la VM. Pour avoir un ordre d'idée, divisez le Step par 3 : vous obtenez environ le nombre de **cycles par seconde** (un cycle = un tour pour *Circular*, un aller-retour pour *Horiz. Flaire*…).\n- *Step de 15 :* environ **5 cycles par seconde**.\n- *Step de 20 :* environ **7 cycles par seconde**."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Cas particuliers :**\n\n**Helix 2** est 4× plus lent : le petit cercle fait un tour complet sur chaque coin avant de passer au suivant.\n\n**Spiral :** le Step règle la vitesse de rotation, tandis que l'expansion et la contraction dépendent du **Radius**. Avec un Step faible ou un petit Radius, la forme ressemble plutôt à un cercle qui gonfle et dégonfle. Pour obtenir une vraie spirale, augmentez le Step ou le Radius : c'est le rapport Step / Radius qui décide du rendu."},{"type":"texte","style":"h2","contenu":"🎛️ Profils de réglage par situation"},{"type":"texte","style":"p","contenu":"Vous pouvez régler le **Radius** et le **Step** indépendamment selon 4 scénarios de combat :"},{"type":"liste","contenu":"**ADS Only :** S'applique lorsque vous visez sans tirer.\n**FIRE Only :** S'applique lorsque vous tirez au jugé sans viser.\n**ADS + FIRE :** S'applique lorsque vous visez et tirez simultanément.\n**NEUTRAL :** S'applique lorsque vous ne visez pas et ne tirez pas (permet de garder l'aide à la visée active en permanence pendant vos déplacements)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Désactivation ciblée :** Si vous ne voulez pas d'assist dans une situation donnée (par exemple au tir au jugé), réglez simplement le **Radius** et le **Step** de ce mode sur **0**."},{"type":"texte","style":"h2","contenu":"🛠️ Comportement dynamique & Dépannage"},{"type":"liste","contenu":"**Centrage dynamique :** La forme géométrique est dessinée en temps réel autour de la position actuelle de votre stick. Si vous poussez votre stick droit à 30 % vers la droite pour suivre une cible, le cercle ou l'ovale se dessinera autour de ce point à 30 %.\n**Réduction en butée :** Plus vous approchez le stick du bord physique de la manette (en butée), plus l'amplitude du MOD se réduit automatiquement pour ne pas altérer votre vitesse de rotation maximale.\n**Écran qui tremble ?** Si votre caméra secoue trop à l'écran, votre **Radius** est trop élevé. Réduisez progressivement la valeur du Radius jusqu'à obtenir un balayage fluide et invisible à l'œil nu."},{"type":"cartelien","affichage":"pleine","titre":"🎥 Démonstration vidéo : AIM Assist & LS Assist en action","destination":"https://www.youtube.com/watch?v=xVhBBF5Q1VU","contenu":"Ouvrir la page dédiée →","icone":"link"}],"fiche":{"colonnes":[{"titre":"Comprendre l'AIM Assist","liens":[{"titre":"❓ Qu'est-ce que l'AIM Assist ?","de":0,"a":1},{"titre":"⚠️ Démystifier l'AIM Assist","de":2,"a":5},{"titre":"🧠 L'aide à la visée native","de":6,"a":11},{"titre":"🛡️ Sécurité & Humanizer d'Offset","de":12,"a":13},{"titre":"🛠️ Comportement & Dépannage","de":25,"a":26},{"titre":"🎥 Démonstration vidéo","de":27,"a":27}]},{"titre":"Régler l'AIM Assist","liens":[{"titre":"📐 Les formes (Shapes)","de":14,"a":16},{"titre":"🎚️ Radius & Step","de":17,"a":24}]}]}},{"id":"ls-assist","titre":"🏃 LS Assist","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le LS Assist ?"},{"type":"texte","style":"p","contenu":"Le **LS Assist** est un MOD d'assistance à la visée. Il applique en continu de micro-mouvements imperceptibles sur votre stick de déplacement (stick gauche), en suivant une forme géométrique (Horiz. Flaire, Circular, Fig. 8…), pour que le jeu détecte votre personnage en mouvement permanent et garde son aide à la visée native active à 100 % du temps.\n\nRésultat : votre viseur reste plus facilement dans la bulle d'aide à la visée de l'ennemi, sans jamais viser à votre place."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer d'Offset"},{"type":"texte","style":"p","contenu":"Des micro-mouvements parfaitement identiques sur le stick de déplacement formeraient une signature mécanique facile à repérer.\n\nPour protéger votre compte, ce MOD est équipé d'un **Humanizer d'Offset**. Il intègre de légères variations aléatoires dans les micro-mouvements simulés du stick gauche, pour un rendu naturel, impossible à distinguer d'un contrôle manuel."},{"type":"texte","style":"h2","contenu":"📐 Formes disponibles pour le LS Assist"},{"type":"texte","style":"p","contenu":"Le LS Assist propose une sélection restreinte de 5 formes optimisées pour le déplacement :"},{"type":"liste","contenu":"**Horiz. Flaire** *(La plus populaire et surement la plus efficace en duel)*\n**Circular**\n**Fig. 8**\n**Flat Infinity**\n**Round Infinity**","numerote":true},{"type":"texte","style":"h2","contenu":"⚙️ Les paramètres de réglage (*Radius & Step*)"},{"type":"texte","style":"p","contenu":"Chaque configuration repose sur deux variables clés :"},{"type":"liste","contenu":"**Radius (Rad) — Le Rayon :** Définit l'amplitude ou la taille de la forme dessinée.\n> *(⚠️ La valeur du Radius doit impérativement être supérieure à la DeadZone configurée en jeu pour être prise en compte).*\n**Step (Cadence / Vitesse) :** Définit la vitesse du mouvement, quelle que soit la vitesse de la VM. Pour avoir un ordre d'idée, divisez le Step par 3 : vous obtenez environ le nombre de **cycles par seconde** (un cycle = un tour pour *Circular*, un aller-retour pour *Horiz. Flaire*…).\n- *Step de 15 :* environ **5 cycles par seconde**.\n- *Step de 20 :* environ **7 cycles par seconde**."},{"type":"texte","style":"h2","contenu":"🎛️ Profils de réglage par situation"},{"type":"texte","style":"p","contenu":"Vous pouvez régler le **Radius** et le **Step** indépendamment selon 4 scénarios de combat :"},{"type":"liste","contenu":"**ADS Only :** S'applique lorsque vous visez sans tirer.\n**FIRE Only :** S'applique lorsque vous tirez au jugé sans viser.\n**ADS + FIRE :** S'applique lorsque vous visez et tirez simultanément.\n**NEUTRAL :** S'applique lorsque vous ne visez pas et ne tirez pas."},{"type":"carte","couleur":"jaune","contenu":"💡 **Désactivation ciblée :** Si vous ne voulez pas d'assist dans une situation donnée (par exemple au tir au jugé), réglez simplement le **Radius** et le **Step** de ce mode sur **0**."},{"type":"texte","style":"h2","contenu":"🛑 Coupure automatique du LS Assist"},{"type":"texte","style":"p","contenu":"Contrairement au stick droit, lorsque vous déplacez réellement votre stick gauche pour faire marcher ou courir votre personnage, **le LS Assist s'interrompt automatiquement** dès que la valeur de votre déplacement dépasse le *Radius* configuré. Il reprend instantanément dès que le stick revient au centre."},{"type":"cartelien","affichage":"pleine","titre":"🎥 Démonstration vidéo : AIM Assist & LS Assist en action","destination":"https://www.youtube.com/watch?v=xVhBBF5Q1VU","contenu":"Ouvrir la page dédiée →","icone":"link"}],"fiche":{"colonnes":[{"titre":"Comprendre le LS Assist","liens":[{"titre":"❓ Qu'est-ce que le LS Assist ?","de":0,"a":1},{"titre":"🛡️ Sécurité & Humanizer d'Offset","de":2,"a":3},{"titre":"🛑 Coupure automatique","de":14,"a":15},{"titre":"🎥 Démonstration vidéo","de":16,"a":16}]},{"titre":"Régler le LS Assist","liens":[{"titre":"📐 Les formes (Shapes)","de":4,"a":6},{"titre":"🎚️ Radius & Step","de":7,"a":13}]}]}},{"id":"aim-abuse","titre":"🎯 AIM Abuse","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'AIM Abuse et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**AIM Abuse** est un MOD conçu pour tirer parti de la mécanique d'**Auto-Snap** (le verrouillage automatique de la visée) présente dans certains jeux.\n\nDans ces jeux, appuyer sur la touche de visée lorsque vous êtes proche d'un ennemi « colle » instantanément le viseur sur la cible. Le MOD AIM Abuse automatise ce geste : il relâche et ré-enfonce la gâchette de visée à une fréquence très rapide. Ce rafraîchissement continu réactive l'Auto-Snap en boucle, forçant votre viseur à rester verrouillé sur l'adversaire, même s'il est en mouvement."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Compatibilité des jeux :**\n\nL'Auto-Snap est de moins en moins présent dans les FPS compétitifs modernes, mais il reste extrêmement puissant dans des jeux comme *GTA 5*, *Red Dead Redemption II*, ou certains jeux de tir disposant d'une aide à la visée renforcée."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer de Timing"},{"type":"texte","style":"p","contenu":"Un spam de visée exécuté à des intervalles strictement identiques (à la milliseconde près) constitue une signature mécanique facilement repérable.\n\nPour protéger votre compte, ce MOD est équipé d'un **Humanizer de Timing**. Il génère de micro-variations aléatoires sur les durées de maintien et de relâchement. L'enchaînement conserve ainsi un rythme vivant et naturel, tout en maintenant un rafraîchissement ultra-efficace de l'Auto-Snap.\n\n**⚙️ Le système de déclenchement :** [**MODs Activator**](page:mods-activator)\n\nAIM Abuse s'appuie sur le système [**MODs Activator**](page:mods-activator). Il s'agit des conditions nécessaires pour déclencher votre MOD. Vous choisissez exactement *comment* et *quand* votre MOD doit s'activer"},{"type":"texte","style":"h2","contenu":"🛠️ Les réglages du MOD"},{"type":"texte","style":"p","contenu":"Pour obtenir un verrouillage fluide sans que l'image ne saute à l'écran, le MOD repose sur deux paramètres à ajuster :"},{"type":"liste","contenu":"**Hold Time :** Définit la durée pendant laquelle la touche de visée reste maintenue enfoncée.\n**Release Time :** Définit la durée pendant laquelle la visée est brièvement relâchée avant d'être réenclenchée."},{"type":"carte","couleur":"jaune","contenu":"💡 **Conseil de réglage :**\n\nL'astuce consiste à régler le **Release Time** le plus finement possible :"},{"type":"liste","contenu":"Il doit être **assez court** pour que votre arme ne quitte pas visuellement le mode visée (pas de zoom/dézoom gênant).\nIl doit être **assez long** pour que le jeu enregistre le relâchement et réactive l'Auto-Snap dès la pression suivante.\n> *Le Hold Time peut rester plus long sans altérer l'efficacité.*"}],"fiche":{"colonnes":[{"titre":"Comprendre l'AIM Abuse","liens":[{"titre":"❓ Qu'est-ce que l'AIM Abuse ?","de":0,"a":2},{"titre":"🛡️ Sécurité & Humanizer de Timing","de":3,"a":4}]},{"titre":"Régler l'AIM Abuse","liens":[{"titre":"🎚️ Hold Time & Release Time","de":5,"a":9}]}]}},{"id":"shot-mods","titre":"🤸 Shot MODs","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'un Shot MOD ?"},{"type":"texte","style":"p","contenu":"Un **Shot MOD** est un MOD d'action automatique qui déclenche un mouvement tactique (s'accroupir, sauter ou se décaler) lorsque vous visez ou tirez. Son objectif principal est de perturber la visée adverse lors de vos duels (*gunfights*) en vous rendant beaucoup plus difficile à toucher, tout en vous laissant concentré sur votre tir.\n\nChaque profil dispose de son propre Shot MOD paramétrable de manière indépendante."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer de Timing"},{"type":"texte","style":"p","contenu":"Les mouvements répétitifs exécutés à la milliseconde près trahissent immédiatement un comportement automatisé.\n\nLe **Strafe Shot** intègre un **Humanizer de Timing**. Il applique de légères variations aléatoires sur la durée des pas de côté. Vos déplacements conservent ainsi un rythme vivant et naturel, évitant un rendu robotisé pour passer sous le radar des systèmes anti-cheat.\n\n**⚙️ Le système de déclenchement :** [**MODs Activator**](page:mods-activator)\n\nLes Shot MODs s'appuient sur le système [**MODs Activator**](page:mods-activator). Il s'agit des conditions nécessaires pour déclencher votre MOD. Vous choisissez exactement *comment* et *quand* votre MOD doit s'activer"},{"type":"texte","style":"h1","contenu":"🛠️ Les différents Shot MODs disponibles"},{"type":"texte","style":"h2","contenu":"⬇️ Drop Shot"},{"type":"texte","style":"p","contenu":"Fait s'accroupir automatiquement votre personnage lorsque le MOD s'active."},{"type":"liste","contenu":"Réduit subitement votre zone d'impact (*hitbox*), forçant l'adversaire à tirer au-dessus de vous."},{"type":"texte","style":"h2","contenu":"⬆️ Jump Shot"},{"type":"texte","style":"p","contenu":"Fait sauter automatiquement votre personnage dès l'engagement du tir."},{"type":"liste","contenu":"Particulièrement redoutable en combat rapproché pour déstabiliser la visée ennemie et éviter les tirs à la tête (*headshots*)."},{"type":"texte","style":"h2","contenu":"↔️ Strafe Shot"},{"type":"texte","style":"p","contenu":"Fait effectuer à votre personnage des pas alternés de gauche à droite pendant le tir pour vous rendre insaisissable.\n\nParamètre à régler :"},{"type":"liste","contenu":"**Strafe Time :** Définit la durée (en millisecondes) de chaque déplacement latéral avant le changement de direction."},{"type":"carte","couleur":"blue","contenu":"🌀 Pour garder le viseur calé sur la cible pendant les pas de côté, utilisez le [**Kinetic AIM**](page:profile-mods), qui compense automatiquement le décalage de la visée."}],"fiche":{"colonnes":[{"titre":"Comprendre les Shot MODs","liens":[{"titre":"❓ Qu'est-ce qu'un Shot MOD ?","de":0,"a":1},{"titre":"🛡️ Sécurité & Humanizer de Timing","de":2,"a":3}]},{"titre":"Régler les Shot MODs","liens":[{"titre":"⬇️ Drop Shot","de":5,"a":7},{"titre":"⬆️ Jump Shot","de":8,"a":10},{"titre":"↔️ Strafe Shot","de":11,"a":14}]}]}},{"id":"kinetic-aim","titre":"🌀 Kinetic AIM","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Kinetic AIM et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Kinetic AIM** est un MOD de compensation dynamique de la visée. Quand vous vous déplacez latéralement en visant ou en tirant, le déplacement de votre personnage décale naturellement votre viseur de la cible. Le MOD détecte ce mouvement et applique en temps réel une micro-correction **opposée** sur le stick de visée (stick droit), pour garder le viseur calé sur l'ennemi pendant que vous bougez.\n\nLa compensation est **proportionnelle** : plus votre mouvement latéral est ample, plus la correction est forte. Un **petit lissage** évite les à-coups : la correction reste douce, sans saccades visibles à l'écran."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer d'Offset"},{"type":"texte","style":"p","contenu":"Une correction mathématiquement parfaite et identique à chaque mouvement serait facile à repérer.\n\nPour protéger votre compte, ce MOD est équipé d'un **Humanizer d'Offset**. Il intègre de légères variations aléatoires dans les déplacements simulés, pour que la compensation garde une subtile imperfection humaine."},{"type":"texte","style":"h2","contenu":"⚙️ Le système de déclenchement"},{"type":"texte","style":"p","contenu":"Le Kinetic AIM s'active uniquement lorsque ces **2 conditions** sont réunies :"},{"type":"liste","contenu":"**Vous appuyez sur Viser et/ou sur Tirer.**\n**Vous vous déplacez latéralement**, grâce :\n- **à vos propres mouvements :** dès que vous poussez le stick gauche à gauche ou à droite ;\n- **au MOD Strafe Shot :** quand il déplace votre personnage de côté.","numerote":true},{"type":"texte","style":"p","contenu":"Sans appui sur Viser ni Tirer, ou sans mouvement latéral, le MOD ne fait rien."},{"type":"liste","contenu":"**Zone morte :** le mouvement latéral n'est pris en compte qu'au-delà d'une petite zone morte : celle réglée dans **Stick Drift Correction** (*LS Correction*) si elle est activée, sinon 5 % par défaut.\n**Avec le LS Assist :** les deux MODs ne se superposent pas. Le Kinetic AIM prend le relais dès que le LS Assist s'interrompt, c'est-à-dire quand vous déplacez réellement votre stick gauche."},{"type":"texte","style":"h2","contenu":"🛠️ Le réglage du MOD"},{"type":"texte","style":"p","contenu":"Il n'y a qu'**une seule valeur** à régler : la **Kinetic Value**, de **0 à 100**, indépendante pour chaque profil. Plus la valeur est élevée, plus la correction du viseur est forte. À **0**, aucune compensation n'est appliquée."},{"type":"carte","couleur":"jaune","contenu":"💡 **Conseil de réglage :**\n\nTrouvez la valeur qui garde votre viseur calé sur la cible pendant vos déplacements latéraux :"},{"type":"liste","contenu":"**Commencez bas** et montez progressivement : une valeur trop forte fait *dépasser* la cible dans le sens inverse.\n**Testez en mouvement :** placez-vous face à une cible à distance moyenne, faites des pas de côté en visant, et cherchez la valeur qui laisse le viseur calé sur elle.\n**Adaptez à la distance et au jeu :** plus l'adversaire est loin, plus la valeur doit être faible. Chaque jeu et chaque sensibilité réagit différemment.\n**Avec le Strafe Shot :** réglez d'abord son *Strafe Time*, puis ajustez la Kinetic Value."}],"fiche":{"colonnes":[{"titre":"Comprendre le Kinetic AIM","liens":[{"titre":"❓ Qu'est-ce que le Kinetic AIM ?","de":0,"a":1},{"titre":"🛡️ Sécurité & Humanizer d'Offset","de":2,"a":3},{"titre":"⚙️ Système de déclenchement","de":4,"a":8}]},{"titre":"Régler le Kinetic AIM","liens":[{"titre":"🎚️ Kinetic Value","de":9,"a":12}]}]}},{"id":"auto-ads","titre":"🎯 Auto ADS","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto ADS ?"},{"type":"texte","style":"p","contenu":"Ce MOD simplifie vos actions au combat en supprimant la nécessité d'appuyer sur la gâchette de visée lorsque vous tirez. Il permet de réduire votre temps de réaction en combinant la visée et le tir en une seule pression."},{"type":"texte","style":"h2","contenu":"🎯 Auto ADS *(Visée automatique)*"},{"type":"texte","style":"p","contenu":"Appuie automatiquement sur la touche de visée (**ADS**) dès que vous enfoncez la touche de tir (**FIRE**)."},{"type":"liste","contenu":"**Utilité :** Idéal si vous avez tendance à tirer au jugé en panique lors d'un duel imprévu. Le script s'assure que vous passez immédiatement en visée épaulée pour gagner en précision sans devoir presser la gâchette de visée."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Auto ADS","liens":[{"titre":"❓ Qu'est-ce que l'Auto ADS ?","de":0,"a":1}]},{"titre":"Régler l'Auto ADS","liens":[{"titre":"🎯 Auto ADS","de":2,"a":4}]}]}},{"id":"auto-fire","titre":"💥 Auto FIRE","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto FIRE ?"},{"type":"texte","style":"p","contenu":"Ce MOD simplifie vos actions au combat en supprimant la nécessité d'appuyer sur la gâchette de tir lorsque vous visez. Il permet de réduire votre temps de réaction en combinant la visée et le tir en une seule pression."},{"type":"texte","style":"h2","contenu":"💥 Auto FIRE *(Tir automatique)*"},{"type":"texte","style":"p","contenu":"Appuie automatiquement sur la touche de tir (**FIRE**) dès que vous enfoncez la touche de visée (**ADS**)."},{"type":"liste","contenu":"**Utilité :** Permet d'ouvrir le feu à la milliseconde près dès que vous épaulez votre arme, éliminant tout temps d'hésitation."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Auto FIRE","liens":[{"titre":"❓ Qu'est-ce que l'Auto FIRE ?","de":0,"a":1}]},{"titre":"Régler l'Auto FIRE","liens":[{"titre":"💥 Auto FIRE","de":2,"a":4}]}]}},{"id":"auto-scope","titre":"🔭 Auto Scope (GTA 6, RDR2, GTA 5)","scripts":["gta6","rdr2","gta5"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto Scope ?"},{"type":"texte","style":"p","contenu":"Ce MOD appuie automatiquement sur la touche de zoom de votre lunette lorsque vous visez. Il n'est pas réservé aux fusils de précision : il fonctionne avec toutes vos armes et lunettes à faible grossissement (x1, x1,5, x2, x4…), du pistolet-mitrailleur au fusil d'assaut."},{"type":"texte","style":"h2","contenu":"🎯 Auto Scope"},{"type":"texte","style":"p","contenu":"Bascule automatiquement votre arme en mode zoom/lunette dès que vous appuyez sur la touche de visée (**ADS**).\n\nParamètre à régler :"},{"type":"liste","contenu":"**Scope Delay :** Définit le délai d'attente (en millisecondes) avant le déclenchement automatique du zoom après avoir pressé *Viser*."},{"type":"carte","couleur":"jaune","contenu":"💡 **Conseil de réglage :**\n\nNe réglez pas un délai trop court ! Le jeu doit impérativement avoir le temps d'amorcer l'animation de visée avant que le script n'envoie la commande de zoom. Si le délai est trop rapide, l'action sera ignorée par le jeu."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Auto Scope","liens":[{"titre":"❓ Qu'est-ce que l'Auto Scope ?","de":0,"a":1}]},{"titre":"Régler l'Auto Scope","liens":[{"titre":"🎚️ Scope Delay","de":2,"a":5}]}]}},{"id":"quick-scope","titre":"⚡ Quick Scope (FPS/TPS)","scripts":["fps-tps"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Quick Scope ?"},{"type":"texte","style":"p","contenu":"Ce MOD est spécialement développé pour les fusils de précision (Sniper). Il automatise les techniques de visée et de tir rapide, comme la célèbre technique du *QuickScope*, pour vous donner un avantage décisif lors de vos duels."},{"type":"texte","style":"h2","contenu":"⚡ Quick Scope"},{"type":"texte","style":"p","contenu":"Déclenche un tir automatique un court instant après avoir pressé la touche de visée (**ADS**), reproduisant à la perfection la célèbre technique du *QuickScope*.\n\nParamètre à régler :"},{"type":"liste","contenu":"**QuickScope Delay :** Définit le temps de pause (en millisecondes) entre le début de la visée et le départ du coup de feu."},{"type":"carte","couleur":"jaune","contenu":"💡 **Conseil de réglage :**\n\nTrouver le bon équilibre est essentiel :"},{"type":"liste","contenu":"**Trop rapide :** La balle partira avant que le jeu ne vous considère en position de visée, transformant votre coup en un tir au jugé (*hip-fire*) imprécis.\n**Trop lent :** Vous perdez tout l'intérêt du QuickScope et laissez le temps à l'adversaire de répliquer."}],"fiche":{"colonnes":[{"titre":"Comprendre le Quick Scope","liens":[{"titre":"❓ Qu'est-ce que le Quick Scope ?","de":0,"a":1}]},{"titre":"Régler le Quick Scope","liens":[{"titre":"🎚️ QuickScope Delay","de":2,"a":6}]}]}},{"id":"headshot-assist","titre":"💀 HeadShot Assist","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le HeadShot Assist et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **HeadShot Assist** est un MOD d'aide à la visée qui applique une légère impulsion verticale vers le haut lorsque vous épaulez votre arme, afin d'aligner plus rapidement votre réticule sur la tête de l'adversaire."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Mise au point importante (ce n'est PAS un aimbot) :**\n\nCe MOD n'est en aucun cas un *cheat PC* ou un *lock* automatique qui repère la tête de l'ennemi à l'écran. Il s'agit simplement d'une assistance mécanique qui tire votre viseur vers le haut."},{"type":"carte","couleur":"jaune","contenu":"💡 *Remarque : Si votre réticule est déjà positionné à hauteur de tête au moment où le MOD s'active, l'impulsion fera monter votre viseur au dessus de la tête !*"},{"type":"texte","style":"h1","contenu":"⚡ Les 3 modes de déclenchement"},{"type":"texte","style":"h2","contenu":"🚀 Instant"},{"type":"texte","style":"p","contenu":"Le HeadShot Assist se déclenche immédiatement dès que vous appuyez sur la touche de visée (**ADS**)."},{"type":"texte","style":"h2","contenu":"🎯 Press Sensitive"},{"type":"texte","style":"p","contenu":"Le HeadShot Assist s'active uniquement lorsque vous enfoncez la gâchette de visée à fond (en butée)."},{"type":"liste","contenu":"**Utilité :** Permet de viser normalement en appuyant légèrement sur la gâchette, et de ne déclencher le coup de pouce vers la tête que lorsque vous enfoncez la gâchette au maximum."},{"type":"texte","style":"h2","contenu":"🔄 Release Sensitive"},{"type":"texte","style":"p","contenu":"Permet de déclencher l'assistance à tout moment pendant la visée. Vous pouvez maintenir la visée aussi longtemps que vous le souhaitez sans rien activer. Quand vous avez besoin du HeadShot Assist, **relâchez légèrement la gâchette** (sans la lâcher complètement) puis enfoncez-la à nouveau en butée."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Note :** Si vous relâchez totalement la gâchette (à 0 %), le geste est annulé et l'assistance ne se déclenchera pas. Cela évite les déclenchements involontaires lors d'une sortie de visée."},{"type":"texte","style":"h2","contenu":"📏 Préréglages de distance & Mode Custom"},{"type":"texte","style":"p","contenu":"La distance de l'ennemi influe directement sur l'amplitude de mouvement nécessaire : plus l'adversaire est loin, plus l'impulsion doit être légère pour ne pas dépasser la cible.\n\nLe MOD propose **3 pré-réglages optimisés** et un mode **Custom** :"},{"type":"liste","contenu":"🥊 **Close :** Ajusté pour les combats rapprochés (environ **5 à 15 mètres**).\n🎯 **Medium :** Ajusté pour les engagements à moyenne distance (environ **15 à 30 mètres**).\n🔭 **Long :** Ajusté pour les cibles éloignées (**30 mètres et plus**).\n🛠️ **Custom :** Vous permet de régler manuellement une valeur numérique précise pour adapter l'impulsion à vos habitudes de jeu ou à votre sensibilité habituelle."}],"fiche":{"colonnes":[{"titre":"Comprendre le HeadShot Assist","liens":[{"titre":"❓ Qu'est-ce que le HeadShot Assist ?","de":0,"a":3}]},{"titre":"Régler le HeadShot Assist","liens":[{"titre":"🚀 Instant","de":5,"a":6},{"titre":"🎯 Press Sensitive","de":7,"a":9},{"titre":"🔄 Release Sensitive","de":10,"a":12},{"titre":"📏 Distance & Mode Custom","de":13,"a":15}]}]}},{"id":"deadeye","titre":"👁️ DeadEye","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD DeadEye ?"},{"type":"texte","style":"p","contenu":"Le **MOD DeadEye** est spécialement conçu pour automatiser et optimiser l'utilisation de la mécanique de *DeadEye* (ralenti / visée de précision) présente dans *Red Dead Redemption II.*\n\nIl permet d'enclencher automatiquement la compétence au moment opportun sans nécessiter d'appui manuel sur le stick, évitant ainsi de perdre du temps ou de gâcher votre jauge de compétence."},{"type":"texte","style":"h1","contenu":"🛠️ Les 2 variantes disponibles"},{"type":"texte","style":"h2","contenu":"🎯 Auto DeadEye"},{"type":"texte","style":"p","contenu":"Enclenche automatiquement le *DeadEye* dès que vous enfoncez la gâchette de visée (**ADS**)."},{"type":"liste","contenu":"**Utilité :** Idéal si vous souhaitez entrer en mode ralenti/précision immédiatement à chaque prise de visée."},{"type":"texte","style":"h2","contenu":"⚡ DeadShot"},{"type":"texte","style":"p","contenu":"Enclenche le *DeadEye* de manière ultra-furtive, juste à l'instant précis où vous appuyez sur la gâchette de tir (**FIRE**)."},{"type":"carte","couleur":"jaune","contenu":"💡 **La particularité du DeadShot (Précision chirurgicale) :**\n\nDans *Red Dead Redemption II*, déclencher le *DeadEye* juste avant le départ du coup réduit instantanément le cercle de dispersion (le réticule d'impact) au point central."},{"type":"texte","style":"p","contenu":"En activant la compétence uniquement lors de la pression sur la détente, le **DeadShot** force une précision à 100 % au moment exact de l'impact, tout en préservant votre jauge de *DeadEye* le reste du temps."}],"scripts":["rdr2"],"fiche":{"colonnes":[{"titre":"Comprendre le DeadEye","liens":[{"titre":"❓ Qu'est-ce que le DeadEye ?","de":0,"a":1}]},{"titre":"Régler le DeadEye","liens":[{"titre":"🎯 Auto DeadEye","de":3,"a":5},{"titre":"⚡ DeadShot","de":6,"a":9}]}]}},{"id":"hold-breath","titre":"🫁 Hold Breath","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Hold Breath et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Hold Breath** est un MOD conçu pour les fusils de précision (snipers) et les armes équipées de lunettes grossissantes. Il bloque automatiquement le souffle de votre personnage dès que vous passez en visée, éliminant totalement le balancement naturel de l'arme pour un tir parfaitement stable."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu & Déclenchement :"},{"type":"liste","contenu":"**Déclenchement automatique :** Dès que vous appuyez sur la touche de visée, le script appuie automatiquement sur la touche d'apnée ( {L3 / LS}), puis la relâche une fois le **Breath Time** écoulé.\n**Ergonomie accrue :** Vous n'avez plus besoin d'enfoncer physiquement le stick gauche ( {L3 / LS}) en pleine visée, ce qui évite de décaler votre réticule au moment crucial."},{"type":"texte","style":"h2","contenu":"🛠️ Le réglage du MOD"},{"type":"liste","contenu":"**Breath Time :** Durée pendant laquelle le souffle est retenu avant d'être relâché automatiquement, de **0 à 5000 ms** (ex. 2000 = 2 secondes)."}],"scripts":["fps-tps"],"fiche":{"colonnes":[{"titre":"Comprendre le Hold Breath","liens":[{"titre":"❓ Qu'est-ce que le Hold Breath ?","de":0,"a":1},{"titre":"⚙️ Fonctionnement & Déclenchement","de":2,"a":3}]},{"titre":"Régler le Hold Breath","liens":[{"titre":"🎚️ Breath Time","de":4,"a":5}]}]}},{"id":"autorun","titre":"🏃 AutoRun","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'AutoRun et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**AutoRun** est un MOD d'automatisation des déplacements. Il prend en charge la pression répétée ou le maintien de la touche de course à votre place, évitant ainsi de fatiguer vos doigts et de vous détruire les sticks analogiques."},{"type":"carte","couleur":"jaune","contenu":"💡 **Indicateur visuel :** Lorsque l'AutoRun est actif en jeu, les LEDs du Cronus Zen clignotent rapidement pour vous indiquer son fonctionnement."},{"type":"texte","style":"h1","contenu":"⚙️ Les 2 modes d'AutoRun selon vos jeux"},{"type":"texte","style":"p","contenu":"Le comportement de l'AutoRun est directement adapté au moteur du jeu concerné. Le script intègre automatiquement la version correspondant au titre auquel vous jouez."},{"type":"texte","style":"h2","contenu":"🎯 Mode FPS / TPS (incluant GTA 6)"},{"type":"texte","style":"p","contenu":"Un fonctionnement fluide basé uniquement sur l'inclinaison du stick analogique :"},{"type":"liste","contenu":"**Activation :** Poussez le stick de déplacement vers l'avant à **90 % ou plus** pour déclencher automatiquement la course.\n**Arrêt :** Relâchez le stick sous le seuil des **20 %** pour stopper l'AutoRun et revenir à une marche normale."},{"type":"texte","style":"h2","contenu":"🤠 Mode GTA 5 / Red Dead Redemption II"},{"type":"texte","style":"p","contenu":"Les jeux Rockstar nécessitant de maintenir ou de tapoter la touche de course ( {CROSS / A}), ce mode gère un **cycle intelligent à 3 états** dès que le stick est poussé **à plus de 85 %** :"},{"type":"liste","contenu":"**🚶 Marcher :** État de départ lorsque vous poussez le stick vers l'avant.\n**🏃 Courir :** Appuyez **une fois** sur {CROSS / A} : Le script maintient automatiquement la touche pour vous faire courir.\n**⚡ Sprinter :** Appuyez **une seconde fois** sur {CROSS / A} : Le script simule des pressions ultra-rapides (spam) pour vous faire sprinter à vitesse maximale.\n**🚶 Retour à la marche :** Appuyez **une troisième fois** sur {CROSS / A} (ou relâchez le stick **sous les 80 %**) pour réinitialiser le cycle."},{"type":"carte","couleur":"jaune","contenu":"💡 **Gestion automatique de la visée :** Si vous passez en visée (**ADS**) pendant un sprint, le script rétrograde automatiquement le déplacement de *Sprinter* à *Courir*, le moteur du jeu ne permettant pas de sprinter tout en épaulant son arme."}],"fiche":{"colonnes":[{"titre":"Comprendre l'AutoRun","liens":[{"titre":"❓ Qu'est-ce que l'AutoRun ?","de":0,"a":4}]},{"titre":"Régler l'AutoRun","liens":[{"titre":"🎯 Mode FPS / TPS","de":5,"a":7},{"titre":"🤠 Mode GTA 5 / Red Dead Redemption II","de":8,"a":11}]}]}},{"id":"turbo-boutons","titre":"⚡ Turbo Boutons","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'un Turbo Bouton et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Un **Turbo Bouton** automatise des pressions ultra-rapides (*spam*) sur une touche spécifique à votre place. Il suffit de maintenir le bouton pour que le script simule un martèlement continu, idéal pour ramasser du loot rapidement, recharger à la chaîne ou valider des actions répétitives sans fatiguer vos doigts."},{"type":"carte","couleur":"jaune","contenu":"💡 **Indicateur visuel :** Lorsque le Turbo Bouton est en cours d'exécution, les LEDs du Cronus Zen clignotent rapidement."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer de Timing"},{"type":"texte","style":"p","contenu":"Un spam de touche parfaitement régulier est une signature mécanique facile à repérer pour les anti-cheats.\n\nCe MOD intègre un **Humanizer de Timing** qui génère de micro-variations aléatoires dans la cadence d'exécution. Cela évite les intervalles figés et répétés à la milliseconde près, donnant au spam de boutons un rythme vivant et 100 % naturel."},{"type":"texte","style":"h2","contenu":"🎮 Les 3 Turbo Boutons disponibles"},{"type":"texte","style":"p","contenu":"Vous pouvez **activer** indépendamment jusqu'à 3 Turbo Boutons dans le menu du script :"},{"type":"etiquettes","contenu":"Turbo CROSS / A | Turbo SQUARE / X | Turbo CIRCLE / B"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Précision d'utilisation :** Vous pouvez laisser les 3 Turbo Boutons activés dans le menu, mais vous ne pouvez pas les **exécuter simultanément** en jeu (le script ne peut pas spammer {CROSS / A} et {CIRCLE / B} en même temps)."},{"type":"texte","style":"h2","contenu":"🛠️ Comment exécuter le Turbo en jeu ?"},{"type":"texte","style":"p","contenu":"L'activation en jeu a été pensée pour ne pas gêner vos pressions simples habituelles :\n\n**Exécution :** Effectuez un **double-tap** (deux pressions rapides) sur le bouton souhaité et **maintenez-le enfoncé** lors de la seconde pression.\n\n**Arrêt :** Relâchez simplement le bouton pour stopper instantanément le Turbo."}],"fiche":{"colonnes":[{"titre":"Comprendre les Turbo Boutons","liens":[{"titre":"❓ Qu'est-ce qu'un Turbo Bouton ?","de":0,"a":2},{"titre":"🛡️ Sécurité & Humanizer de Timing","de":3,"a":4}]},{"titre":"Régler et utiliser les Turbo Boutons","liens":[{"titre":"🎮 Les 3 Turbo Boutons disponibles","de":5,"a":8},{"titre":"🛠️ Comment exécuter le Turbo en jeu ?","de":9,"a":10}]}]}},{"id":"quick-item-gta6","titre":"💊 Quick Item (GTA 6)","blocs":[{"type":"texte","style":"p","contenu":"En développement ..."}],"fiche":{"colonnes":[]}},{"id":"auto-unscope","titre":"🔭 Auto Unscope (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto Unscope et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Redemption II*, lorsque vous passez en visée à la lunette (en appuyant sur **Viser** puis sur **Flèche du bas / D-Pad Down**), le jeu conserve ce mode de zoom en mémoire. Si vous ne sortez pas manuellement de la lunette, votre personnage repassera automatiquement en visée sniper la prochaine fois que vous appuyez sur la gâchette, ce qui peut vous désorienter en combat rapproché.\n\nL'**Auto Unscope** élimine cette contrainte : il automatise la sortie de la lunette dès que vous relâchez la gâchette de visée (**ADS**)."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Visée classique :** Vous appuyez sur **ADS** pour viser normalement.\n**Passage en lunette :** Vous appuyez sur **Flèche du bas / D-Pad Down** pour zoomer dans la lunette.\n**Réinitialisation automatique :** Dès que vous relâchez la gâchette **ADS**, le script envoie immédiatement la commande de sortie de lunette. Lors de votre prochaine prise de visée, vous revenez systématiquement en visée épaulemé classique."},{"type":"carte","couleur":"jaune","contenu":"💡 **Avantage :** Plus besoin de retenir si votre arme est restée en mode lunette ou non, vous reprenez toujours le contrôle en visée standard."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Auto Unscope","liens":[{"titre":"❓ Qu'est-ce que l'Auto Unscope ?","de":0,"a":1}]},{"titre":"Utiliser l'Auto Unscope","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":4}]}]}},{"id":"auto-reload","titre":"🔄 Auto Reload (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto Reload et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Redemption II*, après avoir tiré avec un répititeur ou un fusil à levier/verrou, vous devez effectuer une pression supplémentaire sur le bouton de tir pour réarmer manuellement le chien ou engager la cartouche suivante dans le canon.\n\nL'**Auto Reload** prend en charge ce réarmement mécanique à votre place immédiatement après chaque tir."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Automatisation du réarmement :** Dès que vous relâchez la touche de tir (**FIRE**), le script simule une impulsion ultra-rapide sur la détente pour armer le mécanisme.\n**Gain de réactivité :** Votre arme est immédiatement chargée et prête pour le coup suivant, vous évitant ainsi le temps mort d'une pression manuelle oubliée en plein duel."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Auto Reload","liens":[{"titre":"❓ Qu'est-ce que l'Auto Reload ?","de":0,"a":1}]},{"titre":"Utiliser l'Auto Reload","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"skid-stop","titre":"🐎 Skid Stop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Skid Stop et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Redemption II*, lorsque votre cheval atteint le **Niveau 3 d'affection ou supérieur**, vous débloquez la capacité d'exécuter un dérapage d'arrêt rapide (**Skid Stop**). De base, cette manœuvre nécessite de maintenir simultanément {R1 / RB} et {CROSS / A}.\n\nLe MOD **Skid Stop** simplifie l'exécution de ce mouvement technique en l'attribuant à une commande simple à une seule touche."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Déclenchement :** Effectuez un double-tap (deux pressions rapides) sur la touche {R1 / RB} tout en étant à cheval.\n**Action du script :** Le script maintient automatiquement la combinaison de touches nécessaire ( {R1 / RB} + {CROSS / A}) pour faire déraper et stopper net votre monture."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Préréquis :** Ce mouvement nécessite impérativement que votre cheval soit au **niveau 3 ou 4 d'affection** dans le jeu."}],"fiche":{"colonnes":[{"titre":"Comprendre le Skid Stop","liens":[{"titre":"❓ Qu'est-ce que le Skid Stop ?","de":0,"a":1}]},{"titre":"Utiliser le Skid Stop","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":4}]}]}},{"id":"easy-eagle-eye","titre":"👁️ Easy Eagle Eye (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Easy Eagle Eye et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Redemption II*, la compétence L'Œil de lynx (**Eagle Eye**) vous permet d'analyser votre environnement et de suivre les pistes d'animaux. De base, son activation nécessite d'enfoncer simultanément les deux sticks analogiques ( {L3 / LS} + {R3 / RS}).\n\nL'**Easy Eagle Eye** simplifie cette manipulation en l'attribuant à une unique pression pour ne plus rater la combinaison en plein jeu."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Activation :** Un simple clic sur le stick droit ( {R3 / RS}) suffit pour lancer instantanément l'Œil de lynx."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Easy Eagle Eye","liens":[{"titre":"❓ Qu'est-ce que l'Easy Eagle Eye ?","de":0,"a":1}]},{"titre":"Utiliser l'Easy Eagle Eye","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"horse-galop","titre":"🐎 Horse Gallop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Horse Gallop et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Horse Gallop** automatise le martèlement de la touche de galop tout en gérant le niveau de fatigue de votre monture.\n\nEn plus d'enchaîner les pressions à votre place, le script prend soin de **calmer régulièrement votre cheval** pendant la course. Cela fait remonter sa barre d'endurance au fur et à mesure de votre trajet."},{"type":"carte","couleur":"jaune","contenu":"💡 **Efficacité optimale :** La régénération d'endurance en calmant le cheval est particulièrement puissante à partir du **niveau 3 d'affection**."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Condition préalable :** Vérifiez que la mention « **Horse** » est affichée sur l'écran OLED de votre Zen.\n**Activation :** Effectuez un **double-tap** sur {CROSS / A} et maintenez la touche enfoncée lors de la seconde pression.\n**Indicateur visuel :** Pendant le galop automatique, les LEDs du Cronus Zen clignotent rapidement.\n**Arrêt :** Relâchez simplement {CROSS / A} pour stopper le galop."}],"fiche":{"colonnes":[{"titre":"Comprendre le Horse Gallop","liens":[{"titre":"❓ Qu'est-ce que le Horse Gallop ?","de":0,"a":2}]},{"titre":"Utiliser le Horse Gallop","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":3,"a":4}]}]}},{"id":"cinema-galop","titre":"🎥 Cinema Gallop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Cinema Gallop et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Cinema Gallop** associe le confort de la caméra cinématique de *Red Dead Redemption II* à la gestion automatique des déplacements. Il vous permet de faire trotter ou galoper votre cheval sur de longues distances sans toucher à la manette, tout en restaurant continuellement son endurance en le calmant."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Entrer en mode Cinema Gallop","contenu":"Une fois en selle (écran OLED affichant « **Horse** » et LEDs blanches), maintenez la touche du mode Cinéma enfoncée pendant **1,5 seconde**."},{"titre":"Sélectionner l'allure","blocs":[{"type":"liste","contenu":"- Appuyez **une fois** sur {CROSS / A} : Votre cheval passe en Trot tout en étant calmé régulièrement.\n- Appuyez **une seconde fois** sur {CROSS / A} : Votre cheval passe en Galop (les LEDs du Zen clignotent rapidement) tout en gérant son endurance.\n- Appuyez **une troisième fois** sur {CROSS / A} : Le déplacement automatique s'arrête."}]},{"titre":"Sortir du mode Cinéma","contenu":"Appuyez à nouveau sur la touche **Cinéma** ou sur la gâchette de visée (**ADS**)."}]}],"fiche":{"colonnes":[{"titre":"Comprendre le Cinema Gallop","liens":[{"titre":"❓ Qu'est-ce que le Cinema Gallop ?","de":0,"a":1}]},{"titre":"Utiliser le Cinema Gallop","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"quick-item-rdr2","titre":"💊 Quick Item (RDR2 / RD Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Quick Item et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Quick Item** vous permet d'utiliser instantanément un soin de santé, d'endurance ou de DeadEye en exécutant une simple combinaison de touches, sans avoir à naviguer manuellement dans la roue des objets en plein combat."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Prérequis obligatoire :** Avant d'utiliser ce MOD en jeu, ouvrez votre roue des objets (*Items*) et sélectionnez manuellement le tonique/soin spécifique que vous souhaitez attribuer à chaque emplacement."},{"type":"texte","style":"h2","contenu":"🎮 Correspondance des touches dans la roue"},{"type":"texte","style":"p","contenu":"Le script cible trois positions précises dans la roue des objets :"},{"type":"liste","contenu":"{SQUARE / X} (Haut-Gauche) : Soin de **Santé**.\n{TRIANGLE / Y} (Haut) : Soin d'**Endurance**.\n{CIRCLE / B} (Haut-Droite) : Soin de **DeadEye**."},{"type":"texte","style":"p","contenu":"**Pour déclencher un soin :** Maintenez{L1 / LB} puis effectuez un **double-tap** sur la touche correspondant au soin désiré."},{"type":"texte","style":"h1","contenu":"🛠️ Les 2 modes de Quick Item disponibles"},{"type":"texte","style":"h2","contenu":"🧪 Mode Standard"},{"type":"texte","style":"p","contenu":"Consomme normalement le tonique sélectionné dans votre inventaire."},{"type":"texte","style":"h2","contenu":"⚡ Mode Glitch *(Utilisation infinie en mode Histoire seulement)*"},{"type":"texte","style":"p","contenu":"Permet de consommer l'effet du tonique **sans qu'il ne soit retiré de votre inventaire**, vous permettant de réutiliser le même tonique des dizaines de fois."},{"type":"liste","contenu":"**Condition impérative :** Vous devez **impérativement porter une arme longue en main** (fusil, carabine, fusil à pompe). Le glitch ne fonctionne pas avec un revolver, un pistolet ou un arc.\n**Mouvement automatique :** Au moment exact de boire la potion, le script fait sauter votre personnage. Cette interruption de l'animation applique le bonus de soin tout en annulant la déduction de l'objet dans votre inventaire."},{"type":"carte","couleur":"blue","contenu":"ℹ️ Note : Il arrive très rarement que le jeu valide la consommation et retire le tonique malgré le saut, mais le système reste fonctionnel dans la vaste majorité des cas."}],"fiche":{"colonnes":[{"titre":"Comprendre le Quick Item","liens":[{"titre":"❓ Qu'est-ce que le Quick Item ?","de":0,"a":2}]},{"titre":"Régler et utiliser le Quick Item","liens":[{"titre":"🎮 Correspondance des touches\ndans la roue","de":3,"a":6},{"titre":"🧪 Mode Standard","de":8,"a":9},{"titre":"⚡ Mode Glitch","de":10,"a":13}]}]}},{"id":"autostop-deadeye","titre":"🛑 AutoStop DeadEye (RD Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'AutoStop DeadEye et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Online*, contrairement au mode histoire, la compétence *DeadEye* reste active même lorsque vous relâchez la gâchette de visée, ce qui vide inutilement votre jauge de compétence si vous oubliez de la couper manuellement.\n\nL'**AutoStop DeadEye** résout ce problème en coupant automatiquement le *DeadEye* dès que vous relâchez la touche de visée (**ADS**)."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Économie de jauge :** Dès que vous relâchez la gâchette **ADS**, le script envoie l'impulsion pour désactiver instantanément le *DeadEye*.\n**Confort :** Vous préservez votre jauge de compétence pour les duels suivants sans aucune manipulation supplémentaire."}],"fiche":{"colonnes":[{"titre":"Comprendre l'AutoStop DeadEye","liens":[{"titre":"❓ Qu'est-ce que l'AutoStop DeadEye ?","de":0,"a":1}]},{"titre":"Utiliser l'AutoStop DeadEye","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"autospin","titre":"🔄 AutoSpin (RD Online / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'AutoSpin et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**AutoSpin** est un utilitaire simple qui force votre personnage à tourner en boucle sur lui-même de manière continue.\n\nIl est principalement utilisé pour éviter la déconnexion automatique pour inactivité (*kick AFK*) lorsque vous devez vous absenter quelques minutes sans quitter la session."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Activation :** Maintenez enfoncé le stick gauche {L3 / LS} pendant **2 secondes**.\n**Action du script :** Le personnage pivote en continu sur lui-même.\n**Désactivation :** Cliquez une fois sur {L3 / LS}, ou déplacez le stick gauche à plus de 20 %."}],"fiche":{"colonnes":[{"titre":"Comprendre l'AutoSpin","liens":[{"titre":"❓ Qu'est-ce que l'AutoSpin ?","de":0,"a":1}]},{"titre":"Utiliser l'AutoSpin","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"online-boss","titre":"🏢 Online Boss (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Online Boss ?"},{"type":"texte","style":"p","contenu":"Dans *GTA Online*, lorsque vous devenez **PDG (C.E.O)** ou **Président d'un club de motards (MC President)**, le menu d'interaction de votre personnage change légèrement d'organisation.\n\nActiver ces modes dans le script indique à l'interface où vous vous trouvez dans le jeu, permettant au Cronus Zen d'exécuter les séquences exactes de touches dans les menus interactifs pour commander vos véhicules ou compétences en un clin d'œil."},{"type":"texte","style":"h1","contenu":"🛠️ Les 2 statuts disponibles"},{"type":"texte","style":"h2","contenu":"💼 C.E.O (SecuroServ)"},{"type":"texte","style":"p","contenu":"Activez cette option dans le script lorsque vous vous enregistrez comme PDG en jeu."},{"type":"liste","contenu":"**À quoi ça sert ?** Le script adapte les raccourcis des menus d'interaction SecuroServ.\n**Exemples d'actions rapides :** Appeler votre hélicoptère Buzzard en un seul clic ou activer immédiatement l'**Organisation Fantôme** pour disparaître du radar des autres joueurs."},{"type":"texte","style":"h2","contenu":"🏍️ MC President (Club de Motards)"},{"type":"texte","style":"p","contenu":"Activez cette option dans le script lorsque vous êtes Président de votre club de motards."},{"type":"liste","contenu":"**À quoi ça sert ?** Le script adapte les séquences pour le menu de club de motards.\n**Exemples d'actions rapides :** Faire apparaître instantanément votre moto préférée (comme l'Oppressor) à vos pieds en un clic."},{"type":"carte","couleur":"jaune","contenu":"💡 Lien avec les [**Quick Actions**](/gta5/quick-cheat/) :\n\nUne fois votre statut défini, ces actions peuvent être liées au moteur de [**Quick Actions**](/gta5/quick-cheat/) pour s'exécuter d'une simple combinaison de touches en plein duel."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Online Boss","liens":[{"titre":"❓ Qu'est-ce que l'Online Boss ?","de":0,"a":1}]},{"titre":"Régler l'Online Boss","liens":[{"titre":"💼 C.E.O","de":3,"a":5},{"titre":"🏍️ MC President","de":6,"a":9}]}]}},{"id":"easy-roll","titre":"🔄 Easy Roll (GTA 5 / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Easy Roll et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"En combat rapproché dans *GTA*, exécuter une roulade est la technique clé pour casser la visée automatique adverse. De base, elle nécessite d'épauler son arme puis d'appuyer sur la touche de saut.\n\nL'**Easy Roll** simplifie la manipulation : un simple clic sur {L3 / LS} déclenche immédiatement la roulade, vous permettant de réagir à la milliseconde près sous le feu ennemi."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Condition :** Équipez une arme en main.\n**Activation :** Pressez simplement {L3 / LS}. Le script gère la transition de visée et le saut pour exécuter la roulade instantanément."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Easy Roll","liens":[{"titre":"❓ Qu'est-ce que l'Easy Roll ?","de":0,"a":1}]},{"titre":"Utiliser l'Easy Roll","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"turbo-rpg","titre":"💣 Turbo RPG (GTA 5 / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Turbo RPG et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Turbo RPG** permet d'enchaîner les tirs au lance-roquettes standard à une cadence bien supérieure à celle autorisée par le jeu.\n\nLe script exploite la mécanique du *Weapon Switch* (changement d'arme rapide) : dès que la roquette part, le script bascule sur une autre arme puis revient sur le lance-roquettes en une fraction de seconde, annulant ainsi la longue animation de rechargement manuel."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"etapes","etiquette":"Étape","etapes":[{"contenu":"Équipez votre lance-roquettes classique (*RPG*)."},{"contenu":"**Maintenez la touche de tir (FIRE)**."},{"contenu":"Le script effectue la séquence de tir et d'annulation d'animation en boucle pour pilonner la zone en continu."}]}],"fiche":{"colonnes":[{"titre":"Comprendre le Turbo RPG","liens":[{"titre":"❓ Qu'est-ce que le Turbo RPG ?","de":0,"a":1}]},{"titre":"Utiliser le Turbo RPG","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"klaxon-hold","titre":"🎵 Klaxon Hold (GTA 5 / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Klaxon Hold et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Klaxon Hold** prend en charge le maintien continu de la touche de klaxon à votre place lorsque vous êtes au volant d'un véhicule.\n\nC'est le MOD idéal pour faire jouer en boucle vos klaxons musicaux ou personnalisés dans *GTA Online* sans devoir garder le pouce écrasé sur la manette pendant vos trajets."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Activation :** En voiture, maintenez la touche de klaxon en roulant pour lancer la boucle automatique.\n**Arrêt :** Appuyez une nouvelle fois sur la touche de klaxon ou sortez simplement de votre véhicule pour couper le son."}],"fiche":{"colonnes":[{"titre":"Comprendre le Klaxon Hold","liens":[{"titre":"❓ Qu'est-ce que le Klaxon Hold ?","de":0,"a":1}]},{"titre":"Utiliser le Klaxon Hold","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"quick-care","titre":"🩹 Quick Care (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Quick Care et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Quick Care** est un MOD exclusif conçu pour **GTA Online**. Il vous permet de restaurer votre armure ou votre santé ultra-rapidement en plein combat, sans avoir à passer par le menu d'interaction."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu :"},{"type":"etapes","etiquette":"Étape","etapes":[{"contenu":"**Maintenez la touche de visée**."},{"contenu":"Soins & Armure :","blocs":[{"type":"liste","contenu":"- **Flèche GAUCHE (D-Pad LEFT) :** Appui rapide pour restaurer votre **Armure**.\n- **Flèche DROITE (D-Pad RIGHT) :** Appui rapide pour consommer un **En-cas** (Santé)."}]}]}],"fiche":{"colonnes":[{"titre":"Comprendre le Quick Care","liens":[{"titre":"❓ Qu'est-ce que le Quick Care ?","de":0,"a":1}]},{"titre":"Utiliser le Quick Care","liens":[{"titre":"⚙️ Fonctionnement en jeu","de":2,"a":3}]}]}},{"id":"rs-sensitivity","titre":"🕹️ RS Sensitivity (Stick droit)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le RS Sensitivity ?"},{"type":"texte","style":"p","contenu":"Le MOD **RS Sensitivity** *(Right Stick - Viseur)* vous permet d'outrepasser la gestion de sensibilité native de votre jeu pour modifier entièrement la réponse de votre stick de visée.\n\nVous pouvez appliquer des réglages de sensibilité complètement différents selon la situation de combat :"},{"type":"liste","contenu":"**ADS Only :** Lorsque vous visez sans tirer.\n**FIRE Only :** Lorsque vous tirez au jugé sans viser.\n**ADS + FIRE :** Lorsque vous visez et tirez en même temps.\n**NEUTRAL (Général) :** Lorsque vous vous déplacez sans viser ni tirer."},{"type":"texte","style":"h2","contenu":"📈 Ballistic (Courbes balistiques)"},{"type":"texte","style":"p","contenu":"Modifie la réponse physique de votre stick selon une courbe de réponse personnalisée (à l'image des profils disponibles sur la manette *Xbox Elite Series 2* ou des logiciels PC avancés)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Aperçu en direct :** Dans le menu du script, vous pouvez visualiser le tracé de la courbe sur l'écran OLED en maintenant la touche\n{CROSS / A} lors de la sélection."},{"type":"liste","contenu":"📏 **Linear (Par défaut) :** Courbe standard 1:1. La valeur renvoyée au jeu est strictement égale à l'inclinaison physique du stick.\n⏳ **Delay :** Offre une grande précision au centre du stick pour les micro-ajustements (sensibilité adoucie sur les légers mouvements), puis accélère brutalement lorsque vous poussez le stick vers la butée.\n⚡ **Aggressive :** Répond instantanément dès les premiers millimètres d'inclinaison. Idéal pour un gameplay ultra-réactif ou des tirs réflexes (*flicks*).\n🚀 **Instant :** Atteint une sensibilité maximale quasi-immédiatement après avoir franchi la zone morte, supprimant le temps de montée en charge du stick.\n🌊 **Smooth :** Filtre et lisse les micro-tremblements parasites de vos mains pour offrir un suivi de cible (*tracking*) ultra-fluide et sans à-coups."},{"type":"texte","style":"h2","contenu":"🎚️ Custom Sens (Multiplicateur fixe)"},{"type":"texte","style":"p","contenu":"Permet d'amplifier directement la sensibilité de votre stick en lui appliquant un multiplicateur de puissance."},{"type":"liste","contenu":"**Plage de réglage :** De 0 à 327 , 100 étant la valeur par défaut normal (ce qui correspond à un multiplicateur de **x0** à **x3,27**).\n**Exemple concret :** Si vous réglez la valeur à 200 (multiplicateur x2), pousser votre stick à seulement **50 %** de sa course physique enverra une valeur de **100 %** (butée maximale) à votre jeu."},{"type":"texte","style":"h2","contenu":"⚡ Dynamic Sens (Sensibilité dynamique évolutive)"},{"type":"texte","style":"p","contenu":"Le plus pointu et le plus puissant du script ! Il fait varier votre sensibilité en temps réel selon la vitesse et l'amplitude de mouvement de votre stick.\n\nLes 5 variables à configurer :"},{"type":"liste","contenu":"🏁 **Initial Sens :** La sensibilité de départ appliquée lorsque le stick commence à bouger.\n🎯 **Limit Point (Seuil d'accélération) :** L'angle d'inclinaison du stick à partir duquel la sensibilité commence à grimper vers son maximum. En dessous de ce seuil, la sensibilité reste à *Initial Sens*.\n🔄 **Restart Point (Seuil de réinitialisation) :** Si l'inclinaison du stick redescend en dessous de cette valeur, le script réinitialise immédiatement la sensibilité à *Initial Sens*.\n🔝 **Max Sens :** La sensibilité plafond maximale que le système dynamique peut atteindre.\n📈 **Increase Rate :** La vitesse (cadence) à laquelle la sensibilité augmente une fois le *Limit Point* franchi."}],"fiche":{"colonnes":[{"titre":"Comprendre le RS Sensitivity","liens":[{"titre":"❓ Qu'est-ce que le RS Sensitivity ?","de":0,"a":2}]},{"titre":"Régler le RS Sensitivity","liens":[{"titre":"📈 Ballistic","de":3,"a":6},{"titre":"🎚️ Custom Sens","de":7,"a":9},{"titre":"⚡ Dynamic Sens","de":10,"a":12}]}]}},{"id":"ls-sensitivity","titre":"🕹️ LS Sensitivity (Stick gauche)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le LS Sensitivity ?"},{"type":"texte","style":"p","contenu":"Le MOD **LS Sensitivity** *(Left Stick - Déplacement)* vous permet d'outrepasser la gestion de sensibilité native de votre jeu pour modifier entièrement la réponse de votre stick de déplacement.\n\nVous pouvez appliquer des réglages de sensibilité complètement différents selon la situation de combat :"},{"type":"liste","contenu":"**ADS Only :** Lorsque vous visez sans tirer.\n**FIRE Only :** Lorsque vous tirez au jugé sans viser.\n**ADS + FIRE :** Lorsque vous visez et tirez en même temps.\n**NEUTRAL (Général) :** Lorsque vous vous déplacez sans viser ni tirer."},{"type":"texte","style":"h2","contenu":"📈 Ballistic (Courbes balistiques)"},{"type":"texte","style":"p","contenu":"Modifie la réponse physique de votre stick selon une courbe de réponse personnalisée (à l'image des profils disponibles sur la manette *Xbox Elite Series 2* ou des logiciels PC avancés)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Aperçu en direct :** Dans le menu du script, vous pouvez visualiser le tracé de la courbe sur l'écran OLED en maintenant la touche\n{CROSS / A} lors de la sélection."},{"type":"liste","contenu":"📏 **Linear (Par défaut) :** Courbe standard 1:1. La valeur renvoyée au jeu est strictement égale à l'inclinaison physique du stick.\n⏳ **Delay :** Offre une grande précision au centre du stick pour les micro-ajustements (sensibilité adoucie sur les légers mouvements), puis accélère brutalement lorsque vous poussez le stick vers la butée.\n⚡ **Aggressive :** Répond instantanément dès les premiers millimètres d'inclinaison. Idéal pour un gameplay ultra-réactif ou des tirs réflexes (*flicks*).\n🚀 **Instant :** Atteint une sensibilité maximale quasi-immédiatement après avoir franchi la zone morte, supprimant le temps de montée en charge du stick.\n🌊 **Smooth :** Filtre et lisse les micro-tremblements parasites de vos mains pour offrir un suivi de cible (*tracking*) ultra-fluide et sans à-coups."},{"type":"texte","style":"h2","contenu":"🎚️ Custom Sens (Multiplicateur fixe)"},{"type":"texte","style":"p","contenu":"Permet d'amplifier directement la sensibilité de votre stick en lui appliquant un multiplicateur de puissance."},{"type":"liste","contenu":"**Plage de réglage :** De 0 à 327 , 100 étant la valeur par défaut normal (ce qui correspond à un multiplicateur de **x0** à **x3,27**).\n**Exemple concret :** Si vous réglez la valeur à 200 (multiplicateur x2), pousser votre stick à seulement **50 %** de sa course physique enverra une valeur de **100 %** (butée maximale) à votre jeu."},{"type":"texte","style":"h2","contenu":"⚡ Dynamic Sens (Sensibilité dynamique évolutive)"},{"type":"texte","style":"p","contenu":"Le plus pointu et le plus puissant du script ! Il fait varier votre sensibilité en temps réel selon la vitesse et l'amplitude de mouvement de votre stick.\n\nLes 5 variables à configurer :"},{"type":"liste","contenu":"🏁 **Initial Sens :** La sensibilité de départ appliquée lorsque le stick commence à bouger.\n🎯 **Limit Point (Seuil d'accélération) :** L'angle d'inclinaison du stick à partir duquel la sensibilité commence à grimper vers son maximum. En dessous de ce seuil, la sensibilité reste à *Initial Sens*.\n🔄 **Restart Point (Seuil de réinitialisation) :** Si l'inclinaison du stick redescend en dessous de cette valeur, le script réinitialise immédiatement la sensibilité à *Initial Sens*.\n🔝 **Max Sens :** La sensibilité plafond maximale que le système dynamique peut atteindre.\n📈 **Increase Rate :** La vitesse (cadence) à laquelle la sensibilité augmente une fois le *Limit Point* franchi."}],"fiche":{"colonnes":[{"titre":"Comprendre le LS Sensitivity","liens":[{"titre":"❓ Qu'est-ce que le LS Sensitivity ?","de":0,"a":2}]},{"titre":"Régler le LS Sensitivity","liens":[{"titre":"📈 Ballistic","de":3,"a":6},{"titre":"🎚️ Custom Sens","de":7,"a":9},{"titre":"⚡ Dynamic Sens","de":10,"a":12}]}]}},{"id":"stick-drift","titre":"🕹️ Stick Drift Correction","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que la correction du Stick Drift ?"},{"type":"texte","style":"p","contenu":"Avec le temps et l'usure, les potard des sticks analogiques s'usent et provoquent du *Stick Drift* (le curseur ou la caméra bouge tout seul à l'écran sans que vous ne touchiez à la manette).\n\nCe MOD intègre un outil de diagnostic et de calibration de haute précision directement sur l'écran OLED de votre Cronus Zen. Il neutralise la dérive de vos sticks au point mort sans nécessiter d'augmenter la zone morte (*DeadZone*) dans les paramètres du jeu, préservant ainsi toute la réactivité de votre visée."},{"type":"texte","style":"h2","contenu":"⚙️ Comment diagnostiquer et régler le Drift ?"},{"type":"etapes","etiquette":"Étape","etapes":[{"titre":"Activation","contenu":"Activez l'option dans le menu du script, puis appuyez sur {CROSS / A} pour entrer dans le menu de calibration dédié."},{"titre":"Mesure en temps réel","blocs":[{"type":"liste","contenu":"- 📊 **Real Time RS :** Affiche la dérive physique brute de votre stick droit en temps réel sur l'écran OLED.\n- 📊 **Real Time LS :** Affiche la dérive physique brute de votre stick gauche en temps réel."}]},{"titre":"Application de la correction","blocs":[{"type":"liste","contenu":"- 🎯 **RS Correction :** Ajustez la valeur de compensation pour le stick droit jusqu'à neutraliser totalement la dérive.\n- 🎯 **LS Correction :** Ajustez la valeur de compensation pour le stick gauche jusqu'à neutraliser totalement la dérive."}]}]}],"fiche":{"colonnes":[{"titre":"Comprendre la Stick Drift Correction","liens":[{"titre":"❓ Qu'est-ce que la correction du Stick Drift ?","de":0,"a":1}]},{"titre":"Régler la Stick Drift Correction","liens":[{"titre":"⚙️ Comment diagnostiquer et régler le Drift ?","de":2,"a":3}]}]}},{"id":"hair-trigger","titre":"⚡ Hair Trigger","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu' est-ce que le Hair Trigger et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"De base, les gâchettes analogiques ( {L2 / LT} ou {R2 / RT}) possèdent une course longue : vous devez les enfoncer sur plusieurs millimètres avant que le jeu ne détecte l'action de visée ou de tir.\n\nLe MOD **Hair Trigger** transforme vos gâchettes analogiques en clics numériques ultra-réactifs (type « gâchette mur » ou *clicky trigger*). Dès qu'une micro-pression de 1% est détectée sur la gâchette, le script envoie instantanément un signal d'enfoncement maximal à 100% au jeu."},{"type":"texte","style":"h2","contenu":"🎛️ Options d'attribution"},{"type":"texte","style":"p","contenu":"Vous pouvez choisir d'appliquer le Hair Trigger à :"},{"type":"liste","contenu":"**🎯 Visée uniquement** ( {L2 / LT}) : Pour épauler votre arme à la milliseconde près.\n**💥 Tir uniquement** ( {R2 / RT}) : Pour un départ de coup instantané.\n**⚡ Les deux gâchettes** ( {L2 / LT} + {R2 / RT}) : Pour une réactivité maximale sur toutes vos actions de combat."}],"fiche":{"colonnes":[{"titre":"Comprendre le Hair Trigger","liens":[{"titre":"❓ Qu'est-ce que le Hair Trigger ?","de":0,"a":1}]},{"titre":"Régler le Hair Trigger","liens":[{"titre":"🎛️ Options d'attribution","de":2,"a":4}]}]}},{"id":"rumble-adt","titre":"📳 Rumble & ADT (Vibrations & Gâchettes Adaptatives)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Rumble & ADT ?"},{"type":"texte","style":"p","contenu":"Ce MOD vous permet de contrôler précisément l'activation des moteurs de vibration (*Rumble*) et des gâchettes adaptatives (*ADT* - Adaptive Triggers) de votre manette (notamment sur PS5 DualSense), directement depuis le menu du script sans devoir modifier vos menus de jeu."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Prérequis obligatoire :** Pour que le script et vos MODs fonctionnent correctement, les options de **vibrations** et de **gâchettes adaptatives** doivent **impérativement être activées dans les paramètres du jeu** et réglées sur **« Standard » dans les paramètres généraux de votre console**."},{"type":"texte","style":"h2","contenu":"🛠️ Les 4 modes de configuration au choix"},{"type":"liste","contenu":"✅ **Enabled :** Laisse les vibrations et les gâchettes adaptatives entièrement actives.\n⚙️ **ADT Only :** Désactive les vibrations de la manette tout en conservant le fonctionnement des gâchettes adaptatives (*ADT*).\n📳 **Rumble Only :** Désactive les gâchettes adaptatives (*ADT*) tout en conservant les vibrations de la manette.\n🚫 **Disabled :** Désactive à la fois les vibrations de la manette et le mécanisme des gâchettes adaptatives."}],"fiche":{"colonnes":[{"titre":"Comprendre le Rumble & ADT","liens":[{"titre":"❓ Qu'est-ce que le Rumble & ADT ?","de":0,"a":2}]},{"titre":"Régler le Rumble & ADT","liens":[{"titre":"🛠️ Les 4 modes de configuration","de":3,"a":4}]}]}},{"id":"buttons-layout","titre":"🎮 Button Layout (Remapping des Boutons)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Button Layout et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Button Layout** vous permet de reconfigurer et de personnaliser entièrement la disposition des touches de votre manette directement depuis le script, sans toucher aux options de votre jeu ou de votre console."},{"type":"texte","style":"h2","contenu":"🛠️ Les 2 modes de configuration"},{"type":"liste","contenu":"🎮 **Standard :** Conserve la disposition par défaut des touches de votre manette en jeu.\n🛠️ **Custom :** Active la personnalisation complète de vos boutons selon vos préférences."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Règle absolue du mode Custom :** **1 action = 1 bouton.** Vous ne pouvez pas attribuer la même touche à deux actions différentes."},{"type":"texte","style":"p","contenu":"🔒 **Sécurité anti-erreur :** Si un conflit ou un doublon de touche est détecté lors de votre configuration, l'écran OLED affiche **INVALID** lorsque vous tentez de quitter le menu, et la sortie reste bloquée tant que la configuration n'est pas valide."},{"type":"carte","couleur":"jaune","contenu":"💡 **Perdu dans votre configuration ?** Maintenez {CIRCLE / B} enfoncé pendant **2 secondes** : le layout **Custom** est remis par défaut et vous revenez automatiquement au menu **Controller**.\n\n⏱️ **Sortie automatique :** Si la configuration est invalide et que vous restez inactif pendant **30 secondes**, le script quitte les menus de lui-même et recharge votre dernier layout sauvegardé."},{"type":"texte","style":"h2","contenu":"⚠️ Consignes et avertissements importants"},{"type":"carte","couleur":"rouge","contenu":"🛑 **Réglages du jeu :** Vous devez **impérativement laisser la configuration des touches sur « Standard » dans les options internes du jeu**. Ne modifiez pas non plus l'attribution des boutons dans les paramètres d'accessibilité de votre console (PS5/Xbox)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Navigation dans les menus du jeu :** Pensez à **désactiver le script lorsque vous naviguez dans les menus du jeu** (inventaire, carte, boutique). Sinon, vos réattributions de touches Custom s'appliqueront aussi à la navigation, ce qui peut rendre les déplacements dans les menus déroutants."}],"fiche":{"colonnes":[{"titre":"Comprendre le Button Layout","liens":[{"titre":"❓ Qu'est-ce que le Button Layout ?","de":0,"a":1}]},{"titre":"Régler le Button Layout","liens":[{"titre":"🛠️ Les 2 modes de configuration","de":2,"a":6},{"titre":"⚠️ Consignes et avertissements importants","de":7,"a":9}]}]}},{"id":"inverted-axes","titre":"🕹️ Inverted RY / LY (Inversion des Axes Y)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Inverted RY / LY ?"},{"type":"texte","style":"p","contenu":"Le MOD **Inverted RY / LY** vous permet d'inverser la réponse de l'axe vertical (axe Y) de vos sticks analogiques directement depuis le script :"},{"type":"liste","contenu":"🎯 **Inverted RY (Right Stick Y) :** Inverse l'axe vertical du stick droit (caméra / visée). Pousser le stick vers le haut fait descendre la caméra, et le tirer vers le bas la fait monter.\n🏃 **Inverted LY (Left Stick Y) :** Inverse l'axe vertical du stick gauche (déplacement du personnage)."},{"type":"texte","style":"p","contenu":"Ce MOD permet d'appliquer une visée ou un déplacement inversé de manière transparente, tout en conservant la parfaite exécution de tous les autres MODs du script (comme l'AntiRecoil ou l'AIM Assist)."},{"type":"texte","style":"h2","contenu":"⚠️ Consigne importante de configuration"},{"type":"carte","couleur":"rouge","contenu":"🛑 **Paramètres du jeu et de la console :** Dans les options internes de votre jeu ainsi que dans les réglages d'accessibilité de votre console, vous devez **impérativement laisser l'axe Y sur la configuration « Standard » (non inversé)**."},{"type":"texte","style":"p","contenu":"Le script se charge de réaliser l'inversion de l'axe Y de manière logicielle. Si vous activez aussi l'inversion dans le jeu, les deux réglages s'annuleront."},{"type":"carte","couleur":"jaune","contenu":"💡 **Navigation dans les menus du jeu :** Pensez à **désactiver le script lorsque vous naviguez dans les menus du jeu** (inventaire, carte, boutique). Sinon, l'inversion des axes s'appliquera aussi à la navigation, ce qui peut rendre les déplacements dans les menus déroutants."}],"titreBrut":true,"fiche":{"colonnes":[{"titre":"Comprendre l'Inverted RY / LY","liens":[{"titre":"❓ Qu'est-ce que l'Inverted RY / LY ?","de":0,"a":3}]},{"titre":"Régler l'Inverted RY / LY","liens":[{"titre":"⚠️ Consigne importante de configuration","de":4,"a":7}]}]}},{"id":"auto-save","titre":"💾 Auto Save (Sauvegarde des Réglages)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto Save et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**Auto Save** est une option qui sauvegarde automatiquement la totalité de vos modifications dans la mémoire interne du Cronus Zen dès que vous quittez les menus du script."},{"type":"texte","style":"h1","contenu":"🛠️ Sauvegarde automatique vs Sauvegarde manuelle"},{"type":"texte","style":"h2","contenu":"🔄 Le mode Manuel (Recommandé pour les tests)"},{"type":"texte","style":"p","contenu":"Lorsque l'Auto Save est désactivé, vos réglages restent temporaires tant que vous ne les validez pas explicitement. Pour effectuer une sauvegarde manuelle, entrez dans le menu et appuyez sur la touche {PS / XBOX}."},{"type":"liste","contenu":"**L'avantage stratégique :** Vous pouvez modifier un paramètre (un *Radius*, une sensibilité ou un timing), sortir du menu pour le tester directement en jeu, et si le résultat ne vous convient pas, il vous suffit de changer de *slot* sur votre Cronus Zen puis de revenir sur le script. Vos réglages précédents seront immédiatement restaurés sans altération.\n**Pour valider définitivement :** Si vos tests sont concluants, réouvrez le menu et pressez {PS / XBOX} pour fixer la configuration."},{"type":"texte","style":"h2","contenu":"⚡ Le mode Auto Save"},{"type":"texte","style":"p","contenu":"Chaque modification est écrite immédiatement en mémoire EEPROM dès la fermeture des menus."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Avertissement matériel :** Écrire en permanence dans la mémoire EEPROM de votre Cronus Zen peut accélérer son usure physique à long terme. C'est pourquoi cette option est **désactivée par défaut** dans le script."}],"fiche":{"colonnes":[{"titre":"Comprendre l'Auto Save","liens":[{"titre":"❓ Qu'est-ce que l'Auto Save ?","de":0,"a":1}]},{"titre":"Régler l'Auto Save","liens":[{"titre":"🔄 Le mode Manuel","de":3,"a":5},{"titre":"⚡ Le mode Auto Save","de":6,"a":8}]}]}},{"id":"vm-speed","titre":"⏱️ VM Speed (Cadence d'Exécution)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que la VM Speed et comment fonctionne-t-elle ?"},{"type":"texte","style":"p","contenu":"La **VM Speed** (*Virtual Machine Speed*) définit la fréquence de rafraîchissement à laquelle le processeur du Cronus Zen exécute le code de votre script."},{"type":"texte","style":"h2","contenu":"🧠 Idée reçue : Est-ce que « plus rapide » signifie « meilleur » ?"},{"type":"texte","style":"p","contenu":"**Non, pas nécessairement.** Régler la cadence au minimum ne garantit pas une meilleure réactivité et peut parfois surcharger le signal si votre matériel ne suit pas. L'efficacité dépend de trois facteurs clés :\n\n1️⃣ **Votre plateforme :** PC, PS5 ou Xbox Series.\n\n2️⃣ **Le taux de rafraîchissement de votre manette :** Si votre manette transmet ses données à la console toutes les 8 ms (cas classique de nombreuses manettes d'origine), régler la VM Speed du Zen à 2 ms n'apportera aucun gain et créera des doublons de signaux inutiles.\n\n3️⃣ **Le nombre d'images par seconde (FPS) du jeu :** La réactivité réelle en jeu reste bridée par le moteur graphique du titre auquel vous jouez."},{"type":"texte","style":"h2","contenu":"🎛️ Les 4 cadences disponibles dans le menu"},{"type":"liste","contenu":"🟢 **10 ms (Par défaut) :** Stabilité maximale, cadence idéale pour la majorité des jeux et configurations manette standard.\n🔵 **8 ms :** Synchronisation parfaite avec les manettes opérant nativement à 125 Hz (8 ms).\n🟡 **4 ms :** Réactivité accrue pour les configurations compétitives sur PC ou moniteurs à haut rafraîchissement.\n🔴 **2 ms :** Cadence ultra-rapide (500 Hz) réservée aux setups PC très haut de gamme et manettes cadencées à haute fréquence."}],"fiche":{"colonnes":[{"titre":"Comprendre la VM Speed","liens":[{"titre":"❓ Qu'est-ce que la VM Speed ?","de":0,"a":1},{"titre":"🧠 Idée reçue : plus rapide = meilleur ?","de":2,"a":3}]},{"titre":"Régler la VM Speed","liens":[{"titre":"🎛️ Les 4 cadences disponibles","de":4,"a":5}]}]}},{"id":"act-ads-fire","titre":"🔀 ADS + FIRE *(Viser + Tirer)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD se déclenche uniquement lorsque vous appuyez sur les deux gâchettes en même temps (**Viser ET Tirer**).\n**Cas d'usage idéal :** Parfait pour l'AntiRecoil ou le Strafe Shot sur les armes automatiques quand vous engagez un duel complet."}]},{"id":"act-ads","titre":"🎯 ADS *(Visée globale)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD s'active dès que vous enfoncez la touche de visée (**ADS**), et reste actif si vous commencez à tirer.\n**Cas d'usage idéal :** Idéal pour l'AIM Abuse ou l'assist de visée qui doivent commencer à fonctionner avant même de presser la détente."}]},{"id":"act-fire","titre":"💥 FIRE *(Tir global)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD s'active dès que vous enfoncez la touche de tir (**FIRE**), que vous soyez en train de viser ou non.\n**Cas d'usage idéal :** Pratique pour le RapidFire sur les pistolets ou fusils à pompe, utilisable aussi bien au jugé qu'en visée."}]},{"id":"act-ads-only","titre":"🎯 ADS Only *(Visée exclusive)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD s'active **uniquement** quand vous maintenez la touche de visée seule. Dès que vous appuyez sur la
