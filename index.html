","titre":"🏃 MODs de Mouvement & Tir","blocs":[{"type":"liste","contenu":"**Shot MODs :** Exécute une action de mouvement automatiquement au moment où vous tirez.\n- **Drop Shot** = s'allonger / s'accroupir.\n- **Jump Shot** = sauter.\n- **Strafe** = déplacement latérale.\n**Auto ADS / Auto Fire :** Vise automatiquement dès que vous tirez, ou tire automatiquement dès que vous visez.\n**Quick Scope :** *(Spécifique au script FPS/TPS)* Vise et tire instantanément en une seule pression sur la touche de tir (idéal pour le sniper).\n**Auto Scope :** *(Spécifique aux scripts GTA et RDR2)* Appuie automatiquement sur le bouton du zoom lorsque vous visez.\n**DeadEye :** *(Spécifique au script RDR2)* Active automatiquement le mode DeadEye ou declenche le DeadShot."}]},{"type":"depliant","titre":"🎮 Commandes & Touches de Manette","blocs":[{"type":"liste","contenu":"**ADS** (*Aim Down Sights*) : Touche ou gâchette utilisée pour viser (généralement {L2} sur PlayStation / {LT} sur Xbox).\n**FIRE** : Touche ou gâchette utilisée pour tirer (généralement {R2} sur PlayStation / {RT} sur Xbox).\n**HIP** : Position de tir « au jugé », c'est-à-dire tirer directement sans maintenir la touche de visée (**ADS**).\n{D-Pad} (*Directional Pad*) : La croix directionnelle de la manette ({HAUT / BAS / GAUCHE / DROITE}).\n{CROSS / A} : Bouton **Croix** (PlayStation) / Bouton {A} (Xbox).\n{SQUARE / X} : Bouton **Carré** (PlayStation) / Bouton {X} (Xbox).\n{TRIANGLE / Y} : Bouton **Triangle** (PlayStation) / Bouton {Y} (Xbox).\n{CIRCLE / B} : Bouton **Rond** (PlayStation) / Bouton {B} (Xbox).\n**L1 / LB & R1 / RB** : Gâchettes hautes / boutons supérieurs (*Bumpers*).\n**L2 / LT & R2 / RT** : Gâchettes basses analogiques à course longue (*Triggers*).\n{L3 / LS} : Clic physique obtenu en enfonçant le stick analogique gauche (*Left Stick*).\n{R3 / RS} : Clic physique obtenu en enfonçant le stick analogique droit (*Right Stick*).\n**LY / RY** : Axe vertical (axe Y) du stick gauche (*Left Y*) ou du stick droit (*Right Y*).\n**LX / RX** : Axe horizontal (axe X) du stick gauche (*Left X*) ou du stick droit (*Right X*)."}]},{"type":"depliant","titre":"⚙️ Termes Techniques & Paramètres des MODs","blocs":[{"type":"liste","contenu":"**MOD** : Macro ou fonctionnalité logicielle intégrée au script (ex. *AntiRecoil*, *AIM Assist*, *AutoRun*).\n**DeadZone** (*Zone Morte*) : Perimètre d'inactivité au centre du stick analogique. En dessous de ce seuil d'inclinaison, le jeu ne détecte aucun mouvement.\n**Stick Drift** : Dérive matérielle liée à l'usure des potentiomètres d'un stick, envoyant de faux mouvements à la console même au repos.\n**Radius** (*Rad*) : Taille ou amplitude de la forme géométrique dessinée par le script (ex. *AIM Assist* ou *LS Assist*).\n**Step** : Vitesse / cadence de progression de la forme géométrique dessinée par l'AIM Assist (valeur d'incrémentation de l'angle à chaque cycle).\n**Humanizer** : Algorithme injectant de micro-variations aléatoires dans les timers et les mouvements pour imiter la physique humaine et contourner les systèmes anti-triche.\n**Hair Trigger** : Neutralisation de la course analogique des gâchettes pour les transformer en boutons numériques instantanés (1 % de pression = 100 % d'enfoncement).\n**Quick Toggle** : Combinaison de touches personnalisable permettant d'activer ou désactiver un MOD à la volée en plein jeu.\n**Quick Cheat** : Raccourci manette permettant de déclencher une action rapide (soin, armure, véhicule) sans naviguer manuellement dans les menus du jeu.\n**ADT** (*Adaptive Triggers*) : Système de résistance mécanique dynamique propre aux gâchettes de la manette PS5 DualSense.\n**Rumble** : Moteurs de vibration internes de la manette."}]},{"type":"depliant","titre":"📟 Termes Spécifiques au matériel Cronus Zen","blocs":[{"type":"liste","contenu":"**Cronus Zen** : Boîtier matériel intermédiaire connecté entre votre manette et la console/PC pour exécuter des scripts personnalisés.\n**Écran OLED** : Écran d'affichage situé sur la face avant du boîtier Cronus Zen, utilisé pour la navigation dans les menus du script.\n**VM Speed** (*Virtual Machine Speed*) : Fréquence de rafraîchissement à laquelle le processeur de la machine virtuelle du Cronus Zen exécute le code du script (ex. 10 ms, 8 ms, 2 ms).\n**EEPROM** : Mémoire flash non volatile intégrée au Cronus Zen servant à sauvegarder vos réglages même lorsque le boîtier est hors tension.\n**Slot** : Emplacement mémoire du Cronus Zen pouvant accueillir un script GPC complet."}]}],"icone":"liste","sommaire":false},{"id":"a-propos","titre":"À propos de noozbar","blocs":[{"type":"texte","style":"h1","contenu":"Mon Histoire"},{"type":"texte","style":"h2","contenu":"De joueur à moddeur"},{"type":"texte","style":"p","contenu":"Je suis tombé dans le jeu vidéo à la fin des années 90 avec le premier GTA. J'ai bien sure commencé mes premiers parties sur Mario Kart ou Sonic sur MegaDrive.\nAprès avoir longtemps été un joueur classique, je me suis tourné vers le hack de console sur PS2 : installation de puces, lancement de jeux stockés sur un HDD relié grâce à l'adaptateur réseau...\n\nVers 2007, avec des amis, j'ai collaboré à la création d'un mod pour *GTA San Andreas* sur PS2 : le mod **\"GTA SA - PTMG Édition\"**. Il intégrait un mod menu nous permettant de faire apparaître n'importe quoi, de lancer n'importe quelle mission, de voler, de nous téléporter, d'ajouter la gestion de l'essence, de remplacer tous les fast-foods par des McDo et toutes les canettes par du Coca, de lancer des boules de feu... bref, énormément de choses !"},{"type":"texte","style":"h2","contenu":"Repousser les limites du GPC"},{"type":"texte","style":"p","contenu":"Après une pause dans les années 2010 où je me suis contenté de jouer, la sortie de *The Division 1* en 2016 a tout changé. Face à un PVP parfois toxique, j'ai voulu comprendre comment certains joueurs faisaient pour être aussi précis avec leurs armes — un jeu avec un recul particulièrement difficile à maîtriser. Je me suis donc acheté un **Cronus MAX+**.\n\nAimant comprendre le fonctionnement des choses, j'ai analysé les scripts disponibles à l'époque et lu la documentation sur le langage GPC. J'ai alors commencé à écrire et développer mes propres scripts. À ce moment-là, aucun script n'avait plusieurs profils, les anti-reculs n'appliquaient qu'une simple traction vers le bas, et les MODs étaient vraiment basiques.\n\nJ'ai donc développé des scripts avancés et spécialisés, pensés pour être **ergonomiques et totalement transparents** en jeu : l'idée était d'utiliser directement les mêmes touches que celles du jeu pour contrôler les MODs, rendant l'utilisation ultra-simple et intuitive.\n\nParmi les innovations apportées à l'époque :"},{"type":"liste","contenu":"**Changement de profils automatique :** Vos profils d'armes basculent automatiquement en même temps que vous changez d'arme en jeu.\n**Anti-recul progressif dans le temps :** Une valeur d'anti-recul dynamique qui s'adapte au fur et à mesure que vous maintenez la gâchette de tir enfoncée.\n**Armes préconfigurées :** Une sélection d'armes directement intégrées avec leurs réglages d'anti-recul déjà configurés.\n**Gestion des MODs par profil :** La possibilité d'activer un MOD sur un profil spécifique tout en le laissant désactivé sur un autre.\n**Valeurs de MODs uniques par profil :** Chaque profil dispose de ses propres réglages (par exemple, une cadence de tir pour le *RapidFire* ou une valeur d'anti-recul totalement différente d'une arme à l'autre).\nEt bien plus encore..."},{"type":"texte","style":"p","contenu":"Ce qui est devenu la norme aujourd'hui ne l'était pas du tout en 2016 / 2017. Charlie (**MaxADMIN**) m'a alors intégré à son équipe de développement de GamePacks pour que je partage mes idées et mon côté créatif."},{"type":"texte","style":"h2","contenu":"La transition vers le ZEN"},{"type":"texte","style":"p","contenu":"J'ai ensuite eu la chance de faire partie des bêta-testeurs de la nouvelle génération de Cronus : le **Cronus ZEN**. J'ai participé au développement des premiers scripts avec menus OLED.\n\nC'est à cette période que j'ai rencontré un jeune joueur passionné qui utilisait mon \"menu template\" pour créer un script sur son FPS préféré. Il m'a demandé des conseils, des astuces, pour qu'il puisse créer son propre script et je lui ai transmis tout ce que je savais. Vous le connaissez aujourd'hui sous le nom de **TaylorDrift21**, c'est l'un des meilleurs développeurs de scripts que je connaisse avec **Chaton**."},{"type":"texte","style":"h2","contenu":"Toujours plus haut"},{"type":"texte","style":"p","contenu":"Après plusieurs années de développement intensif, j'ai choisi de lever le pied pendant quelque temps et de suivre l'évolution de la scène GPC avec un peu plus de distance.\n\nJ'ai mis à profit ce temps de recul pour retravailler mes bases en profondeur et tout remettre à plat. Aujourd'hui, je suis de retour à plein régime pour concevoir des scripts de qualité supérieure : des créations entièrement réécrites d'une page blanche, plus performantes, fluides et uniques que jamais et sans aucun compromis sur la précision, l'ergonomie et l'originalité."}],"icone":"etoile","separateurAvant":true,"rubrique":"Le site"},{"id":"discord","titre":"Discord","icone":"link","iconePersonnalisee":"💬","lien":"https://discord.gg/e2v4NN4fVu","blocs":[]}],"cartesExtra":[{"nom":"CRONUS ZEN","description":"Branchements, connexion PS5 / Xbox / PC, Bypass, mise à jour du firmware et dépannage.","icone":"ordinateur","couleurHex":"#3ad1ff","lien":"/cronus-zen/","bouton":"Ouvrir le guide →"},{"nom":"BIBLIOTHÈQUE DES MODs","description":"La description et les conseils de réglage de chaque MOD, menu par menu.","icone":"dossier","couleurHex":"#a46bff","lien":"/bibliotheque/","bouton":"Ouvrir la bibliothèque →"},{"nom":"COMPRENDRE LES SCRIPTS","description":"Ce qu'un MOD peut (et ne peut pas) faire, comment fonctionnent les scripts, compatibilité.","icone":"ampoule","couleurHex":"#ffb547","lien":"/comprendre/","bouton":"Comprendre →"},{"nom":"DISCORD","description":"Support, annonces des mises à jour et codes de déblocage : rejoins les 22 000+ membres.","icone":"link","iconePersonnalisee":"💬","couleurHex":"#7c5cff","lien":"https://discord.gg/e2v4NN4fVu","bouton":"Rejoindre le Discord →"}],"menu":[{"titre":"Cronus ZEN","ouvertAccueil":true,"items":[{"page":"cronus-zen","titre":"Vue d'ensemble"},"guide-cronus-zen","bypass-ps5","connexion-xbox-pc","mise-a-jour-zen","depannage-faq"]},{"titre":"Mes scripts","ouvertAccueil":true,"items":[{"script":"gta6"},{"script":"fps-tps"},{"script":"rdr2"},{"script":"gta5"},"vibrations-adt","navigation-oled"]},{"titre":"Bibliothèque des MODs","items":[{"page":"bibliotheque","titre":"Vue d'ensemble"},"profile-mods","global-mods","mods-activator","controller","misc","quick-toggle",{"sousTitre":"Spécifiques à un script"},"gta6-activity","fps-tps-switch-profile","rdr2-activity","gta5-online-cheat","gta5-story-cheat","gta5-quick-cheat"]},{"titre":"Comprendre","items":["comprendre","lexique"]}]},"scripts":[{"id":"gta6","nom":"MIAMI","jeu":"Grand Theft Auto VI","description":"Script GTA VI : dominez Vice City grâce à des MODs de combat redoutables et des automatisations pour faciliter toutes vos activités.","couleurHex":"#ff4fd8","couleurNomHex":"#ff4fd8","image":"/media/cartes/gta6.jpg","imageOpacite":0.3,"logoBadge":"/media/badges/gta6.jpg","banniere":"/media/bannieres/gta6.jpg","imagePartage":"/media/cartes/gta6.jpg","disponible":true,"onglets":[{"id":"accueil","titre":"Présentation","titrePage":"MIAMI — Grand Theft Auto VI","icone":"liste","sommaire":true,"blocs":[{"type":"carte","image":"/media/bannieres/gta6.jpg","titre":"","contenu":""},{"type":"texte","style":"titre","contenu":"📋 Structure et Contenu des Menus du Script","horsSommaire":true},{"type":"depliant","titre":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨","soustitre":"Réglages indispensables dans la console ET dans le jeu","couleurHex":"#ffb547","mod":"vibrations-adt"},{"type":"depliant","titre":"🚗 Gestion de la Conduite & des Véhicules (bientôt...)","blocs":[{"type":"texte","style":"h3","contenu":"❓ Qu'est-ce que la gestion des véhicules et comment fonctionne-t-elle ?"},{"type":"texte","style":"p","contenu":"Cette fonctionnalité adapte automatiquement le comportement du script lorsque vous pilotez un véhicule (ou que vous vous déplacez les mains nues suivant votre configuration). Elle neutralise instantanément tous les MODs pouvant interférer avec la conduite (comme l'AntiRecoil) pour vous garantir un contrôle total."},{"type":"texte","style":"h3","contenu":"🛠️ Fonctionnement selon votre configuration"},{"type":"liste","contenu":"**🤖 Détection Automatique via ADT (PS5 & PC) :**\n> Lorsque vous jouez sur la version PS5 ou PC du jeu et que les gâchettes adaptatives (ADT) sont activées :\n- **Analyse intelligente :** Le script analyse le retour mécanique des gâchettes pour détecter automatiquement si vous êtes au volant d'un véhicule ou si vous vous déplacez les mains nues sans arme équipée.\n- **Affichage OLED :** L'état **« Unarmed / In vehicle »** s'affiche automatiquement sur l'écran du Cronus Zen et adapte le profil instantanément sans aucune manipulation de votre part.\n**🎮 Gestion Manuelle / Mode Driving (Xbox, PS4 ou ADT désactivées) :**\n> Si vous jouez sur une plateforme sans support ADT (Xbox, PS4) ou si vous avez désactivé les gâchettes adaptatives dans vos menus *(💡 il est toutefois fortement conseillé de toujours laisser les ADT et les vibrations activées dans les options de la console et du jeu)* :\n- **Bascule manuelle** : Appuyez sur la touche {TRIANGLE / Y} pour passer manuellement en mode « **Driving** » (ou pour revenir à votre profil d'arme principal)."},{"type":"texte","style":"p","contenu":"🔄 **Réinitialisation et désynchronisation** : Si un décalage survient en jeu (par exemple après une cinématique ou une transition de véhicule):\nMaintenez la touche {L3 / LS} et appuyez sur {TRIANGLE / Y} pour réinitialiser immédiatement l'état.\n*(Note : Ce système de resynchronisation concerne uniquement la gestion manuelle ; la détection automatique via ADT ne peut pas se désynchroniser).*"}]},{"type":"texte","style":"titre","contenu":"🎯 1. Profile MODs"},{"type":"texte","style":"p","contenu":"Réglages spécifiques à un profil ou à une arme (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). Ces valeurs changent automatiquement lorsque vous basculez d'un profil à un autre."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un MOD** pour afficher sa description détaillée et ses conseils de configuration. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🎯 AntiRecoil | 🔥 Fire MODs | 📐 AIM Assist | 🏃 LS Assist | 👁️ AIM Abuse | 💥 Shot MODs | 🔍 Auto ADS | 🔫 Auto Fire | 🔭 Auto Scope | 🎯 HeadShot Assist","mods":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-ads-fire","auto-scope","headshot-assist"]},{"type":"texte","style":"titre","contenu":"🌐 2. Global MODs"},{"type":"texte","style":"p","contenu":"Options actives en permanence dans le script, quel que soit le profil d'arme actuellement sélectionné."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un MOD** pour afficher sa description détaillée et ses conseils de configuration. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🏃 AutoRun | ⚡ Turbo CROSS / A | ⚡ Turbo SQUARE / X | ⚡ Turbo CIRCLE / B | 🤸 Easy Roll | 📢 Klaxon Hold | 🎒 Quick Item | 🌪️ AutoSpin","mods":["autorun","turbo-boutons","turbo-boutons","turbo-boutons","easy-roll","klaxon-hold","quick-item-gta6","autospin"]},{"type":"texte","style":"titre","contenu":"⚡ 3. MODs Activator"},{"type":"texte","style":"p","contenu":"Conditions et états de déclenchement nécessaires pour activer certains Profile MODs (ex. : uniquement en visée *ADS Only*, en tir *FIRE*, ou en visée + tir *ADS + FIRE*)."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un mode** pour afficher son explication détaillée. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🔀 ADS + FIRE | 🎯 ADS | 💥 FIRE | 🎯 ADS Only | 💥 FIRE Only","mods":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"titre","contenu":"🎮 4. Controller"},{"type":"texte","style":"p","contenu":"Configuration matérielle et comportementale de votre manette (Sensibilité des sticks, Zone morte / *Stick Drift*, Inversion de l'axe Y, Remapping des boutons)."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur une option** pour afficher sa description et ses conseils. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🕹️ RS Sensitivity | 🕹️ LS Sensitivity | 🎯 Stick Drift | ⚡ Hair Trigger | 📳 Rumble & ADT | 🎛️ Buttons Layout | ↕️ Inverted RY | ↕️ Inverted LY","mods":["rs-ls-sensitivity","rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes","inverted-axes"]},{"type":"texte","style":"titre","contenu":"🛠️ 5. Misc"},{"type":"texte","style":"p","contenu":"Options système et paramètres globaux de fonctionnement de la machine virtuelle du Cronus Zen."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur une option** pour afficher sa description et ses conseils. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"💾 Auto Save | ⏱️ VM Speed","mods":["auto-save","vm-speed"]},{"type":"texte","style":"titre","contenu":"🔀 6. Quick Toggle"},{"type":"texte","style":"p","contenu":"Attribution de raccourcis rapides à la manette pour activer ou désactiver vos MODs préférés à la volée en plein combat."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur la pastille** pour afficher l'explication détaillée. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🔀 Quick Toggle","mods":["quick-toggle"]},{"type":"texte","style":"titre","contenu":"🌴 7. Activity"},{"type":"texte","style":"p","contenu":"Modules d'automatisation dédiés aux mini-jeux et métiers en jeu (Pêche automatique, *Bench Press* et d'autres à venir...) pour réussir à tous les coups sans effort physique."},{"type":"modbody","mod":"gta6-activity-test"},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur une activité** pour afficher son explication détaillée et son guide d'utilisation. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🎣 Fishing | 🏋️ Bench Press","mods":["activity-gta6-fishing","activity-gta6-bench-press"]},{"type":"depliant","titre":"📝 Patch Note","blocs":[{"type":"texte","style":"p","contenu":"Version 1.00 - Public Release"}]}]},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"texte","style":"h1","contenu":"🔀 Le menu Profile MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Profile MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce menu regroupe l'ensemble des réglages spécifiques à une arme ou à un profil de jeu (**AntiRecoil, Fire MODs, Shot MODs...**). Ces valeurs s'appliquent automatiquement dès que vous changez de profil en jeu.\n\nChaque profil dispose de ses propres réglages indépendants."},{"type":"mods","ids":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist","deadeye","hold-breath"]}],"icone":"cible","sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubrique":"Bibliothèque des MODs","canonique":"/profile-mods/"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 Le menu Global MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Global MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des MODs ou des options actives en permanence, quel que soit le profil sélectionné (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons","easy-roll","klaxon-hold","quick-item-gta6","autospin"]}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp","canonique":"/global-mods/"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 Le menu MODs Activator"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le \"MODs Activator\" ?"},{"type":"texte","style":"p","contenu":"Le **MODs Activator** est le moteur de conditions du script. Il vous permet de définir avec une précision totale **quand** et **comment** vos MODs doivent s'activer en jeu.\n\nAu lieu d'imposer un comportement rigide, ce système écoute vos touches en temps réel et ne déclenche vos modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) que si la condition exacte que vous avez choisie est remplie."},{"type":"texte","style":"h2","contenu":"⚙️ Principe de fonctionnement"},{"type":"texte","style":"p","contenu":"Chaque joueur a sa propre façon de jouer, et chaque arme a ses contraintes. En associant un mode de déclenchement spécifique à chaque MOD, vous évitez les activations involontaires (par exemple : faire un *Drop Shot* alors que vous vouliez simplement ajuster votre visée de loin).\n\nLe système analyse la combinaison de vos touches principales : la gâchette de visée (**ADS**) et la gâchette de tir (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 Les 5 modes de déclenchement disponibles"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Quels MODs utilisent le MODs Activator ?"},{"type":"texte","style":"p","contenu":"Vous pouvez attribuer un mode d'activation indépendant pour chacun des modules suivants dans votre profil :"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **En résumé :**\n\nLe MODs Activator offre un contrôle sur-mesure de votre manette. Il s'adapte à votre gameplay au lieu de vous forcer à adapter votre façon de jouer au script."}],"icone":"eclair","sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp","canonique":"/mods-activator/"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 Le menu Controller"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Controller\" ?"},{"type":"texte","style":"p","contenu":"C'est tout ce qui a un rapport avec la configuration matérielle de votre manette (Sensibilité, Zone morte / Stick Drift, Inversion axe Y, Disposition des boutons)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp","canonique":"/controller/"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ Le menu Misc"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Misc\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des options système du script (**Auto Save** pour sauvegarder les réglages, **VM Speed** pour la vitesse d'exécution)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp","canonique":"/misc/"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ Le menu Quick Toggle (Raccourcis en Jeu)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp","canonique":"/quick-toggle/"},{"id":"activity","titre":"Activity","icone":"palmier","sommaire":false,"blocs":[{"type":"texte","style":"h1","contenu":"🌴 Le menu Activity - GTA VI"},{"type":"modbody","mod":"activity-gta6-intro"},{"type":"mods","ids":["activity-gta6-fishing","activity-gta6-bench-press"]}]},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","rubrique":"Bien démarrer","canonique":"/vibrations-adt/"},{"id":"navigation-oled","titre":"Navigation & Menus OLED","blocs":[{"type":"texte","style":"p","contenu":"Tous les scripts partagent la même architecture de menu et le même système de navigation. Ce guide vous explique comment utiliser le menu OLED, comprendre la structure des menus, leur contenu et régler vos paramètres."},{"type":"texte","style":"h1","contenu":"📖 Guide Général & Fonctionnement de mes Scripts"},{"type":"depliant","titre":"📂 Structure du Menu Principal (Main Menu)","blocs":[{"type":"texte","style":"h3","contenu":"Les fonctionnalités sont réparties en 6 catégories distinctes :"},{"type":"liste","contenu":"🔀 **Profile MODs** : Réglages spécifiques à un profil ou à une arme (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). Ces valeurs changent automatiquement quand vous basculez de profil.\n🌍 **Global MODs** : Options actives en permanence, quel que soit le profil sélectionné (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator** : Conditions nécessaires pour déclencher certains *Profile MODs* (ex. : uniquement en visée *ADS Only*, en tir *FIRE*, ou *ADS + FIRE*).\n🎮 **Controller** : Configuration matérielle de votre manette (Sensibilité, Zone morte / *Stick Drift*, Inversion axe Y, Disposition des boutons).\n⚙️ **Misc** : Options système du script (*Auto Save* pour sauvegarder les réglages, *VM Speed* pour la vitesse d'exécution).\n⏱️ **Quick Toggle** : Attributions de raccourcis rapides à la manette pour activer ou désactiver un MOD à la volée."}]},{"type":"depliant","titre":"🕹️ Menus additionnels spécifiques selon le jeu","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)** : Modules d'automatisation dédiés aux mini-jeux et métiers en jeu (*Pêche automatique*, *5 Finger Fillet*, *Cooking*, *Bench Press* et d'autres à venir...) pour réussir à tous les coups sans effort physique.\n🔄 **Switch Profile (FPS / TPS)** : Système de bascule rapide permettant de changer de profil d'arme ou de configuration (Profil 1, Profil 2, Primaire, Secondaire...) à la volée en plein jeu, afin d'adapter instantanément vos MODs et votre *AntiRecoil* à l'arme que vous tenez en main.\n🌐 **Online Cheat (GTA V)** : Manipulations rapides pour exécuter instantanément des actions clés du menu Interaction en GTA Online (consommer des en-cas, équiper une armure lourde, faire réapparaître votre véhicule personnel...).\n👤 **Story Cheat (GTA V)** : Exécution automatique des combinaisons de codes de triche officiels réservés au mode Histoire de GTA V (santé/armure au max, invincibilité, armes, effets d'environnement...).\n🚀 **Quick Cheat (GTA V)** : Attribution de combinaisons de touches rapides sur votre manette (sur le principe des *Quick Toggles*) pour déclencher vos *Cheats* GTA V favoris en plein jeu à la volée."}]},{"type":"texte","style":"h1","contenu":"🧭 Guide de navigation et d'édition"},{"type":"depliant","titre":"🛑 Sécurité : Le KillSwitch (Coupe-circuit du script)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention cruciale :** Peu importe que vous soyez dans un jeu de course ou dans un jeu de tir, le script exécute aveuglément les instructions qu'il contient. C'est pourquoi il est **absolument crucial de désactiver votre script** lorsque vous naviguez dans les menus du jeu ou de la console. Un MOD s'exécutant lors d'un simple appui sur un bouton, il serait dommage de supprimer un équipement rare dans votre inventaire ou d'acheter/vendre par erreur parce qu'un MOD s'est déclenché au mauvais moment !"},{"type":"texte","style":"h2","contenu":"💡 Comment activer ou désactiver le KillSwitch (mute total des fonctionnalités du script) :"},{"type":"texte","style":"p","contenu":"Appuyez sur l'une de ces combinaisons / touches à tout moment :"},{"type":"liste","contenu":"- Soit sur le bouton {OPTIONS / MENUS} de votre manette.\n- Soit sur le bouton {PS / XBOX}.\n- Soit en maintenant {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entrer et sortir du menu","blocs":[{"type":"liste","contenu":"🚪 **Ouvrir le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS}.\n🎯 **Accès rapide AntiRecoil :** Maintenez {L2 / LT} et appuyez sur {PS / XBOX} pour ouvrir directement les valeurs AntiRecoil du profil actif *(si le MOD AntiRecoil est activé sur ce profil)*.\n🚪 **Fermer le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS} *(si l'Auto Save est activé dans Misc, vos réglages sont enregistrés automatiquement)*.\n💾 **Sauvegarder manuellement et quitter :** Appuyez sur {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Naviguer et modifier les valeurs des MODs","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Naviguer dans les menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Aide visuelle sur l'écran OLED :**\n\n🧭 **Flèches directionnelles :** *Des flèches apparaissent autour du paramètre pour vous indiquer directement dans quel sens appuyer sur la manette.*"},{"type":"texte","style":"p","contenu":"📜 **Ligne d'instructions :** *Un texte défile sur la dernière ligne de l'écran pour vous guider pas à pas si vous hésitez sur la touche à utiliser.*"},{"type":"liste","contenu":"↕️ **Parcourir une liste ou un menu déroulant :** Utilisez {D-Pad HAUT} ou {BAS} *(menu principal, liste de Cheats, choix de réglages...)*.\n📥**Entrer dans un menu / sous-menu :** Appuyez sur {CROSS / A}.\n🔄**Changer de profil à modifier :** Appuyez sur {CROSS / A} *(uniquement dans le menu Profile MODs)*.\n↔️**Se déplacer entre les sous-menus / MODs :** Utilisez {D-Pad GAUCHE} ou {DROITE}.\n⚙️**Activer/Désactiver un MOD ou changer son type :** Utilisez {D-Pad HAUT} ou {BAS}.\n↩️**Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Modifier les valeurs numériques *(ex. : force de l'AntiRecoil, cadence du Rapid Fire)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Activez le MOD :** Si le MOD est sur *OFF*, vous n'avez pas accès à ses valeurs ajustables.\n\n2️⃣ **Entrer dans le menu d'édition :** Appuyez sur {CROSS / A}.\n\n3️⃣ **Sélectionner le paramètre :** Utilisez {D-Pad GAUCHE} ou {DROITE} pour naviguer entre les différentes options.\n\n4️⃣ **Modifier la valeur :** Maintenez {R1 / RB} puis appuyez sur {D-Pad DROITE} (ou {HAUT}) pour augmenter, ou {D-Pad GAUCHE} (ou {BAS}) pour diminuer.\n\n5️⃣ **Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."}]}],"icone":"menu","sommaire":true,"canonique":"/navigation-oled/"}]},{"id":"fps-tps","nom":"THE GANGBANGER","jeu":"Multi FPS / TPS","description":"Script Multi FPS/TPS : surpassez vos adversaires sur vos shooters préférés avec des MODs de combat taillés pour la compétition.","couleurHex":"#ffb547","couleurNomHex":"#ffb547","image":"/media/cartes/fps-tps.jpg","imageOpacite":0.3,"logoBadge":"/media/badges/fps-tps.jpg","banniere":"/media/bannieres/fps-tps.jpg","imagePartage":"/media/cartes/fps-tps.jpg","disponible":true,"onglets":[{"id":"accueil","titre":"Présentation","titrePage":"THE GANGBANGER — Multi FPS / TPS","icone":"liste","sommaire":true,"blocs":[{"type":"carte","image":"/media/bannieres/fps-tps.jpg","titre":"","contenu":""},{"type":"texte","style":"titre","contenu":"📋 Structure et Contenu des Menus du Script","horsSommaire":true},{"type":"depliant","titre":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨","soustitre":"Réglages indispensables dans la console ET dans le jeu","couleurHex":"#ffb547","mod":"vibrations-adt"},{"type":"texte","style":"titre","contenu":"🎯 1. Profile MODs"},{"type":"texte","style":"p","contenu":"Réglages spécifiques à un profil ou à une arme (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). Ces valeurs changent automatiquement lorsque vous basculez d'un profil à un autre."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un MOD** pour afficher sa description détaillée et ses conseils de configuration. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🎯 AntiRecoil | 🔥 Fire MODs | 📐 AIM Assist | 🏃 LS Assist | 👁️ AIM Abuse | 💥 Shot MODs | 🔍 Auto ADS | 🔫 Auto Fire | 🔭 Quick Scope | 🎯 HeadShot Assist | 🫁 Hold Breath","mods":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-ads-fire","auto-scope","headshot-assist","hold-breath"]},{"type":"texte","style":"titre","contenu":"🌐 2. Global MODs"},{"type":"texte","style":"p","contenu":"Options actives en permanence dans le script, quel que soit le profil d'arme actuellement sélectionné."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un MOD** pour afficher sa description détaillée et ses conseils de configuration. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🏃 AutoRun | ⚡ Turbo CROSS / A | ⚡ Turbo SQUARE / X | ⚡ Turbo CIRCLE / B","mods":["autorun","turbo-boutons","turbo-boutons","turbo-boutons"]},{"type":"texte","style":"titre","contenu":"⚡ 3. MODs Activator"},{"type":"texte","style":"p","contenu":"Conditions et états de déclenchement nécessaires pour activer certains Profile MODs (ex. : uniquement en visée *ADS Only*, en tir *FIRE*, ou en visée + tir *ADS + FIRE*)."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un mode** pour afficher son explication détaillée. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🔀 ADS + FIRE | 🎯 ADS | 💥 FIRE | 🎯 ADS Only | 💥 FIRE Only","mods":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"titre","contenu":"🎮 4. Controller"},{"type":"texte","style":"p","contenu":"Configuration matérielle et comportementale de votre manette (Sensibilité des sticks, Zone morte / *Stick Drift*, Inversion de l'axe Y, Remapping des boutons)."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur une option** pour afficher sa description et ses conseils. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🕹️ RS Sensitivity | 🕹️ LS Sensitivity | 🎯 Stick Drift | ⚡ Hair Trigger | 📳 Rumble & ADT | 🎛️ Buttons Layout | ↕️ Inverted RY | ↕️ Inverted LY","mods":["rs-ls-sensitivity","rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes","inverted-axes"]},{"type":"texte","style":"titre","contenu":"🛠️ 5. Misc"},{"type":"texte","style":"p","contenu":"Options système et paramètres globaux de fonctionnement de la machine virtuelle du Cronus Zen."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur une option** pour afficher sa description et ses conseils. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"💾 Auto Save | ⏱️ VM Speed","mods":["auto-save","vm-speed"]},{"type":"texte","style":"titre","contenu":"🔀 6. Quick Toggle"},{"type":"texte","style":"p","contenu":"Attribution de raccourcis rapides à la manette pour activer ou désactiver vos MODs préférés à la volée en plein combat."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur la pastille** pour afficher l'explication détaillée. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🔀 Quick Toggle","mods":["quick-toggle"]},{"type":"texte","style":"titre","contenu":"🔄 7. Switch Profile"},{"type":"texte","style":"p","contenu":"Système de bascule rapide permettant de changer de profil d'arme ou de configuration (Profil 1, Profil 2, Primaire, Secondaire...) à la volée en plein jeu, afin d'adapter instantanément vos MODs et votre *AntiRecoil* à l'arme que vous tenez en main."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur la pastille** pour afficher l'explication détaillée et la liste des raccourcis de bascule. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🔄 Switch Profile","mods":["switch-profile"]},{"type":"depliant","titre":"📝 Patch Note","blocs":[{"type":"texte","style":"p","contenu":"Version 1.00 - Public Release"}]}]},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"texte","style":"h1","contenu":"🔀 Le menu Profile MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Profile MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce menu regroupe l'ensemble des réglages spécifiques à une arme ou à un profil de jeu (**AntiRecoil, Fire MODs, Shot MODs...**). Ces valeurs s'appliquent automatiquement dès que vous changez de profil en jeu.\n\nChaque profil dispose de ses propres réglages indépendants."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention (Script FPS / TPS) :**\n\nTant que vous n'avez pas configuré le menu [**Switch Profile**](/fps-tps/switch-profile/), vous n'aurez accès qu'à un seul profil dans ce menu (et en jeu)."},{"type":"mods","ids":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist","hold-breath"]}],"icone":"cible","sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubrique":"Bibliothèque des MODs","canonique":"/profile-mods/"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 Le menu Global MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Global MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des MODs ou des options actives en permanence, quel que soit le profil sélectionné (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons"]}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp","canonique":"/global-mods/"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 Le menu MODs Activator"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le \"MODs Activator\" ?"},{"type":"texte","style":"p","contenu":"Le **MODs Activator** est le moteur de conditions du script. Il vous permet de définir avec une précision totale **quand** et **comment** vos MODs doivent s'activer en jeu.\n\nAu lieu d'imposer un comportement rigide, ce système écoute vos touches en temps réel et ne déclenche vos modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) que si la condition exacte que vous avez choisie est remplie."},{"type":"texte","style":"h2","contenu":"⚙️ Principe de fonctionnement"},{"type":"texte","style":"p","contenu":"Chaque joueur a sa propre façon de jouer, et chaque arme a ses contraintes. En associant un mode de déclenchement spécifique à chaque MOD, vous évitez les activations involontaires (par exemple : faire un *Drop Shot* alors que vous vouliez simplement ajuster votre visée de loin).\n\nLe système analyse la combinaison de vos touches principales : la gâchette de visée (**ADS**) et la gâchette de tir (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 Les 5 modes de déclenchement disponibles"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Quels MODs utilisent le MODs Activator ?"},{"type":"texte","style":"p","contenu":"Vous pouvez attribuer un mode d'activation indépendant pour chacun des modules suivants dans votre profil :"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **En résumé :**\n\nLe MODs Activator offre un contrôle sur-mesure de votre manette. Il s'adapte à votre gameplay au lieu de vous forcer à adapter votre façon de jouer au script."}],"icone":"eclair","sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp","canonique":"/mods-activator/"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 Le menu Controller"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Controller\" ?"},{"type":"texte","style":"p","contenu":"C'est tout ce qui a un rapport avec la configuration matérielle de votre manette (Sensibilité, Zone morte / Stick Drift, Inversion axe Y, Disposition des boutons)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp","canonique":"/controller/"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ Le menu Misc"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Misc\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des options système du script (**Auto Save** pour sauvegarder les réglages, **VM Speed** pour la vitesse d'exécution)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp","canonique":"/misc/"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ Le menu Quick Toggle (Raccourcis en Jeu)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp","canonique":"/quick-toggle/"},{"id":"switch-profile","titre":"Switch Profile","icone":"actualiser","sommaire":true,"blocs":[{"type":"texte","style":"h1","contenu":"🔄 Le menu Switch Profile (Script FPS / TPS)"},{"type":"modbody","mod":"switch-profile"}]},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","rubrique":"Bien démarrer","canonique":"/vibrations-adt/"},{"id":"navigation-oled","titre":"Navigation & Menus OLED","blocs":[{"type":"texte","style":"p","contenu":"Tous les scripts partagent la même architecture de menu et le même système de navigation. Ce guide vous explique comment utiliser le menu OLED, comprendre la structure des menus, leur contenu et régler vos paramètres."},{"typ {OPTIONS / MENUS} *(si l'Auto Save est activé dans Misc, vos réglages sont enregistrés automatiquement)*.\n💾 **Sauvegarder manuellement et quitter :** Appuyez sur {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Naviguer et modifier les valeurs des MODs","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Naviguer dans les menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Aide visuelle sur l'écran OLED :**\n\n🧭 **Flèches directionnelles :** *Des flèches apparaissent autour du paramètre pour vous indiquer directement dans quel sens appuyer sur la manette.*"},{"type":"texte","style":"p","contenu":"📜 **Ligne d'instructions :** *Un texte défile sur la dernière ligne de l'écran pour vous guider pas à pas si vous hésitez sur la touche à utiliser.*"},{"type":"liste","contenu":"↕️ **Parcourir une liste ou un menu déroulant :** Utilisez {D-Pad HAUT} ou {BAS} *(menu principal, liste de Cheats, choix de réglages...)*.\n📥**Entrer dans un menu / sous-menu :** Appuyez sur {CROSS / A}.\n🔄**Changer de profil à modifier :** Appuyez sur {CROSS / A} *(uniquement dans le menu Profile MODs)*.\n↔️**Se déplacer entre les sous-menus / MODs :** Utilisez {D-Pad GAUCHE} ou {DROITE}.\n⚙️**Activer/Désactiver un MOD ou changer son type :** Utilisez {D-Pad HAUT} ou {BAS}.\n↩️**Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Modifier les valeurs numériques *(ex. : force de l'AntiRecoil, cadence du Rapid Fire)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Activez le MOD :** Si le MOD est sur *OFF*, vous n'avez pas accès à ses valeurs ajustables.\n\n2️⃣ **Entrer dans le menu d'édition :** Appuyez sur {CROSS / A}.\n\n3️⃣ **Sélectionner le paramètre :** Utilisez {D-Pad GAUCHE} ou {DROITE} pour naviguer entre les différentes options.\n\n4️⃣ **Modifier la valeur :** Maintenez {R1 / RB} puis appuyez sur {D-Pad DROITE} (ou {HAUT}) pour augmenter, ou {D-Pad GAUCHE} (ou {BAS}) pour diminuer.\n\n5️⃣ **Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."}]}],"icone":"menu","sommaire":true,"canonique":"/navigation-oled/"}]},{"id":"rdr2","nom":"COWBOY 2","jeu":"Red Dead Redemption II","description":"Script RDR2 : l'outil ultime pour régner sur le Far West, avec des MODs de tir avancés et des assistances pour vos métiers et activités.","couleurHex":"#ff7a3d","couleurNomHex":"#ff7a3d","image":"/media/cartes/rdr2.jpg","imageOpacite":0.3,"logoBadge":"/media/badges/rdr2.jpg","banniere":"/media/bannieres/rdr2.jpg","imagePartage":"/media/cartes/rdr2.jpg","disponible":true,"onglets":[{"id":"accueil","titre":"Présentation","titrePage":"COWBOY 2 — Red Dead Redemption II","icone":"liste","sommaire":true,"blocs":[{"type":"carte","image":"/media/bannieres/rdr2.jpg","titre":"","contenu":""},{"type":"texte","style":"titre","contenu":"📋 Structure et Contenu des Menus du Script","horsSommaire":true},{"type":"depliant","titre":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨","soustitre":"Réglages indispensables dans la console ET dans le jeu","couleurHex":"#ffb547","mod":"vibrations-adt"},{"type":"depliant","titre":"🐎 Focus : Le Mode « On Horse » (Gestion à cheval)","blocs":[{"type":"texte","style":"h3","contenu":"❓ Qu'est-ce que l'état « On Horse » et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Appuyer sur la touche {TRIANGLE / Y} fait basculer le script en mode « **On Horse** ».\n\nCet état adapte automatiquement le comportement de vos MODs pour offrir une conduite fluide à cheval sans interférences :"},{"type":"liste","contenu":"**Désactivation des MODs de combat gênants :** Certains MODs à pied sont temporairement neutralisés pour ne pas déranger les déplacements et la caméra à cheval.\n**Gestion du galop :** L'état **« On Horse »** conditionne le fonctionnement des MODs **Horse Gallop** et **Cinema Gallop** afin d'éviter qu'ils ne se déclenchent lorsque vous êtes à pied."},{"type":"texte","style":"p","contenu":"🔄 Réinitialisation et désynchronisation\n\nSi votre personnage chute de cheval ou si l'état du script ne correspond plus à votre situation en jeu (ex. le script pense que vous êtes à cheval alors que vous êtes à pied) :"},{"type":"carte","couleur":"jaune","contenu":"💡 **Raccourci de resynchronisation :** Maintenez la touche {L3 / LS} et appuyez sur {TRIANGLE / Y} pour réinitialiser instantanément l'état\n« On Horse »."}]},{"type":"texte","style":"titre","contenu":"🎯 1. Profile MODs"},{"type":"texte","style":"p","contenu":"Réglages spécifiques à un profil ou à une arme (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). Ces valeurs changent automatiquement lorsque vous basculez d'un profil à un autre."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un MOD** pour afficher sa description détaillée et ses conseils de configuration. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🎯 AntiRecoil | 🔥 Fire MODs | 👁️ AIM Abuse | 💥 Shot MODs | 🔍 Auto ADS | 🔫 Auto Fire | 🔭 Auto Scope | 🎯 HeadShot Assist | 👁️ DeadEye","mods":["antirecoil","fire-mods","aim-abuse","shot-mods","auto-ads-fire","auto-ads-fire","auto-scope","headshot-assist","deadeye"]},{"type":"texte","style":"titre","contenu":"🌐 2. Global MODs"},{"type":"texte","style":"p","contenu":"Options actives en permanence dans le script, quel que soit le profil d'arme actuellement sélectionné."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un MOD** pour afficher sa description détaillée et ses conseils de configuration. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🏃 AutoRun | ⚡ Turbo CROSS / A | ⚡ Turbo SQUARE / X | ⚡ Turbo CIRCLE / B | 🔭❌ Auto Unscope | 🔄 Auto Reload | 🛑💨 Skid Stop | 🦅 Easy Eagle Eye | 🐎 Horse Gallop | 🎬 Cinema Gallop | 🎒 Quick Item | 💀 Auto Stop DeadEye (RDO) | 🌪️ AutoSpin","mods":["autorun","turbo-boutons","turbo-boutons","turbo-boutons","auto-unscope","auto-reload","skid-stop","easy-eagle-eye","horse-galop","cinema-galop","quick-item-rdr2","autostop-deadeye","autospin"]},{"type":"texte","style":"titre","contenu": liquez sur la pastille** pour afficher l'explication détaillée. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🔀 Quick Toggle","mods":["quick-toggle"]},{"type":"texte","style":"titre","contenu":"🤠 7. Activity"},{"type":"texte","style":"p","contenu":"Modules d'automatisation dédiés aux mini-jeux et métiers en jeu (Pêche automatique, 5 Finger Fillet, Cooking) pour réussir à tous les coups sans effort physique."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur une activité** pour afficher son explication détaillée et son guide d'utilisation. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🎣 Fishing | 🔪 5 Finger Fillet | 🥩 Cooking","mods":["activity-rdr2-fishing","five-finger-fillet","cooking"]},{"type":"depliant","titre":"📝 Patch Note","blocs":[{"type":"texte","style":"p","contenu":"Version 1.00 - Public Release"}]}]},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"texte","style":"h1","contenu":"🔀 Le menu Profile MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Profile MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce menu regroupe l'ensemble des réglages spécifiques à une arme ou à un profil de jeu (**AntiRecoil, Fire MODs, Shot MODs...**). Ces valeurs s'appliquent automatiquement dès que vous changez de profil en jeu.\n\nChaque profil dispose de ses propres réglages indépendants."},{"type":"mods","ids":["antirecoil","fire-mods","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist","deadeye"]}],"icone":"cible","sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubrique":"Bibliothèque des MODs","canonique":"/profile-mods/"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 Le menu Global MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Global MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des MODs ou des options actives en permanence, quel que soit le profil sélectionné (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons","auto-unscope","auto-reload","skid-stop","easy-eagle-eye","horse-galop","cinema-galop","quick-item-rdr2","autostop-deadeye","autospin"]}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp","canonique":"/global-mods/"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 Le menu MODs Activator"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le \"MODs Activator\" ?"},{"type":"texte","style":"p","contenu":"Le **MODs Activator** est le moteur de conditions du script. Il vous permet de définir avec une précision totale **quand** et **comment** vos MODs doivent s'activer en jeu.\n\nAu lieu d'imposer un comportement rigide, ce système écoute vos touches en temps réel et ne déclenche vos modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) que si la condition exacte que vous avez choisie est remplie."},{"type":"texte","style":"h2","contenu":"⚙️ Principe de fonctionnement"},{"type":"texte","style":"p","contenu":"Chaque joueur a sa propre façon de jouer, et chaque arme a ses contraintes. En associant un mode de déclenchement spécifique à chaque MOD, vous évitez les activations involontaires (par exemple : faire un *Drop Shot* alors que vous vouliez simplement ajuster votre visée de loin).\n\nLe système analyse la combinaison de vos touches principales : la gâchette de visée (**ADS**) et la gâchette de tir (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 Les 5 modes de déclenchement disponibles"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Quels MODs utilisent le MODs Activator ?"},{"type":"texte","style":"p","contenu":"Vous pouvez attribuer un mode d'activation indépendant pour chacun des modules suivants dans votre profil :"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **En résumé :**\n\nLe MODs Activator offre un contrôle sur-mesure de votre manette. Il s'adapte à votre gameplay au lieu de vous forcer à adapter votre façon de jouer au script."}],"icone":"eclair","sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp","canonique":"/mods-activator/"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 Le menu Controller"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Controller\" ?"},{"type":"texte","style":"p","contenu":"C'est tout ce qui a un rapport avec la configuration matérielle de votre manette (Sensibilité, Zone morte / Stick Drift, Inversion axe Y, Disposition des boutons)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp","canonique":"/controller/"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ Le menu Misc"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Misc\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des options système du script (**Auto Save** pour sauvegarder les réglages, **VM Speed** pour la vitesse d'exécution)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp","canonique":"/misc/"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ Le menu Quick Toggle (Raccourcis en Jeu)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp","canonique":"/quick-toggle/"},{"id":"activity","titre":"Activity","icone":"cowboy","sommaire":false,"bloc e."}]},{"type":"depliant","titre":"🕹️ Menus additionnels spécifiques selon le jeu","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)** : Modules d'automatisation dédiés aux mini-jeux et métiers en jeu (*Pêche automatique*, *5 Finger Fillet*, *Cooking*, *Bench Press* et d'autres à venir...) pour réussir à tous les coups sans effort physique.\n🔄 **Switch Profile (FPS / TPS)** : Système de bascule rapide permettant de changer de profil d'arme ou de configuration (Profil 1, Profil 2, Primaire, Secondaire...) à la volée en plein jeu, afin d'adapter instantanément vos MODs et votre *AntiRecoil* à l'arme que vous tenez en main.\n🌐 **Online Cheat (GTA V)** : Manipulations rapides pour exécuter instantanément des actions clés du menu Interaction en GTA Online (consommer des en-cas, équiper une armure lourde, faire réapparaître votre véhicule personnel...).\n👤 **Story Cheat (GTA V)** : Exécution automatique des combinaisons de codes de triche officiels réservés au mode Histoire de GTA V (santé/armure au max, invincibilité, armes, effets d'environnement...).\n🚀 **Quick Cheat (GTA V)** : Attribution de combinaisons de touches rapides sur votre manette (sur le principe des *Quick Toggles*) pour déclencher vos *Cheats* GTA V favoris en plein jeu à la volée."}]},{"type":"texte","style":"h1","contenu":"🧭 Guide de navigation et d'édition"},{"type":"depliant","titre":"🛑 Sécurité : Le KillSwitch (Coupe-circuit du script)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention cruciale :** Peu importe que vous soyez dans un jeu de course ou dans un jeu de tir, le script exécute aveuglément les instructions qu'il contient. C'est pourquoi il est **absolument crucial de désactiver votre script** lorsque vous naviguez dans les menus du jeu ou de la console. Un MOD s'exécutant lors d'un simple appui sur un bouton, il serait dommage de supprimer un équipement rare dans votre inventaire ou d'acheter/vendre par erreur parce qu'un MOD s'est déclenché au mauvais moment !"},{"type":"texte","style":"h2","contenu":"💡 Comment activer ou désactiver le KillSwitch (mute total des fonctionnalités du script) :"},{"type":"texte","style":"p","contenu":"Appuyez sur l'une de ces combinaisons / touches à tout moment :"},{"type":"liste","contenu":"- Soit sur le bouton {OPTIONS / MENUS} de votre manette.\n- Soit sur le bouton {PS / XBOX}.\n- Soit en maintenant {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entrer et sortir du menu","blocs":[{"type":"liste","contenu":"🚪 **Ouvrir le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS}.\n🎯 **Accès rapide AntiRecoil :** Maintenez {L2 / LT} et appuyez sur {PS / XBOX} pour ouvrir directement les valeurs AntiRecoil du profil actif *(si le MOD AntiRecoil est activé sur ce profil)*.\n🚪 **Fermer le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS} *(si l'Auto Save est activé dans Misc, vos réglages sont enregistrés automatiquement)*.\n💾 **Sauvegarder manuellement et quitter :** Appuyez sur {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Naviguer et modifier les valeurs des MODs","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Naviguer dans les menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Aide visuelle sur l'écran OLED :**\n\n🧭 **Flèches directionnelles :** *Des flèches apparaissent autour du paramètre pour vous indiquer directement dans quel sens appuyer sur la manette.*"},{"type":"texte","style":"p","contenu":"📜 **Ligne d'instructions :** *Un texte défile sur la dernière ligne de l'écran pour vous guider pas à pas si vous hésitez sur la touche à utiliser.*"},{"type":"liste","contenu":"↕️ **Parcourir une liste ou un menu déroulant :** Utilisez {D-Pad HAUT} ou {BAS} *(menu principal, liste de Cheats, choix de réglages...)*.\n📥**Entrer dans un menu / sous-menu :** Appuyez sur {CROSS / A}.\n🔄**Changer de profil à modifier :** Appuyez sur {CROSS / A} *(uniquement dans le menu Profile MODs)*.\n↔️**Se déplacer entre les sous-menus / MODs :** Utilisez {D-Pad GAUCHE} ou {DROITE}.\n⚙️**Activer/Désactiver un MOD ou changer son type :** Utilisez {D-Pad HAUT} ou {BAS}.\n↩️**Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Modifier les valeurs numériques *(ex. : force de l'AntiRecoil, cadence du Rapid Fire)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Activez le MOD :** Si le MOD est sur *OFF*, vous n'avez pas accès à ses valeurs ajustables.\n\n2️⃣ **Entrer dans le menu d'édition :** Appuyez sur {CROSS / A}.\n\n3️⃣ **Sélectionner le paramètre :** Utilisez {D-Pad GAUCHE} ou {DROITE} pour naviguer entre les différentes options.\n\n4️⃣ **Modifier la valeur :** Maintenez {R1 / RB} puis appuyez sur {D-Pad DROITE} (ou {HAUT}) pour augmenter, ou {D-Pad GAUCHE} (ou {BAS}) pour diminuer.\n\n5️⃣ **Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."}]}],"icone":"menu","sommaire":true,"canonique":"/navigation-oled/"}]},{"id":"gta5","nom":"DOGTAG5","jeu":"GTA V & GTA Online","description":"Script GTA V / GTA Online : prenez le contrôle total de Los Santos avec des MODs de combat, des cheats et des codes de triche intégrés.","couleurHex":"#5aa9ff","couleurNomHex":"#5aa9ff","image":"/media/cartes/gta5.jpg","imageOpacite":0.3,"logoBadge":"/media/badges/gta5.jpg","banniere":"/media/bannieres/gta5.jpg","imagePartage":"/media/cartes/gta5.jpg","disponible":true,"onglets":[{"id":"accueil","titre":"Présentation","titrePage":"DOGTAG5 — GTA V & GTA Online","icone":"liste","sommaire":true,"blocs":[{"type":"carte","image":"/media/bannieres/gta5.jpg","titre":"","contenu":""},{"type":"texte","style":"titre","contenu":"📋 Structure et Contenu des Menus du Script","horsSommaire":true},{"type":"depliant","titre":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨","soustitre":"Réglages indispensables dans la console ET dans le jeu","couleurHex":"#ffb547","mod":"vibrations-adt"},{"type":"depliant","titre":"🚗 Gestion de la Conduite & des Véhicules","blocs":[{"type":"texte","style":"h3","contenu":"❓ Qu'est-ce que la gestion des véhicules et comment fonctionne-t-elle ?"},{"type":"texte","style":"p","contenu":"Cette fonctionnalité adapte automatiquement le comportement du script lorsque vous pilotez un véhicule (ou que vous vous déplacez les mains nues suivant votre configuration). Elle neutralise instantanément tous les MODs pouvant interférer avec la conduite (comme l'AntiRecoil) pour vous garantir un contrôle total."},{"type":"texte","style":"h3","contenu":"🛠️ Fonctionnement selon votre configuration"},{"type":"liste","contenu":"**🤖 Détection Automatique via ADT (PS5 & PC) :**\n> Lorsque vous jouez sur la version PS5 ou PC du jeu et que les gâchettes adaptatives (ADT) sont activées :\n- **Analyse intelligente :** Le script analyse le retour mécanique des gâchettes pour détecter automatiquement si vous êtes au volant d'un véhicule ou si vous vous déplacez les mains nues sans arme équipée.\n- **Affichage OLED :** L'état **« Unarmed / In vehicle »** s'affiche automatiquement sur l'écran du Cronus Zen et adapte le profil instantanément sans aucune manipulation de votre part.\n**🎮 Gestion Manuelle / Mode Driving (Xbox, PS4 ou ADT désactivées) :**\n> Si vous jouez sur une plateforme sans support ADT (Xbox, PS4) ou si vous avez désactivé les gâchettes adaptatives dans vos menus *(💡 il est toutefois fortement conseillé de toujours laisser les ADT et les vibrations activées dans les options de la console et du jeu)* :\n- **Bascule manuelle** : Appuyez sur la touche {TRIANGLE / Y} pour passer manuellement en mode « **Driving** » (ou pour revenir à votre profil d'arme principal)."},{"type":"texte","style":"p","contenu":"🔄 **Réinitialisation et désynchronisation** : Si un décalage survient en jeu (par exemple après une cinématique ou une transition de véhicule):\nMaintenez la touche {L3 / LS} et appuyez sur {TRIANGLE / Y} pour réinitialiser immédiatement l'état.\n*(Note : Ce système de resynchronisation concerne uniquement la gestion manuelle ; la détection automatique via ADT ne peut pas se désynchroniser).*"}]},{"type":"texte","style":"titre","contenu":"🎯 1. Profile MODs"},{"type":"texte","style":"p","contenu":"Réglages spécifiques à un profil ou à une arme (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). Ces valeurs changent automatiquement lorsque vous basculez d'un profil à un autre."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un MOD** pour afficher sa description détaillée et ses conseils de configuration. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🎯 AntiRecoil | 🔥 Fire MODs | 👁️ AIM Abuse | 💥 Shot MODs | 🔍 Auto ADS | 🔫 Auto Fire | 🔭 Auto Scope | 🎯 HeadShot Assist","mods":["antirecoil","fire-mods","aim-abuse","shot-mods","auto-ads-fire","auto-ads-fire","auto-scope","headshot-assist"]},{"type":"texte","style":"titre","contenu":"🌐 2. Global MODs"},{"type":"texte","style":"p","contenu":"Options actives en permanence dans le script, quel que soit le profil d'arme actuellement sélectionné."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un MOD** pour afficher sa description détaillée et ses conseils de configuration. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🏃 AutoRun | ⚡ Turbo CROSS / A | ⚡ Turbo SQUARE / X | ⚡ Turbo CIRCLE / B | 🤸 Easy Roll | 💣 Turbo RPG | 📢 Klaxon Hold | 🌪️ AutoSpin | 🩹 Quick Care","mods":["autorun","turbo-boutons","turbo-boutons","turbo-boutons","easy-roll","turbo-rpg","klaxon-hold","autospin","quick-care"]},{"type":"texte","style":"titre","contenu":"⚡ 3. MODs Activator"},{"type":"texte","style":"p","contenu":"Conditions et états de déclenchement nécessaires pour activer certains Profile MODs (ex. : uniquement en visée *ADS Only*, en tir *FIRE*, ou en visée + tir *ADS + FIRE*)."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur un mode** pour afficher son explication détaillée. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🔀 ADS + FIRE | 🎯 ADS | 💥 FIRE | 🎯 ADS Only | 💥 FIRE Only","mods":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"titre","contenu":"🎮 4. Controller"},{"type":"texte","style":"p","contenu":"Configuration matérielle et comportementale de votre manette (Sensibilité des sticks, Zone morte / *Stick Drift*, Inversion de l'axe Y, Remapping des boutons)."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur une option** pour afficher sa description et ses conseils. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🕹️ RS Sensitivity | 🕹️ LS Sensitivity | 🎯 Stick Drift | ⚡ Hair Trigger | 📳 Rumble & ADT | 🎛️ Buttons Layout | ↕️ Inverted RY | ↕️ Inverted LY","mods":["rs-ls-sensitivity","rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes","inverted-axes"]},{"type":"texte","style":"titre","contenu":"🛠️ 5. Misc"},{"type":"texte","style":"p","contenu":"Options système et paramètres globaux de fonctionnement de la machine virtuelle du Cronus Zen."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur une option** pour afficher sa description et ses conseils. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"💾 Auto Save | ⏱️ VM Speed","mods":["auto-save","vm-speed"]},{"type":"texte","style":"titre","contenu":"🔀 6. Quick Toggle"},{"type":"texte","style":"p","contenu":"Attribution de raccourcis rapides à la manette pour activer ou désactiver vos MODs préférés à la volée en plein combat."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur la pastille** pour afficher l'explication détaillée. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🔀 Quick Toggle","mods":["quick-toggle"]},{"type":"texte","style":"titre","contenu":"🌐 7. Online Cheat (GTA Online)"},{"type":"texte","style":"p","contenu":"Manipulations rapides pour exécuter instantanément des actions clés du menu Interaction en GTA Online (consommer des en-cas, équiper une armure lourde, faire réapparaître votre véhicule personnel...)."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur la pastille** pour afficher l'explication détaillée et la liste des actions. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"🌐 Online Cheat","mods":["online-cheat"]},{"type":"texte","style":"titre","contenu":"📖 8. Story Cheat (GTA V)"},{"type":"texte","style":"p","contenu":"Exécution automatique des combinaisons de codes de triche officiels réservés au mode Histoire de GTA V (santé/armure au max, invincibilité, armes, effets d'environnement...)."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur la pastille** pour afficher l'explication détaillée et la liste des codes pris en charge. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"📖 Story Cheat","mods":["story-cheat"]},{"type":"texte","style":"titre","contenu":"⚡ 9. Quick Cheat (GTA V - GTA Online)"},{"type":"texte","style":"p","contenu":"Attribution de combinaisons de touches rapides sur votre manette (sur le principe des *Quick Toggles*) pour déclencher vos *Cheats* GTA V favoris en plein jeu à la volée."},{"type":"carte","couleur":"blue","contenu":"👇 **Cliquez sur la pastille** pour afficher l'explication détaillée. Cliquez à nouveau pour la refermer."},{"type":"etiquettes","contenu":"⚡ Quick Cheat","mods":["quick-cheat"]},{"type":"depliant","titre":"📝 Patch Note","blocs":[{"type":"texte","style":"p","contenu":"Version 1.00 - Public Release"}]}]},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"texte","style":"h1","contenu":"🔀 Le menu Profile MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Profile MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce menu regroupe l'ensemble des réglages spécifiques à une arme ou à un profil de jeu (**AntiRecoil, Fire MODs, Shot MODs...**). Ces valeurs s'appliquent automatiquement dès que vous changez de profil en jeu.\n\nChaque profil dispose de ses propres réglages indépendants."},{"type":"mods","ids":["antirecoil","fire-mods","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist"]}],"icone":"cible","sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubrique":"Bibliothèque des MODs","canonique":"/profile-mods/"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 Le menu Global MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Global MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des MODs ou des options actives en permanence, quel que soit le profil sélectionné (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons","easy-roll","turbo-rpg","klaxon-hold","autospin","quick-care"]}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp","canonique":"/global-mods/"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 Le menu MODs Activator"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le \"MODs Activator\" ?"},{"type":"texte","style":"p","contenu":"Le **MODs Activator** est le moteur de conditions du script. Il vous permet de définir avec une précision totale **quand** et **comment** vos MODs doivent s'activer en jeu.\n\nAu lieu d'imposer un comportement rigide, ce système écoute vos touches en temps réel et ne déclenche vos modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) que si la condition exacte que vous avez choisie est remplie."},{"type":"texte","style":"h2","contenu":"⚙️ Principe de fonctionnement"},{"type":"texte","style":"p","contenu":"Chaque joueur a sa propre façon de jouer, et chaque arme a ses contraintes. En associant un mode de déclenchement spécifique à chaque MOD, vous évitez les activations involontaires (par exemple : faire un *Drop Shot* alors que vous vouliez simplement ajuster votre visée de loin).\n\nLe système analyse la combinaison de vos touches principales : la gâchette de visée (**ADS**) et la gâchette de tir (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 Les 5 modes de déclenchement disponibles"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Quels MODs utilisent le MODs Activator ?"},{"type":"texte","style":"p","contenu":"Vous pouvez attribuer un mode d'activation indépendant pour chacun des modules suivants dans votre profil :"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **En résumé :**\n\nLe MODs Activator offre un contrôle sur-mesure de votre manette. Il s'adapte à votre gameplay au lieu de vous forcer à adapter votre façon de jouer au script."}],"icone":"eclair","sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp","canonique":"/mods-activator/"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 Le menu Controller"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Controller\" ?"},{"type":"texte","style":"p","contenu":"C'est tout ce qui a un rapport avec la configuration matérielle de votre manette (Sensibilité, Zone morte / Stick Drift, Inversion axe Y, Disposition des boutons)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp","canonique":"/controller/"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ Le menu Misc"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Misc\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des options système du script (**Auto Save** pour sauvegarder les réglages, **VM Speed** pour la vitesse d'exécution)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp","canonique":"/misc/"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ Le menu Quick Toggle (Raccourcis en Jeu)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp","canonique":"/quick-toggle/"},{"id":"online-cheat","titre":"Online Cheat","icone":"globe","sommaire":true,"blocs":[{"type":"texte","style":"h1","contenu":"🌐 Le menu Online Cheat (GTA Online)"},{"type":"modbody","mod":"online-cheat"}]},{"id":"story-cheat","titre":"Story Cheat","icone":"livre","sommaire":true,"blocs":[{"type":"texte","style":"h1","contenu":"👤 Le menu Story Cheat (GTA V Mode Histoire)"},{"type":"modbody","mod":"story-cheat"}]},{"id":"quick-cheat","titre":"Quick Cheat","icone":"fusee","sommaire":true,"blocs":[{"type":"texte","style":"h1","contenu":"🚀 Le menu Quick Cheat (Raccourcis en jeu)"},{"type":"modbody","mod":"quick-cheat"}]},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","rubrique":"Bien démarrer","canonique":"/vibrations-adt/"},{"id":"navigation-oled","titre":"Navigation & Menus OLED","blocs":[{"type":"texte","style":"p","contenu":"Tous les scripts partagent la même architecture de menu et le même système de navigation. Ce guide vous explique comment utiliser le menu OLED, comprendre la structure des menus, leur contenu et régler vos paramètres."},{"type":"texte","style":"h1","contenu":"📖 Guide Général & Fonctionnement de mes Scripts"},{"type":"depliant","titre":"📂 Structure du Menu Principal (Main Menu)","blocs":[{"type":"texte","style":"h3","contenu":"Les fonctionnalités sont réparties en 6 catégories distinctes :"},{"type":"liste","contenu":"🔀 **Profile MODs** : Réglages spécifiques à un profil ou à une arme (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). Ces valeurs changent automatiquement quand vous basculez de profil.\n🌍 **Global MODs** : Options actives en permanence, quel que soit le profil sélectionné (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator** : Conditions nécessaires pour déclencher certains *Profile MODs* (ex. : uniquement en visée *ADS Only*, en tir *FIRE*, ou *ADS + FIRE*).\n🎮 **Controller** : Configuration matérielle de votre manette (Sensibilité, Zone morte / *Stick Drift*, Inversion axe Y, Disposition des boutons).\n⚙️ **Misc** : Options système du script (*Auto Save* pour sauvegarder les réglages, *VM Speed* pour la vitesse d'exécution).\n⏱️ **Quick Toggle** : Attributions de raccourcis rapides à la manette pour activer ou désactiver un MOD à la volée."}]},{"type":"depliant","titre":"🕹️ Menus additionnels spécifiques selon le jeu","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)** : Modules d'automatisation dédiés aux mini-jeux et métiers en jeu (*Pêche automatique*, *5 Finger Fillet*, *Cooking*, *Bench Press* et d'autres à venir...) pour réussir à tous les coups sans effort physique.\n🔄 **Switch Profile (FPS / TPS)** : Système de bascule rapide permettant de changer de profil d'arme ou de configuration (Profil 1, Profil 2, Primaire, Secondaire...) à la volée en plein jeu, afin d'adapter instantanément vos MODs et votre *AntiRecoil* à l'arme que vous tenez en main.\n🌐 **Online Cheat (GTA V)** : Manipulations rapides pour exécuter instantanément des actions clés du menu Interaction en GTA Online (consommer des en-cas, équiper une armure lourde, faire réapparaître votre véhicule personnel...).\n👤 **Story Cheat (GTA V)** : Exécution automatique des combinaisons de codes de triche officiels réservés au mode Histoire de GTA V (santé/armure au max, invincibilité, armes, effets d'environnement...).\n🚀 **Quick Cheat (GTA V)** : Attribution de combinaisons de touches rapides sur votre manette (sur le principe des *Quick Toggles*) pour déclencher vos *Cheats* GTA V favoris en plein jeu à la volée."}]},{"type":"texte","style":"h1","contenu":"🧭 Guide de navigation et d'édition"},{"type":"depliant","titre":"🛑 Sécurité : Le KillSwitch (Coupe-circuit du script)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention cruciale :** Peu importe que vous soyez dans un jeu de course ou dans un jeu de tir, le script exécute aveuglément les instructions qu'il contient. C'est pourquoi il est **absolument crucial de désactiver votre script** lorsque vous naviguez dans les menus du jeu ou de la console. Un MOD s'exécutant lors d'un simple appui sur un bouton, il serait dommage de supprimer un équipement rare dans votre inventaire ou d'acheter/vendre par erreur parce qu'un MOD s'est déclenché au mauvais moment !"},{"type":"texte","style":"h2","contenu":"💡 Comment activer ou désactiver le KillSwitch (mute total des fonctionnalités du script) :"},{"type":"texte","style":"p","contenu":"Appuyez sur l'une de ces combinaisons / touches à tout moment :"},{"type":"liste","contenu":"- Soit sur le bouton {OPTIONS / MENUS} de votre manette.\n- Soit sur le bouton {PS / XBOX}.\n- Soit en maintenant {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entrer et sortir du menu","blocs":[{"type":"liste","contenu":"🚪 **Ouvrir le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS}.\n🎯 **Accès rapide AntiRecoil :** Maintenez {L2 / LT} et appuyez sur {PS / XBOX} pour ouvrir directement les valeurs AntiRecoil du profil actif *(si le MOD AntiRecoil est activé sur ce profil)*.\n🚪 **Fermer le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS} *(si l'Auto Save est activé dans Misc, vos réglages sont enregistrés automatiquement)*.\n💾 **Sauvegarder manuellement et quitter :** Appuyez sur {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Naviguer et modifier les valeurs des MODs","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Naviguer dans les menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Aide visuelle sur l'écran OLED :**\n\n🧭 **Flèches directionnelles :** *Des flèches apparaissent autour du paramètre pour vous indiquer directement dans quel sens appuyer sur la manette.*"},{"type":"texte","style":"p","contenu":"📜 **Ligne d'instructions :** *Un texte défile sur la dernière ligne de l'écran pour vous guider pas à pas si vous hésitez sur la touche à utiliser.*"},{"type":"liste","contenu":"↕️ **Parcourir une liste ou un menu déroulant :** Utilisez {D-Pad HAUT} ou {BAS} *(menu principal, liste de Cheats, choix de réglages...)*.\n📥**Entrer dans un menu / sous-menu :** Appuyez sur {CROSS / A}.\n🔄**Changer de profil à modifier :** Appuyez sur {CROSS / A} *(uniquement dans le menu Profile MODs)*.\n↔️**Se déplacer entre les sous-menus / MODs :** Utilisez {D-Pad GAUCHE} ou {DROITE}.\n⚙️**Activer/Désactiver un MOD ou changer son type :** Utilisez {D-Pad HAUT} ou {BAS}.\n↩️**Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Modifier les valeurs numériques *(ex. : force de l'AntiRecoil, cadence du Rapid Fire)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Activez le MOD :** Si le MOD est sur *OFF*, vous n'avez pas accès à ses valeurs ajustables.\n\n2️⃣ **Entrer dans le menu d'édition :** Appuyez sur {CROSS / A}.\n\n3️⃣ **Sélectionner le paramètre :** Utilisez {D-Pad GAUCHE} ou {DROITE} pour naviguer entre les différentes options.\n\n4️⃣ **Modifier la valeur :** Maintenez {R1 / RB} puis appuyez sur {D-Pad DROITE} (ou {HAUT}) pour augmenter, ou {D-Pad GAUCHE} (ou {BAS}) pour diminuer.\n\n5️⃣ **Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."}]}],"icone":"menu","sommaire":true,"canonique":"/navigation-oled/"}]}],"mods":[{"id":"antirecoil","titre":"🎯 AntiRecoil","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'un AntiRecoil et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'AntiRecoil simule le mouvement de votre pouce sur le
