 Option 1: Wireless headset (Bluetooth or 2.4 GHz USB Dongle)**\n> *This is the ideal solution.* Connect your wireless headset directly to your console or PC. The audio signal completely bypasses the Cronus Zen, ensuring maximum sound quality and voice chat free of any interference.\n**🔌 Option 2: USB headset (or Sound card / Jack ➔ USB adapter)**\n> Plug your USB headset *(or your jack headset via a dedicated sound card / USB adapter)* directly into one of your console's USB ports, not into the Cronus Zen.\n**🎮 Option 3: Second controller dedicated to audio**\n> Plug a second controller via USB directly into your console, then connect your jack headset to that second controller. It will serve exclusively as an external sound card for the game and your voice chat."},{"type":"carte","couleur":"jaune","contenu":"💡 **Check:** Go to your console's audio settings and verify that the input *(microphone)* and output *(headset)* devices are assigned to your headset or to the second controller, and not to the Cronus Zen."}]},{"type":"depliant","titre":"🛞 Your Cronus shows \"Wheel\" or \"Tournament\"","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Resolution procedure:"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Connect your Cronus Zen to your PC using the cable plugged into the **PROG port** *(located on the right side of the device)*."},{"contenu":"Open the [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/) application."},{"contenu":"In the status bar at the very bottom of the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) window *(next to the serial number and version)*, find the clickable text showing the active mode. If it is set to **Wheel** or **Tournament**, click it and set it back to **Normal**."}]},{"type":"carte","couleur":"jaune","contenu":"💡 **Check:** The Cronus Zen's OLED screen should display its standard menu again and no longer mention *Wheel* mode."}]},{"type":"depliant","titre":"📡 Your Cronus is not recognized or does not work on your console (Output Protocol)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Resolution procedure:"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Mandatory first step","contenu":"Make sure you have tried other certified **data** USB cables *(charge & data)* and checked the condition of your USB ports."},{"contenu":"Connect the Cronus Zen to your computer via the **PROG port** *(right side)*."},{"contenu":"Go to [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/)."},{"contenu":"Click the **Device Management** tab, then select **Device Settings**."},{"contenu":"In the window that opens, find the **Output Protocol** line."},{"contenu":"Replace the current option *(or AUTO mode)* by explicitly choosing your console from the list (*PS5, PS4, Xbox Series X/S, PC, Nintendo Switch*...)."},{"contenu":"Close the window to save the setting automatically, then reconnect your Zen to the console."}]}]}]},{"type":"carte","image":"/media/guide/depannage-1.webp","titre":"","contenu":""}],"icone":"outil","sommaire":false,"sousTitre":"Solutions to the most common problems: E3 errors, sound and mic, Wheel or Tournament mode, Cronus Zen not recognized by the console."},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"carte","couleur":"rouge","contenu":"🚨 **Enable your vibrations and adaptive triggers**, in your console / platform settings **AND** in your game."},{"type":"modbody","mod":"vibrations-adt","sansTitre":true}],"icone":"attention","couleurOnglet":"#ffb547","commun":true,"rubriqueScript":"Getting started","sousTitre":"The essential setting before using a script: choose your platform to see where to enable vibrations and adaptive triggers."},{"id":"navigation-oled","titre":"OLED Navigation & Menus","blocs":[{"type":"texte","style":"p","contenu":"All scripts share the same menu architecture and the same navigation system. This guide explains how to use the OLED menu, understand the structure of the menus and their contents, and adjust your settings."},{"type":"modbody","mod":"navigation-oled","sansTitre":true}],"icone":"menu","commun":true,"sommaire":false,"sousTitre":"How my scripts' menus are organized, and how to open them, browse them and change values from the OLED screen."},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning (FPS / TPS Script):**\n\nUntil you have configured the [**Switch Profile**](/fps-tps/switch-profile/) menu, you will only have access to a single profile in this menu (and in-game)."},{"type":"mods","ids":["antirecoil","fire-mods","aim-assist","ls-assist","shot-mods","kinetic-aim","aim-abuse","auto-ads","auto-fire","auto-scope","quick-scope","headshot-assist","deadeye","hold-breath"],"sommaire":true}],"icone":"cible","commun":true,"sommaire":false,"rubriqueScript":"MODs Library","sousTitre":"The settings specific to each weapon or game profile (AntiRecoil, Fire MODs, Shot MODs…). Each profile keeps its own values, applied automatically as soon as you switch profiles in game."},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"mods","ids":["autorun","turbo-boutons","quick-item-gta6","auto-unscope","auto-reload","skid-stop","easy-eagle-eye","horse-galop","cinema-galop","quick-item-rdr2","autostop-deadeye","autospin","online-boss","easy-roll","turbo-rpg","klaxon-hold","quick-care"],"sommaire":true}],"icone":"globe","commun":true,"sommaire":false,"sousTitre":"The MODs and options that are always active, whatever profile is selected (AutoRun, Turbo Buttons…)."},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"modbody","mod":"mods-activator","sansTitre":true}],"icone":"eclair","commun":true,"sommaire":false,"sousTitre":"The script's condition engine: it defines when and how your MODs trigger in game."},{"id":"controller","titre":"Controller","blocs":[{"type":"mods","ids":["rs-sensitivity","ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"],"sommaire":true}],"icone":"manette","commun":true,"sommaire":false,"sousTitre":"Your controller's hardware settings: sensitivity, dead zone, axis inversion and button layout."},{"id":"misc","titre":"Misc","blocs":[{"type":"mods","ids":["auto-save","vm-speed"],"sommaire":true}],"icone":"engrenage","commun":true,"sommaire":false,"sousTitre":"The script's system options: automatic saving of your settings (Auto Save) and execution speed (VM Speed)."},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"modbody","mod":"quick-toggle","sansTitre":true}],"icone":"chrono","commun":true,"sommaire":true,"sousTitre":"Turn a MOD on or off in the middle of a fight with a button combination, without opening the OLED menu."},{"id":"gta6-activity","titre":"GTA 6 - Activity","blocs":[{"type":"carte","couleur":"jaune","contenu":"💡 **Exiting an activity:** To exit any activity launched from the Activity menu and return to standard gameplay, hold {CIRCLE / B} for a few seconds."},{"type":"mods","ids":["activity-gta6-fishing","activity-gta6-bench-press"],"sommaire":true}],"icone":"palmier","sommaire":false,"sousTitre":"MODs dedicated to GTA 6 mini-games (fishing, bench press), so you can complete them without fatigue."},{"id":"fps-tps-switch-profile","titre":"FPS/TPS - Switch Profile","blocs":[{"type":"modbody","mod":"switch-profile","sansTitre":true}],"icone":"actualiser","sommaire":false,"sousTitre":"Manage up to 3 separate weapon profiles and choose how to switch between them in the middle of a game."},{"id":"rdr2-activity","titre":"RDR2 - Activity","blocs":[{"type":"carte","couleur":"jaune","contenu":"💡 **Exiting an activity:** To exit any activity launched from the Activity menu and return to standard gameplay, hold {CIRCLE / B} for a few seconds."},{"type":"mods","ids":["activity-rdr2-fishing","five-finger-fillet","cooking"],"sommaire":true}],"icone":"cowboy","sommaire":false,"sousTitre":"MODs dedicated to Red Dead Redemption II and Red Dead Online mini-games (fishing, knife game, meat cooking), so you can complete them without fatigue."},{"id":"gta5-online-cheat","titre":"GTA 5 - Online Action","blocs":[{"type":"modbody","mod":"online-cheat","sansTitre":true}],"icone":"globe","sommaire":false,"sousTitre":"9 actions from the GTA Online interaction menu, performed in a split second without leaving the fight."},{"id":"gta5-story-cheat","titre":"GTA 5 - Story Action","blocs":[{"type":"modbody","mod":"story-cheat","sansTitre":true}],"icone":"livre","sommaire":false,"sousTitre":"All the official cheat codes from GTA 5 Story Mode, sent automatically without typing the combinations."},{"id":"gta5-quick-cheat","titre":"GTA 5 - Quick Action","blocs":[{"type":"modbody","mod":"quick-cheat","sansTitre":true}],"icone":"fusee","sommaire":false,"sousTitre":"Controller shortcuts to instantly launch your favorite commands from the Online Action and Story Action menus, without opening a menu."},{"id":"idees-recues","titre":"Understanding MODs & Misconceptions","titrePage":"Understanding MODs & Misconceptions","icone":"ampoule","sommaire":true,"blocs":[{"type":"texte","style":"titre","contenu":"❓ What is a MOD?"},{"type":"texte","style":"p","contenu":"A **MOD** (or *Macro On Demand*) is a programmable sequence of commands (button presses, analog stick movements, etc.) sent by the controller to the console.\n\nThese macros are automated using Cronus Zen scripts, but this principle is also used by many other gaming devices:"},{"type":"liste","contenu":"**Pro controllers:** they offer macro features through their configurable paddles or sensitivity settings.\n**Gaming keyboards:** they often have dedicated keys for macros that are fully programmable through their software."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Remember:** Using MODs is therefore not reserved for Cronus users: it is a very common practice in video games in general."},{"type":"texte","style":"titre","contenu":"❓ What can I do (and not do) with MODs?"},{"type":"texte","style":"p","contenu":"The Cronus Zen is at the heart of many misconceptions. In reality, its capabilities remain strictly hardware-based and emulated:"},{"type":"duo","cartes":[{"titre":"✅ What a Cronus Zen can do","couleur":"vert","blocs":[{"type":"liste","contenu":"Automate button presses and analog stick movements.\nLet you create and customize your macros.\nUse several macros in a single script.\nOptimize the aim assist already natively present in the game."}]},{"titre":"❌ What a Cronus Zen CANNOT do","couleur":"rouge","blocs":[{"type":"liste","contenu":"Access or modify the game files.\nTrigger an Aimbot (automatic lock-on).\nAutomatically aim at the head (*automatic Headshot*).\nMake you invincible or let you walk through walls.\nIncrease your damage.\nSee or analyze what is happening on your screen."}]}]},{"type":"texte","style":"titre","contenu":"💡 Important things to know"},{"type":"liste","contenu":"**Respecting the game's limits:** The restrictions imposed by the developers cannot be exceeded. If the game has a fire rate limit or a cooldown, a script can never go beyond it."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Beware of fake video demonstrations:** Do not trust videos promising perfect tracking, instant headshots or laser weapons. If a seller guarantees you this kind of feature, it means they are actually using a **real PC cheat** to shoot their video, and not a Cronus Zen. A script only evaluates your controller's signals: it can in no way read or modify the game's memory."},{"type":"texte","style":"titre","contenu":"📋 In summary"},{"type":"carte","couleur":"blue","contenu":"A macro does not modify the game: it simply changes the way your commands are transmitted. The game keeps receiving ordinary button presses and controller movements. A script can neither access the game's code, nor bypass its mechanisms, nor perform actions not intended by the developers.\n\nAll it does is **automate what you could already do yourself**, repeating the commands with perfect timing and regularity. If an action can be done manually, a Cronus Zen script can reproduce it. It does not add new capabilities, it simply removes the tedium of manual execution."}],"sousTitre":"What a MOD really is, what a Cronus Zen can do… and what it will never do."},{"id":"fonctionnement-scripts","titre":"How Scripts work","titrePage":"How Scripts work","icone":"engrenage","sommaire":false,"blocs":[{"type":"texte","style":"p","contenu":"Scripts are made to work with your game controller, not with a particular game.\n\nAlthough most scripts claim to be \"made for such-and-such game\", they actually only adapt to the commands sent by your controller. A script dedicated to a specific game is simply a set of MODs configured to match that game's mechanics and buttons. The script responds to the orders transmitted by your actions on the controller (the *inputs*) and not to what is happening directly on screen.\n\nThese MODs only modify the signal the controller sends to the console (the *outputs*):"},{"type":"liste","contenu":"**Example:** If you use the *RapidFire* MOD, the script detects that you are holding the fire button and loops the order to press that button to the console."},{"type":"carte","couleur":"orange","contenu":"⚠️ Whether you are in a racing game or a shooter: the script blindly executes the instructions it contains. That is why it is crucial to **disable your script when you navigate the game or console menus**. Since a MOD runs on a simple button press, it would be a shame to delete a rare piece of equipment from your inventory because a MOD triggered by mistake!"}],"sousTitre":"Why a script works with your controller, not with a specific game."},{"id":"meilleur-script","titre":"Which script is the best?","titrePage":"Which script is the best?","icone":"trophee","sommaire":false,"blocs":[{"type":"texte","style":"p","contenu":"**There is no \"best\" script.** Deep down, they all perform very similar tasks. The only thing that really makes a difference is **your settings**.\n\nYou can watch impressive demonstrations on YouTube or TikTok, apply exactly the same settings and find the result mediocre. Likewise, copying configurations shared on Discord often only gives average results. Even if a setting seems good to you, there is almost always room for improvement. Shared settings are excellent starting points, but they will never be perfectly optimized for your profile."},{"type":"texte","style":"h3","contenu":"Several unique factors influence the effectiveness of your settings:"},{"type":"liste","contenu":"**Your hardware:** your sticks' dead zone, the level of *stick drift*, the controller's response time.\n**Your network:** latency (ping) and the stability of your internet connection.\n**Your in-game settings:** overall sensitivity, the dead zones configured *in-game*.\n**Your playstyle:** the way you handle the analog sticks, your combat preferences (close range, long range, etc.)."},{"type":"carte","couleur":"blue","contenu":"📋 **In summary**, good settings are settings you have fine-tuned yourself, taking the time needed to run your own tests."}],"sousTitre":"Why the best settings are the ones you fine-tune yourself."},{"id":"compatibilite","titre":"Compatibility & Required hardware","titrePage":"Compatibility & Required hardware","icone":"manette","sommaire":false,"blocs":[{"type":"texte","style":"titre","contenu":"❓Which platforms do the scripts work on?"},{"type":"texte","style":"p","contenu":"The scripts are compatible with **PS5, PS4, Xbox Series X|S, Xbox One and PC**."},{"type":"texte","style":"titre","contenu":"📋 What hardware and setup are required?"},{"type":"liste","contenu":"**Unit:** An up-to-date **Cronus ZEN**.\n**Computer:** A PC (Windows) or a Mac. Management is done directly online on the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) website (there is no longer any software to install).\n**Browser:** You must use a **Chromium**-based browser (such as Microsoft Edge, Google Chrome or Brave)."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning:** Be sure to disable the page's automatic translation on [Zen Studio Live](https://zenstudio.collectivemindsstore.com/), otherwise the interface will be unreadable!"}],"sousTitre":"Compatible platforms and the hardware you need to use my scripts."},{"id":"lexique","titre":"Glossary","blocs":[{"type":"groupe","blocs":[{"type":"depliant","titre":"🎯 Aim & Shooting MODs","blocs":[{"type":"liste","contenu":"**AntiRecoil:** Automatically compensates for the weapon's recoil downward or sideways while shooting.\n**Fire MODs:** Changes the firing rhythm (Rapid Fire, Burst Fire, Dynamic Rapid Fire...).\n**AIM Assist / LS Assist:** Exploits the game's native aim assist by applying discreet micro-movements to the aiming stick and/or the movement stick to strengthen your crosshair's magnetism. (⚠️ **is NOT an aimbot)**\n**AIM Abuse:** Quickly presses and releases the aim button (**ADS**) to force the game to constantly re-center the crosshair on the enemy. *(Mostly used in games with automatic aiming such as GTA 5 or RDR2)*\n**HeadShot Assist:** Automatically shifts the crosshair toward the target's head when aiming. (⚠️ **is NOT an aimbot)**"}]},{"type":"depliant","titre":"🏃 Movement & Shooting MODs","blocs":[{"type":"liste","contenu":"**Shot MODs:** Automatically performs a movement action at the moment you shoot.\n- **Drop Shot** = lie down / crouch.\n- **Jump Shot** = jump.\n- **Strafe** = lateral movement.\n**Auto ADS / Auto Fire:** Automatically aims as soon as you shoot, or automatically shoots as soon as you aim.\n**Quick Scope:** *(Specific to the FPS/TPS script)* Aims and shoots instantly with a single press of the fire button (ideal for sniping).\n**Auto Scope:** *(Specific to the GTA and RDR2 scripts)* Automatically presses the zoom button when you aim.\n**DeadEye:** *(Specific to the RDR2 script)* Automatically activates DeadEye mode or triggers DeadShot."}]},{"type":"depliant","titre":"🎮 Controls & Controller Buttons","blocs":[{"type":"liste","contenu":"**ADS** (*Aim Down Sights*): Button or trigger used to aim (usually {L2} on PlayStation / {LT} on Xbox).\n**FIRE**: Button or trigger used to shoot (usually {R2} on PlayStation / {RT} on Xbox).\n**HIP**: \"Hip-fire\" shooting position, i.e. shooting directly without holding the aim button (**ADS**).\n{D-Pad} (*Directional Pad*): The controller's directional cross ({UP / DOWN / LEFT / RIGHT}).\n{CROSS / A}: **Cross** button (PlayStation) / {A} button (Xbox).\n{SQUARE / X}: **Square** button (PlayStation) / {X} button (Xbox).\n{TRIANGLE / Y}: **Triangle** button (PlayStation) / {Y} button (Xbox).\n{CIRCLE / B}: **Circle** button (PlayStation) / {B} button (Xbox).\n**L1 / LB & R1 / RB**: Upper triggers / shoulder buttons (*Bumpers*).\n**L2 / LT & R2 / RT**: Long-travel analog lower triggers (*Triggers*).\n{L3 / LS}: Physical click obtained by pressing down the left analog stick (*Left Stick*).\n{R3 / RS}: Physical click obtained by pressing down the right analog stick (*Right Stick*).\n**LY / RY**: Vertical axis (Y axis) of the left stick (*Left Y*) or the right stick (*Right Y*).\n**LX / RX**: Horizontal axis (X axis) of the left stick (*Left X*) or the right stick (*Right X*)."}]},{"type":"depliant","titre":"⚙️ Technical Terms & MOD Settings","blocs":[{"type":"liste","contenu":"**MOD**: Macro or software feature built into the script (e.g. *AntiRecoil*, *AIM Assist*, *AutoRun*).\n**DeadZone** (*Dead Zone*): Inactive perimeter at the center of the analog stick. Below this tilt threshold, the game detects no movement.\n**Stick Drift**: Hardware drift caused by wear of a stick's potentiometers, sending false movements to the console even at rest.\n**Radius** (*Rad*): Size or amplitude of the geometric shape drawn by the script (e.g. *AIM Assist* or *LS Assist*).\n**Step**: Speed / rate of progression of the geometric shape drawn by the AIM Assist (angle increment value at each cycle).\n**Humanizer**: Algorithm injecting random micro-variations into timers and movements to imitate human physics and get around anti-cheat systems.\n**Hair Trigger**: Neutralization of the triggers' analog travel to turn them into instant digital buttons (1% pressure = 100% depression).\n**Quick Toggle**: Customizable button combination to enable or disable a MOD on the fly mid-game.\n**Quick Action**: Controller shortcut to trigger a quick action (healing, armor, vehicle) without manually navigating the game menus.\n**ADT** (*Adaptive Triggers*): Dynamic mechanical resistance system specific to the PS5 DualSense controller's triggers.\n**Rumble**: The controller's internal vibration motors."}]},{"type":"depliant","titre":"📟 Cronus Zen Hardware-Specific Terms","blocs":[{"type":"liste","contenu":"**Cronus Zen**: Intermediate hardware unit connected between your controller and the console/PC to run custom scripts.\n**OLED screen**: Display located on the front of the Cronus Zen unit, used to navigate the script menus.\n**VM Speed** (*Virtual Machine Speed*): Refresh rate at which the Cronus Zen's virtual machine processor executes the script code (e.g. 10 ms, 8 ms, 2 ms).\n**EEPROM**: Non-volatile flash memory built into the Cronus Zen used to save your settings even when the unit is powered off.\n**Slot**: Cronus Zen memory location that can hold a complete GPC script."}]}]}],"icone":"liste","sommaire":false,"sousTitre":"The terms and abbreviations used in my scripts and on this site, sorted by topic."},{"id":"abonnement","titre":"VIP Subscription","titrePage":"VIP Subscription","icone":"couronne","pageSeule":true,"sousTitre":"Two plans to enjoy my scripts: free access, at no cost, and VIP access, with no commitment.","descriptionPartage":"Free or VIP access: the subscription plans for noozbar's Cronus ZEN scripts.","blocs":[{"type":"formules","cartes":[{"etiquette":"Free access","prix":"0 €","sousPrix":"Free, for everyone","inclus":"All my free scripts, published under the name **noozbar** on [Zen Studio Live](https://zenstudio.collectivemindsstore.com/)\nAll the guides and tips on this site\nHelp from the community in the public Discord channels","exclus":"My VIP scripts\nPriority help in the VIP channels\nEarly access to updates","bouton":"My script library →","lien":"https://gpclib.cmindapi.com/gpc-library?author=363"},{"vedette":true,"etiquette":"VIP access","badge":"All included","prix":"10 €","periode":"/ month","sousPrix":"No commitment, cancel anytime","inclus":"Everything in free access\n**All my VIP scripts**, published under the name **GamerTagFR** on [Zen Studio Live](https://zenstudio.collectivemindsstore.com/)\nPriority help in the VIP Discord channels\nAn exclusive badge and role on the Discord\nEarly access to script updates\nThe satisfaction of supporting my work and GamerTagFR's ❤️","bouton":"Become VIP · €10 / month","lien":"https://mee6.gg/m/804753812048314408"}]},{"type":"texte","style":"h1","contenu":"🚀 Become VIP in 6 steps","horsSommaire":true},{"type":"etapes","etiquette":"Step","contenu":"💳 | Subscribe | With the \"Become VIP\" button above.\n🔗 | Link your Discord account | The VIP role will be assigned to your Discord account.\n🏠 | Join us | If you are not on our [Discord server](https://discord.gg/e2v4NN4fVu) yet.\n📜 | Accept the VIP rules | Go to the **#règles-vip** channel and accept the rules: the VIP channels appear.\n🤖 | Request your code | In **#code-script**, click \"Get my code\" and enter the **ID:** and **CYCLE:** shown on the OLED screen.\n🔓 | Enter the code | {LEFT / RIGHT} to move, {UP / DOWN} to change the digits, then hold {CROSS / A} for 2 to 3 seconds."},{"type":"texte","style":"h1","contenu":"❓ Frequently asked questions","horsSommaire":true},{"type":"texte","style":"h2","contenu":"💎 The subscription"},{"type":"depliant","titre":"🔑 Which scripts are VIP-only?","blocs":[{"type":"texte","style":"p","contenu":"My scripts published under the name **noozbar** on [Zen Studio Live](https://zenstudio.collectivemindsstore.com/) are free. Those published under the name **GamerTagFR** are reserved for VIPs."}]},{"type":"depliant","titre":"💶 Do I have to pay for each script?","blocs":[{"type":"texte","style":"p","contenu":"No. A single VIP subscription gives access to **all** my VIP scripts: the unlock bot works for each of them."}]},{"type":"depliant","titre":"❌ How do I cancel?","blocs":[{"type":"texte","style":"p","contenu":"The subscription has **no commitment**: you can cancel it at any time from the subscription page."}]},{"type":"texte","style":"h2","contenu":"🔒 Unlock codes"},{"type":"depliant","titre":"🔁 The script asks me for a code again?","blocs":[{"type":"texte","style":"p","contenu":"That's normal: the script asks for a new code every **30 power-ups** of the Cronus Zen, and the code changes each time. Request it again from the bot in **#code-script** with the **ID:** and **CYCLE:** shown on the OLED screen."}]},{"type":"depliant","titre":"⛔ My script shows LOCK?","blocs":[{"type":"texte","style":"p","contenu":"A wrong code was entered **3 times**: as a protection, the script is locked. Reinstall it from [Zen Studio Live](https://zenstudio.collectivemindsstore.com/), then request a new code from the bot in **#code-script**."}]},{"type":"depliant","titre":"💾 Are my settings lost when the code is requested again?","blocs":[{"type":"texte","style":"p","contenu":"No, your settings do not change: just enter the new code.\n\n⚠️ However, when the script is replaced on its slot (by an update or by the same version), your settings are reset."}]},{"type":"texte","style":"h2","contenu":"📥 Installation and updates"},{"type":"depliant","titre":"❓ How do I install one of my scripts on the Cronus ZEN?","blocs":[{"type":"carte","couleur":"rouge","langue":"fr","contenu":"🛑 **Turn off automatic page translation on Zen Studio Live.** Otherwise, your browser also translates the site's buttons and you will no longer find them with this guide."},{"type":"texte","style":"p","contenu":"The installation is done entirely online in three clicks:\n\n1️⃣ Go to the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) website\n\n2️⃣ In the **Scripts Library**, search for either **noozbar** (free scripts) or **GamerTagFR** (VIP scripts), or directly for the script name.\n\n3️⃣ Once you have chosen a script, click its {Send to Slot} button, choose the slot you want to put it on, then click the {Program} button."}]},{"type":"depliant","titre":"♻️ How do updates work?","blocs":[{"type":"texte","style":"p","contenu":"Updates are **100% free**: for my VIP scripts, your VIP subscription just needs to be active.\n\nWhen a new version is released, an announcement is posted on Discord. Simply go back to the *Scripts Library* on [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) and send the new version to your slot in place of the old one.\n\n⚠️ **Warning:** replacing the script on its slot (with an update or with the same version) resets your settings. Remember to write them down before updating."}]}]},{"id":"a-propos","titre":"About noozbar","blocs":[{"type":"texte","style":"titre","contenu":"From player to modder"},{"type":"texte","style":"p","contenu":"I fell into video games at the end of the 90s with the very first GTA. Of course, I started my first games on Mario Kart or Sonic on the MegaDrive.\nAfter being a regular player for a long time, I turned to console hacking on PS2: installing chips, launching games stored on an HDD connected through the network adapter...\n\nAround 2007, with friends, I collaborated on creating a mod for *GTA San Andreas* on PS2: the mod **\"GTA SA - PTMG Edition\"**. It included a mod menu that let us spawn anything, launch any mission, fly, teleport, add fuel management, replace all the fast-food restaurants with McDonald's and all the cans with Coca-Cola, throw fireballs... in short, a huge number of things!"},{"type":"texte","style":"titre","contenu":"Pushing the limits of GPC"},{"type":"texte","style":"p","contenu":"After a break in the 2010s when I just played, the release of *The Division 1* in 2016 changed everything. Faced with sometimes toxic PVP, I wanted to understand how some players managed to be so precise with their weapons — a game with particularly hard-to-master recoil. So I bought a **Cronus MAX+**.\n\nLoving to understand how things work, I analyzed the scripts available at the time and read the documentation on the GPC language. I then started writing and developing my own scripts. At that time, no script had multiple profiles, anti-recoils only applied a simple downward pull, and the MODs were really basic.\n\nSo I developed advanced, specialized scripts designed to be **ergonomic and completely transparent** in-game: the idea was to directly use the same buttons as the game to control the MODs, making use ultra-simple and intuitive.\n\nAmong the innovations introduced at the time:"},{"type":"liste","contenu":"**Automatic profile switching:** Your weapon profiles switch automatically as you change weapons in-game.\n**Anti-recoil that progresses over time:** A dynamic anti-recoil value that adapts the longer you hold the fire trigger.\n**Preconfigured weapons:** A selection of weapons built in directly, with their anti-recoil settings already configured.\n**MOD management per profile:** The ability to enable a MOD on a specific profile while leaving it disabled on another.\n**Unique MOD values per profile:** Each profile has its own settings (for example, a fire rate for *RapidFire* or a completely different anti-recoil value from one weapon to another).\nAnd much more..."},{"type":"texte","style":"p","contenu":"What has become the norm today was not at all so in 2016 / 2017. Charlie (**MaxADMIN**) then brought me into his GamePacks development team so that I could share my ideas and my creative side."},{"type":"texte","style":"titre","contenu":"The move to the ZEN"},{"type":"texte","style":"p","contenu":"I then had the chance to be one of the beta testers of the new generation of Cronus: the **Cronus ZEN**. I took part in developing the first scripts with OLED menus.\n\nIt was during this period that I met a passionate young player who was using my \"menu template\" to create a script for his favorite FPS. He asked me for advice and tips so he could create his own script, and I passed on everything I knew. You know him today as **TaylorDrift21**, one of the best script developers I know, along with **Chaton**."},{"type":"texte","style":"titre","contenu":"Always aiming higher"},{"type":"texte","style":"p","contenu":"After several years of intensive development, I chose to take my foot off the gas for a while and follow the evolution of the GPC scene from a bit more of a distance.\n\nI used this time away to rework my foundations in depth and start over from scratch. Today, I'm back at full speed to design higher-quality scripts: creations entirely rewritten from a blank page, more powerful, smoother and more unique than ever, with no compromise on precision, ergonomics and originality."}],"icone":"etoile","separateurAvant":true,"rubrique":"The site","sousTitre":"My journey, from passionate gamer to GPC script developer."},{"id":"discord","titre":"Discord","icone":"link","iconePersonnalisee":"💬","lien":"https://discord.gg/e2v4NN4fVu","blocs":[]},{"id":"mentions-legales","titre":"Legal notice","titrePage":"Legal notice","icone":"info","pageSeule":true,"sousTitre":"Legal information about the noozbar.com website.","blocs":[{"type":"texte","style":"titre","contenu":"✍️ Site publisher"},{"type":"texte","style":"p","contenu":"The **noozbar.com** website is published by **noozbar**, a GPC script developer.\n\nContact: on the [Discord server](https://discord.gg/e2v4NN4fVu), or by email: **noozbar@gmail.com**."},{"type":"texte","style":"titre","contenu":"🖥️ Hosting"},{"type":"texte","style":"p","contenu":"The website is hosted by **Cloudflare, Inc.** *(Cloudflare Pages service)*, 101 Townsend Street, San Francisco, CA 94107, United States — [www.cloudflare.com](https://www.cloudflare.com)."},{"type":"texte","style":"titre","contenu":"™️ Trademarks"},{"type":"texte","style":"p","contenu":"noozbar Scripts is an independent project, not affiliated with any video game publisher or studio, nor with Collective Minds. Grand Theft Auto, GTA, Red Dead Redemption and RDR are trademarks of Take-Two Interactive Software, Inc. PlayStation, PS4, PS5 and DualSense are trademarks of Sony Interactive Entertainment Inc. Xbox is a trademark of Microsoft Corporation. Nintendo Switch is a trademark of Nintendo. Steam is a trademark of Valve Corporation. Cronus ZEN is a trademark of Collective Minds Gaming Co. Ltd. All other trademarks mentioned belong to their respective owners and are used for identification purposes only. Using scripts may violate the terms of service of some games: each player remains responsible for how they use them."},{"type":"texte","style":"titre","contenu":"🎮 Use of the scripts"},{"type":"texte","style":"p","contenu":"The scripts presented on this website only work with a Cronus ZEN: they automate controller inputs *(button presses, stick movements)* and do not modify game files, code or memory. Their use may nevertheless violate the terms of service of some games or online services, and lead to penalties on your game account. Each player remains solely responsible for how they use them."},{"type":"texte","style":"titre","contenu":"🔒 Personal data"},{"type":"texte","style":"p","contenu":"This website has no user accounts and uses neither advertising cookies nor audience measurement tools. Your language choice is simply stored in your browser.\n\nTo display the number of members of the Discord server, your browser contacts Discord directly. Embedded videos are provided by YouTube, in privacy-enhanced mode. The host Cloudflare may record technical connection data *(such as the IP address)* to ensure the operation and security of the website."},{"type":"texte","style":"titre","contenu":"©️ Intellectual property"},{"type":"texte","style":"p","contenu":"The texts on this website, the scripts and the noozbar logo are the property of their author. Any reproduction or distribution without permission is prohibited."}]}],"cartesExtra":[{"nom":"CRONUS ZEN","description":"Connections, PS5 / Xbox / PC setup, Bypass, firmware update and troubleshooting.","icone":"ordinateur","couleurHex":"#3ad1ff","lien":"/guide-cronus-zen/","bouton":"Open the guide →"},{"nom":"MODs LIBRARY","description":"The description and tuning tips for every MOD, menu by menu.","icone":"dossier","couleurHex":"#a46bff","lien":"/profile-mods/","bouton":"Open the library →"},{"nom":"KNOWLEDGE BASE","description":"What a MOD can (and cannot) do, how scripts work, which script is the best, compatibility and required hardware.","icone":"ampoule","couleurHex":"#ffb547","lien":"/idees-recues/","bouton":"Open the knowledge base →"},{"nom":"VIP SUBSCRIPTION","description":"Free or VIP access: compare the two plans, then learn how to install, unlock and update my scripts.","icone":"couronne","couleurHex":"#6d28d9","couleurIconeHex":"#ffd34d","lien":"/abonnement/","bouton":"See the plans →"}],"menu":[{"titre":"Cronus ZEN","ouvertAccueil":true,"items":["guide-cronus-zen","bypass-ps5","connexion-xbox-pc","manette-tierce","mise-a-jour-zen","depannage-faq"]},{"titre":"My scripts","ouvertAccueil":true,"items":[{"script":"gta6"},{"script":"fps-tps"},{"script":"rdr2"},{"script":"gta5"},"vibrations-adt","navigation-oled"]},{"titre":"MODs Library","items":["profile-mods","global-mods","mods-activator","controller","misc","quick-toggle",{"sousTitre":"Script-specific"},"gta6-activity","fps-tps-switch-profile","rdr2-activity","gta5-online-cheat","gta5-story-cheat","gta5-quick-cheat"]},{"titre":"Knowledge base","items":["idees-recues","fonctionnement-scripts","meilleur-script","compatibilite","lexique"]}],"redirections":{"cronus-zen":"guid titre","contenu":"⚡ Quick Action (GTA 5 / GTA Online)"},{"type":"texte","style":"p","contenu":"Assignment of quick button combinations on your controller (same principle as *Quick Toggles*) to trigger your favorite GTA 5 actions on the fly mid-game."},{"type":"etiquettes","contenu":"⚡ Quick Action","mods":["quick-cheat"]},{"type":"texte","style":"titre","contenu":"📝 Patch Note"},{"type":"depliant","titre":"📝 Version History","blocs":[{"type":"texte","style":"p","contenu":"Version 1.00 - Public Release"}]}]},{"id":"vibrations-adt","titre":"Vibrations & ADT","icone":"attention","couleurOnglet":"#ffb547","section":true,"blocs":[],"rubrique":"Script guide"},{"id":"navigation-oled","titre":"OLED Navigation & Menus","icone":"menu","section":true,"blocs":[]},{"id":"gestion-conduite","titre":"Driving & Vehicles","icone":"carte","section":true,"blocs":[],"descriptionPartage":"How the script detects that you are in a vehicle to adapt the MODs, and how to resynchronize it if it gets out of sync."},{"id":"profile-mods","titre":"Profile MODs","icone":"cible","section":true,"blocs":[]},{"id":"global-mods","titre":"Global MODs","icone":"globe","section":true,"blocs":[]},{"id":"mods-activator","titre":"MODs Activator","icone":"eclair","section":true,"blocs":[]},{"id":"controller","titre":"Controller","icone":"manette","section":true,"blocs":[]},{"id":"misc","titre":"Misc","icone":"engrenage","section":true,"blocs":[]},{"id":"quick-toggle","titre":"Quick Toggle","icone":"chrono","section":true,"blocs":[]},{"id":"online-cheat","titre":"Online Action","icone":"globe","section":true,"blocs":[]},{"id":"story-cheat","titre":"Story Action","icone":"livre","section":true,"blocs":[]},{"id":"quick-cheat","titre":"Quick Action","icone":"fusee","section":true,"blocs":[]}]}],"mods":[{"id":"antirecoil","titre":"🎯 AntiRecoil","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is an AntiRecoil and how does it work?"},{"type":"texte","style":"p","contenu":"The AntiRecoil simulates the movement of your thumb on the analog stick by applying an opposing force to compensate for the weapon's recoil:"},{"type":"liste","contenu":"**Y axis (Vertical):** Compensates for the weapon's natural climb (or drop) when you shoot (the recoil).\n**X axis (Horizontal):** Corrects lateral drift to the left or right."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Essential condition — Enabling vibrations:**\n\nVibrations must absolutely be **enabled in the game and console options**. My scripts automatically cut the compensation as soon as the game's vibrations stop. This prevents your crosshair from dropping if you keep the fire button held while your magazine is empty and your character is reloading."},{"type":"carte","couleur":"jaune","contenu":"💡 *If you don't want to feel the physical vibrations in your hands, you can disable them directly from the script's OLED menu, in the option* **Controller**."},{"type":"carte","contenu":"🎯 **Quick access in-game:** Hold {L2 / LT} and press {PS / XBOX} to directly open or close the active profile's AntiRecoil values, without going back through the main menu. *(The AntiRecoil MOD must be enabled on that profile.)*"},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Offset Humanizer"},{"type":"texte","style":"p","contenu":"Perfectly regular compensation draws mechanical, identical trajectories that are easy to spot.\n\nAll my AntiRecoils are equipped with an **Offset Humanizer**. It adds slight random variations to the simulated physical movements. This helps you stay undetected by anti-cheat systems."},{"type":"texte","style":"h3","contenu":"⚙️ The trigger system: MODs Activator"},{"type":"texte","style":"p","contenu":"AntiRecoils rely on the [**MODs Activator**](page:mods-activator) system. These are the conditions required to trigger your MOD. You choose exactly *how* and *when* your MOD should activate."},{"type":"texte","style":"h2","contenu":"🎯 Which AntiRecoil type to choose?"},{"type":"texte","style":"p","contenu":"The **Progressive** and **Advanced** modes are by far the most powerful and precise.\n\nThe choice of mode mainly depends on the game and the weapon used, but also on how much you want to dive into the settings:"},{"type":"liste","contenu":"If you want a quick, hassle-free setup, go for the simpler modes (**Standard** or **Rumble**).\nIf you are looking for perfection and enjoy taking the time to understand and fine-tune your settings, the **Progressive** and **Advanced** modes will give you incomparable results."},{"type":"texte","style":"h1","contenu":"🛠️ The different AntiRecoil types available"},{"type":"texte","style":"h2","contenu":"🔹 Standard"},{"type":"texte","style":"p","contenu":"A very simple AntiRecoil that just applies a fixed, constant value on each axis:"},{"type":"liste","contenu":"**Vertical:** A fixed value to compensate for the weapon's climb.\n**Horizontal:** A fixed value to correct the lateral offset."},{"type":"texte","style":"h2","contenu":"📈 Progressive"},{"type":"texte","style":"p","contenu":"A dynamic vertical AntiRecoil coupled with a **Standard** horizontal AntiRecoil. It is ideal for weapons whose recoil changes in intensity over the burst.\n\nVertical parameters (3 values):"},{"type":"liste","contenu":"**Vertical Start:** Starting value applied from the very beginning of the shot.\n**Vertical End:** Final value to reach.\n**Vertical Time:** Duration (in milliseconds) to go from *Start* to *End* (e.g. 1000 = 1 second).\n**Horizontal:** Fixed value for the lateral offset."},{"type":"texte","style":"h3","contenu":"📝 Usage examples:"},{"type":"liste","contenu":"**Strong initial kick:** If your weapon has a big initial kick and then settles, set for example *Start = 38*, *End = 24*, and *Time = 2000* (2 seconds). The compensation will start at 38 then gradually drop to 24 over 2 seconds.\n**Intensifying recoil:** If the weapon gets harder and harder to control as you keep shooting, set for example *Start = 20*, *End = 42*, and *Time = 4000* (4 seconds). The value will gradually rise from 20 to 42."},{"type":"texte","style":"h2","contenu":"📳 Rumble (Low / Med / High)"},{"type":"texte","style":"p","contenu":"A vibration-based vertical AntiRecoil coupled with a **Standard** horizontal AntiRecoil.\n\nThe script retrieves the vibration data sent by the game and applies a coefficient to it (higher or lower depending on the chosen mode) to calculate the force to apply on the analog stick.\n\nAdjustable parameters:"},{"type":"liste","contenu":"**Rumble Power:** Adjusts the overall strength of the vertical AntiRecoil.\n**Rumble Horizontal:** Adjusts the fixed lateral correction (works like Standard mode)."},{"type":"carte","couleur":"jaune","contenu":"💡 *Tip: The* **Rumble Low** *mode applies a light coefficient. If the vertical compensation lacks strength, first try switching to* **Rumble Med** *or* **Rumble High** *before increasing the Rumble Power value.*"},{"type":"texte","style":"h2","contenu":"⚡ Advanced (Step-based system)"},{"type":"texte","style":"p","contenu":"The most advanced mode, offering surgical precision thanks to a split into **500 ms** slices (0.5 second)."},{"type":"liste","contenu":"Up to **10 Steps** for the Vertical axis and **10 Steps** for the Horizontal axis (i.e. up to 5 seconds of continuous fire).\n**Totally independent** settings for the Vertical and Horizontal axes (e.g. 4 Steps on Y and 6 Steps on X).\n**Smooth interpolation:** The script does not jump violently from one value to another; it calculates a continuous progression between each step (rising or falling, with positive or negative values)."},{"type":"texte","style":"h3","contenu":"📝 Example of how it works (Vertical on 4 Steps / 2000 ms):"},{"type":"texte","style":"p","contenu":"**Configuration:** *Step 1 = 20 | Step 2 = 25 | Step 3 = 30 | Step 4 = 35*"},{"type":"liste","contenu":"**From 0 to 500 ms:** The **Step 1 (20)** value is applied directly from the start of the shot.\n**From 500 to 1000 ms:** The value gradually rises from **20 (Step 1)** until it reaches **25 (Step 2)**.\n**From 1000 to 1500 ms:** The value gradually rises from **25 (Step 2)** until it reaches **30 (Step 3)**.\n**From 1500 to 2000 ms:** The value gradually rises from **30 (Step 3)** until it reaches **35 (Step 4)**, then stays at 35 as long as you hold the trigger."}],"fiche":{"colonnes":[{"titre":"Understanding the AntiRecoil","liens":[{"titre":"❓ What is an AntiRecoil?","de":0,"a":5},{"titre":"🛡️ Security & Offset Humanizer","de":6,"a":7},{"titre":"⚙️ Trigger system","de":8,"a":9},{"titre":"🎯 Which AntiRecoil type to choose?","de":10,"a":12,"scripts":["gta6","fps-tps"]}]},{"titre":"Setting up the AntiRecoil","liens":[{"titre":"🔹 Standard","de":14,"a":16},{"titre":"📈 Progressive","de":17,"a":21,"scripts":["gta6","fps-tps"]},{"titre":"📳 Rumble","de":22,"a":25,"scripts":["gta6","fps-tps"]},{"titre":"⚡ Advanced","de":26,"a":31,"scripts":["gta6","fps-tps"]}]}]}},{"id":"fire-mods","titre":"🔫 Fire MODs","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a Fire MOD?"},{"type":"texte","style":"p","contenu":"A **Fire MOD** is a firing mode that interacts directly with your fire button when you pull the trigger:"},{"type":"liste","contenu":"**Semi-automatic weapon (pistol, single-shot rifle...):** *RapidFire* simulates ultra-fast presses to turn it into an automatic (full-auto) weapon.\n**Automatic weapon (assault rifle, submachine gun...):** *BurstFire* converts continuous fire into controlled bursts to keep recoil under control."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Cycle Humanizer"},{"type":"texte","style":"p","contenu":"Overly regular fire rates are the main cause of detection by anti-cheats. To protect you:"},{"type":"liste","contenu":"**Limit of 360 RPM / 6 RPS:** The maximum rate is capped at **360 rounds per minute (RPM)** or **6 rounds per second (RPS)** in the script. Spamming the fire button at a higher frequency is almost humanly impossible. This threshold keeps your shots credible and lets you **fly under the anti-cheats' radar**.\n**Cycle Humanizer:** This system constantly varies the hold and release durations of the button (*Hold/Release*), while strictly respecting the configured overall rate. Your shots keep a smooth, natural rhythm, removing the frozen or automated feel of classic macros."},{"type":"texte","style":"p","contenu":"**⚙️ The trigger system:** [**MODs Activator**](page:mods-activator)\n\nFire MODs rely on the [**MODs Activator**](page:mods-activator) system. These are the conditions required to trigger your MOD. You choose exactly *how* and *when* your MOD should activate"},{"type":"texte","style":"h2","contenu":"🎯 Which Fire MOD to choose?"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Important rule:** You can only enable **one Fire MOD per profile**."},{"type":"liste","contenu":"**On a semi-automatic weapon:** Use one of the **RapidFire** modes to fire continuously.\n**On an automatic weapon:** **Never** use RapidFire (it would slow down your natural fire rate). Use the **BurstFire** mode instead."},{"type":"texte","style":"h1","contenu":"🛠️ The different Fire MOD types available"},{"type":"texte","style":"h2","contenu":"⚡ RapidFire Dynamic"},{"type":"texte","style":"p","contenu":"A smart mode that adapts the fire rate to the pressure applied on the trigger:"},{"type":"liste","contenu":"The harder you press the fire trigger, the higher the rate.\nUseful for adjusting the firing speed on the fly without opening the menu."},{"type":"texte","style":"h2","contenu":"⏱️ RPM RapidFire"},{"type":"texte","style":"p","contenu":"Mode based on the number of **Rounds Per Minute (RPM / BPM)**."},{"type":"liste","contenu":"If the game displays the weapon's stats in RPM or BPM, choose this mode.\nJust enter the game's exact value in the **Rate of Fire** parameter."},{"type":"texte","style":"h2","contenu":"🎯 RPS RapidFire (or RapidFire)"},{"type":"texte","style":"p","contenu":"Mode based on the number of **Rounds Per Second (RPS / BPS)**."},{"type":"liste","contenu":"This is the most common format in Cronus scripts.\nIf the game displays the weapon's stats in RPS or BPS, choose this mode and set the **Rate of Fire** value to the desired number of shots per second."},{"type":"texte","style":"h2","contenu":"💥 BurstFire (Burst shooting)"},{"type":"texte","style":"p","contenu":"This mode is reserved for **automatic weapons** to force fire in small bursts and keep maximum accuracy at long range.\n\nParameters to adjust:"},{"type":"liste","contenu":"**Hold Time:** How long the script holds the fire button down (burst duration).\n**Release Time:** Duration of the forced pause between two bursts."}],"fiche":{"colonnes":[{"titre":"Understanding Fire MODs","liens":[{"titre":"❓ What is a Fire MOD?","de":0,"a":2},{"titre":"🛡️ Security & Cycle Humanizer","de":3,"a":5},{"titre":"⚙️ Trigger system","de":6,"a":6},{"titre":"🎯 Which Fire MOD to choose?","de":7,"a":9}]},{"titre":"Setting up Fire MODs","liens":[{"titre":"⚡ RapidFire Dynamic","de":11,"a":13},{"titre":"⏱️ RPM RapidFire","de":14,"a":16,"scripts":["gta6","fps-tps"]},{"titre":"🎯 RPS RapidFire","de":17,"a":19,"scripts":["gta6","fps-tps"]},{"titre":"🎯 RapidFire","de":17,"a":19,"scripts":["rdr2","gta5"],"seulScript":true},{"titre":"💥 BurstFire","de":20,"a":22}]}]}},{"id":"aim-assist","titre":"🎯 AIM Assist","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the AIM Assist?"},{"type":"texte","style":"p","contenu":"The **AIM Assist** is an aim assistance MOD. It continuously applies tiny, imperceptible movements to your aiming stick (right stick), following a geometric shape (circle, spiral, diamond…), so that the game's native aim assist stays active 100% of the time.\n\nThe result: your crosshair stays inside the enemy's aim assist bubble more easily, without ever aiming for you."},{"type":"texte","style":"h2","contenu":"⚠️ Demystifying AIM Assist"},{"type":"texte","style":"p","contenu":"It is essential to dispel the misconceptions: **AIM Assist is in no way a PC Aimbot.**"},{"type":"liste","contenu":"It will **not** automatically stick to the target.\nIt will **not** follow the enemy on its own without any action on your part."},{"type":"texte","style":"p","contenu":"As its name suggests, it is an **assist** that exploits and amplifies the native aim assist already built into the game by the developers. The MOD's effectiveness therefore depends directly on how generous the aim assist is in the title you are playing."},{"type":"texte","style":"h2","contenu":"🧠 How does a game's native aim assist work?"},{"type":"texte","style":"p","contenu":"Imagine a **virtual bubble** surrounding each enemy. When the center of your screen passes over this bubble, the game activates its internal aim assist under two very specific conditions:"},{"type":"liste","contenu":"**Character movement (Left Stick):** The game detects a movement of your character greater than the dead zone (*DeadZone*). This is the principle exploited by **LS Assist**.\n**Camera / aim movement (Right Stick):** The game detects a movement of your camera or crosshair greater than the dead zone. This is the principle exploited by **AIM Assist**."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Golden rule:** If both of your analog sticks are perfectly still, the game's aim assist **does not activate**, even if an enemy crosses the center of your screen."},{"type":"texte","style":"p","contenu":"The **AIM Assist** and **LS Assist** MODs continuously simulate imperceptible micro-movements on your sticks to force the game to keep its aim assist active 100% of the time, letting you stay inside the enemy's bubble more easily."},{"type":"texte","style":"p","contenu":"**AIM Assist** applies geometric micro-trajectories around the aiming stick."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Offset Humanizer"},{"type":"texte","style":"p","contenu":"Perfectly identical geometric trajectories, repeated in a loop, would form a mechanical signature that is easy to spot.\n\nTo protect your account, this MOD is equipped with an **Offset Humanizer**. It adds slight random variations to the simulated micro-movements: the drawn shapes keep a subtle human imperfection, impossible to tell apart from manual control."},{"type":"texte","style":"h2","contenu":"📐 The geometric shapes (*Shapes*)"},{"type":"texte","style":"p","contenu":"Every player and every game reacts differently to trajectories. You can choose from 13 available geometric shapes (listed here in the exact order of the OLED menu):"},{"type":"liste","contenu":"**Horiz. Flaire:** Moves back and forth horizontally along a line (left / right)\n**Circular:** Draws a regular, smooth circle\n**Fig. 8:** Forms an upright 8, with two loops one above the other\n**Flat Infinity:** Draws a flattened infinity symbol (∞), wider than tall\n**Round Infinity:** Draws a balanced infinity symbol (∞), almost as tall as wide\n**Diamond** *(formerly called Sticky)* **:** Follows a square or diamond path (→ ↓ ← ↑)\n**Tall Oval:** Forms a vertical oval (taller than wide)\n**Wide Oval:** Forms a horizontal oval (wider than tall)\n**Spiral:** Draws a spiral circle whose radius increases then decreases\n**Helix:** Spins a small square/diamond around the center\n**Helix 2:** Same as Helix, but with a slower progression between directions\n**Flower:** Draws a multi-petal rosette\n**Vert. Flaire:** Moves back and forth vertically along a line (forward / backward)","numerote":true},{"type":"texte","style":"h2","contenu":"⚙️ The adjustment parameters (*Radius & Step*)"},{"type":"texte","style":"p","contenu":"Each configuration relies on two key variables:"},{"type":"liste","contenu":"**Radius (Rad) — The Radius:** Defines the amplitude or size of the drawn shape.\n> *(⚠️ The Radius value must absolutely be greater than the DeadZone configured in-game to be taken into account).*\n**Step (Rate / Speed):** Defines the speed of the movement, regardless of the VM speed. For a rough idea, divide the Step by 3: you get approximately the number of **cycles per second** (one cycle = one turn for *Circular*, one back-and-forth for *Horiz. Flaire*…).\n- *Step of 15:* about **5 cycles per second**.\n- *Step of 20:* about **7 cycles per second**."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Special cases:**\n\n**Helix 2** is 4× slower: the small circle makes one full turn on each corner before moving to the next.\n\n**Spiral:** the Step sets the rotation speed, while the expansion and contraction depend on the **Radius**. With a low Step or a small Radius, the shape looks more like a circle that inflates and deflates. To get a real spiral, increase the Step or the Radius: it is the Step / Radius ratio that determines the result."},{"type":"texte","style":"h2","contenu":"🎛️ Tuning profiles by situation"},{"type":"texte","style":"p","contenu":"You can adjust the **Radius** and the **Step** independently for 4 combat scenarios:"},{"type":"liste","contenu":"**ADS Only:** Applies when you aim without shooting.\n**FIRE Only:** Applies when you hip-fire without aiming.\n**ADS + FIRE:** Applies when you aim and shoot at the same time.\n**NEUTRAL:** Applies when you are neither aiming nor shooting (keeps the aim assist permanently active while you move)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Targeted deactivation:** If you don't want assist in a given situation (for example hip-fire), simply set the **Radius** and the **Step** of that mode to **0**."},{"type":"texte","style":"h2","contenu":"🛠️ Dynamic behavior & Troubleshooting"},{"type":"liste","contenu":"**Dynamic centering:** The geometric shape is drawn in real time around your stick's current position. If you push your right stick 30% to the right to follow a target, the circle or oval will be drawn around that 30% point.\n**Reduction at the limit:** The closer you bring the stick to the physical edge of the controller (at the limit), the more the MOD's amplitude automatically shrinks so as not to alter your maximum turning speed.\n**Screen shaking?** If your camera shakes too much on screen, your **Radius** is too high. Gradually reduce the Radius value until you get a smooth sweep that is invisible to the naked eye."},{"type":"cartelien","affichage":"pleine","titre":"🎥 Video demo: AIM Assist & LS Assist in action","destination":"https://www.youtube.com/watch?v=xVhBBF5Q1VU","contenu":"Open the dedicated page →","icone":"link"}],"fiche":{"colonnes":[{"titre":"Understanding the AIM Assist","liens":[{"titre":"❓ What is the AIM Assist?","de":0,"a":1},{"titre":"⚠️ Demystifying AIM Assist","de":2,"a":5},{"titre":"🧠 Native aim assist","de":6,"a":11},{"titre":"🛡️ Security & Offset Humanizer","de":12,"a":13},{"titre":"🛠️ Behavior & Troubleshooting","de":25,"a":26},{"titre":"🎥 Video demonstration","de":27,"a":27}]},{"titre":"Setting up the AIM Assist","liens":[{"titre":"📐 Shapes","de":14,"a":16},{"titre":"🎚️ Radius & Step","de":17,"a":24}]}]}},{"id":"ls-assist","titre":"🏃 LS Assist","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the LS Assist?"},{"type":"texte","style":"p","contenu":"The **LS Assist** is an aim assistance MOD. It continuously applies tiny, imperceptible movements to your movement stick (left stick), following a geometric shape (Horiz. Flaire, Circular, Fig. 8…), so that the game detects your character as constantly moving and keeps its native aim assist active 100% of the time.\n\nThe result: your crosshair stays inside the enemy's aim assist bubble more easily, without ever aiming for you."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Offset Humanizer"},{"type":"texte","style":"p","contenu":"Perfectly identical micro-movements on the movement stick would form a mechanical signature that is easy to spot.\n\nTo protect your account, this MOD is equipped with an **Offset Humanizer**. It adds slight random variations to the simulated left-stick micro-movements, for a natural feel that is impossible to tell apart from manual control."},{"type":"texte","style":"h2","contenu":"📐 Shapes available for LS Assist"},{"type":"texte","style":"p","contenu":"LS Assist offers a restricted selection of 5 shapes optimized for movement:"},{"type":"liste","contenu":"**Horiz. Flaire** *(The most popular and probably the most effective in duels)*\n**Circular**\n**Fig. 8**\n**Flat Infinity**\n**Round Infinity**","numerote":true},{"type":"texte","style":"h2","contenu":"⚙️ The adjustment parameters (*Radius & Step*)"},{"type":"texte","style":"p","contenu":"Each configuration relies on two key variables:"},{"type":"liste","contenu":"**Radius (Rad) — The Radius:** Defines the amplitude or size of the drawn shape.\n> *(⚠️ The Radius value must absolutely be greater than the DeadZone configured in-game to be taken into account).*\n**Step (Rate / Speed):** Defines the speed of the movement, regardless of the VM speed. For a rough idea, divide the Step by 3: you get approximately the number of **cycles per second** (one cycle = one turn for *Circular*, one back-and-forth for *Horiz. Flaire*…).\n- *Step of 15:* about **5 cycles per second**.\n- *Step of 20:* about **7 cycles per second**."},{"type":"texte","style":"h2","contenu":"🎛️ Tuning profiles by situation"},{"type":"texte","style":"p","contenu":"You can adjust the **Radius** and the **Step** independently for 4 combat scenarios:"},{"type":"liste","contenu":"**ADS Only:** Applies when you aim without shooting.\n**FIRE Only:** Applies when you hip-fire without aiming.\n**ADS + FIRE:** Applies when you aim and shoot at the same time.\n**NEUTRAL:** Applies when you are neither aiming nor shooting."},{"type":"carte","couleur":"jaune","contenu":"💡 **Targeted deactivation:** If you don't want assist in a given situation (for example hip-fire), simply set the **Radius** and the **Step** of that mode to **0**."},{"type":"texte","style":"h2","contenu":"🛑 LS Assist automatic cut-off"},{"type":"texte","style":"p","contenu":"Unlike the right stick, when you actually move your left stick to make your character walk or run, **LS Assist stops automatically** as soon as your movement value exceeds the configured *Radius*. It resumes instantly as soon as the stick returns to the center."},{"type":"cartelien","affichage":"pleine","titre":"🎥 Video demo: AIM Assist & LS Assist in action","destination":"https://www.youtube.com/watch?v=xVhBBF5Q1VU","contenu":"Open the dedicated page →","icone":"link"}],"fiche":{"colonnes":[{"titre":"Understanding the LS Assist","liens":[{"titre":"❓ What is the LS Assist?","de":0,"a":1},{"titre":"🛡️ Security & Offset Humanizer","de":2,"a":3},{"titre":"🛑 Automatic cut-off","de":14,"a":15},{"titre":"🎥 Video demonstration","de":16,"a":16}]},{"titre":"Setting up the LS Assist","liens":[{"titre":"📐 Shapes","de":4,"a":6},{"titre":"🎚️ Radius & Step","de":7,"a":13}]}]}},{"id":"aim-abuse","titre":"🎯 AIM Abuse","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is AIM Abuse and how does it work?"},{"type":"texte","style":"p","contenu":"**AIM Abuse** is a MOD designed to take advantage of the **Auto-Snap** mechanic (automatic aim lock) found in some games.\n\nIn these games, pressing the aim button when you are close to an enemy instantly \"sticks\" the crosshair to the target. The AIM Abuse MOD automates this action: it releases and re-presses the aim trigger at a very fast frequency. This continuous refresh re-triggers Auto-Snap in a loop, forcing your crosshair to stay locked on the opponent, even if they are moving."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Game compatibility:**\n\nAuto-Snap is increasingly rare in modern competitive FPS games, but it remains extremely powerful in games like *GTA 5*, *Red Dead Redemption II*, or certain shooters with a strengthened aim assist."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Timing Humanizer"},{"type":"texte","style":"p","contenu":"Aim spamming executed at strictly identical intervals (down to the millisecond) is an easily spotted mechanical signature.\n\nTo protect your account, this MOD is equipped with a **Timing Humanizer**. It generates random micro-variations in the hold and release durations. The sequence thus keeps a lively, natural rhythm, while still maintaining an ultra-efficient Auto-Snap refresh.\n\n**⚙️ The trigger system:** [**MODs Activator**](page:mods-activator)\n\nAIM Abuse relies on the [**MODs Activator**](page:mods-activator) system. These are the conditions required to trigger your MOD. You choose exactly *how* and *when* your MOD should activate"},{"type":"texte","style":"h2","contenu":"🛠️ The MOD settings"},{"type":"texte","style":"p","contenu":"To get a smooth lock without the image jumping on screen, the MOD relies on two parameters to adjust:"},{"type":"liste","contenu":"**Hold Time:** Defines how long the aim button stays held down.\n**Release Time:** Defines how long the aim is briefly released before being re-engaged."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tuning tip:**\n\nThe trick is to set the **Release Time** as finely as possible:"},{"type":"liste","contenu":"It must be **short enough** so that your weapon does not visually leave aim mode (no annoying zoom in/out).\nIt must be **long enough** for the game to register the release and re-trigger Auto-Snap on the next press.\n> *The Hold Time can stay longer without affecting effectiveness.*"}],"fiche":{"colonnes":[{"titre":"Understanding the AIM Abuse","liens":[{"titre":"❓ What is the AIM Abuse?","de":0,"a":2},{"titre":"🛡️ Safety & Timing Humanizer","de":3,"a":4}]},{"titre":"Setting up the AIM Abuse","liens":[{"titre":"🎚️ Hold Time & Release Time","de":5,"a":9}]}]}},{"id":"shot-mods","titre":"🤸 Shot MODs","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a Shot MOD?"},{"type":"texte","style":"p","contenu":"A **Shot MOD** is an automatic action MOD that triggers a tactical movement (crouching, jumping or sidestepping) when you aim or shoot. Its main purpose is to disrupt the opponent's aim during your duels (*gunfights*) by making you much harder to hit, while keeping you focused on your shot.\n\nEach profile has its own independently configurable Shot MOD."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Timing Humanizer"},{"type":"texte","style":"p","contenu":"Repetitive movements executed down to the millisecond immediately betray automated behavior.\n\n**Strafe Shot** includes a **Timing Humanizer**. It applies slight random variations to the duration of the sidesteps. Your movements thus keep a lively, natural rhythm, avoiding a robotic look so as to fly under the radar of anti-cheat systems.\n\n**⚙️ The trigger system:** [**MODs Activator**](page:mods-activator)\n\nShot MODs rely on the [**MODs Activator**](page:mods-activator) system. These are the conditions required to trigger your MOD. You choose exactly *how* and *when* your MOD should activate"},{"type":"texte","style":"h1","contenu":"🛠️ The different Shot MODs available"},{"type":"texte","style":"h2","contenu":"⬇️ Drop Shot"},{"type":"texte","style":"p","contenu":"Automatically makes your character crouch when the MOD activates."},{"type":"liste","contenu":"Suddenly reduces your hit area (*hitbox*), forcing the opponent to shoot above you."},{"type":"texte","style":"h2","contenu":"⬆️ Jump Shot"},{"type":"texte","style":"p","contenu":"Automatically makes your character jump as soon as the shot is engaged."},{"type":"liste","contenu":"Particularly formidable in close combat to destabilize the enemy's aim and avoid shots to the head (*headshots*)."},{"type":"texte","style":"h2","contenu":"↔️ Strafe Shot"},{"type":"texte","style":"p","contenu":"Makes your character take alternating steps from left to right while shooting to make you elusive.\n\nParameter to adjust:"},{"type":"liste","contenu":"**Strafe Time:** Defines the duration (in milliseconds) of each lateral movement before the direction changes."},{"type":"carte","couleur":"blue","contenu":"🌀 To keep your crosshair locked on the target during the side steps, use the [**Kinetic AIM**](page:profile-mods), which automatically compensates for the aim drift."}],"fiche":{"colonnes":[{"titre":"Understanding Shot MODs","liens":[{"titre":"❓ What is a Shot MOD?","de":0,"a":1},{"titre":"🛡️ Safety & Timing Humanizer","de":2,"a":3}]},{"titre":"Setting up Shot MODs","liens":[{"titre":"⬇️ Drop Shot","de":5,"a":7},{"titre":"⬆️ Jump Shot","de":8,"a":10},{"titre":"↔️ Strafe Shot","de":11,"a":14}]}]}},{"id":"kinetic-aim","titre":"🌀 Kinetic AIM","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Kinetic AIM and how does it work?"},{"type":"texte","style":"p","contenu":"The **Kinetic AIM** is a dynamic aim-compensation MOD. When you move sideways while aiming or shooting, your character's movement naturally pulls your crosshair off the target. The MOD detects this movement and applies a real-time **opposite** micro-correction on the aiming stick (right stick), to keep your crosshair locked on the enemy while you move.\n\nThe compensation is **proportional**: the wider your sideways movement, the stronger the correction. A **light smoothing** prevents jerks: the correction stays soft, with no visible stutter on screen."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Offset Humanizer"},{"type":"texte","style":"p","contenu":"A mathematically perfect correction, identical on every movement, would be easy to spot.\n\nTo protect your account, this MOD is equipped with an **Offset Humanizer**. It adds slight random variations to the simulated movements, so the compensation keeps a subtle human imperfection."},{"type":"texte","style":"h2","contenu":"⚙️ The trigger system"},{"type":"texte","style":"p","contenu":"The Kinetic AIM only activates when these **2 conditions** are met:"},{"type":"liste","contenu":"**You press Aim and/or Fire.**\n**You move sideways**, thanks to:\n- **your own movements:** as soon as you push the left stick left or right;\n- **the Strafe Shot MOD:** when it moves your character sideways.","numerote":true},{"type":"texte","style":"p","contenu":"Without pressing Aim or Fire, or without sideways movement, the MOD does nothing."},{"type":"liste","contenu":"**Dead zone:** sideways movement is only taken into account beyond a small dead zone: the one set in **Stick Drift Correction** (*LS Correction*) if it is enabled, otherwise 5% by default.\n**With the LS Assist:** the two MODs do not overlap. The Kinetic AIM takes over as soon as the LS Assist stops, that is, when you actually move your left stick."},{"type":"texte","style":"h2","contenu":"🛠️ The MOD setting"},{"type":"texte","style":"p","contenu":"There is only **one value** to adjust: the **Kinetic Value**, from **0 to 100**, independent for each profile. The higher the value, the stronger the crosshair correction. At **0**, no compensation is applied."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tuning tip:**\n\nFind the value that keeps your crosshair locked on the target during your sideways movements:"},{"type":"liste","contenu":"**Start low** and increase gradually: a value that is too strong makes you *overshoot* the target in the opposite direction.\n**Test while moving:** stand facing a target at medium distance, strafe while aiming, and look for the value that keeps the crosshair locked on it.\n**Adapt to distance and game:** the farther the opponent, the lower the value should be. Every game and every sensitivity reacts differently.\n**With the Strafe Shot:** set its *Strafe Time* first, then adjust the Kinetic Value."}],"fiche":{"colonnes":[{"titre":"Understanding the Kinetic AIM","liens":[{"titre":"❓ What is the Kinetic AIM?","de":0,"a":1},{"titre":"🛡️ Security & Offset Humanizer","de":2,"a":3},{"titre":"⚙️ Trigger system","de":4,"a":8}]},{"titre":"Setting up the Kinetic AIM","liens":[{"titre":"🎚️ Kinetic Value","de":9,"a":12}]}]}},{"id":"auto-ads","titre":"🎯 Auto ADS","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto ADS?"},{"type":"texte","style":"p","contenu":"This MOD simplifies your actions in combat by removing the need to press the aim trigger when you shoot. It reduces your reaction time by combining aiming and shooting in a single press."},{"type":"texte","style":"h2","contenu":"🎯 Auto ADS *(Automatic aiming)*"},{"type":"texte","style":"p","contenu":"Automatically presses the aim button (**ADS**) as soon as you press the fire button (**FIRE**)."},{"type":"liste","contenu":"**Use:** Ideal if you tend to hip-fire in a panic during an unexpected duel. The script makes sure you immediately go into shouldered aim to gain accuracy without having to press the aim trigger."}],"fiche":{"colonnes":[{"titre":"Understanding Auto ADS","liens":[{"titre":"❓ What is Auto ADS?","de":0,"a":1}]},{"titre":"Setting up Auto ADS","liens":[{"titre":"🎯 Auto ADS","de":2,"a":4}]}]}},{"id":"auto-fire","titre":"💥 Auto FIRE","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto FIRE?"},{"type":"texte","style":"p","contenu":"This MOD simplifies your actions in combat by removing the need to press the fire trigger when you aim. It reduces your reaction time by combining aiming and shooting in a single press."},{"type":"texte","style":"h2","contenu":"💥 Auto FIRE *(Automatic shooting)*"},{"type":"texte","style":"p","contenu":"Automatically presses the fire button (**FIRE**) as soon as you press the aim button (**ADS**)."},{"type":"liste","contenu":"**Use:** Lets you open fire to the millisecond as soon as you shoulder your weapon, eliminating any hesitation time."}],"fiche":{"colonnes":[{"titre":"Understanding Auto FIRE","liens":[{"titre":"❓ What is Auto FIRE?","de":0,"a":1}]},{"titre":"Setting up Auto FIRE","liens":[{"titre":"💥 Auto FIRE","de":2,"a":4}]}]}},{"id":"auto-scope","titre":"🔭 Auto Scope (GTA 6, RDR2, GTA 5)","scripts":["gta6","rdr2","gta5"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto Scope?"},{"type":"texte","style":"p","contenu":"This MOD automatically presses your scope's zoom button when you aim. It is not limited to sniper rifles: it works with all your weapons and low-magnification scopes (x1, x1.5, x2, x4…), from submachine guns to assault rifles."},{"type":"texte","style":"h2","contenu":"🎯 Auto Scope"},{"type":"texte","style":"p","contenu":"Automatically switches your weapon to zoom/scope mode as soon as you press the aim button (**ADS**).\n\nParameter to adjust:"},{"type":"liste","contenu":"**Scope Delay:** Defines the waiting time (in milliseconds) before the zoom triggers automatically after pressing *Aim*."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tuning tip:**\n\nDo not set too short a delay! The game must absolutely have time to start the aiming animation before the script sends the zoom command. If the delay is too fast, the action will be ignored by the game."}],"fiche":{"colonnes":[{"titre":"Understanding Auto Scope","liens":[{"titre":"❓ What is Auto Scope?","de":0,"a":1}]},{"titre":"Setting up Auto Scope","liens":[{"titre":"🎚️ Scope Delay","de":2,"a":5}]}]}},{"id":"quick-scope","titre":"⚡ Quick Scope (FPS/TPS)","scripts":["fps-tps"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Quick Scope?"},{"type":"texte","style":"p","contenu":"This MOD is specially designed for precision rifles (Sniper). It automates fast aiming and shooting techniques, such as the famous *QuickScope* technique, to give you a decisive edge in your duels."},{"type":"texte","style":"h2","contenu":"⚡ Quick Scope"},{"type":"texte","style":"p","contenu":"Triggers an automatic shot a short moment after pressing the aim button (**ADS**), perfectly reproducing the famous *QuickScope* technique.\n\nParameter to adjust:"},{"type":"liste","contenu":"**QuickScope Delay:** Defines the pause time (in milliseconds) between the start of the aim and the moment the shot is fired."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tuning tip:**\n\nFinding the right balance is essential:"},{"type":"liste","contenu":"**Too fast:** The bullet will leave before the game considers you in aiming position, turning your shot into an inaccurate shot from the hip (*hip-fire*).\n**Too slow:** You lose the whole point of the QuickScope and give the opponent time to retaliate."}],"fiche":{"colonnes":[{"titre":"Understanding Quick Scope","liens":[{"titre":"❓ What is Quick Scope?","de":0,"a":1}]},{"titre":"Setting up Quick Scope","liens":[{"titre":"🎚️ QuickScope Delay","de":2,"a":6}]}]}},{"id":"headshot-assist","titre":"💀 HeadShot Assist","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is HeadShot Assist and how does it work?"},{"type":"texte","style":"p","contenu":"**HeadShot Assist** is an aim assist MOD that applies a slight upward vertical impulse when you shoulder your weapon, in order to align your reticle with the opponent's head more quickly."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Important clarification (it is NOT an aimbot):**\n\nThis MOD is in no way a *PC cheat* or an automatic *lock* that spots the enemy's head on screen. It is simply a mechanical assist that pulls your crosshair upward."},{"type":"carte","couleur":"jaune","contenu":"💡 *Note: If your reticle is already positioned at head height when the MOD activates, the impulse will push your crosshair above the head!*"},{"type":"texte","style":"h1","contenu":"⚡ The 3 trigger modes"},{"type":"texte","style":"h2","contenu":"🚀 Instant"},{"type":"texte","style":"p","contenu":"HeadShot Assist triggers immediately as soon as you press the aim button (**ADS**)."},{"type":"texte","style":"h2","contenu":"🎯 Press Sensitive"},{"type":"texte","style":"p","contenu":"HeadShot Assist only activates when you press the aim trigger all the way down (to the limit)."},{"type":"liste","contenu":"**Use:** Lets you aim normally by pressing the trigger lightly, and only triggers the nudge toward the head when you press the trigger to the maximum."},{"type":"texte","style":"h2","contenu":"🔄 Release Sensitive"},{"type":"texte","style":"p","contenu":"Lets you trigger the assist at any time while aiming. You can hold the aim as long as you like without activating anything. When you need HeadShot Assist, **slightly release the trigger** (without letting go completely) then press it all the way down again."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Note:** If you fully release the trigger (to 0%), the gesture is canceled and the assist will not trigger. This avoids unintended triggers when you come out of aim."},{"type":"texte","style":"h2","contenu":"📏 Distance presets & Custom Mode"},{"type":"texte","style":"p","contenu":"The enemy's distance directly affects the amount of movement required: the farther the opponent, the lighter the impulse must be so as not to overshoot the target.\n\nThe MOD offers **3 optimized presets** and a **Custom** mode:"},{"type":"liste","contenu":"🥊 **Close:** Tuned for close-quarters combat (roughly **5 to 15 meters**).\n🎯 **Medium:** Tuned for mid-range engagements (roughly **15 to 30 meters**).\n🔭 **Long:** Tuned for distant targets (**30 meters and beyond**).\n🛠️ **Custom:** Lets you manually set a precise numerical value to adapt the impulse to your playstyle or usual sensitivity."}],"fiche":{"colonnes":[{"titre":"Understanding the HeadShot Assist","liens":[{"titre":"❓ What is the HeadShot Assist?","de":0,"a":3}]},{"titre":"Setting up the HeadShot Assist","liens":[{"titre":"🚀 Instant","de":5,"a":6},{"titre":"🎯 Press Sensitive","de":7,"a":9},{"titre":"🔄 Release Sensitive","de":10,"a":12},{"titre":"📏 Distance & Custom Mode","de":13,"a":15}]}]}},{"id":"deadeye","titre":"👁️ DeadEye","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the DeadEye MOD?"},{"type":"texte","style":"p","contenu":"The **DeadEye MOD** is specially designed to automate and optimize the use of the *DeadEye* mechanic (slow motion / precision aim) found in *Red Dead Redemption II.*\n\nIt automatically triggers the skill at the right moment without needing a manual stick press, so you don't waste time or waste your skill gauge."},{"type":"texte","style":"h1","contenu":"🛠️ The 2 variants available"},{"type":"texte","style":"h2","contenu":"🎯 Auto DeadEye"},{"type":"texte","style":"p","contenu":"Automatically triggers *DeadEye* as soon as you press the aim trigger (**ADS**)."},{"type":"liste","contenu":"**Use:** Ideal if you want to enter slow-motion/precision mode immediately every time you aim."},{"type":"texte","style":"h2","contenu":"⚡ DeadShot"},{"type":"texte","style":"p","contenu":"Triggers *DeadEye* in an ultra-stealthy way, at the precise instant you press the fire trigger (**FIRE**)."},{"type":"carte","couleur":"jaune","contenu":"💡 **What makes DeadShot special (Surgical precision):**\n\nIn *Red Dead Redemption II*, triggering *DeadEye* just before the shot instantly shrinks the spread circle (the impact reticle) to the center point."},{"type":"texte","style":"p","contenu":"By activating the skill only when the trigger is pressed, **DeadShot** forces 100% accuracy at the exact moment of impact, while preserving your *DeadEye* gauge the rest of the time."}],"scripts":["rdr2"],"fiche":{"colonnes":[{"titre":"Understanding the DeadEye","liens":[{"titre":"❓ What is the DeadEye?","de":0,"a":1}]},{"titre":"Setting up the DeadEye","liens":[{"titre":"🎯 Auto DeadEye","de":3,"a":5},{"titre":"⚡ DeadShot","de":6,"a":9}]}]}},{"id":"hold-breath","titre":"🫁 Hold Breath","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Hold Breath MOD and how does it work?"},{"type":"texte","style":"p","contenu":"**Hold Breath** is a MOD designed for precision rifles (snipers) and weapons equipped with magnifying scopes. It automatically holds your character's breath as soon as you aim, completely eliminating the weapon's natural sway for a perfectly steady shot."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation & Triggering:"},{"type":"liste","contenu":"**Automatic trigger:** As soon as you press the aim button, the script automatically presses the breath-holding button ( {L3 / LS}), then releases it once the **Breath Time** has e
