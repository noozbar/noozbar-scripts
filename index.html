 stability of your internet connection.\n**Your in-game settings:** overall sensitivity, the dead zones configured *in-game*.\n**Your playstyle:** the way you handle the analog sticks, your combat preferences (close range, long range, etc.)."},{"type":"texte","style":"p","contenu":"📋 **In summary**, good settings are settings you have fine-tuned yourself, taking the time needed to run your own tests."}]},{"type":"depliant","titre":"🎮 Compatibility & Required hardware","blocs":[{"type":"texte","style":"h2","contenu":"❓Which platforms do the scripts work on?"},{"type":"texte","style":"p","contenu":"The scripts are compatible with **PS5, PS4, Xbox Series X|S, Xbox One and PC**."},{"type":"texte","style":"h2","contenu":"📋 What hardware and setup are required?"},{"type":"liste","contenu":"**Unit:** An up-to-date **Cronus ZEN**.\n**Computer:** A PC (Windows) or a Mac. Management is done directly online on the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) website (there is no longer any software to install).\n**Browser:** You must use a **Chromium**-based browser (such as Microsoft Edge, Google Chrome or Brave)."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning:** Be sure to disable the page's automatic translation on [Zen Studio Live](https://zenstudio.collectivemindsstore.com/), otherwise the interface will be unreadable!"}]}],"icone":"ampoule","sommaire":false},{"id":"lexique","titre":"Glossary","blocs":[{"type":"depliant","titre":"🎯 Aim & Shooting MODs","blocs":[{"type":"liste","contenu":"**AntiRecoil:** Automatically compensates for the weapon's recoil downward or sideways while shooting.\n**Fire MODs:** Changes the firing rhythm (Rapid Fire, Burst Fire, Dynamic Rapid Fire...).\n**AIM Assist / LS Assist:** Exploits the game's native aim assist by applying discreet micro-movements to the aiming stick and/or the movement stick to strengthen your crosshair's magnetism. (⚠️ **is NOT an aimbot)**\n**AIM Abuse:** Quickly presses and releases the aim button (**ADS**) to force the game to constantly re-center the crosshair on the enemy. *(Mostly used in games with automatic aiming such as GTA V or RDR2)*\n**HeadShot Assist:** Automatically shifts the crosshair toward the target's head when aiming. (⚠️ **is NOT an aimbot)**"}]},{"type":"depliant","titre":"🏃 Movement & Shooting MODs","blocs":[{"type":"liste","contenu":"**Shot MODs:** Automatically performs a movement action at the moment you shoot.\n- **Drop Shot** = lie down / crouch.\n- **Jump Shot** = jump.\n- **Strafe** = lateral movement.\n**Auto ADS / Auto Fire:** Automatically aims as soon as you shoot, or automatically shoots as soon as you aim.\n**Quick Scope:** *(Specific to the FPS/TPS script)* Aims and shoots instantly with a single press of the fire button (ideal for sniping).\n**Auto Scope:** *(Specific to the GTA and RDR2 scripts)* Automatically presses the zoom button when you aim.\n**DeadEye:** *(Specific to the RDR2 script)* Automatically activates DeadEye mode or triggers DeadShot."}]},{"type":"depliant","titre":"🎮 Controls & Controller Buttons","blocs":[{"type":"liste","contenu":"**ADS** (*Aim Down Sights*): Button or trigger used to aim (usually {L2} on PlayStation / {LT} on Xbox).\n**FIRE**: Button or trigger used to shoot (usually {R2} on PlayStation / {RT} on Xbox).\n**HIP**: \"Hip-fire\" shooting position, i.e. shooting directly without holding the aim button (**ADS**).\n{D-Pad} (*Directional Pad*): The controller's directional cross ({UP / DOWN / LEFT / RIGHT}).\n{CROSS / A}: **Cross** button (PlayStation) / {A} button (Xbox).\n{SQUARE / X}: **Square** button (PlayStation) / {X} button (Xbox).\n{TRIANGLE / Y}: **Triangle** button (PlayStation) / {Y} button (Xbox).\n{CIRCLE / B}: **Circle** button (PlayStation) / {B} button (Xbox).\n**L1 / LB & R1 / RB**: Upper triggers / shoulder buttons (*Bumpers*).\n**L2 / LT & R2 / RT**: Long-travel analog lower triggers (*Triggers*).\n{L3 / LS}: Physical click obtained by pressing down the left analog stick (*Left Stick*).\n{R3 / RS}: Physical click obtained by pressing down the right analog stick (*Right Stick*).\n**LY / RY**: Vertical axis (Y axis) of the left stick (*Left Y*) or the right stick (*Right Y*).\n**LX / RX**: Horizontal axis (X axis) of the left stick (*Left X*) or the right stick (*Right X*)."}]},{"type":"depliant","titre":"⚙️ Technical Terms & MOD Settings","blocs":[{"type":"liste","contenu":"**MOD**: Macro or software feature built into the script (e.g. *AntiRecoil*, *AIM Assist*, *AutoRun*).\n**DeadZone**: Inactive perimeter at the center of the analog stick. Below this tilt threshold, the game detects no movement.\n**Stick Drift**: Hardware drift caused by wear of a stick's potentiometers, sending false movements to the console even at rest.\n**Radius** (*Rad*): Size or amplitude of the geometric shape drawn by the script (e.g. *AIM Assist* or *LS Assist*).\n**Step**: Speed / rate of progression of the geometric shape drawn by the AIM Assist (angle increment value at each cycle).\n**Humanizer**: Algorithm injecting random micro-variations into timers and movements to imitate human physics and get around anti-cheat systems.\n**Hair Trigger**: Neutralization of the triggers' analog travel to turn them into instant digital buttons (1% pressure = 100% depression).\n**Quick Toggle**: Customizable button combination to enable or disable a MOD on the fly mid-game.\n**Quick Cheat**: Controller shortcut to trigger a quick action (healing, armor, vehicle) without manually navigating the game menus.\n**ADT** (*Adaptive Triggers*): Dynamic mechanical resistance system specific to the PS5 DualSense controller's triggers.\n**Rumble**: The controller's internal vibration motors."}]},{"type":"depliant","titre":"📟 Cronus Zen Hardware-Specific Terms","blocs":[{"type":"liste","contenu":"**Cronus Zen**: Intermediate hardware unit connected between your controller and the console/PC to run custom scripts.\n**OLED screen**: Display located on the front of the Cronus Zen unit, used to navigate the script menus.\n**VM Speed** (*Virtual Machine Speed*): Refresh rate at which the Cronus Zen's virtual machine processor executes the script code (e.g. 10 ms, 8 ms, 2 ms).\n**EEPROM**: Non-volatile flash memory built into the Cronus Zen used to save your settings even when the unit is powered off.\n**Slot**: Cronus Zen memory location that can hold a complete GPC script."}]}],"icone":"liste","sommaire":false},{"id":"a-propos","titre":"About noozbar","blocs":[{"type":"texte","style":"h1","contenu":"My Story"},{"type":"texte","style":"h2","contenu":"From player to modder"},{"type":"texte","style":"p","contenu":"I fell into video games at the end of the 90s with the very first GTA. Of course, I started my first games on Mario Kart or Sonic on the MegaDrive.\nAfter being a regular player for a long time, I turned to console hacking on PS2: installing chips, launching games stored on an HDD connected through the network adapter...\n\nAround 2007, with friends, I collaborated on creating a mod for *GTA San Andreas* on PS2: the mod **\"GTA SA - PTMG Edition\"**. It included a mod menu that let us spawn anything, launch any mission, fly, teleport, add fuel management, replace all the fast-food restaurants with McDonald's and all the cans with Coca-Cola, throw fireballs... in short, a huge number of things!"},{"type":"texte","style":"h2","contenu":"Pushing the limits of GPC"},{"type":"texte","style":"p","contenu":"After a break in the 2010s when I just played, the release of *The Division 1* in 2016 changed everything. Faced with sometimes toxic PVP, I wanted to understand how some players managed to be so precise with their weapons — a game with particularly hard-to-master recoil. So I bought a **Cronus MAX+**.\n\nLoving to understand how things work, I analyzed the scripts available at the time and read the documentation on the GPC language. I then started writing and developing my own scripts. At that time, no script had multiple profiles, anti-recoils only applied a simple downward pull, and the MODs were really basic.\n\nSo I developed advanced, specialized scripts designed to be **ergonomic and completely transparent** in-game: the idea was to directly use the same buttons as the game to control the MODs, making use ultra-simple and intuitive.\n\nAmong the innovations introduced at the time:"},{"type":"liste","contenu":"**Automatic profile switching:** Your weapon profiles switch automatically as you change weapons in-game.\n**Anti-recoil that progresses over time:** A dynamic anti-recoil value that adapts the longer you hold the fire trigger.\n**Preconfigured weapons:** A selection of weapons built in directly, with their anti-recoil settings already configured.\n**MOD management per profile:** The ability to enable a MOD on a specific profile while leaving it disabled on another.\n**Unique MOD values per profile:** Each profile has its own settings (for example, a fire rate for *RapidFire* or a completely different anti-recoil value from one weapon to another).\nAnd much more..."},{"type":"texte","style":"p","contenu":"What has become the norm today was not at all so in 2016 / 2017. Charlie (**MaxADMIN**) then brought me into his GamePacks development team so that I could share my ideas and my creative side."},{"type":"texte","style":"h2","contenu":"The move to the ZEN"},{"type":"texte","style":"p","contenu":"I then had the chance to be one of the beta testers of the new generation of Cronus: the **Cronus ZEN**. I took part in developing the first scripts with OLED menus.\n\nIt was during this period that I met a passionate young player who was using my \"menu template\" to create a script for his favorite FPS. He asked me for advice and tips so he could create his own script, and I passed on everything I knew. You know him today as **TaylorDrift21**, one of the best script developers I know, along with **Chaton**."},{"type":"texte","style":"h2","contenu":"Always aiming higher"},{"type":"texte","style":"p","contenu":"After several years of intensive development, I chose to take my foot off the gas for a while and follow the evolution of the GPC scene from a bit more of a distance.\n\nI used this time away to rework my foundations in depth and start over from scratch. Today, I'm back at full speed to design higher-quality scripts: creations entirely rewritten from a blank page, more powerful, smoother and more unique than ever, with no compromise on precision, ergonomics and originality."}],"icone":"etoile","separateurAvant":true,"rubrique":"The site"},{"id":"discord","titre":"Discord","icone":"link","iconePersonnalisee":"💬","lien":"https://discord.gg/e2v4NN4fVu","blocs":[]}],"cartesExtra":[{"nom":"CRONUS ZEN","description":"Connections, PS5 / Xbox / PC setup, Bypass, firmware update and troubleshooting.","icone":"ordinateur","couleurHex":"#3ad1ff","lien":"/cronus-zen/","bouton":"Open the guide →"},{"nom":"MODs LIBRARY","description":"The description and tuning tips for every MOD, menu by menu.","icone":"dossier","couleurHex":"#a46bff","lien":"/bibliotheque/","bouton":"Open the library →"},{"nom":"UNDERSTANDING THE SCRIPTS","description":"What a MOD can (and cannot) do, how scripts work, compatibility.","icone":"ampoule","couleurHex":"#ffb547","lien":"/comprendre/","bouton":"Learn more →"},{"nom":"DISCORD","description":"Support, update announcements and unlock codes: join 22,000+ members.","icone":"link","iconePersonnalisee":"💬","couleurHex":"#7c5cff","lien":"https://discord.gg/e2v4NN4fVu","bouton":"Join the Discord →"}],"menu":[{"titre":"Cronus ZEN","ouvertAccueil":true,"items":[{"page":"cronus-zen","titre":"Overview"},"guide-cronus-zen","bypass-ps5","connexion-xbox-pc","mise-a-jour-zen","depannage-faq"]},{"titre":"My scripts","ouvertAccueil":true,"items":[{"script":"gta6"},{"script":"fps-tps"},{"script":"rdr2"},{"script":"gta5"},"vibrations-adt","navigation-oled"]},{"titre":"MODs Library","items":[{"page":"bibliotheque","titre":"Overview"},"profile-mods","global-mods","mods-activator","controller","misc","quick-toggle",{"sousTitre":"Script-specific"},"gta6-activity","fps-tps-switch-profile","rdr2-activity","gta5-online-cheat","gta5-story-cheat","gta5-quick-cheat"]},{"titre":"Understanding","items":["comprendre","lexique"]}]},"scripts":[{"id":"gta6","nom":"MIAMI","jeu":"Grand Theft Auto VI","description":"GTA VI script: dominate Vice City with formidable combat MODs and automations that make every activity easier.","couleurHex":"#ff4fd8","couleurNomHex":"#ff4fd8","image":"/media/cartes/gta6.jpg","imageOpacite":0.3,"logoBadge":"/media/badges/gta6.jpg","banniere":"/media/bannieres/gta6.jpg","imagePartage":"/media/cartes/gta6.jpg","disponible":true,"onglets":[{"id":"accueil","titre":"Overview","titrePage":"MIAMI — Grand Theft Auto VI","icone":"liste","sommaire":true,"blocs":[{"type":"carte","image":"/media/bannieres/gta6.jpg","titre":"","contenu":""},{"type":"texte","style":"titre","contenu":"📋 Script Menu Structure and Contents","horsSommaire":true},{"type":"depliant","titre":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨","soustitre":"Essential settings in the console AND in the game","couleurHex":"#ffb547","mod":"vibrations-adt"},{"type":"depliant","titre":"🚗 Driving & Vehicle Handling (coming soon...)","blocs":[{"type":"texte","style":"h3","contenu":"❓ What is vehicle handling and how does it work?"},{"type":"texte","style":"p","contenu":"This feature automatically adapts the script's behavior when you are driving a vehicle (or moving around bare-handed depending on your setup). It instantly neutralizes all the MODs that could interfere with driving (such as AntiRecoil) to guarantee you total control."},{"type":"texte","style":"h3","contenu":"🛠️ How it works depending on your setup"},{"type":"liste","contenu":"**🤖 Automatic Detection via ADT (PS5 & PC):**\n> When you play the PS5 or PC version of the game and the adaptive triggers (ADT) are enabled:\n- **Smart analysis:** The script analyzes the triggers' mechanical feedback to automatically detect whether you are driving a vehicle or moving bare-handed with no weapon equipped.\n- **OLED display:** The **\"Unarmed / In vehicle\"** state is automatically displayed on the Cronus Zen screen and the profile adapts instantly with no action on your part.\n**🎮 Manual Handling / Driving Mode (Xbox, PS4 or ADT disabled):**\n> If you play on a platform without ADT support (Xbox, PS4) or if you have disabled the adaptive triggers in your menus *(💡 it is however strongly recommended to always leave ADT and vibrations enabled in the console and game options)*:\n- **Manual switch**: Press the {TRIANGLE / Y} button to manually switch to \"**Driving**\" mode (or to return to your main weapon profile)."},{"type":"texte","style":"p","contenu":"🔄 **Reset and desynchronization**: If an offset occurs in-game (for example after a cutscene or a vehicle transition):\nHold the {L3 / LS} button and press {TRIANGLE / Y} to immediately reset the state.\n*(Note: This resynchronization system only applies to manual handling; automatic detection via ADT cannot become desynchronized).*"}]},{"type":"texte","style":"titre","contenu":"🎯 1. Profile MODs"},{"type":"texte","style":"p","contenu":"Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch from one profile to another."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a MOD** to display its detailed description and setup tips. Click again to close it."},{"type":"etiquettes","contenu":"🎯 AntiRecoil | 🔥 Fire MODs | 📐 AIM Assist | 🏃 LS Assist | 👁️ AIM Abuse | 💥 Shot MODs | 🔍 Auto ADS | 🔫 Auto Fire | 🔭 Auto Scope | 🎯 HeadShot Assist","mods":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-ads-fire","auto-scope","headshot-assist"]},{"type":"texte","style":"titre","contenu":"🌐 2. Global MODs"},{"type":"texte","style":"p","contenu":"Options that are always active in the script, whatever weapon profile is currently selected."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a MOD** to display its detailed description and setup tips. Click again to close it."},{"type":"etiquettes","contenu":"🏃 AutoRun | ⚡ Turbo CROSS / A | ⚡ Turbo SQUARE / X | ⚡ Turbo CIRCLE / B | 🤸 Easy Roll | 📢 Klaxon Hold | 🎒 Quick Item | 🌪️ AutoSpin","mods":["autorun","turbo-boutons","turbo-boutons","turbo-boutons","easy-roll","klaxon-hold","quick-item-gta6","autospin"]},{"type":"texte","style":"titre","contenu":"⚡ 3. MODs Activator"},{"type":"texte","style":"p","contenu":"Trigger conditions and states required to activate certain Profile MODs (e.g. only when aiming *ADS Only*, when shooting *FIRE*, or when aiming + shooting *ADS + FIRE*)."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a mode** to display its detailed explanation. Click again to close it."},{"type":"etiquettes","contenu":"🔀 ADS + FIRE | 🎯 ADS | 💥 FIRE | 🎯 ADS Only | 💥 FIRE Only","mods":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"titre","contenu":"🎮 4. Controller"},{"type":"texte","style":"p","contenu":"Hardware and behavioral configuration of your controller (Stick sensitivity, Dead zone / *Stick Drift*, Y-axis inversion, Button remapping)."},{"type":"carte","couleur":"blue","contenu":"👇 **Click an option** to display its description and tips. Click again to close it."},{"type":"etiquettes","contenu":"🕹️ RS Sensitivity | 🕹️ LS Sensitivity | 🎯 Stick Drift | ⚡ Hair Trigger | 📳 Rumble & ADT | 🎛️ Buttons Layout | ↕️ Inverted RY | ↕️ Inverted LY","mods":["rs-ls-sensitivity","rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes","inverted-axes"]},{"type":"texte","style":"titre","contenu":"🛠️ 5. Misc"},{"type":"texte","style":"p","contenu":"System options and global operating settings of the Cronus Zen's virtual machine."},{"type":"carte","couleur":"blue","contenu":"👇 **Click an option** to display its description and tips. Click again to close it."},{"type":"etiquettes","contenu":"💾 Auto Save | ⏱️ VM Speed","mods":["auto-save","vm-speed"]},{"type":"texte","style":"titre","contenu":"🔀 6. Quick Toggle"},{"type":"texte","style":"p","contenu":"Quick controller shortcut assignments to enable or disable your favorite MODs on the fly in the heat of combat."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a chip** to display the detailed explanation. Click again to close it."},{"type":"etiquettes","contenu":"🔀 Quick Toggle","mods":["quick-toggle"]},{"type":"texte","style":"titre","contenu":"🌴 7. Activity"},{"type":"texte","style":"p","contenu":"Automation modules dedicated to in-game mini-games and jobs (Automatic fishing, *Bench Press* and more to come...) to succeed every time with no physical effort."},{"type":"modbody","mod":"gta6-activity-test"},{"type":"carte","couleur":"blue","contenu":"👇 **Click an activity** to display its detailed explanation and usage guide. Click again to close it."},{"type":"etiquettes","contenu":"🎣 Fishing | 🏋️ Bench Press","mods":["activity-gta6-fishing","activity-gta6-bench-press"]},{"type":"depliant","titre":"📝 Patch Note","blocs":[{"type":"texte","style":"p","contenu":"Version 1.00 - Public Release"}]}]},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"texte","style":"h1","contenu":"🔀 The Profile MODs menu"},{"type":"texte","style":"h2","contenu":"❓ What are \"Profile MODs\"?"},{"type":"texte","style":"p","contenu":"This menu groups all the settings specific to a weapon or a game profile (**AntiRecoil, Fire MODs, Shot MODs...**). These values apply automatically as soon as you change profile in-game.\n\nEach profile has its own independent settings."},{"type":"mods","ids":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist","deadeye","hold-breath"]}],"icone":"cible","sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubrique":"MODs Library","canonique":"/profile-mods/"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 The Global MODs menu"},{"type":"texte","style":"h2","contenu":"❓ What are \"Global MODs\"?"},{"type":"texte","style":"p","contenu":"These are MODs or options that are always active, whatever the selected profile (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons","easy-roll","klaxon-hold","quick-item-gta6","autospin"]}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp","canonique":"/global-mods/"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 The MODs Activator menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"MODs Activator\"?"},{"type":"texte","style":"p","contenu":"The **MODs Activator** is the script's condition engine. It lets you define with total precision **when** and **how** your MODs should activate in-game.\n\nInstead of imposing a rigid behavior, this system listens to your buttons in real time and only triggers your modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) if the exact condition you chose is met."},{"type":"texte","style":"h2","contenu":"⚙️ How it works"},{"type":"texte","style":"p","contenu":"Every player has their own way of playing, and every weapon has its constraints. By assigning a specific trigger mode to each MOD, you avoid unintended activations (for example: doing a *Drop Shot* when you just wanted to adjust your aim from a distance).\n\nThe system analyzes the combination of your main buttons: the aim trigger (**ADS**) and the fire trigger (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 The 5 available trigger modes"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Which MODs use the MODs Activator?"},{"type":"texte","style":"p","contenu":"You can assign an independent activation mode to each of the following modules in your profile:"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **In summary:**\n\nThe MODs Activator offers tailor-made control of your controller. It adapts to your gameplay instead of forcing you to adapt your playstyle to the script."}],"icone":"eclair","sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp","canonique":"/mods-activator/"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 The Controller menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Controller\" menu?"},{"type":"texte","style":"p","contenu":"This is everything related to your controller's hardware configuration (Sensitivity, Dead zone / Stick Drift, Y-axis inversion, Button layout)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp","canonique":"/controller/"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ The Misc menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Misc\" menu?"},{"type":"texte","style":"p","contenu":"These are script system options (**Auto Save** to save your settings, **VM Speed** for execution speed)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp","canonique":"/misc/"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ The Quick Toggle menu (In-game shortcuts)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp","canonique":"/quick-toggle/"},{"id":"activity","titre":"Activity","icone":"palmier","sommaire":false,"blocs":[{"type":"texte","style":"h1","contenu":"🌴 The Activity menu - GTA VI"},{"type":"modbody","mod":"activity-gta6-intro"},{"type":"mods","ids":["activity-gta6-fishing","activity-gta6-bench-press"]}]},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","rubrique":"Getting started","canonique":"/vibrations-adt/"},{"id":"navigation-oled","titre":"OLED Navigation & Menus","blocs":[{"type":"texte","style":"p","contenu":"All scripts share the same menu architecture and the same navigation system. This guide explains how to use the OLED menu, understand the structure of the menus and their contents, and adjust your settings."},{"type":"texte","style":"h1","contenu":"📖 General Guide & How My Scripts Work"},{"type":"depliant","titre":"📂 Main Menu structure","blocs":[{"type":"texte","style":"h3","contenu":"The features are divided into 6 distinct categories:"},{"type":"liste","contenu":"🔀 **Profile MODs**: Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch profile.\n🌍 **Global MODs**: Options that are always active, whatever the selected profile (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator**: Conditions required to trigger certain *Profile MODs* (e.g. only when aiming *ADS Only*, when shooting *FIRE*, or *ADS + FIRE*).\n🎮 **Controller**: Hardware configuration of your controller (Sensitivity, Dead zone / *Stick Drift*, Y-axis inversion, Button layout).\n⚙️ **Misc**: Script system options (*Auto Save* to save your settings, *VM Speed* for execution speed).\n⏱️ **Quick Toggle**: Quick controller shortcut assignments to enable or disable a MOD on the fly."}]},{"type":"depliant","titre":"🕹️ Additional game-specific menus","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)**: Automation modules dedicated to in-game mini-games and jobs (*Automatic fishing*, *5 Finger Fillet*, *Cooking*, *Bench Press* and more to come...) to succeed every time with no physical effort.\n🔄 **Switch Profile (FPS / TPS)**: Quick-switch system letting you change weapon profile or configuration (Profile 1, Profile 2, Primary, Secondary...) on the fly mid-game, to instantly adapt your MODs and your *AntiRecoil* to the weapon you are holding.\n🌐 **Online Cheat (GTA V)**: Quick actions to instantly run key actions from the Interaction menu in GTA Online (eating snacks, equipping heavy armor, respawning your personal vehicle...).\n👤 **Story Cheat (GTA V)**: Automatic execution of the official cheat code combinations reserved for GTA V Story mode (max health/armor, invincibility, weapons, environment effects...).\n🚀 **Quick Cheat (GTA V)**: Assignment of quick button combinations on your controller (same principle as *Quick Toggles*) to trigger your favorite GTA V *Cheats* on the fly mid-game."}]},{"type":"texte","style":"h1","contenu":"🧭 Navigation and editing guide"},{"type":"depliant","titre":"🛑 Safety: the KillSwitch (script cut-off)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Crucial warning:** Whether you are in a racing game or a shooter, the script blindly executes the instructions it contains. That is why it is **absolutely crucial to disable your script** when you navigate the game or console menus. Since a MOD runs on a simple button press, it would be a shame to delete a rare piece of equipment from your inventory or to buy/sell by mistake because a MOD triggered at the wrong time!"},{"type":"texte","style":"h2","contenu":"💡 How to enable or disable the KillSwitch (total mute of the script's features):"},{"type":"texte","style":"p","contenu":"Press one of these combinations / buttons at any time:"},{"type":"liste","contenu":"- Either the {OPTIONS / MENUS} button on your controller.\n- Or the {PS / XBOX} button.\n- Or by holding {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entering and exiting the menu","blocs":[{"type":"liste","contenu":"🚪 **Open the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS}.\n🎯 **AntiRecoil quick access:** Hold {L2 / LT} and press {PS / XBOX} to directly open the active profile's AntiRecoil values *(if the AntiRecoil MOD is enabled on that profile)*.\n🚪 **Close the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS} *(if Auto Save is enabled in Misc, your settings are saved automatically)*.\n💾 **Save manually and exit:** Press {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Navigating and editing MOD values","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Navigating the menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual help on the OLED screen:**\n\n🧭 **Directional arrows:** *Arrows appear around the parameter to tell you directly which direction to press on the controller.*"},{"type":"texte","style":"p","contenu":"📜 **Instruction line:** *A text scrolls on the last line of the screen to guide you step by step if you are unsure which button to use.*"},{"type":"liste","contenu":"↕️ **Browse a list or a drop-down menu:** Use {D-Pad UP} or {DOWN} *(main menu, Cheats list, settings choices...)*.\n📥**Enter a menu / sub-menu:** Press {CROSS / A}.\n🔄**Change the profile to edit:** Press {CROSS / A} *(only in the Profile MODs menu)*.\n↔️**Move between sub-menus / MODs:** Use {D-Pad LEFT} or {RIGHT}.\n⚙️**Enable/Disable a MOD or change its type:** Use {D-Pad UP} or {DOWN}.\n↩️**Go back to the previous menu:** Press {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Editing numerical values *(e.g. AntiRecoil strength, Rapid Fire rate)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Enable the MOD:** If the MOD is *OFF*, you do not have access to its adjustable values.\n\n2️⃣ **Enter the edit menu:** Press {CROSS / A}.\n\n3️⃣ **Select the parameter:** Use {D-Pad LEFT} or {RIGHT} to navigate between the different options.\n\n4️⃣ **Change the value:** Hold {R1 / RB} then press {D-Pad RIGHT} (or {UP}) to increase, or {D-Pad LEFT} (or {DOWN}) to decrease.\n\n5️⃣ **Go back to the previous menu:** Press {CIRCLE / B}."}]}],"icone":"menu","sommaire":true,"canonique":"/navigation-oled/"}]},{"id":"fps-tps","nom":"THE GANGBANGER","jeu":"Multi FPS / TPS","description":"Multi FPS/TPS script: outplay your opponents in your favorite shooters with combat MODs built for competition.","couleurHex":"#ffb547","couleurNomHex":"#ffb547","image":"/media/cartes/fps-tps.jpg","imageOpacite":0.3,"logoBadge":"/media/badges/fps-tps.jpg","banniere":"/media/bannieres/fps-tps.jpg","imagePartage":"/media/cartes/fps-tps.jpg","disponible":true,"onglets":[{"id":"accueil","titre":"Overview","titrePage":"THE GANGBANGER — Multi FPS / TPS","icone":"liste","sommaire":true,"blocs":[{"type":"carte","image":"/media/bannieres/fps-tps.jpg","titre":"","contenu":""},{"type":"texte","style":"titre","contenu":"📋 Script Menu Structure and Contents","horsSommaire":true},{"type":"depliant","titre":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨","soustitre":"Essential settings in the console AND in the game","couleurHex":"#ffb547","mod":"vibrations-adt"},{"type":"texte","style":"titre","contenu":"🎯 1. Profile MODs"},{"type":"texte","style":"p","contenu":"Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch from one profile to another."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a MOD** to display its detailed description and setup tips. Click again to close it."},{"type":"etiquettes","contenu":"🎯 AntiRecoil | 🔥 Fire MODs | 📐 AIM Assist | 🏃 LS Assist | 👁️ AIM Abuse | 💥 Shot MODs | 🔍 Auto ADS | 🔫 Auto Fire | 🔭 Quick Scope | 🎯 HeadShot Assist | 🫁 Hold Breath","mods":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","a chine."},{"type":"carte","couleur":"blue","contenu":"👇 **Click an option** to display its description and tips. Click again to close it."},{"type":"etiquettes","contenu":"💾 Auto Save | ⏱️ VM Speed","mods":["auto-save","vm-speed"]},{"type":"texte","style":"titre","contenu":"🔀 6. Quick Toggle"},{"type":"texte","style":"p","contenu":"Quick controller shortcut assignments to enable or disable your favorite MODs on the fly in the heat of combat."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a chip** to display the detailed explanation. Click again to close it."},{"type":"etiquettes","contenu":"🔀 Quick Toggle","mods":["quick-toggle"]},{"type":"texte","style":"titre","contenu":"🔄 7. Switch Profile"},{"type":"texte","style":"p","contenu":"Quick-switch system letting you change weapon profile or configuration (Profile 1, Profile 2, Primary, Secondary...) on the fly mid-game, to instantly adapt your MODs and your *AntiRecoil* to the weapon you are holding."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a chip** to display the detailed explanation and the list of switch shortcuts. Click again to close it."},{"type":"etiquettes","contenu":"🔄 Switch Profile","mods":["switch-profile"]},{"type":"depliant","titre":"📝 Patch Note","blocs":[{"type":"texte","style":"p","contenu":"Version 1.00 - Public Release"}]}]},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"texte","style":"h1","contenu":"🔀 The Profile MODs menu"},{"type":"texte","style":"h2","contenu":"❓ What are \"Profile MODs\"?"},{"type":"texte","style":"p","contenu":"This menu groups all the settings specific to a weapon or a game profile (**AntiRecoil, Fire MODs, Shot MODs...**). These values apply automatically as soon as you change profile in-game.\n\nEach profile has its own independent settings."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning (FPS / TPS Script):**\n\nUntil you have configured the [**Switch Profile**](/fps-tps/switch-profile/) menu, you will only have access to a single profile in this menu (and in-game)."},{"type":"mods","ids":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist","hold-breath"]}],"icone":"cible","sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubrique":"MODs Library","canonique":"/profile-mods/"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 The Global MODs menu"},{"type":"texte","style":"h2","contenu":"❓ What are \"Global MODs\"?"},{"type":"texte","style":"p","contenu":"These are MODs or options that are always active, whatever the selected profile (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons"]}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp","canonique":"/global-mods/"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 The MODs Activator menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"MODs Activator\"?"},{"type":"texte","style":"p","contenu":"The **MODs Activator** is the script's condition engine. It lets you define with total precision **when** and **how** your MODs should activate in-game.\n\nInstead of imposing a rigid behavior, this system listens to your buttons in real time and only triggers your modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) if the exact condition you chose is met."},{"type":"texte","style":"h2","contenu":"⚙️ How it works"},{"type":"texte","style":"p","contenu":"Every player has their own way of playing, and every weapon has its constraints. By assigning a specific trigger mode to each MOD, you avoid unintended activations (for example: doing a *Drop Shot* when you just wanted to adjust your aim from a distance).\n\nThe system analyzes the combination of your main buttons: the aim trigger (**ADS**) and the fire trigger (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 The 5 available trigger modes"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Which MODs use the MODs Activator?"},{"type":"texte","style":"p","contenu":"You can assign an independent activation mode to each of the following modules in your profile:"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **In summary:**\n\nThe MODs Activator offers tailor-made control of your controller. It adapts to your gameplay instead of forcing you to adapt your playstyle to the script."}],"icone":"eclair","sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp","canonique":"/mods-activator/"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 The Controller menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Controller\" menu?"},{"type":"texte","style":"p","contenu":"This is everything related to your controller's hardware configuration (Sensitivity, Dead zone / Stick Drift, Y-axis inversion, Button layout)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp","canonique":"/controller/"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ The Misc menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Misc\" menu?"},{"type":"texte","style":"p","contenu":"These are script system options (**Auto Save** to save your settings, **VM Speed** for execution speed)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp","canonique":"/misc/"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ The Quick Toggle menu (In-game shortcuts)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp","canonique":"/quick-toggle/"},{"id":"switch-profile","titre":"Switch Profile","icone":"actualiser","sommaire":true,"blocs":[{"type":"texte","style":"h1","contenu":"🔄 The Switch Profile menu (FPS / TPS script)"},{"type":"modbody","mod":"switch-profile"}]},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","rubrique":"Getting started","canonique":"/vibrations-adt/"},{"id":"navigation-oled","titre":"OLED Navigation & Menus","blocs":[{"type":"texte","style":"p","contenu":"All scripts share the same menu architecture and the same navigation system. This guide explains how to use the OLED menu, understand the structure of the menus and their contents, and adjust your settings."},{"type":"texte","style":"h1","contenu":"📖 General Guide & How My Scripts Work"},{"type":"depliant","titre":"📂 Main Menu structure","blocs":[{"type":"texte","style":"h3","contenu":"The features are divided into 6 distinct categories:"},{"type":"liste","contenu":"🔀 **Profile MODs**: Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch profile.\n🌍 **Global MODs**: Options that are always active, whatever the selected profile (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator**: Conditions required to trigger certain *Profile MODs* (e.g. only when aiming *ADS Only*, when shooting *FIRE*, or *ADS + FIRE*).\n🎮 **Controller**: Hardware configuration of your controller (Sensitivity, Dead zone / *Stick Drift*, Y-axis inversion, Button layout).\n⚙️ **Misc**: Script system options (*Auto Save* to save your settings, *VM Speed* for execution speed).\n⏱️ **Quick Toggle**: Quick controller shortcut assignments to enable or disable a MOD on the fly."}]},{"type":"depliant","titre":"🕹️ Additional game-specific menus","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)**: Automation modules dedicated to in-game mini-games and jobs (*Automatic fishing*, *5 Finger Fillet*, *Cooking*, *Bench Press* and more to come...) to succeed every time with no physical effort.\n🔄 **Switch Profile (FPS / TPS)**: Quick-switch system letting you change weapon profile or configuration (Profile 1, Profile 2, Primary, Secondary...) on the fly mid-game, to instantly adapt your MODs and your *AntiRecoil* to the weapon you are holding.\n🌐 **Online Cheat (GTA V)**: Quick actions to instantly run key actions from the Interaction menu in GTA Online (eating snacks, equipping heavy armor, respawning your personal vehicle...).\n👤 **Story Cheat (GTA V)**: Automatic execution of the official cheat code combinations reserved for GTA V Story mode (max health/armor, invincibility, weapons, environment effects...).\n🚀 **Quick Cheat (GTA V)**: Assignment of quick button combinations on your controller (same principle as *Quick Toggles*) to trigger your favorite GTA V *Cheats* on the fly mid-game."}]},{"type":"texte","style":"h1","contenu":"🧭 Navigation and editing guide"},{"type":"depliant","titre":"🛑 Safety: the KillSwitch (script cut-off)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Crucial warning:** Whether you are in a racing game or a shooter, the script blindly executes the instructions it contains. That is why it is **absolutely crucial to disable your script** when you navigate the game or console menus. Since a MOD runs on a simple button press, it would be a shame to delete a rare piece of equipment from your inventory or to buy/sell by mistake because a MOD triggered at the wrong time!"},{"type":"texte","style":"h2","contenu":"💡 How to enable or disable the KillSwitch (total mute of the script's features):"},{"type":"texte","style":"p","contenu":"Press one of these combinations / buttons at any time:"},{"type":"liste","contenu":"- Either the {OPTIONS / MENUS} button on your controller.\n- Or the {PS / XBOX} button.\n- Or by holding {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entering and exiting the menu","blocs":[{"type":"liste","contenu":"🚪 **Open the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS}.\n🎯 **AntiRecoil quick access:** Hold {L2 / LT} and press {PS / XBOX} to directly open the active profile's AntiRecoil values *(if the AntiRecoil MOD is enabled on that profile)*.\n🚪 **Close the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS} *(if Auto Save is enabled in Misc, your settings are saved automatically)*.\n💾 **Save manually and exit:** Press {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Navigating and editing MOD values","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Navigating the menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual help on the OLED screen:**\n\n🧭 **Directional arrows:** *Arrows appear around the parameter to tell you directly which direction to press on the controller.*"},{"type":"texte","style":"p","contenu":"📜 **Instruction line:** *A text scrolls on the last line of the screen to guide you step by step if you are unsure which button to use.*"},{"type":"liste","contenu":"↕️ **Browse a list or a drop-down menu:** Use {D-Pad UP} or {DOWN} *(main menu, Cheats list, settings choices...)*.\n📥**Enter a menu / sub-menu:** Press {CROSS / A}.\n🔄**Change the profile to edit:** Press {CROSS / A} *(only in the Profile MODs menu)*.\n↔️**Move between sub-menus / MODs:** Use {D-Pad LEFT} or {RIGHT}.\n⚙️**Enable/Disable a MOD or change its type:** Use {D-Pad UP} or {DOWN}.\n↩️**Go back to the previous menu:** Press {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Editing numerical values *(e.g. AntiRecoil strength, Rapid Fire rate)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Enable the MOD:** If the MOD is *OFF*, you do not have access to its adjustable values.\n\n2️⃣ **Enter the edit menu:** Press {CROSS / A}.\n\n3️⃣ **Select the parameter:** Use {D-Pad LEFT} or {RIGHT} to navigate between the different options.\n\n4️⃣ **Change the value:** Hold {R1 / RB} then press {D-Pad RIGHT} (or {UP}) to increase, or {D-Pad LEFT} (or {DOWN}) to decrease.\n\n5️⃣ **Go back to the previous menu:** Press {CIRCLE / B}."}]}],"icone":"menu","sommaire":true,"canonique":"/navigation-oled/"}]},{"id":"rdr2","nom":"COWBOY 2","jeu":"Red Dead Redemption II","description":"RDR2 script: the ultimate tool to rule the Wild West, with advanced shooting MODs and assists for your jobs and activities.","couleurHex":"#ff7a3d","couleurNomHex":"#ff7a3d","image":"/media/cartes/rdr2.jpg","imageOpacite":0.3,"logoBadge":"/media/badges/rdr2.jpg","banniere":"/media/bannieres/rdr2.jpg","imagePartage":"/media/cartes/rdr2.jpg","disponible":true,"onglets":[{"id":"accueil","titre":"Overview","titrePage":"COWBOY 2 — Red Dead Redemption II","icone":"liste","sommaire":true,"blocs":[{"type":"carte","image":"/media/bannieres/rdr2.jpg","titre":"","contenu":""},{"type":"texte","style":"titre","contenu":"📋 Script Menu Structure and Contents","horsSommaire":true},{"type":"depliant","titre":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨","soustitre":"Essential settings in the console AND in the game","couleurHex":"#ffb547","mod":"vibrations-adt"},{"type":"depliant","titre":"🐎 Focus: the \"On Horse\" Mode (horseback handling)","blocs":[{"type":"texte","style":"h3","contenu":"❓ What is the \"On Horse\" state and how does it work?"},{"type":"texte","style":"p","contenu":"Pressing the {TRIANGLE / Y} button switches the script to \"**On Horse**\" mode.\n\nThis state automatically adapts the behavior of your MODs to offer smooth horseback riding without interference:"},{"type":"liste","contenu":"**Disabling bothersome combat MODs:** Some on-foot MODs are temporarily neutralized so they don't interfere with movement and the camera on horseback.\n**Gallop handling:** The **\"On Horse\"** state governs the operation of the **Horse Gallop** and **Cinema Gallop** MODs so they don't trigger while you are on foot."},{"type":"texte","style":"p","contenu":"🔄 Reset and desynchronization\n\nIf your character falls off the horse or if the script's state no longer matches your situation in-game (e.g. the script thinks you are on horseback when you are on foot):"},{"type":"carte","couleur":"jaune","contenu":"💡 **Resync shortcut:** Hold the {L3 / LS} button and press {TRIANGLE / Y} to instantly reset the\n\"On Horse\" state."}]},{"type":"texte","style":"titre","contenu":"🎯 1. Profile MODs"},{"type":"texte","style":"p","contenu":"Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch from one profile to another."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a MOD** to display its detailed description and setup tips. Click again to close it."},{"type":"etiquettes","contenu":"🎯 AntiRecoil | 🔥 Fire MODs | 👁️ AIM Abuse | 💥 Shot MODs | 🔍 Auto ADS | 🔫 Auto Fire | 🔭 Auto Scope | 🎯 HeadShot Assist | 👁️ DeadEye","mods":["antirecoil","fire-mods","aim-abuse","shot-mods","auto-ads-fire","auto-ads-fire","auto-scope","headshot-assist","deadeye"]},{"type":"texte","style":"titre","contenu":"🌐 2. Global MODs"},{"type":"texte","style":"p","contenu":"Options that are always active in the script, whatever weapon profile is currently selected."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a MOD** to display its detailed description and setup tips. Click again to close it."},{"type":"etiquettes","contenu":"🏃 AutoRun | ⚡ Turbo CROSS / A | ⚡ Turbo SQUARE / X | ⚡ Turbo CIRCLE / B | 🔭❌ Auto Unscope | 🔄 Auto Reload | 🛑💨 Skid Stop | 🦅 Easy Eagle Eye | 🐎 Horse Gallop | 🎬 Cinema Gallop | 🎒 Quick Item | 💀 Auto Stop DeadEye (RDO) | 🌪️ AutoSpin","mods":["autorun","turbo-bo {"type":"mods","ids":["autorun","turbo-boutons","auto-unscope","auto-reload","skid-stop","easy-eagle-eye","horse-galop","cinema-galop","quick-item-rdr2","autostop-deadeye","autospin"]}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp","canonique":"/global-mods/"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 The MODs Activator menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"MODs Activator\"?"},{"type":"texte","style":"p","contenu":"The **MODs Activator** is the script's condition engine. It lets you define with total precision **when** and **how** your MODs should activate in-game.\n\nInstead of imposing a rigid behavior, this system listens to your buttons in real time and only triggers your modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) if the exact condition you chose is met."},{"type":"texte","style":"h2","contenu":"⚙️ How it works"},{"type":"texte","style":"p","contenu":"Every player has their own way of playing, and every weapon has its constraints. By assigning a specific trigger mode to each MOD, you avoid unintended activations (for example: doing a *Drop Shot* when you just wanted to adjust your aim from a distance).\n\nThe system analyzes the combination of your main buttons: the aim trigger (**ADS**) and the fire trigger (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 The 5 available trigger modes"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Which MODs use the MODs Activator?"},{"type":"texte","style":"p","contenu":"You can assign an independent activation mode to each of the following modules in your profile:"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **In summary:**\n\nThe MODs Activator offers tailor-made control of your controller. It adapts to your gameplay instead of forcing you to adapt your playstyle to the script."}],"icone":"eclair","sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp","canonique":"/mods-activator/"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 The Controller menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Controller\" menu?"},{"type":"texte","style":"p","contenu":"This is everything related to your controller's hardware configuration (Sensitivity, Dead zone / Stick Drift, Y-axis inversion, Button layout)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp","canonique":"/controller/"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ The Misc menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Misc\" menu?"},{"type":"texte","style":"p","contenu":"These are script system options (**Auto Save** to save your settings, **VM Speed** for execution speed)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp","canonique":"/misc/"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ The Quick Toggle menu (In-game shortcuts)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp","canonique":"/quick-toggle/"},{"id":"activity","titre":"Activity","icone":"cowboy","sommaire":false,"blocs":[{"type":"texte","style":"h1","contenu":"🤠 The Activity menu - RDR 2"},{"type":"modbody","mod":"activity-rdr2-intro"},{"type":"mods","ids":["activity-rdr2-fishing","five-finger-fillet","cooking"]}]},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","rubrique":"Getting started","canonique":"/vibrations-adt/"},{"id":"navigation-oled","titre":"OLED Navigation & Menus","blocs":[{"type":"texte","style":"p","contenu":"All scripts share the same menu architecture and the same navigation system. This guide explains how to use the OLED menu, understand the structure of the menus and their contents, and adjust your settings."},{"type":"texte","style":"h1","contenu":"📖 General Guide & How My Scripts Work"},{"type":"depliant","titre":"📂 Main Menu structure","blocs":[{"type":"texte","style":"h3","contenu":"The features are divided into 6 distinct categories:"},{"type":"liste","contenu":"🔀 **Profile MODs**: Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch profile.\n🌍 **Global MODs**: Options that are always active, whatever the selected profile (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator**: Conditions required to trigger certain *Profile MODs* (e.g. only when aiming *ADS Only*, when shooting *FIRE*, or *ADS + FIRE*).\n🎮 **Controller**: Hardware configuration of your controller (Sensitivity, Dead zone / *Stick Drift*, Y-axis inversion, Button layout).\n⚙️ **Misc**: Script system options (*Auto Save* to save your settings, *VM Speed* for execution speed).\n⏱️ **Quick Toggle**: Quick controller shortcut assignments to enable or disable a MOD on the fly."}]},{"type":"depliant","titre":"🕹️ Additional game-specific menus","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)**: Automation modules dedicated to in-game mini-games and jobs (*Automatic fishing*, *5 Finger Fillet*, *Cooking*, *Bench Press* and more to come...) to succeed every time with no physical effort.\n🔄 **Switch Profile (FPS / TPS)**: Quick-switch system letting you change weapon profile or configuration (Profile 1, Profile 2, Primary, Secondary...) on the fly mid-game, to instantly adapt your MODs and your *AntiRecoil* to the weapon you are holding.\n🌐 **Online Cheat (GTA V)**: Quick actions to instantly run key actions from the Interaction menu in GTA Online (eating snacks, equipping heavy armor, respawning your personal vehicle...).\n👤 **Story Cheat (GTA V)**: Automatic execution of the official cheat code combinations reserved for GTA V Story mode (max health/armor, invincibility, weapons, environment effects...).\n🚀 **Quick Cheat (GTA V)**: Assignment of quick button combinations on your controller (same principle as *Quick Toggles*) to trigger your favorite GTA V *Cheats* on the fly mid-game."}]},{"type":"texte","style":"h1","contenu":"🧭 Navigation and editing guide"},{"type":"depliant","titre":"🛑 Safety: the KillSwitch (script cut-off)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Crucial warning:** Whether you are in a racing game or a shooter, the script blindly executes the instructions it contains. That is why it is **absolutely crucial to disable your script** when you navigate the game or console menus. Since a MOD runs on a simple button press, it would be a shame to delete a rare piece of equipment from your inventory or to buy/sell by mistake because a MOD triggered at the wrong time!"},{"type":"texte","style":"h2","contenu":"💡 How to enable or disable the KillSwitch (total mute of the script's features):"},{"type":"texte","style":"p","contenu":"Press one of these combinations / buttons at any time:"},{"type":"liste","contenu":"- Either the {OPTIONS / MENUS} button on your controller.\n- Or the {PS / XBOX} button.\n- Or by holding {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entering and exiting the menu","blocs":[{"type":"liste","contenu":"🚪 **Open the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS}.\n🎯 **AntiRecoil quick access:** Hold {L2 / LT} and press {PS / XBOX} to directly open the active profile's AntiRecoil values *(if the AntiRecoil MOD is enabled on that profile)*.\n🚪 **Close the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS} *(if Auto Save is enabled in Misc, your settings are saved automatically)*.\n💾 **Save manually and exit:** Press {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Navigating and editing MOD values","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Navigating the menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual help on the OLED screen:**\n\n🧭 **Directional arrows:** *Arrows appear around the parameter to tell you directly which direction to press on the controller.*"},{"type":"texte","style":"p","contenu":"📜 **Instruction line:** *A text scrolls on the last line of the screen to guide you step by step if you are unsure which button to use.*"},{"type":"liste","contenu":"↕️ **Browse a list or a drop-down menu:** Use {D-Pad UP} or {DOWN} *(main menu, Cheats list, settings choices...)*.\n📥**Enter a menu / sub-menu:** Press {CROSS / A}.\n🔄**Change the profile to edit:** Press {CROSS / A} *(only in the Profile MODs menu)*.\n↔️**Move between sub-menus / MODs:** Use {D-Pad LEFT} or {RIGHT}.\n⚙️**Enable/Disable a MOD or change its type:** Use {D-Pad UP} or {DOWN}.\n↩️**Go back to the previous menu:** Press {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Editing numerical values *(e.g. AntiRecoil strength, Rapid Fire rate)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Enable the MOD:** If the MOD is *OFF*, you do not have access to its adjustable values.\n\n2️⃣ **Enter the edit menu:** Press {CROSS / A}.\n\n3️⃣ **Select the parameter:** Use {D-Pad LEFT} or {RIGHT} to navigate between the different options.\n\n4️⃣ **Change the value:** Hold {R1 / RB} then press {D-Pad RIGHT} (or {UP}) to increase, or {D-Pad LEFT} (or {DOWN}) to decrease.\n\n5️⃣ **Go back to the previous menu:** Press {CIRCLE / B}."}]}],"icone":"menu","sommaire":true,"canonique":"/navigation-oled/"}]},{"id":"gta5","nom":"DOGTAG5","jeu":"GTA V & GTA Online","description":"GTA V / GTA Online script: take total control of Los Santos with combat MODs, cheats and built-in cheat codes.","couleurHex":"#5aa9ff","couleurNomHex":"#5aa9ff","image":"/media/cartes/gta5.jpg","imageOpacite":0.3,"logoBadge":"/media/badges/gta5.jpg","banniere":"/media/bannieres/gta5.jpg","imagePartage":"/media/cartes/gta5.jpg","disponible":true,"onglets":[{"id":"accueil","titre":"Overview","titrePage":"DOGTAG5 — GTA V & GTA Online","icone":"liste","sommaire":true,"blocs":[{"type":"carte","image":"/media/bannieres/gta5.jpg","titre":"","contenu":""},{"type":"texte","style":"titre","contenu":"📋 Script Menu Structure and Contents","horsSommaire":true},{"type":"depliant","titre":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨","soustitre":"Essential settings in the console AND in the game","couleurHex":"#ffb547","mod":"vibrations-adt"},{"type":"depliant","titre":"🚗 Driving & Vehicle Handling","blocs":[{"type":"texte","style":"h3","contenu":"❓ What is vehicle handling and how does it work?"},{"type":"texte","style":"p","contenu":"This feature automatically adapts the script's behavior when you are driving a vehicle (or moving around bare-handed depending on your setup). It instantly neutralizes all the MODs that could interfere with driving (such as AntiRecoil) to guarantee you total control."},{"type":"texte","style":"h3","contenu":"🛠️ How it works depending on your setup"},{"type":"liste","contenu":"**🤖 Automatic Detection via ADT (PS5 & PC):**\n> When you play the PS5 or PC version of the game and the adaptive triggers (ADT) are enabled:\n- **Smart analysis:** The script analyzes the triggers' mechanical feedback to automatically detect whether you are driving a vehicle or moving bare-handed with no weapon equipped.\n- **OLED display:** The **\"Unarmed / In vehicle\"** state is automatically displayed on the Cronus Zen screen and the profile adapts instantly with no action on your part.\n**🎮 Manual Handling / Driving Mode (Xbox, PS4 or ADT disabled):**\n> If you play on a platform without ADT support (Xbox, PS4) or if you have disabled the adaptive triggers in your menus *(💡 it is however strongly recommended to always leave ADT and vibrations enabled in the console and game options)*:\n- **Manual switch**: Press the {TRIANGLE / Y} button to manually switch to \"**Driving**\" mode (or to return to your main weapon profile)."},{"type":"texte","style":"p","contenu":"🔄 **Reset and desynchronization**: If an offset occurs in-game (for example after a cutscene or a vehicle transition):\nHold the {L3 / LS} button and press {TRIANGLE / Y} to immediately reset the state.\n*(Note: This resynchronization system only applies to manual handling; automatic detection via ADT cannot become desynchronized).*"}]},{"type":"texte","style":"titre","contenu":"🎯 1. Profile MODs"},{"type":"texte","style":"p","contenu":"Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch from one profile to another."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a MOD** to display its detailed description and setup tips. Click again to close it."},{"type":"etiquettes","contenu":"🎯 AntiRecoil | 🔥 Fire MODs | 👁️ AIM Abuse | 💥 Shot MODs | 🔍 Auto ADS | 🔫 Auto Fire | 🔭 Auto Scope | 🎯 HeadShot Assist","mods":["antirecoil","fire-mods","aim-abuse","shot-mods","auto-ads-fire","auto-ads-fire","auto-scope","headshot-assist"]},{"type":"texte","style":"titre","contenu":"🌐 2. Global MODs"},{"type":"texte","style":"p","contenu":"Options that are always active in the script, whatever weapon profile is currently selected."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a MOD** to display its detailed description and setup tips. Click again to close it."},{"type":"etiquettes","contenu":"🏃 AutoRun | ⚡ Turbo CROSS / A | ⚡ Turbo SQUARE / X | ⚡ Turbo CIRCLE / B | 🤸 Easy Roll | 💣 Turbo RPG | 📢 Klaxon Hold | 🌪️ AutoSpin | 🩹 Quick Care","mods":["autorun","turbo-boutons","turbo-boutons","turbo-boutons","easy-roll","turbo-rpg","klaxon-hold","autospin","quick-care"]},{"type":"texte","style":"titre","contenu":"⚡ 3. MODs Activator"},{"type":"texte","style":"p","contenu":"Trigger conditions and states required to activate certain Profile MODs (e.g. only when aiming *ADS Only*, when shooting *FIRE*, or when aiming + shooting *ADS + FIRE*)."},{"type":"carte","couleur":"blue","contenu":"👇 **Click a mode** to display its detailed explanation. Click again to close it."},{"type":"etiquettes","contenu":"🔀 ADS + FIRE | 🎯 ADS | 💥 FIRE | 🎯 ADS Only | 💥 FIRE Only","mods":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"titre","contenu":"🎮 4. Controller"},{"type":"texte","style":"p","contenu":"Hardware and behavioral configuration of your controller (Stick sensitivity, Dead zone / *Stick Drift*, Y-axis inversion, Button remapping)."},{"type":"carte","couleur":"blue","contenu":"👇 **Click an option** to display its description and tips. Click again to close it."},{"type":"etiquettes","contenu":"🕹️ RS Sensitivity | 🕹️ LS Sensitivity | 🎯 Stick Drift | ⚡ Hair Trigger | 📳 Rumble & ADT | 🎛️ Buttons Layout | ↕️ Inverted RY | ↕️ Inverted LY","mods":["rs-ls-sensitivity","rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes","inverted-axes"]},{"type":"texte","style":"titre","contenu":"🛠️ 5. Misc"},{"type":"texte","style":"p","contenu":"System options and global operating settings of the Cronus Zen's virtual machine."},{"type":"carte","couleur":"blue","contenu":"👇 **Click an option** to display its description and tips. Click again to close it."},{"type":"etiquettes","contenu":"💾 Auto Save | ⏱️ VM Speed","mods":["auto-save","vm-speed"]},{"type":"texte","style":"titre","contenu":"🔀 6. Quick Toggle"},{"type":"texte","style":"p","contenu":"Quick controller shortcut assignments to enable or disa tyle":"h2","contenu":"❓ What are \"Profile MODs\"?"},{"type":"texte","style":"p","contenu":"This menu groups all the settings specific to a weapon or a game profile (**AntiRecoil, Fire MODs, Shot MODs...**). These values apply automatically as soon as you change profile in-game.\n\nEach profile has its own independent settings."},{"type":"mods","ids":["antirecoil","fire-mods","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist"]}],"icone":"cible","sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubrique":"MODs Library","canonique":"/profile-mods/"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 The Global MODs menu"},{"type":"texte","style":"h2","contenu":"❓ What are \"Global MODs\"?"},{"type":"texte","style":"p","contenu":"These are MODs or options that are always active, whatever the selected profile (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons","easy-roll","turbo-rpg","klaxon-hold","autospin","quick-care"]}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp","canonique":"/global-mods/"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 The MODs Activator menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"MODs Activator\"?"},{"type":"texte","style":"p","contenu":"The **MODs Activator** is the script's condition engine. It lets you define with total precision **when** and **how** your MODs should activate in-game.\n\nInstead of imposing a rigid behavior, this system listens to your buttons in real time and only triggers your modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) if the exact condition you chose is met."},{"type":"texte","style":"h2","contenu":"⚙️ How it works"},{"type":"texte","style":"p","contenu":"Every player has their own way of playing, and every weapon has its constraints. By assigning a specific trigger mode to each MOD, you avoid unintended activations (for example: doing a *Drop Shot* when you just wanted to adjust your aim from a distance).\n\nThe system analyzes the combination of your main buttons: the aim trigger (**ADS**) and the fire trigger (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 The 5 available trigger modes"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Which MODs use the MODs Activator?"},{"type":"texte","style":"p","contenu":"You can assign an independent activation mode to each of the following modules in your profile:"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **In summary:**\n\nThe MODs Activator offers tailor-made control of your controller. It adapts to your gameplay instead of forcing you to adapt your playstyle to the script."}],"icone":"eclair","sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp","canonique":"/mods-activator/"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 The Controller menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Controller\" menu?"},{"type":"texte","style":"p","contenu":"This is everything related to your controller's hardware configuration (Sensitivity, Dead zone / Stick Drift, Y-axis inversion, Button layout)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp","canonique":"/controller/"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ The Misc menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Misc\" menu?"},{"type":"texte","style":"p","contenu":"These are script system options (**Auto Save** to save your settings, **VM Speed** for execution speed)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp","canonique":"/misc/"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ The Quick Toggle menu (In-game shortcuts)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp","canonique":"/quick-toggle/"},{"id":"online-cheat","titre":"Online Cheat","icone":"globe","sommaire":true,"blocs":[{"type":"texte","style":"h1","contenu":"🌐 The Online Cheat menu (GTA Online)"},{"type":"modbody","mod":"online-cheat"}]},{"id":"story-cheat","titre":"Story Cheat","icone":"livre","sommaire":true,"blocs":[{"type":"texte","style":"h1","contenu":"👤 The Story Cheat menu (GTA V Story Mode)"},{"type":"modbody","mod":"story-cheat"}]},{"id":"quick-cheat","titre":"Quick Cheat","icone":"fusee","sommaire":true,"blocs":[{"type":"texte","style":"h1","contenu":"🚀 The Quick Cheat menu (In-game shortcuts)"},{"type":"modbody","mod":"quick-cheat"}]},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","rubrique":"Getting started","canonique":"/vibrations-adt/"},{"id":"navigation-oled","titre":"OLED Navigation & Menus","blocs":[{"type":"texte","style":"p","contenu":"All scripts share the same menu architecture and the same navigation system. This guide explains how to use the OLED menu, understand the structure of the menus and their contents, and adjust your settings."},{"type":"texte","style":"h1","contenu":"📖 General Guide & How My Scripts Work"},{"type":"depliant","titre":"📂 Main Menu structure","blocs":[{"type":"texte","style":"h3","contenu":"The features are divided into 6 distinct categories:"},{"type":"liste","contenu":"🔀 **Profile MODs**: Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch profile.\n🌍 **Global MODs**: Options that are always active, whatever the selected profile (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator**: Conditions required to trigger certain *Profile MODs* (e.g. only when aiming *ADS Only*, when shooting *FIRE*, or *ADS + FIRE*).\n🎮 **Controller**: Hardware configuration of your controller (Sensitivity, Dead zone / *Stick Drift*, Y-axis inversion, Button layout).\n⚙️ **Misc**: Script system options (*Auto Save* to save your settings, *VM Speed* for execution speed).\n⏱️ **Quick Toggle**: Quick controller shortcut assignments to enable or disable a MOD on the fly."}]},{"type":"depliant","titre":"🕹️ Additional game-specific menus","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)**: Automation modules dedicated to in-game mini-games and jobs (*Automatic fishing*, *5 Finger Fillet*, *Cooking*, *Bench Press* and more to come...) to succeed every time with no physical effort.\n🔄 **Switch Profile (FPS / TPS)**: Quick-switch system letting you change weapon profile or configuration (Profile 1, Profile 2, Primary, Secondary...) on the fly mid-game, to instantly adapt your MODs and your *AntiRecoil* to the weapon you are holding.\n🌐 **Online Cheat (GTA V)**: Quick actions to instantly run key actions from the Interaction menu in GTA Online (eating snacks, equipping heavy armor, respawning your personal vehicle...).\n👤 **Story Cheat (GTA V)**: Automatic execution of the official cheat code combinations reserved for GTA V Story mode (max health/armor, invincibility, weapons, environment effects...).\n🚀 **Quick Cheat (GTA V)**: Assignment of quick button combinations on your controller (same principle as *Quick Toggles*) to trigger your favorite GTA V *Cheats* on the fly mid-game."}]},{"type":"texte","style":"h1","contenu":"🧭 Navigation and editing guide"},{"type":"depliant","titre":"🛑 Safety: the KillSwitch (script cut-off)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Crucial warning:** Whether you are in a racing game or a shooter, the script blindly executes the instructions it contains. That is why it is **absolutely crucial to disable your script** when you navigate the game or console menus. Since a MOD runs on a simple button press, it would be a shame to delete a rare piece of equipment from your inventory or to buy/sell by mistake because a MOD triggered at the wrong time!"},{"type":"texte","style":"h2","contenu":"💡 How to enable or disable the KillSwitch (total mute of the script's features):"},{"type":"texte","style":"p","contenu":"Press one of these combinations / buttons at any time:"},{"type":"liste","contenu":"- Either the {OPTIONS / MENUS} button on your controller.\n- Or the {PS / XBOX} button.\n- Or by holding {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entering and exiting the menu","blocs":[{"type":"liste","contenu":"🚪 **Open the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS}.\n🎯 **AntiRecoil quick access:** Hold {L2 / LT} and press {PS / XBOX} to directly open the active profile's AntiRecoil values *(if the AntiRecoil MOD is enabled on that profile)*.\n🚪 **Close the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS} *(if Auto Save is enabled in Misc, your settings are saved automatically)*.\n💾 **Save manually and exit:** Press {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Navigating and editing MOD values","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Navigating the menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual help on the OLED screen:**\n\n🧭 **Directional arrows:** *Arrows appear around the parameter to tell you directly which direction to press on the controller.*"},{"type":"texte","style":"p","contenu":"📜 **Instruction line:** *A text scrolls on the last line of the screen to guide you step by step if you are unsure which button to use.*"},{"type":"liste","contenu":"↕️ **Browse a list or a drop-down menu:** Use {D-Pad UP} or {DOWN} *(main menu, Cheats list, settings choices...)*.\n📥**Enter a menu / sub-menu:** Press {CROSS / A}.\n🔄**Change the profile to edit:** Press {CROSS / A} *(only in the Profile MODs menu)*.\n↔️**Move between sub-menus / MODs:** Use {D-Pad LEFT} or {RIGHT}.\n⚙️**Enable/Disable a MOD or change its type:** Use {D-Pad UP} or {DOWN}.\n↩️**Go back to the previous menu:** Press {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Editing numerical values *(e.g. AntiRecoil strength, Rapid Fire rate)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Enable the MOD:** If the MOD is *OFF*, you do not have access to its adjustable values.\n\n2️⃣ **Enter the edit menu:** Press {CROSS / A}.\n\n3️⃣ **Select the parameter:** Use {D-Pad LEFT} or {RIGHT} to navigate between the different options.\n\n4️⃣ **Change the value:** Hold {R1 / RB} then press {D-Pad RIGHT} (or {UP}) to increase, or {D-Pad LEFT} (or {DOWN}) to decrease.\n\n5️⃣ **Go back to the previous menu:** Press {CIRCLE / B}."}]}],"icone":"menu","sommaire":true,"canonique":"/navigation-oled/"}]}],"mods":[{"id":"antirecoil","titre":"🎯 AntiRecoil","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is an AntiRecoil and how does it work?"},{"type":"texte","style":"p","contenu":"The AntiRecoil simulates the movement of your thumb on the analog stick by applying an opposing force to compensate for the weapon's recoil:"},{"type":"liste","contenu":"**Y axis (Vertical):** Compensates for the weapon's natural climb (or drop) when you shoot.\n**X axis (Horizontal):** Corrects lateral drift to the left or right."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Essential condition — Enabling vibrations:**\n\nVibrations must absolutely be **enabled in the game and console options**. My scripts automatically cut the compensation as soon as the game's vibrations stop. This prevents your crosshair from dropping if you keep the fire button held while your magazine is empty and your character is reloading."},{"type":"carte","couleur":"jaune","contenu":"💡 *If you don't want to feel the physical vibrations in your hands, you can disable them directly from the script's OLED menu in the* **Controller** *option.*"},{"type":"texte","style":"h3","contenu":"🛡️Safety: Offset Humanizer"},{"type":"texte","style":"p","contenu":"All my AntiRecoils are equipped with an **Offset Humanizer**. It adds slight random variations to the simulated physical movements to avoid reproducing perfectly mechanical, identical trajectories. This helps you stay undetected by anti-cheat systems.\n\n⚙️**The trigger system:** [**MODs Activator**](page:mods-activator)\n\nAntiRecoils rely on the [**MODs Activator**](page:mods-activator) system. These are the conditions required to trigger your MOD. You choose exactly *how* and *when* your MOD should activate"},{"type":"texte","style":"h2","contenu":"🎯 Which type of AntiRecoil should you choose?"},{"type":"texte","style":"p","contenu":"The **Progressive** and **Advanced** modes are by far the most powerful and precise.\n\nThe choice of mode mainly depends on the game and the weapon used, but also on how much you want to dive into the settings:"},{"type":"liste","contenu":"If you want a quick, hassle-free setup, go for the simpler modes (**Standard** or **Rumble**).\nIf you are looking for perfection and enjoy taking the time to understand and fine-tune your settings, the **Progressive** and **Advanced** modes will give you incomparable results."},{"type":"texte","style":"h1","contenu":"🛠️ The different AntiRecoil types available"},{"type":"texte","style":"h2","contenu":"1. 🔹 Standard"},{"type":"texte","style":"p","contenu":"A very simple AntiRecoil that just applies a fixed, constant value on each axis:"},{"type":"liste","contenu":"**Vertical:** A fixed value to compensate for the weapon's climb.\n**Horizontal:** A fixed value to correct the lateral offset."},{"type":"texte","style":"h2","contenu":"2. 📈 Progressive"},{"type":"texte","style":"p","contenu":"A dynamic vertical AntiRecoil coupled with a **Standard** horizontal AntiRecoil. It is ideal for weapons whose recoil changes in intensity over the burst.\n\nVertical parameters (3 values):"},{"type":"liste","contenu":"**Vertical Start:** Starting value applied from the very beginning of the shot.\n**Vertical End:** Final value to reach.\n**Vertical Time:** Duration (in milliseconds) to go from *Start* to *End* (e.g. 1000 = 1 second).\n**Horizontal:** Fixed value for the lateral offset."},{"type":"carte","couleur":"jaune","contenu":"💡 **Usage examples:**"},{"type":"liste","contenu":"**Strong initial kick:** If your weapon has a big initial kick and then settles, set for example *Start = 38*, *End = 24*, and *Time = 2000* (2 seconds). The compensation will start at 38 then gradually drop to 24 over 2 seconds.\n**Intensifying recoil:** If the weapon gets harder and harder to control as you keep shooting, set for example *Start = 20*, *End = 42*, and *Time = 4000* (4 seconds). The value will gradually rise from 20 to 42."},{"type":"texte","style":"h2","contenu":"3. 📳 Rumble (Low / Med / High)"},{"type":"texte","style":"p","contenu":"A vibration-based vertical AntiRecoil coupled with a **Standard** horizontal AntiRecoil.\n\nThe script retrieves the vibration data sent by the game and applies a coefficient to it (higher or lower depending on the chosen mode) to calculate the force to apply on the analog stick.\n\nAdjustable parameters:"},{"type":"liste","contenu":"**Rumble Power:** Adjusts the overall strength of the vertical AntiRecoil.\n**Rumble Horizontal:** Adjusts the fixed lateral correction (works like Standard mode)."},{"type":"carte","couleur":"jaune","contenu":"💡 *Tip: The* **Rumble Low** *mode applies a light coefficient. If the vertical compensation lacks strength, first try switching to* **Rumble Med*
