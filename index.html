suffit de configurer leur mode de bascule. Une fois débloqué, chaque profil dispose de ses propres réglages indépendants dans le menu **Profile MODs**.\n\nLe menu **Switch Profile** contient 3 options principales :"},{"type":"texte","style":"h2","contenu":"1. 🔀 Prim/Sec BTN","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Définit la méthode pour passer du profil **Primary** au profil **Secondary** (ou pour revenir au dernier profil utilisé après avoir quitté le profil Custom).\n\n**Note :** Configurer cette option débloque automatiquement le profil Secondary en jeu et dans le menu *Profile MODs*.\n\nModes de bascule disponibles :"},{"type":"liste","contenu":"🔘 **Tap BTN :** Un simple appui sur la touche choisie.\n🔘🔘 **Dbl-tap BTN :** Un double appui rapide sur la touche choisie.\n⏱️ **Hold BTN :** Un appui maintenu sur la touche choisie.\n🔣 **Combination :** Une combinaison de deux touches (maintenir un bouton + appuyer sur un autre)."},{"type":"texte","style":"h2","contenu":"2. 🎯 Custom *(accessible après avoir configuré Prim/Sec)*","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Définit la méthode pour basculer depuis le profil Primary ou Secondary vers le profil **Custom** (idéal pour un pistolet, une arme lourde ou un véhicule).\n\n**Note :** Configurer cette option débloque automatiquement le profil Custom en jeu et dans le menu *Profile MODs*.\n\nModes de bascule disponibles :"},{"type":"liste","contenu":"🔘🔘 **Dbl-tap BTN :** Un double appui rapide sur la touche choisie.\n⏱️ **Hold BTN :** Un appui maintenu sur la touche choisie.\n🔣 **Combination :** Une combinaison de deux touches (maintenir un bouton + appuyer sur un autre)."},{"type":"texte","style":"h2","contenu":"3. 🔄 Resync Profile *(accessible après avoir configuré Prim/Sec)*","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Permet de resynchroniser vos profils en jeu si un décalage survient (par exemple, si vous avez appuyé sur la touche de changement d'arme pendant une cinématique ou un chargement)."},{"type":"liste","contenu":"🔣 **Combination :** Seul le mode *Combination* est proposé. Il permet de faire défiler les profils en boucle jusqu'à retrouver le profil correspondant à votre arme en main."},{"type":"carte","couleur":"orange","titre":"🛡️ Protection anti-conflit (Gestion automatique des doublons)","contenu":"","blocs":[{"type":"texte","style":"p","contenu":"Pour éviter les erreurs de manipulation et garantir une compatibilité parfaite en jeu, le menu intègre une **sécurité active contre les conflits de touches** : il est impossible d'attribuer la même méthode **et** le même bouton à deux profils différents.\n\n**Comment le menu gère-t-il cela automatiquement ?** Le script filtre les options en temps réel et masque les touches déjà utilisées :"},{"type":"liste","contenu":"**Tap / Dbl-tap / Hold :** Deux profils peuvent utiliser la même méthode (ex. *Dbl-tap* pour Prim/Sec et Custom), mais ils ne pourront pas utiliser la même touche. Si vous choisissez *Dbl-tap + Triangle* pour *Prim/Sec*, la touche *Triangle* disparaîtra automatiquement de la liste des choix si vous sélectionnez *Dbl-tap* pour *Custom*.\n**Combination :** Les combinaisons peuvent partager le même bouton maintenu (*Hold*), à condition que le bouton tapé (*Tap*) soit différent (et inversement)."},{"type":"texte","style":"p","contenu":"💡 **En résumé :** Pas de risque de vous tromper ! Si un bouton n'apparaît pas dans votre menu, c'est qu'il est déjà attribué à une méthode identique sur un autre profil. Cette sécurité s'applique dynamiquement sur **Prim/Sec**, **Custom** et **Resync**."}]}],"scripts":["fps-tps"]},{"id":"online-cheat","titre":"🌐 Le menu Online Cheat (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Online Cheat et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**Online Cheat** est un module d'automatisation des menus d'interaction dans *GTA Online*. Il regroupe environ **10 manipulations rapides** complexes que vous devriez normalement exécuter manuellement au {D-Pad} en ouvrant le menu d'interaction.\n\nLe script reproduit ces enchaînements en une fraction de seconde pour vous équiper, vous soigner ou gérer votre matériel sans interrompre vos combats."},{"type":"texte","style":"h2","contenu":"📋 Exemples d'actions automatisées"},{"type":"texte","style":"p","contenu":"Parmi la dizaine de raccourcis intégrés au script, vous trouverez :"},{"type":"liste","contenu":"**🚁 Sparrow :** Appelle et fait apparaître automatiquement un hélicoptère Sparrow à proximité depuis votre inventaire.\n🥽 **Thermal Vision :** Bascule l'activation du casque à vision thermique en un clin d'œil.\n🚘 **Personal Vehicle :** Demande le livreur ou fait réapparaître votre véhicule personnel à proximité."},{"type":"texte","style":"h2","contenu":"⚙️ Comment exécuter un Online Cheat ?"},{"type":"texte","style":"p","contenu":"Vous disposez de deux méthodes d'activation au choix :\n\n1️⃣ **Depuis l'écran OLED :** Naviguez directement dans le menu **Online Cheat** du script, sélectionnez le Cheat désiré et tapez sur {CROSS / A} pour lancer l'action souhaitée.\n\n2️⃣ **Via un** [**Quick Cheat**](/gta5/quick-cheat/)*:* Assignez l'action à un raccourci manette personnalisé dans le menu [**Quick Cheat**](/gta5/quick-cheat/) pour un lancement instantané au cœur de l'action."}],"scripts":["gta5"]},{"id":"story-cheat","titre":"👤 Le menu Story Cheat (GTA V Mode Histoire)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Story Cheat et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Story Cheat** intègre l'intégralité des codes de triche officiels du mode solo de *GTA V*. Au lieu de mémoriser et de tapoter de longues combinaisons de touches sur la manette, le script envoie la séquence complète à votre place dès que vous le sélectionnez."},{"type":"texte","style":"h2","contenu":"🗂️ Organisation des codes par catégories"},{"type":"texte","style":"p","contenu":"Tous les codes du jeu sont répertoriés et classés en 4 groupes distincts dans le menu du script :"},{"type":"liste","contenu":"🔫 **Weapon (Armes) :** Obtenir toutes les armes, munitions explosives, balles enflammées, etc.\n🏃 **Character (Personnage) :** Invincibilité temporaire, santé/armure au maximum, super saut, coup de poing explosif (*Super Punch*), courir/nager plus vite.\n🚗 **Vehicle (Véhicules) :** Faire apparaître n'importe quel véhicule du jeu (Buzzard, Comet, Sanchez, Trashmaster, etc.).\n🌀 **Misc (Divers) :** Augmenter ou réduire l'indice de recherche, modifier la météo, gravité lunaire, mode ralenti (*Slow Motion*)."},{"type":"texte","style":"h2","contenu":"⚙️ Comment exécuter un Story Cheat ?"},{"type":"texte","style":"p","contenu":"Vous disposez de deux méthodes d'activation au choix :\n\n1️⃣ **Depuis l'écran OLED :** Naviguez directement dans le menu Story Cheat du script, sélectionnez le Cheat désiré et tapez sur {CROSS / A} pour lancer l'action souhaitée.\n\n2️⃣ **Via un** [**Quick Cheat**](/gta5/quick-cheat/)*:* Assignez l'action à un raccourci manette personnalisé dans le menu [**Quick Cheat**](/gta5/quick-cheat/) pour un lancement instantané au cœur de l'action."}],"scripts":["gta5"]},{"id":"quick-cheat","titre":"🚀 Le menu Quick Cheat (Raccourcis en jeu)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'un Quick Cheat et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Quick Cheat** fonctionne sur le même principe que les [**Quick Toggles**](page:quick-toggle). Il vous permet d'attribuer une action issue des menus **Online Cheat** ou **Story Cheat** à une combinaison de touches dédiée sur votre manette.\n\nAu lieu de devoir ouvrir un menu en plein affrontement, il vous suffit de réaliser votre raccourci pour que l'action s'exécute automatiquement en tâche de fond."},{"type":"texte","style":"h2","contenu":"🛠️ Exemple d'utilisation en jeu"},{"type":"liste","contenu":"**Sur le terrain :** Vous êtes en train de vous faire tirer dessus dans *GTA Online*.\n**Action :** Plutôt que d'ouvrir le menu d'interaction pour chercher votre armure, vous faites simplement votre raccourci **Quick Cheat** personnalisé.\n**Résultat :** Le script remet votre armure ultra-lourde instantanément, pendant que vous continuez à vous déplacer et à tirer."},{"type":"carte","couleur":"jaune","contenu":"💡 **Personnalisation :** Vous pouvez configurer vos raccourcis **Quick Cheat** directement dans le menu du script pour garder vos fonctions préférées (soin, armure, vision thermique ou véhicule) au bout des doigts."}],"scripts":["gta5"]},{"id":"five-finger-fillet","titre":"🔪 5 Finger Fillet (Jeu du couteau)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD 5 Finger Fillet et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Ce MOD mémorise les séquences de touches de vos adversaires au jeu du couteau (*Five Finger Fillet*) et les exécute automatiquement à une vitesse et une précision parfaites, vous garantissant de remporter toutes vos parties sans aucun risque de vous rater."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"texte","style":"p","contenu":"1️⃣ **Mise en place :** Approchez-vous d'une table de jeu (par exemple à Strawberry). Dans le menu **Activity**, validez **5 Finger Fillet** avec {CROSS / A}, puis asseyez-vous à la table pour démarrer la partie."},{"type":"texte","style":"h3","contenu":"2️⃣ Mémorisation de la séquence :"},{"type":"liste","contenu":"- Maintenez {R2 / RT} enfoncé pendant la démonstration de l'adversaire.\n- Tout en maintenant {R2 / RT}, saisissez **les 5 derniers boutons** de la combinaison (ignorez le premier bouton qui est toujours {CROSS / A})."},{"type":"texte","style":"p","contenu":"3️⃣ **Lancement du tour :** Quand vient votre tour de jouer, appuyez une fois sur la touche {D-Pad BAS} pour déclencher l'enchaînement automatique.\n\n4️⃣ **Arrêt du tour :** Dès que la séquence est terminée et la manche gagnée, appuyez sur {D-Pad HAUT} pour stopper la boucle.\n\n5️⃣ **Manches suivantes :** Lorsque l'adversaire propose une nouvelle séquence :"},{"type":"liste","contenu":"- Maintenez {R2 / RT} et appuyez sur {L2 / LT} pour effacer la combinaison précédente.\n- Maintenez à nouveau {R2 / RT} et saisissez la nouvelle séquence de 5 touches."}],"scripts":["rdr2"]},{"id":"cooking","titre":"🥩 Cooking (Cuisson automatique de viande)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Cooking et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le MOD **Cooking** prend en charge la cuisson en chaîne de vos viandes au feu de camp. Il vous évite de devoir maintenir les touches à la main pendant de longues minutes lorsque vous devez préparer de grands stocks de nourriture pour votre personnage."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"texte","style":"p","contenu":"1️⃣ **Mise en place :** Positionnez votre personnage devant un feu de camp de manière à ouvrir le menu de cuisine.\n\n2️⃣ **Lancement :** Dans le menu **Activity**, lancez **Cooking** en appuyant sur {CROSS / A}.\n\n3️⃣ **Sélection de la viande :** Choisissez la viande que vous voulez préparer et maintenez {CROSS / A} pendant 1 seconde pour démarrer le processus."},{"type":"texte","style":"h3","contenu":"4️⃣ Choix du mode de conservation :"},{"type":"liste","contenu":"- **Ranger en continu :** Appuyez sur {SQUARE / X} pour que le script stocke automatiquement chaque morceau cuit dans votre inventaire (par défaut).\n- **Manger en continu :** Appuyez sur {R2 / RT} pour que votre personnage consomme directement chaque préparation sur place."}],"scripts":["rdr2"]},{"id":"gta6-activity-test","titre":"Activités en phase de test","scripts":["gta6"],"blocs":[{"type":"carte","couleur":"rouge","contenu":"🧪 **Activités en phase de test :** pour le moment, toutes les activités du script (**Fishing**, **Bench Press** et celles à venir) sont en phase de test. Leurs rythmes et leurs séquences de touches seront affinés et optimisés dès la sortie officielle du jeu."}]},{"id":"activity-rdr2-fishing","titre":"🎣 Fishing (Pêche automatique)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Fishing et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le MOD **Fishing** automatise l'intégralité du processus de pêche. Il gère le moulinage lent pour attirer le poisson, le ferrage instantané dès la touche, et le ramener rapidement au bord. L'écran OLED du Cronus Zen affiche l'état exact de la pêche en temps réel."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"texte","style":"p","contenu":"1️⃣ **Mise en place :** Équipez votre canne à pêche au bord d'un cours d'eau.\n\n2️⃣ **Lancement :** Ouvrez le menu **Activity** du script et lancez **Fishing** en appuyant sur {CROSS / A}.\n\n3️⃣ **Préparation :** Sélectionnez votre leurre ou votre appât dans le jeu.\n\n4️⃣ **Lancer de ligne** : Maintenez {L2 / LT} puis {R2 / RT}, puis relâchez {R2 / RT} pour jeter la ligne. Relâchez ensuite tous les boutons de la manette."},{"type":"liste","contenu":"*Note : Si le lancer ne vous convient pas, appuyez sur* {CIRCLE / B} *pour annuler et relancez votre ligne.*"},{"type":"texte","style":"h3","contenu":"5️⃣ Gestion automatique par le script :"},{"type":"liste","contenu":"Le script mouline doucement à votre place pour stimuler les poissons.\nDès qu'un poisson mord à l'hameçon, le script le ferre automatiquement.\nLe script bascule en moulinage rapide pour ramener la prise au plus vite."},{"type":"texte","style":"p","contenu":"6️⃣ **Combats avec le poisson :** Lorsque le poisson se débat, le script stoppe automatiquement le moulinage. Orientez simplement votre stick pour contrer les déplacements du poisson. Dès qu'il se calme, le script reprend le moulinage rapide.\n\n7️⃣ **Fin de prise :** Choisissez en jeu de garder le poisson ou de le rejeter à l'eau. Remettez un appât si nécessaire et relancez votre ligne."}],"scripts":["rdr2"]},{"id":"activity-gta6-intro","titre":"Introduction Activity (GTA VI)","scripts":["gta6"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu Activity ?"},{"type":"texte","style":"p","contenu":"Le menu **Activity** regroupe un ensemble de modules d'automatisation dédiés aux mini-jeux et activités secondaires de *GTA VI*.\n\nCes MODs simplifient ou prennent entièrement en charge les manipulations répétitives (pêche, développé couché) pour vous éviter la fatigue musculaire et vous garantir 100% de réussite."},{"type":"carte","couleur":"jaune","contenu":"💡 **Quitter une activité :** Pour sortir de n'importe quel module du menu Activity et revenir au jeu standard, maintenez la touche {CIRCLE / B} enfoncée pendant quelques secondes."},{"type":"modbody","mod":"gta6-activity-test"},{"type":"texte","style":"p","contenu":"De plus, de **nouvelles activités seront ajoutées au fur et à mesure** que le jeu sera exploré et que de nouveaux mini-jeux seront découverts."}]},{"id":"activity-rdr2-intro","titre":"Introduction Activity (RDR2)","scripts":["rdr2"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu Activity ?"},{"type":"texte","style":"p","contenu":"Le menu **Activity** regroupe un ensemble de modules d'automatisation dédiés aux mini-jeux et activités secondaires de *Red Dead Redemption 2* et *Red Dead Online*.\n\nCes MODs simplifient ou prennent entièrement en charge les manipulations répétitives (pêche, jeu du couteau, cuisson de viande) pour vous éviter la fatigue musculaire et vous garantir 100 % de réussite."},{"type":"carte","couleur":"jaune","contenu":"💡 **Quitter une activité :** Pour sortir de n'importe quel module du menu Activity et revenir au jeu standard, maintenez la touche {CIRCLE / B} enfoncée pendant quelques secondes."}]}]};

<script>window.SITE_DATA_EN={"nomSite":"noozbar Scripts","titreSite":"noozbar — Premium Scripts for Cronus ZEN","pied":"© noozbar — Premium Scripts for Cronus ZEN · [Discord](https://discord.gg/e2v4NN4fVu) · [Zen Studio Live](https://zenstudio.collectivemindsstore.com/)","portail":{"onglets":[{"id":"accueil","titre":"Home","blocs":[{"type":"texte","style":"titre","contenu":"🚀 Expertise, Technology & Innovation"},{"type":"depliant","titre":"🎓 Recognized expertise since 2017","blocs":[{"type":"texte","style":"p","contenu":"A GPC developer since **2017** and a pioneer of Cronus development with over **441,000 downloads** on [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/), I'm stepping back into the spotlight after a more discreet period.\n\nI used that quieter pace to start again from scratch: **a fully rewritten menu, new development methods and 100% proprietary code**. Even for the most classic features, **there is no copy-paste: every line was written from A to Z by me, and every MOD was rethought, redesigned and optimized.**"}]},{"type":"depliant","titre":"🔬 An ultra-precise architecture","blocs":[{"type":"liste","contenu":"**Polar encoding:** Everything in my scripts is coded in Polar. It is **327.67 times more precise** than the usual standard, which only allows small values between -100 and +100. This gives my MODs extreme precision.\n**Shared working variables:** In a classic script, each MOD blindly applies its own value, and it is often the last MOD read that overrides the previous ones. Here, every MOD works on and modifies shared variables. Once all the MODs have run, the final values are applied to the sticks and buttons to perform the action. The result? Absolute smoothness, compatibility and precision between all the MODs.\n**VM Speed optimization:** All combo and MOD timings are dynamically recalculated by the script to adapt perfectly to any *VM Speed* chosen in the menu. Not a single millisecond is lost."}]},{"type":"depliant","titre":"🤖 Smart Humanizers","blocs":[{"type":"texte","style":"p","contenu":"On top of the care taken with in-game precision, I built in advanced systems to keep you safe:"},{"type":"liste","contenu":"**Timing Humanizer:** Applied to MODs such as *Turbo Buttons, AIM Abuse* or *Strafe Shot*. It generates micro-variations in the execution timing. This avoids frozen, repeated intervals down to the millisecond, giving button spamming a lively, 100% natural rhythm.\n**Offset Humanizer:** Applied to MODs such as *AntiRecoil, LS/RS Assist* or *Strafe Shot*. It adds slight random variations to the simulated physical movements. The stick trace keeps a subtle human imperfection, making the trajectories impossible to tell apart from manual control.\n**Cycle Humanizer:** Applied to MODs such as *RapidFire and BurstFire*. It produces Hold/Release cycles that constantly differ, while strictly respecting the overall fire rate you have set. Your shots keep a smooth, natural rhythm, removing the frozen or automated feel of classic macros."},{"type":"texte","style":"p","contenu":"These *Humanizers* are designed to never reproduce perfectly mechanical, identical movements or timings, which helps you very effectively stay undetected by anti-cheat systems."}]},{"type":"texte","style":"titre","contenu":"📜 My scripts"},{"type":"cartesscripts","partie":"scripts"},{"type":"texte","style":"titre","contenu":"📚 Documentation, Community & Subscription"},{"type":"cartesscripts","partie":"extra"},{"type":"depliant","titre":"💎 How does the Supporter subscription work?","blocs":[{"type":"texte","style":"p","contenu":"To access and unlock all my scripts, a monthly subscription **with no commitment** *(cancellable at any time)* has been set up."},{"type":"liste","contenu":"🔓 **Unlimited access to ALL my scripts:** Unlike other developers who sell each script individually at the same price, your subscription gives you access to my entire script library for as long as it is active.\n🎖️ **Exclusive Badge & Role:** A dedicated role and a Supporter badge are displayed on your Discord profile.\n🚀 **Early access:** Early access to some updates, new features and beta tests of upcoming scripts.\n🛠️ **Priority support:** A Supporters-only channel on Discord to get quick, personalized help when needed."}]},{"type":"depliant","titre":"❓How do I install one of my scripts on the Cronus ZEN?","blocs":[{"type":"texte","style":"p","contenu":"The installation is done entirely online in just a few clicks:\n\n1️⃣ Go to the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) website\n\n2️⃣ Search for the name **GamerTagFR** or directly the script name in the **Scripts Library**.\n\n3️⃣ In the list of scripts offered by **GamerTagFR**, choose one of my scripts.\n\n4️⃣ Click the blue **\"Send to Slot\"** button of the script, choose the slot you want to put the script on, then click the yellow\n**\"Program\"** button."}]},{"type":"depliant","titre":"🔒 How do I unlock one of my scripts?","blocs":[{"type":"texte","style":"p","contenu":"On the first launch on your Cronus ZEN, the script displays an **\"ID\"** code and a **\"C:\"** code on the OLED screen:\n\n1️⃣ Go to our [**Discord**](https://discord.gg/e2v4NN4fVu) server, in the **#Code-Scripts** section (access reserved for *Supporters*).\n\n2️⃣ At the bottom of the page, a **BOT** offers to give you your unlock code: click the **\"Obtenir mon code\"** *(Get my code)* button to open the code request window.\n\n3️⃣ Enter your **ID** code in the *Identifier (10 digits)* field and your **C:** code in the *Cycle number* field of the code request window so the BOT generates your unique unlock key.\n\n4️⃣ Enter this code using your controller's directional pad (D-Pad: **UP — DOWN — LEFT — RIGHT**).\n\n5️⃣ Once the code is entered, hold the {CROSS / A} button for 2 to 3 seconds: the script is unlocked permanently!"}]},{"type":"depliant","titre":"♻️ How do updates work?","blocs":[{"type":"texte","style":"p","contenu":"Updates are **100% free** for all active Supporters.\n\nWhen a new version is released, an announcement is posted on Discord. Simply go back to the *Scripts Library* on [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) and send the new version to your slot in place of the old one."}]},{"type":"texte","style":"h1","contenu":"❓ Need help?","horsSommaire":true},{"type":"cartelien","affichage":"pleine","titre":"Join the Discord","icone":"link","iconePersonnalisee":"💬","couleurHex":"#7c5cff","destination":"https://discord.gg/e2v4NN4fVu","contenu":"Join a community of **22,000+ members**: support, update announcements and unlock codes (#Code-Scripts)."},{"type":"carte","image":"/media/discord-gamertagfr.jpg","titre":"","contenu":"","lien":"https://discord.gg/e2v4NN4fVu"}],"icone":"home","entete":"accueil","grandTitre":"Premium Scripts","sousTitre":"Cronus ZEN scripts by noozbar for GTA VI, Multi FPS/TPS, Red Dead Redemption II and GTA V: full documentation, recommended settings and support.","sommaire":false,"descriptionPartage":"Premium Cronus ZEN scripts by noozbar: GTA VI, Multi FPS/TPS, RDR2 and GTA V. Documentation, settings and support."},{"id":"cronus-zen","titre":"Overview","titrePage":"Cronus ZEN","icone":"ordinateur","rubrique":"Cronus ZEN","sommaire":false,"descriptionPartage":"Technical guide, PS5 Bypass, update, troubleshooting and glossary for the Cronus ZEN.","blocs":[{"type":"texte","style":"p","contenu":"⬇️ Everything you need to know about your Cronus ZEN, sorted by topic ⬇️"},{"type":"cartelien","titre":"Cronus ZEN Technical Guide","icone":"terminal","destination":"page:guide-cronus-zen","contenu":"🔌 Connections · 🧩 Ports · 📡 Output Protocol · 🔁 Switching scripts on the fly · 🏭 Factory Reset · 🧹 Full reset"},{"type":"cartelien","titre":"PS5 Connection (Bypass)","icone":"bouclier","destination":"page:bypass-ps5","contenu":"The specific procedure for using your Cronus ZEN on PS5 (DualSense, DualSense Edge, third-party controller)."},{"type":"cartelien","titre":"Other Platform Connection","icone":"ordinateur","destination":"page:connexion-xbox-pc","contenu":"Connecting your Cronus ZEN and controller on Xbox, PS4, Switch or PC, with a third-party controller or keyboard / mouse."},{"type":"cartelien","titre":"Cronus ZEN Update","icone":"actualiser","destination":"page:mise-a-jour-zen","contenu":"Update the firmware or roll back to an earlier version (Downgrade)."},{"type":"cartelien","titre":"Troubleshooting & FAQ","icone":"outil","destination":"page:depannage-faq","contenu":"E3 errors, sound problems, Wheel / Tournament mode, Output Protocol..."},{"type":"cartelien","titre":"Glossary","icone":"liste","destination":"page:lexique","contenu":"The dictionary of technical terms, buttons and abbreviations used in the manual."}]},{"id":"guide-cronus-zen","titre":"Technical Guide","blocs":[{"type":"texte","style":"p","contenu":"Everything technical about your Cronus ZEN, step by step. Click a title to open the procedure, click again to close it."},{"type":"depliant","titre":"🔌 Connections and basic checks","blocs":[{"type":"texte","style":"h2","contenu":"❓ What should you check before starting?"},{"type":"texte","style":"p","contenu":"To ensure your Cronus Zen works properly and to avoid unexpected disconnections or detection errors, make sure you meet these essential hardware requirements."},{"type":"texte","style":"h2","contenu":"📋 Pre-flight checklist"},{"type":"liste","contenu":"🔄 **Up-to-date firmware:** Make sure your Cronus Zen is updated to the latest firmware version (see the *Updating your Cronus Zen* section).\n🎛️ **Cable quality:** Use **data transfer cables** (*Data Transfer*) exclusively.\n> ⚠️ **Cable warning:** **Never** use **charge-only cables** (*Charge-Only*). These cables do not carry control signals and will prevent the console or PC from detecting your hardware."}]},{"type":"depliant","titre":"🔌 Cronus Zen port layout and roles","blocs":[{"type":"texte","style":"h2","contenu":"1. 🖥️ CONSOLE & FIRMWARE port *(on the back)*"},{"type":"liste","contenu":"**Usage:** Connects the Cronus Zen to your console (PS5, PS4, Xbox, Switch) or to your PC for gaming.\n**Other function:** Used to perform firmware updates via [*Zen Studio Live*](https://zenstudio.collectivemindsstore.com/)."},{"type":"texte","style":"h2","contenu":"2. 💻 PROG port *(on the right side)*"},{"type":"liste","contenu":"**Usage:** Connects the Cronus Zen to your laptop or desktop PC.\n**Sole function:** Only used to program, configure and transfer your GPC scripts and GamePacks to the Cronus Zen slots from [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/)."},{"type":"texte","style":"h2","contenu":"3. 🎮 A1 port *(on the left side)*"},{"type":"liste","contenu":"**Usage:** Plug in your **main official controller** (DualSense for PS5, Xbox controller for Xbox, etc.).\n**Role:** Acts as hardware security and authentication with the console."},{"type":"texte","style":"h2","contenu":"4. ⌨️ A2 & A3 ports *(on the front)*"},{"type":"liste","contenu":"**Port A2 (Front right) & Port A3 (Front left):** Used to connect a third-party controller (*Crossover Controller* — for example an Xbox controller to play on PlayStation) or your Keyboard & Mouse peripherals."},{"type":"carte","image":"/media/guide/ports-cronus-zen.webp","titre":"","contenu":""}]},{"type":"depliant","titre":"📡 Output Protocol","blocs":[{"type":"texte","style":"p","contenu":"For peace of mind and absolute compatibility with your platform, it is wise to manually set the **Output Protocol** of your Cronus Zen.\n\nBy default, this setting is on **AUTO**. Although it works in most cases, it can sometimes fail to correctly detect your hardware and block communication. Manually setting your protocol is an excellent practice to prevent any malfunction."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step setup procedure"},{"type":"texte","style":"p","contenu":"1️⃣ Connect your Cronus Zen to your computer via the **PROG** port *(located on the right side of the unit)*.\n\n2️⃣ Open the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) application.\n\n3️⃣ Click the **Device Management** tab, then select **Device Settings**.\n\n4️⃣ In the window that opens, find the **Output Protocol** line.\n\n5️⃣ Replace the **AUTO** mode by explicitly selecting your console from the list *(PS5, PS4, Xbox Series X/S, PC, Nintendo Switch...)*.\n\n6️⃣ Close the window to save the setting automatically, then reconnect your Zen to your console or PC."}]},{"type":"depliant","titre":"🎮 Switching scripts on the fly (Remote Slot Change)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Setup procedure:"},{"type":"texte","style":"p","contenu":"1️⃣ Connect your Cronus Zen to your computer via the **PROG port** *(right side)*.\n\n2️⃣ Open the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) application.\n\n3️⃣ Click the **Device Management** tab, then select **Device Settings**.\n\n4️⃣ In the window, find the **Remote Slot Change** line.\n\n5️⃣ Select the desired option from the drop-down menu. *(💡 Hover over the* **\"i\"** *icon next to the field to see the exact control combination on your controller).*\n\n6️⃣ Close the window to save your choice."},{"type":"carte","couleur":"jaune","contenu":"💡 **In-game use:** Perform the chosen button combination at any time during your session to instantly switch to the next *slot* without interrupting your game."}]},{"type":"depliant","titre":"🏭 Factory Reset (Hard Reset)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning:** The Factory Reset erases the entire memory of your Cronus Zen. All your scripts saved in the *slots* as well as your personal configurations will be permanently deleted."},{"type":"texte","style":"p","contenu":"You have **two methods** to perform a *Factory Reset*:"},{"type":"texte","style":"h2","contenu":"🛠️ Method 1: Hardware reset (P1 and P2 buttons)","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Completely disconnect your Cronus Zen from any power source.\n\n2️⃣ Press and hold the **P1** and **P2** buttons simultaneously *(the two blue buttons located under the device)*.\n\n3️⃣ While holding both buttons down, connect your Cronus Zen to your computer *(whichever USB port you use)*.\n\n4️⃣ As soon as a **Red ➔ Green ➔ Blue** light sequence plays on the unit, you can release the buttons."},{"type":"texte","style":"h2","contenu":"💻 Method 2: Software reset (Via [ZEN Studio Live](https://zenstudio.collectivemindsstore.com/))","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Connect your Cronus Zen to your computer using the cable plugged into the **PROG port** *(right side)*.\n\n2️⃣ In [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/), click the **Device Management** tab, then select **Factory Reset**.\n\n3️⃣ In the security window that opens, type the word **RESET** in the required field then confirm.\n\n4️⃣ The **Red ➔ Green ➔ Blue** LED sequence plays on the unit to confirm the operation."},{"type":"carte","couleur":"jaune","contenu":"💡 **Check:** After the reset, the OLED screen refreshes to the default home screen and all your memory *slots* appear empty again."}]},{"type":"depliant","titre":"🧹 Full reset","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Complete reset procedure (step by step):"},{"type":"texte","style":"p","contenu":"1️⃣ **Connecting to the PC:** Connect your Cronus Zen to your computer using the cable plugged into the **PROG port** *(right side)*.\n\n2️⃣ **Opening the software:** Launch the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) application.\n\n3️⃣ **System purge (Device Management):** Click the **Device Management** icon and run the following 3 operations in succession:"},{"type":"liste","contenu":"- 🗑️ **Erase Memory Slots:** Erases all the scripts and profiles saved in the unit's memories.\n- 📡 **Clear Bluetooth:** Resets wireless pairings and the memories of saved devices.\n- 🔄 **Factory Reset:** Resets the entire hardware configuration."},{"type":"texte","style":"h3","contenu":"4️⃣ Clean firmware reinstall:"},{"type":"liste","contenu":"- Perform a [**Downgrade**](page:mise-a-jour-zen) to the oldest firmware version available.\n- Once the flash is complete, immediately start an update to the **latest version** (*Update to latest*)."},{"type":"carte","couleur":"rouge","titre":"🚨 If the problem persists after this procedure:","contenu":"","blocs":[{"type":"liste","contenu":"Make sure to follow the step-by-step installation procedure without skipping any step.\nCheck your USB cables. Only certified **Data Transfer** cables *(data & charge)* allow stable operation.\nChange the USB port on your computer or console. Plug the unit directly into the motherboard or the console *(avoid USB hubs and extension cables)*."}]}]},{"type":"carte","image":"/media/guide/guide-cronus-zen-2.webp","titre":"","contenu":""}],"icone":"terminal","sommaire":false,"titrePage":"Cronus ZEN Technical Guide"},{"id":"bypass-ps5","titre":"PS5 Connection (Bypass)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the PS5 Bypass procedure?"},{"type":"texte","style":"p","contenu":"Because of the PlayStation 5's native security measures, the Cronus Zen requires a specific authentication procedure (called **Bypass**) to work properly without disconnecting after a few minutes of play."},{"type":"depliant","titre":"⚙️ 1. Initial PS5 console setup *(To be done only once)*","blocs":[{"type":"texte","style":"p","contenu":"Before first use, connect your DualSense or DualSense Edge controller directly to the console (without going through the Cronus Zen) and apply the following settings:"},{"type":"texte","style":"h2","contenu":"A. Enabling Bluetooth","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Go to **Settings > Accessories > General > Advanced Settings**.\n\n2️⃣ If the **\"Enable Bluetooth\"** button is displayed, press {CROSS} to enable it (your console will restart)."},{"type":"texte","style":"h2","contenu":"B. Setting up the communication method","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Go to **Settings > Accessories > Controller (General) > Communication Method**.\n\n2️⃣ Select **\"Use USB Cable\"**."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning:** Remember to check this setting after every PS5 system update, as the console may sometimes reset this choice to its default."},{"type":"texte","style":"h2","contenu":"C. Preventing your controllers from sleeping or entering rest mode","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Go to **Settings > System > Power Saving**\n\n2️⃣ Set the 3 parameters as follows:"},{"type":"liste","contenu":"*Set time until PS5 enters rest mode:* Set both parameters to **Do Not Put in Rest Mode**\n*Set when controllers turn off =* **Do Not Turn Off**"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning:** Your authentication controller going to sleep can cancel your Bypass and cause disconnections."},{"type":"texte","style":"h2","contenu":"D. Selecting the Gearhead profile","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Connect your Cronus Zen to the PS5 using the cable plugged into the rear **CONSOLE & FIRMWARE** port.\n\n2️⃣ Make sure your Cronus Zen is on the **Gearhead** profile *(alien head logo* 👽*)*: if a script is currently loaded, press the big blue button on the right of the Cronus Zen until the Gearhead logo appears on the OLED screen.\n\n3️⃣ Then unplug your Cronus Zen from the PS5."},{"type":"carte","image":"/media/guide/bypass-ps5-1.webp","titre":"","contenu":""}]},{"type":"depliant","titre":"🛡️ 2. PS5 Bypass procedure (DualSense Standard)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **When to perform this procedure?** You must redo this procedure every time you turn on or restart your console, if you unplug the Cronus Zen from the PS5, or if you unplug the authentication controller from port A1."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Before the first connection:** Manually set the **Output Protocol** to **PLAYSTATION 5** in [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(Device Management > Device Settings)* to avoid any malfunction related to AUTO mode."},{"type":"liste","contenu":"Plug your **DualSense** controller into the **A1** port *(located on the left side of your Cronus Zen)*.","numerote":true},{"type":"carte","couleur":"orange","contenu":"Important: the Cronus Zen must be connected to the PS5."},{"type":"liste","contenu":"On your PS5, go to **Settings** ➔ **Accessories** ➔ **General** and highlight **Turn Off Accessories**.\n> 🛑 *Do not click it: the option must only stay highlighted on the screen.*\nPress and hold the {D-Pad RIGHT} button (directional pad right) on your controller and do not release it under any circumstances during the rest of the procedure.\nWhile holding the D-Pad RIGHT button, click the **Reset** button located under your Cronus Zen.\nWait **5 seconds** while the Bypass runs, then release the D-Pad RIGHT button.\nExit the console menus by pressing {CIRCLE}. Your Bypass is active and operational!","numerote":true,"debut":2},{"type":"carte","couleur":"jaune","contenu":"💡 **Good practice — Script activation:** Activate your script only once your game is running in the game (avoid loading the script in the console or game menus).\n\n**Why?** At startup, some scripts automatically detect the state of the adaptive triggers (ADT). If you are still in the console menus, no mechanical data is transmitted, which can block the script's initialization."}]},{"type":"depliant","titre":"🛡️ 3. PS5 Bypass procedure (DualSense Edge)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **When to perform this procedure?** You must redo this procedure every time you turn on or restart your console, if you unplug the Cronus Zen from the PS5, or if you unplug the authentication controller from port A1."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Before the first connection:** Manually set the **Output Protocol** to **PLAYSTATION 5** in [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(Device Management > Device Settings)* to avoid any malfunction related to AUTO mode."},{"type":"liste","contenu":"Connect your controller to your console via Bluetooth *(you must be able to navigate your console settings)*.\nPlug your **DualSense Edge** controller into the **A1 port** *(located on the left side of your Cronus Zen)*.","numerote":true},{"type":"carte","couleur":"orange","contenu":"Important: the Cronus Zen must **not** be connected to the PS5 for now."},{"type":"liste","contenu":"On your PS5, go to **Settings > Accessories > General** and highlight **Turn Off Accessories**.\n> 🛑 *Do not click it: the option must only stay highlighted on the screen.*","numerote":true,"debut":3},{"type":"liste","contenu":"Press and hold the {D-Pad RIGHT} button (directional pad right) on your controller and **do not release it under any circumstances** during the rest of the procedure.\nWhile holding the {D-Pad RIGHT} button, plug your Cronus Zen into the USB port on the front of your PS5.\nWait **5 seconds** while the Bypass runs, then release the {D-Pad RIGHT} button.\nExit the console menus by pressing {CIRCLE}. Your Bypass is active and operational!","numerote":true,"debut":4},{"type":"carte","couleur":"jaune","contenu":"💡 **Good practice — Script activation:** Activate your script only **once your game is running** in the game (avoid loading the script in the console or game menus).\n\n**Why?** At startup, some scripts automatically detect the state of the adaptive triggers (*ADT*). If you are still in the console menus, no mechanical data is transmitted, which can block the script's initialization."}]},{"type":"depliant","titre":"🎮 4. Using a third-party controller *(Crossover Controller)* or Keyboard / Mouse","blocs":[{"type":"texte","style":"p","contenu":"If you prefer to play with another controller (e.g. an Xbox controller or a third-party competition controller) or with a Keyboard / Mouse combo:"},{"type":"liste","contenu":"**PS5 authentication:** Leave your **DualSense / DualSense Edge** controller permanently plugged into the **A1** port *(located on the left side of your Cronus Zen)*. It acts as the hardware authenticator with the console.\nGaming peripherals:\n- **Third-party controller (Crossover):** Plug it into the **A3** port *(front right)* of your Cronus Zen.\n- **Keyboard & Mouse:** Plug them into the **A2** port *(front left)* and **A3** port *(front right)* of your Cronus Zen.","numerote":true},{"type":"carte","couleur":"rouge","contenu":"🛑 **Warning:** **Under no circumstances** unplug the DualSense controller from port A1 during your gaming session. If it is disconnected, authentication will be lost and you will have to redo the Bypass procedure from the beginning."}]},{"type":"carte","image":"/media/guide/bypass-ps5-2.webp","titre":"","contenu":""}],"icone":"bouclier","sommaire":false,"titrePage":"PS5 Connection (Bypass)"},{"id":"connexion-xbox-pc","titre":"Other Platform Connection","titrePage":"Other Platform Connection","icone":"ordinateur","sommaire":false,"descriptionPartage":"Connecting the Cronus ZEN and the controller on Xbox, PS4, Switch, PC and other platforms.","blocs":[{"type":"texte","style":"p","contenu":"This procedure applies to **Xbox, PC** and other consoles *(PS4, Switch)*. On **PS5**, the connection uses a specific procedure: see [**PS5 Connection (Bypass)**](page:bypass-ps5)."},{"type":"texte","style":"h2","contenu":"🎮 1. Xbox, PS4, Switch, PC connection"},{"type":"texte","style":"p","contenu":"1️⃣ Before the first connection, manually set the **Output Protocol** to your platform in [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(Device Management > Device Settings)* to avoid any malfunction related to AUTO mode.\n\n2️⃣ Connect your Cronus Zen to your console using the cable plugged into the **rear CONSOLE & FIRMWARE port**.\n\n3️⃣ Plug your **official controller** *(the one matching your console)* into the **A1 port** *(located on the left side of your Cronus Zen)*."},{"type":"carte","couleur":"jaune","contenu":"💡 **Good practice — Script activation:** Activate your script only **once your game is running** in the game (avoid loading the script in the console or game menus).\n\n**Why?** At startup, some scripts automatically detect the state of the adaptive triggers (*ADT*). If you are still in the console menus, no mechanical data is transmitted, which can block the script's initialization."},{"type":"texte","style":"h2","contenu":"🕹️ 2. Using a third-party controller *(Third-Party / Crossover)* or Keyboard / Mouse"},{"type":"texte","style":"p","contenu":"If you prefer to play with another controller *(e.g. a PS5 controller on Xbox, a third-party competition controller)* or with a Keyboard / Mouse combo:\n\n1️⃣ **Authentication:** Leave your **official controller** permanently plugged into the **A1 port** *(it acts as the hardware authenticator with the console)*."},{"type":"texte","style":"h3","contenu":"2️⃣ Gaming peripherals:"},{"type":"liste","contenu":"- **Third-party controller:** Plug it into the **A3 port** *(front right)* of your Cronus Zen.\n- **Keyboard & Mouse:** Plug them into the **A2 and A3 ports** *(on the front)* of your Cronus Zen."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Warning:** **Under no circumstances** unplug the official controller from port A1 during your gaming session. If it is disconnected, authentication will be lost immediately and you will have to redo the entire connection procedure from the beginning"},{"type":"carte","image":"/media/guide/bypass-ps5-2.webp","titre":"","contenu":""}]},{"id":"mise-a-jour-zen","titre":"Cronus Zen Update","blocs":[{"type":"texte","style":"h2","contenu":"❓ Why and how to update the firmware?"},{"type":"texte","style":"p","contenu":"Updating (*Update*) or rolling back to an earlier version (*Downgrade*) of your Cronus Zen's firmware is done directly from your web browser. This operation ensures absolute compatibility with the latest scripts and fixes any display or detection bugs."},{"type":"texte","style":"h1","contenu":"⚙️ Step-by-step procedure"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Compatible browser required:** You **must use a Chromium-based browser** (such as **Microsoft Edge**, **Google Chrome** or **Brave**)."},{"type":"texte","style":"p","contenu":"1️⃣ **Connecting to the PC:** Connect your Cronus Zen to your computer using the **CONSOLE & FIRMWARE port** *(the port located at the back of the unit)*"},{"type":"carte","image":"/media/guide/mise-a-jour-1.webp","titre":"","contenu":""},{"type":"texte","style":"p","contenu":"2️⃣ **Entering Bootloader mode:** Press and hold the small blue button **under your Cronus Zen** until **\"Zen Bootloader\"** appears on the OLED screen."},{"type":"carte","image":"/media/guide/mise-a-jour-2.webp","titre":"","contenu":""},{"type":"texte","style":"p","contenu":"3️⃣ **Accessing the site:** Open your web browser *(Edge, Chrome or Brave)* and go to this page: [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/)\n\n4️⃣ Click the **Update Firmware** button at the bottom of the window.\n\n5️⃣ **Connecting the device:** In the *Firmware Update* window, click the **\"Connect Device\"** button."},{"type":"carte","image":"/media/guide/mise-a-jour-3.webp","titre":"","contenu":"","largeurMax":380},{"type":"texte","style":"p","contenu":"6️⃣ **Selecting the hardware:** Select your Cronus Zen in the list of detected devices, then click **\"Connect\"**."},{"type":"carte","image":"/media/guide/mise-a-jour-4.webp","titre":"","contenu":""},{"type":"texte","style":"h3","contenu":"7️⃣ Choosing the version to install:"},{"type":"liste","contenu":"⬆️ **To update (Update):** Click the **\"Update to latest\"** button.\n⬇️ **To install an earlier version (Downgrade):** Click **\"Other Versions\"**, select the desired version from the drop-down menu, then click **\"Download and flash\"**."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning — Hardware error:** If you perform a *downgrade* to unblock your Cronus Zen following an **E3**, **E3001,** **E3002** error code or because of a malfunction, select **the oldest firmware version** available in the drop-down menu."},{"type":"images","images":[{"image":"/media/guide/mise-a-jour-5.webp"},{"image":"/media/guide/mise-a-jour-6.webp"}]}],"icone":"actualiser","sommaire":true},{"id":"depannage-faq","titre":"Troubleshooting & FAQ","blocs":[{"type":"depliant","titre":"❓ What are the main causes of errors and problems?","blocs":[{"type":"texte","style":"h2","contenu":"💻 1. Software and update issues"},{"type":"liste","contenu":"**Interrupted or incorrectly performed update:**\n> 💡 **Solution:** The best remedy for software malfunctions is to perform a [**downgrade**](page:mise-a-jour-zen) to the **oldest** firmware version, then restart the update to the very latest version. If the problem persists, perform a *Factory Reset (warning: this erases all the scripts saved on the unit)*.\n**Wrong platform detection (Output Protocol):** Even though *AUTO* mode is supposed to recognize your console, automatic detection sometimes fails and blocks communication.\n> 💡 **Solution:** In [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/), go to the **Device Management** tab ➔ **Device Settings**, then force the **Output Protocol** by manually selecting your gaming platform (*PS5, Xbox Series X/S, PS4, PC*...) instead of leaving it on *AUTO*.\n**Blocked by antivirus or firewall:**\n> 💡 **Solution:** Temporarily disable your antivirus or allow [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/) in your Windows firewall if the software refuses to detect the Zen or apply an update.\n**Corrupted script in a memory slot:**\n> 💡 **Solution:** If the Zen crashes or restarts only when you select a particular profile, erase the relevant *slot* in [ZEN Studio](https://zenstudio.collectivemindsstore.com/) then reinstall the script."},{"type":"texte","style":"h2","contenu":"🔌 2. Hardware and power issues"},{"type":"liste","contenu":"**Insufficient USB power:** The USB ports on your computer or console, or the use of a passive (unpowered) USB *hub*, do not deliver enough power to the Cronus Zen and its peripherals.\n> 💡 **Solution:** Plug the Cronus Zen directly into the main USB ports of your console or the back of your PC. Avoid extension cables and USB power strips without external power.\n**Faulty or incompatible USB cables:**\n> 💡 **Solution:** Only certified **Data Transfer** cables *(charge & data)* work. *Charge-Only* cables do not transmit information and cause detection errors."},{"type":"texte","style":"h2","contenu":"🎮 3. Controller and compatibility issues"},{"type":"liste","contenu":"**Discharged or unsupported controller:**\n> 💡 **Solution:** Make sure your controller is sufficiently charged before plugging it into the Zen and check its hardware compatibility in the official list.\nVibrations or Adaptive Triggers (ADT) disabled:"},{"type":"texte","style":"p","contenu":"Some scripts (especially those handling automatic vehicle or profile detection) use vibration and ADT feedback to work properly."},{"type":"carte","couleur":"jaune","contenu":"💡 **Solution:** Make sure **Vibrations** and **Adaptive Triggers** are enabled both in your **console's system settings** and in your **game's options menus**."},{"type":"texte","style":"h2","contenu":"🏎️ 4. Incorrect system modes (*Wheel Mode*, *Tournament Mode*)"},{"type":"liste","contenu":"**Accidental mode change:**\n> 💡 **Solution:** In the status bar at the very bottom of the [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/) window *(next to the serial number and version)*, find the clickable text showing the active mode. If it is set to **Wheel** or **Tournament**, click it and set it back to **Normal**."}]},{"type":"depliant","titre":"🚨 Fixing Errors (E3, E3001, E3002)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Resolution procedure (follow in order):"},{"type":"texte","style":"p","contenu":"1️⃣ **Simple restart:** Fully unplug your Cronus Zen from all its USB connections, wait 5 seconds, then plug it back in.\n\n2️⃣ **Firmware restoration (Downgrade):** If it remains blocked, follow the procedure in the **\"**[**Cronus Zen Updates**](page:mise-a-jour-zen)**\"** guide to perform a **downgrade** by selecting the **oldest** firmware version available.\n\n3️⃣ **Factory Reset:** If the error persists, perform a complete *Factory Reset* of the device to wipe the system memory.\n⚠️ **Warning: the factory reset deletes all the scripts stored on the Cronus Zen.**"},{"type":"carte","couleur":"jaune","contenu":"💡 **Check:** Once the reset or flash is complete, the error code should disappear and the OLED screen should display the usual startup interface."}]},{"type":"depliant","titre":"🎧 Sound, Mic or Voice Chat issues (Jack port)","blocs":[{"type":"texte","style":"p","contenu":"Do you experience crackling, sound dropouts, loss of the voice channel or an undetected microphone when your headset is plugged into the jack port of the controller connected to the Cronus Zen?"},{"type":"texte","style":"h2","contenu":"⚡ Quick fixes by console"},{"type":"texte","style":"h2","contenu":"🎮 Dedicated PS5 solution","couleurHex":"#3d9bff","fondCouleur":"#3d9bff","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ Simply plug your headset into your controller's jack port **BEFORE** performing the [**PS5 Bypass**](page:bypass-ps5) procedure.\n\n2️⃣ Then start your usual [**PS5 Bypass**](page:bypass-ps5) procedure."},{"type":"texte","style":"h2","contenu":"🎮 Dedicated XBOX solution","couleurHex":"#4ade5a","fondCouleur":"#4ade5a","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ Connect your Cronus Zen to your Xbox (*no controller should be plugged into the Cronus Zen at this step*).\n\n2️⃣ Make sure your Cronus Zen is on the **Gearhead** screen *(alien head logo* 👽*)*."},{"type":"carte","couleur":"jaune","contenu":"*💡 If a script is currently loaded on a slot, press the big blue button on the right several times until the Gearhead logo appears on the OLED screen.*"},{"type":"texte","style":"p","contenu":"3️⃣ Plug your jack headset into your Xbox controller.\n\n4️⃣ Then plug your controller into the **A1** port of your Cronus Zen.\n\n5️⃣ Once the headset is connected to the controller and the controller plugged into the Zen, briefly press the **Reset** button located under the Cronus Zen unit."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Good to know:** The Cronus Zen handles audio signal transit through the jack port of a controller connected to its USB ports very poorly. To keep optimal sound quality and a fully working microphone, it is strongly recommended not to route the audio through the unit."},{"type":"texte","style":"h2","contenu":"🛠️ Still having sound or microphone problems? (3 effective alternatives)"},{"type":"liste","contenu":"**📶 Option 1: Wireless headset (Bluetooth or 2.4 GHz USB Dongle)**\n> *This is the ideal solution.* Connect your wireless headset directly to your console or PC. The audio signal completely bypasses the Cronus Zen, ensuring maximum sound quality and voice chat free of any interference.\n**🔌 Option 2: USB headset (or Sound card / Jack ➔ USB adapter)**\n> Plug your USB headset *(or your jack headset via a dedicated sound card / USB adapter)* directly into one of your console's USB ports, not into the Cronus Zen.\n**🎮 Option 3: Second controller dedicated to audio**\n> Plug a second controller via USB directly into your console, then connect your jack headset to that second controller. It will serve exclusively as an external sound card for the game and your voice chat."},{"type":"carte","couleur":"jaune","contenu":"💡 **Check:** Go to your console's audio settings and verify that the input *(microphone)* and output *(headset)* devices are assigned to your headset or to the second controller, and not to the Cronus Zen."}]},{"type":"depliant","titre":"🛞 Your Cronus shows \"Wheel\" or \"Tournament\"","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Resolution procedure:"},{"type":"texte","style":"p","contenu":"1️⃣ Connect your Cronus Zen to your PC using the cable plugged into the **PROG port** *(located on the right side of the device)*.\n\n2️⃣ Open the [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/) application.\n\n3️⃣ In the status bar at the very bottom of the [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) window *(next to the serial number and version)*, find the clickable text showing the active mode. If it is set to **Wheel** or **Tournament**, click it and set it back to **Normal**."},{"type":"carte","couleur":"jaune","contenu":"💡 **Check:** The Cronus Zen's OLED screen should display its standard menu again and no longer mention *Wheel* mode."}]},{"type":"depliant","titre":"📡 Your Cronus is not recognized or does not work on your console (Output Protocol)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Resolution procedure:"},{"type":"texte","style":"p","contenu":"1️⃣ **Mandatory first step:** Make sure you have tried other certified **data** USB cables *(charge & data)* and checked the condition of your USB ports.\n\n2️⃣ Connect the Cronus Zen to your computer via the **PROG port** *(right side)*.\n\n3️⃣ Go to [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/).\n\n4️⃣ Click the **Device Management** tab, then select **Device Settings**.\n\n5️⃣ In the window that opens, find the **Output Protocol** line.\n\n6️⃣ Replace the current option *(or AUTO mode)* by explicitly choosing your console from the list (*PS5, PS4, Xbox Series X/S, PC, Nintendo Switch*...).\n\n7️⃣ Close the window to save the setting automatically, then reconnect your Zen to the console."}]},{"type":"carte","image":"/media/guide/depannage-1.webp","titre":"","contenu":""}],"icone":"outil","sommaire":false},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","commun":true,"rubriqueScript":"Getting started"},{"id":"navigation-oled","titre":"OLED Navigation & Menus","blocs":[{"type":"texte","style":"p","contenu":"All scripts share the same menu architecture and the same navigation system. This guide explains how to use the OLED menu, understand the structure of the menus and their contents, and adjust your settings."},{"type":"texte","style":"h1","contenu":"📖 General Guide & How My Scripts Work"},{"type":"depliant","titre":"📂 Main Menu structure","blocs":[{"type":"texte","style":"h3","contenu":"The features are divided into 6 distinct categories:"},{"type":"liste","contenu":"🔀 **Profile MODs**: Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch profile.\n🌍 **Global MODs**: Options that are always active, whatever the selected profile (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator**: Conditions required to trigger certain *Profile MODs* (e.g. only when aiming *ADS Only*, when shooting *FIRE*, or *ADS + FIRE*).\n🎮 **Controller**: Hardware configuration of your controller (Sensitivity, Dead zone / *Stick Drift*, Y-axis inversion, Button layout).\n⚙️ **Misc**: Script system options (*Auto Save* to save your settings, *VM Speed* for execution speed).\n⏱️ **Quick Toggle**: Quick controller shortcut assignments to enable or disable a MOD on the fly."}]},{"type":"depliant","titre":"🕹️ Additional game-specific menus","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)**: Automation modules dedicated to in-game mini-games and jobs (*Automatic fishing*, *5 Finger Fillet*, *Cooking*, *Bench Press* and more to come...) to succeed every time with no physical effort.\n🔄 **Switch Profile (FPS / TPS)**: Quick-switch system letting you change weapon profile or configuration (Profile 1, Profile 2, Primary, Secondary...) on the fly mid-game, to instantly adapt your MODs and your *AntiRecoil* to the weapon you are holding.\n🌐 **Online Cheat (GTA V)**: Quick actions to instantly run key actions from the Interaction menu in GTA Online (eating snacks, equipping heavy armor, respawning your personal vehicle...).\n👤 **Story Cheat (GTA V)**: Automatic execution of the official cheat code combinations reserved for GTA V Story mode (max health/armor, invincibility, weapons, environment effects...).\n🚀 **Quick Cheat (GTA V)**: Assignment of quick button combinations on your controller (same principle as *Quick Toggles*) to trigger your favorite GTA V *Cheats* on the fly mid-game."}]},{"type":"texte","style":"h1","contenu":"🧭 Navigation and editing guide"},{"type":"depliant","titre":"🛑 Safety: the KillSwitch (script cut-off)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Crucial warning:** Whether you are in a racing game or a shooter, the script blindly executes the instructions it contains. That is why it is **absolutely crucial to disable your script** when you navigate the game or console menus. Since a MOD runs on a simple button press, it would be a shame to delete a rare piece of equipment from your inventory or to buy/sell by mistake because a MOD triggered at the wrong time!"},{"type":"texte","style":"h2","contenu":"💡 How to enable or disable the KillSwitch (total mute of the script's features):"},{"type":"texte","style":"p","contenu":"Press one of these combinations / buttons at any time:"},{"type":"liste","contenu":"- Either the {OPTIONS / MENUS} button on your controller.\n- Or the {PS / XBOX} button.\n- Or by holding {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entering and exiting the menu","blocs":[{"type":"liste","contenu":"🚪 **Open the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS}.\n🎯 **AntiRecoil quick access:** Hold {L2 / LT} and press {PS / XBOX} to directly open the active profile's AntiRecoil values *(if the AntiRecoil MOD is enabled on that profile)*.\n🚪 **Close the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS} *(if Auto Save is enabled in Misc, your settings are saved automatically)*.\n💾 **Save manually and exit:** Press {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Navigating and editing MOD values","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Navigating the menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual help on the OLED screen:**\n\n🧭 **Directional arrows:** *Arrows appear around the parameter to tell you directly which direction to press on the controller.*"},{"type":"texte","style":"p","contenu":"📜 **Instruction line:** *A text scrolls on the last line of the screen to guide you step by step if you are unsure which button to use.*"},{"type":"liste","contenu":"↕️ **Browse a list or a drop-down menu:** Use {D-Pad UP} or {DOWN} *(main menu, Cheats list, settings choices...)*.\n📥**Enter a menu / sub-menu:** Press {CROSS / A}.\n🔄**Change the profile to edit:** Press {CROSS / A} *(only in the Profile MODs menu)*.\n↔️**Move between sub-menus / MODs:** Use {D-Pad LEFT} or {RIGHT}.\n⚙️**Enable/Disable a MOD or change its type:** Use {D-Pad UP} or {DOWN}.\n↩️**Go back to the previous menu:** Press {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Editing numerical values *(e.g. AntiRecoil strength, Rapid Fire rate)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Enable the MOD:** If the MOD is *OFF*, you do not have access to its adjustable values.\n\n2️⃣ **Enter the edit menu:** Press {CROSS / A}.\n\n3️⃣ **Select the parameter:** Use {D-Pad LEFT} or {RIGHT} to navigate between the different options.\n\n4️⃣ **Change the value:** Hold {R1 / RB} then press {D-Pad RIGHT} (or {UP}) to increase, or {D-Pad LEFT} (or {DOWN}) to decrease.\n\n5️⃣ **Go back to the previous menu:** Press {CIRCLE / B}."}]}],"icone":"menu","commun":true,"sommaire":true},{"id":"bibliotheque","titre":"Overview","titrePage":"MODs Library","icone":"dossier","rubrique":"MODs Library","blocs":[{"type":"texte","style":"p","contenu":"⬇️ Find the description and tuning tips for each MOD, menu by menu ⬇️"},{"type":"texte","style":"h1","contenu":"Menus & MODs common to all scripts"},{"type":"cartelien","titre":"Profile MODs","contenu":"AntiRecoil, Fire MODs, AIM Assist, Shot MODs...: the settings specific to each profile / weapon.","destination":"page:profile-mods","image":"/media/bibliotheque/profile-mods.webp"},{"type":"cartelien","titre":"Global MODs","contenu":"AutoRun, Turbo Buttons, Easy Roll...: the options that are always active.","destination":"page:global-mods","image":"/media/bibliotheque/global-mods.webp"},{"type":"cartelien","titre":"MODs Activator","contenu":"The trigger conditions for your MODs (ADS, FIRE, ADS + FIRE...).","destination":"page:mods-activator","image":"/media/bibliotheque/mods-activator.webp"},{"type":"cartelien","titre":"Controller","contenu":"Stick sensitivity, Stick Drift, Hair Trigger, vibrations, button layout.","destination":"page:controller","image":"/media/bibliotheque/controller.webp"},{"type":"cartelien","titre":"Misc","contenu":"Auto Save and VM Speed: the script's system options.","destination":"page:misc","image":"/media/bibliotheque/misc.webp"},{"type":"cartelien","titre":"Quick Toggle","contenu":"Enable / disable your favorite MODs on the fly with a shortcut.","destination":"page:quick-toggle","image":"/media/bibliotheque/quick-toggle.webp"},{"type":"texte","style":"h1","contenu":"Menus & MODs specific to a script"},{"type":"cartelien","titre":"Activity — GTA VI script","contenu":"Automatic fishing, Bench Press...: the GTA VI activity automations.","destination":"page:gta6-activity","image":"/media/bibliotheque/gta6-activity.webp"},{"type":"cartelien","titre":"Switch Profile — FPS / TPS script","contenu":"Switch weapon profiles on the fly, mid-game.","destination":"page:fps-tps-switch-profile","image":"/media/bibliotheque/switch-profile.webp"},{"type":"cartelien","titre":"Activity — RDR2 script","contenu":"Fishing, 5 Finger Fillet, Cooking: the Red Dead Redemption II automations.","destination":"page:rdr2-activity","image":"/media/bibliotheque/rdr2-activity.webp"},{"type":"cartelien","titre":"Online Cheat — GTA V script","contenu":"The GTA Online Interaction menu actions in one click.","destination":"page:gta5-online-cheat","image":"/media/bibliotheque/gta5-online-cheat.webp"},{"type":"cartelien","titre":"Story Cheat — GTA V script","contenu":"The official Story mode cheat codes, executed automatically.","destination":"page:gta5-story-cheat","image":"/media/bibliotheque/gta5-story-cheat.webp"},{"type":"cartelien","titre":"Quick Cheat — GTA V script","contenu":"Your favorite cheats on a controller shortcut.","destination":"page:gta5-quick-cheat","image":"/media/bibliotheque/gta5-quick-cheat.webp"}],"descriptionPartage":"Description and tuning tips for all the MODs in the noozbar scripts, menu by menu."},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"texte","style":"h1","contenu":"🔀 The Profile MODs menu"},{"type":"texte","style":"h2","contenu":"❓ What are \"Profile MODs\"?"},{"type":"texte","style":"p","contenu":"This menu groups all the settings specific to a weapon or a game profile (**AntiRecoil, Fire MODs, Shot MODs...**). These values apply automatically as soon as you change profile in-game.\n\nEach profile has its own independent settings."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Warning (FPS / TPS Script):**\n\nUntil you have configured the [**Switch Profile**](/fps-tps/switch-profile/) menu, you will only have access to a single profile in this menu (and in-game)."},{"type":"mods","ids":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist","deadeye","hold-breath"]}],"icone":"cible","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubriqueScript":"MODs Library"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 The Global MODs menu"},{"type":"texte","style":"h2","contenu":"❓ What are \"Global MODs\"?"},{"type":"texte","style":"p","contenu":"These are MODs or options that are always active, whatever the selected profile (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons","quick-item-gta6","auto-unscope","auto-reload","skid-stop","easy-eagle-eye","horse-galop","cinema-galop","quick-item-rdr2","autostop-deadeye","autospin","online-boss","easy-roll","turbo-rpg","klaxon-hold","quick-care"]}],"icone":"globe","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 The MODs Activator menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"MODs Activator\"?"},{"type":"texte","style":"p","contenu":"The **MODs Activator** is the script's condition engine. It lets you define with total precision **when** and **how** your MODs should activate in-game.\n\nInstead of imposing a rigid behavior, this system listens to your buttons in real time and only triggers your modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) if the exact condition you chose is met."},{"type":"texte","style":"h2","contenu":"⚙️ How it works"},{"type":"texte","style":"p","contenu":"Every player has their own way of playing, and every weapon has its constraints. By assigning a specific trigger mode to each MOD, you avoid unintended activations (for example: doing a *Drop Shot* when you just wanted to adjust your aim from a distance).\n\nThe system analyzes the combination of your main buttons: the aim trigger (**ADS**) and the fire trigger (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 The 5 available trigger modes"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Which MODs use the MODs Activator?"},{"type":"texte","style":"p","contenu":"You can assign an independent activation mode to each of the following modules in your profile:"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **In summary:**\n\nThe MODs Activator offers tailor-made control of your controller. It adapts to your gameplay instead of forcing you to adapt your playstyle to the script."}],"icone":"eclair","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 The Controller menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Controller\" menu?"},{"type":"texte","style":"p","contenu":"This is everything related to your controller's hardware configuration (Sensitivity, Dead zone / Stick Drift, Y-axis inversion, Button layout)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ The Misc menu"},{"type":"texte","style":"h2","contenu":"❓ What is the \"Misc\" menu?"},{"type":"texte","style":"p","contenu":"These are script system options (**Auto Save** to save your settings, **VM Speed** for execution speed)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ The Quick Toggle menu (In-game shortcuts)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","commun":true,"sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp"},{"id":"gta6-activity","titre":"GTA VI - Activity","blocs":[{"type":"texte","style":"h1","contenu":"🌴 The Activity menu - GTA VI"},{"type":"modbody","mod":"activity-gta6-intro"},{"type":"mods","ids":["activity-gta6-fishing","activity-gta6-bench-press"]}],"icone":"palmier","sommaire":false,"imagePartage":"/media/bibliotheque/gta6-activity.webp"},{"id":"fps-tps-switch-profile","titre":"FPS/TPS - Switch Profile","blocs":[{"type":"texte","style":"h1","contenu":"🔄 The Switch Profile menu (FPS / TPS script)"},{"type":"modbody","mod":"switch-profile"}],"icone":"actualiser","sommaire":false,"imagePartage":"/media/bibliotheque/switch-profile.webp"},{"id":"rdr2-activity","titre":"RDR2 - Activity","blocs":[{"type":"texte","style":"h1","contenu":"🤠 The Activity menu - RDR 2"},{"type":"modbody","mod":"activity-rdr2-intro"},{"type":"mods","ids":["activity-rdr2-fishing","five-finger-fillet","cooking"]}],"icone":"cowboy","sommaire":false,"imagePartage":"/media/bibliotheque/rdr2-activity.webp"},{"id":"gta5-online-cheat","titre":"GTA V - Online Cheat","blocs":[{"type":"texte","style":"h1","contenu":"🌐 The Online Cheat menu (GTA Online)"},{"type":"modbody","mod":"online-cheat"}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/gta5-online-cheat.webp"},{"id":"gta5-story-cheat","titre":"GTA V - Story Cheat","blocs":[{"type":"texte","style":"h1","contenu":"👤 The Story Cheat menu (GTA V Story Mode)"},{"type":"modbody","mod":"story-cheat"}],"icone":"livre","sommaire":false,"imagePartage":"/media/bibliotheque/gta5-story-cheat.webp"},{"id":"gta5-quick-cheat","titre":"GTA V - Quick Cheat","blocs":[{"type":"texte","style":"h1","contenu":"🚀 The Quick Cheat menu (In-game shortcuts)"},{"type":"modbody","mod":"quick-cheat"}],"icone":"fusee","sommaire":false,"imagePartage":"/media/bibliotheque/gta5-quick-cheat.webp"},{"id":"comprendre","titre":"Understanding Scripts & MODs","blocs":[{"type":"depliant","titre":"💡 Understanding MODs & Misconceptions (Anti-cheat, Aimbot...)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a MOD?"},{"type":"texte","style":"p","contenu":"A **MOD** (or *Macro On Demand*) is a programmable sequence of commands (button presses, analog stick movements, etc.) sent by the controller to the console.\n\nThese macros are automated using Cronus Zen scripts, but this principle is also used by many other gaming devices:"},{"type":"liste","contenu":"**Pro controllers:** they offer macro features through their configurable paddles or sensitivity settings.\n**Gaming keyboards:** they often have dedicated keys for macros that are fully programmable through their software."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Remember:** Using MODs is therefore not reserved for Cronus users: it is a very common practice in video games in general."},{"type":"texte","style":"h2","contenu":"❓ What can I do (and not do) with MODs?"},{"type":"texte","style":"p","contenu":"The Cronus Zen is at the heart of many misconceptions. In reality, its capabilities remain strictly hardware-based and emulated:"},{"type":"texte","style":"h2","contenu":"✅ What a Cronus Zen can do:"},{"type":"liste","contenu":"Automate button presses and analog stick movements.\nLet you create and customize your macros.\nUse several macros in a single script.\nOptimize the aim assist already natively present in the game."},{"type":"texte","style":"h2","contenu":"❌ What a Cronus Zen can NOT do:"},{"type":"liste","contenu":"Access or modify the game files.\nTrigger an Aimbot (automatic lock-on).\nAutomatically aim at the head (*automatic Headshot*).\nMake you invincible or let you walk through walls.\nIncrease your damage.\nSee or analyze what is happening on your screen."},{"type":"texte","style":"h2","contenu":"💡 Important things to know"},{"type":"liste","contenu":"**Respecting the game's limits:** The restrictions imposed by the developers cannot be exceeded. If the game has a fire rate limit or a cooldown, a script can never go beyond it."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Beware of fake video demonstrations:** Do not trust videos promising perfect tracking, instant headshots or laser weapons. If a seller guarantees you this kind of feature, it means they are actually using a **real PC cheat** to shoot their video, and not a Cronus Zen. A script only evaluates your controller's signals: it can in no way read or modify the game's memory."},{"type":"texte","style":"h2","contenu":"📋 In summary"},{"type":"texte","style":"p","contenu":"A macro does not modify the game: it simply changes the way your commands are transmitted. The game keeps receiving ordinary button presses and controller movements. A script can neither access the game's code, nor bypass its mechanisms, nor perform actions not intended by the developers.\n\nAll it does is **automate what you could already do yourself**, repeating the commands with perfect timing and regularity. If an action can be done manually, a Cronus Zen script can reproduce it. It does not add new capabilities, it simply removes the tedium of manual execution."}]},{"type":"depliant","titre":"⚙️ How Scripts work","blocs":[{"type":"texte","style":"h2","contenu":"❓How do scripts actually work?"},{"type":"texte","style":"p","contenu":"Scripts are made to work with your game controller, not with a particular game.\n\nAlthough most scripts claim to be \"made for such-and-such game\", they actually only adapt to the commands sent by your controller. A script dedicated to a specific game is simply a set of MODs configured to match that game's mechanics and buttons. The script responds to the orders transmitted by your actions on the controller (the *inputs*) and not to what is happening directly on screen.\n\nThese MODs only modify the signal the controller sends to the console (the *outputs*):"},{"type":"liste","contenu":"**Example:** If you use the *RapidFire* MOD, the script detects that you are holding the fire button and loops the order to press that button to the console."},{"type":"carte","couleur":"orange","contenu":"⚠️ Whether you are in a racing game or a shooter: the script blindly executes the instructions it contains. That is why it is crucial to **disable your script when you navigate the game or console menus**. Since a MOD runs on a simple button press, it would be a shame to delete a rare piece of equipment from your inventory because a MOD triggered by mistake!"}]},{"type":"depliant","titre":"🏆 Which script is the best?","blocs":[{"type":"texte","style":"p","contenu":"**There is no \"best\" script.** Deep down, they all perform very similar tasks. The only thing that really makes a difference is **your settings**.\n\nYou can watch impressive demonstrations on YouTube or TikTok, apply exactly the same settings and find the result mediocre. Likewise, copying configurations shared on Discord often only gives average results. Even if a setting seems good to you, there is almost always room for improvement. Shared settings are excellent starting points, but they will never be perfectly optimized for your profile."},{"type":"texte","style":"h3","contenu":"Several unique factors influence the effectiveness of your settings:"},{"type":"liste","contenu":"**Your hardware:** your sticks' dead zone, the level of *stick drift*, the controller's response time.\n**Your network:** latency (ping) and the
