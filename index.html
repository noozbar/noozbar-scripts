stick analogique en appliquant une force opposée pour compenser le recul de l'arme :"},{"type":"liste","contenu":"**Axe Y (Vertical) :** Compense la montée (ou la descente) naturelle de l'arme lorsque vous tirez.\n**Axe X (Horizontal) :** Corrige les dérives latérales vers la gauche ou la droite."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Condition indispensable — Activation des vibrations :**\n\nLes vibrations doivent impérativement être **activées dans les options du jeu et de la console**. Mes scripts coupent automatiquement la compensation dès que les vibrations du jeu s'arrêtent. Cela empêche votre viseur de tomber vers le bas si vous gardez le bouton de tir enfoncé alors que votre chargeur est vide et que votre personnage recharge."},{"type":"carte","couleur":"jaune","contenu":"💡 *Si vous ne souhaitez pas ressentir les vibrations physiques dans les mains, vous pouvez les désactiver directement depuis le menu OLED du script dans l'option* **Controller** ."},{"type":"texte","style":"h3","contenu":"🛡️Sécurité : Humanizer d'Offset"},{"type":"texte","style":"p","contenu":"Tous mes AntiRecoil sont équipés d'un **Humanizer d'Offset**. Il intègre de légères variations aléatoires dans les mouvements physiques simulés pour éviter de reproduire des trajectoires parfaitement mécaniques et identiques. Cela vous aide à rester indétectable par les systèmes anti-cheat.\n\n⚙️**Le système de déclenchement :** [**MODs Activator**](page:mods-activator)\n\nLes AntiRecoil s'appuient sur le système [**MODs Activator**](page:mods-activator). Il s'agit des conditions nécessaires pour déclencher votre MOD. Vous choisissez exactement *comment* et *quand* votre MOD doit s'activer"},{"type":"texte","style":"h2","contenu":"🎯 Quel type d'AntiRecoil choisir ?"},{"type":"texte","style":"p","contenu":"Les modes **Progressive** et **Advanced** sont de loin les plus performants et les plus précis.\n\nLe choix du mode dépend principalement du jeu, de l'arme utilisée, mais aussi de votre envie de vous plonger dans les réglages :"},{"type":"liste","contenu":"Si vous souhaitez un réglage rapide et sans prise de tête, orientez-vous vers les modes plus simples (**Standard** ou **Rumble**).\nSi vous recherchez la perfection et que vous aimez prendre le temps de comprendre et peaufiner vos paramètres, les modes **Progressive** et **Advanced** vous offriront des résultats incomparables."},{"type":"texte","style":"h1","contenu":"🛠️ Les différents types d'AntiRecoil disponibles"},{"type":"texte","style":"h2","contenu":"1. 🔹 Standard"},{"type":"texte","style":"p","contenu":"Un AntiRecoil très simple qui applique simplement une valeur fixe et constante sur chaque axe :"},{"type":"liste","contenu":"**Vertical :** Une valeur fixe pour compenser la montée de l'arme.\n**Horizontal :** Une valeur fixe pour corriger le décalage latéral."},{"type":"texte","style":"h2","contenu":"2. 📈 Progressive"},{"type":"texte","style":"p","contenu":"Un AntiRecoil vertical dynamique couplé à un AntiRecoil horizontal **Standard**. Il est idéal pour les armes dont le recul change d'intensité au cours de la rafale.\n\nParamètres verticaux (3 valeurs) :"},{"type":"liste","contenu":"**Vertical Start :** Valeur de départ appliquée dès le début du tir.\n**Vertical End :** Valeur finale à atteindre.\n**Vertical Time :** Durée (en millisecondes) pour passer de *Start* à *End* (ex. 1000 = 1 seconde).\n**Horizontal :** Valeur fixe pour le décalage latéral."},{"type":"carte","couleur":"jaune","contenu":"💡 **Exemples d'utilisation :**"},{"type":"liste","contenu":"**Fort kick de départ :** Si votre arme a un gros kick initiale puis se stabilise, réglez par exemple *Start = 38*, *End = 24*, et *Time = 2000* (2 secondes). La compensation démarrera à 38 puis descendra progressivement vers 24 sur 2 secondes.\n**Recul s'intensifiant :** Si l'arme devient de plus en plus dure à contrôler au fil du tir, réglez par exemple *Start = 20*, *End = 42*, et *Time = 4000* (4 secondes). La valeur montera progressivement de 20 à 42."},{"type":"texte","style":"h2","contenu":"3. 📳 Rumble (Low / Med / High)"},{"type":"texte","style":"p","contenu":"Un AntiRecoil vertical basé sur les vibrations, couplé à un AntiRecoil horizontal **Standard**.\n\nLe script récupère les données de vibration envoyées par le jeu et leur applique un coefficient (plus ou moins élevé selon le mode choisi) pour calculer la force à appliquer sur le stick analogique.\n\nParamètres ajustables :"},{"type":"liste","contenu":"**Rumble Power :** Ajuste la force globale de l'AntiRecoil vertical.\n**Rumble Horizontal :** Ajuste la correction latérale fixe (fonctionne comme le mode Standard)."},{"type":"carte","couleur":"jaune","contenu":"💡 *Conseil : Le mode* **Rumble Low** *applique un coefficient léger. Si la compensation verticale manque de force, essayez d'abord de passer sur* **Rumble Med** *ou* **Rumble High** *avant d'augmenter la valeur Rumble Power.*"},{"type":"texte","style":"h2","contenu":"4. ⚡ Advanced (Système par Steps)"},{"type":"texte","style":"p","contenu":"Le mode le plus avancé, offrant une précision chirurgicale grâce à un découpage par tranches de **500 ms** (0,5 seconde)."},{"type":"liste","contenu":"Jusqu'à **10 Steps** pour l'axe Vertical et **10 Steps** pour l'axe Horizontal (soit jusqu'à 5 secondes de tir continu).\nRéglages **totalement indépendants** pour l'axe Vertical et l'axe Horizontal (ex. 4 Steps en Y et 6 Steps en X).\n**Interpolation fluide :** Le script ne saute pas violemment d'une valeur à l'autre ; il calcule une progression continue entre chaque palier (en montant comme en descendant, avec des valeurs positives ou négatives)."},{"type":"texte","style":"h3","contenu":"📝 Exemple de fonctionnement (Vertical sur 4 Steps / 2000 ms) :"},{"type":"texte","style":"p","contenu":"**Configuration :** *Step 1 = 20 | Step 2 = 25 | Step 3 = 30 | Step 4 = 35*"},{"type":"liste","contenu":"**De 0 à 500 ms :** La valeur **Step 1 (20)** s'applique directement dès le début du tir.\n**De 500 à 1000 ms :** La valeur monte progressivement de **20 (Step 1)** jusqu'à atteindre **25 (Step 2)**.\n**De 1000 à 1500 ms :** La valeur monte progressivement de **25 (Step 2)** jusqu'à atteindre **30 (Step 3)**.\n**De 1500 à 2000 ms :** La valeur monte progressivement de **30 (Step 3)** jusqu'à atteindre **35 (Step 4)**, puis reste à 35 tant que vous maintenez la détente."}]},{"id":"fire-mods","titre":"🔫 Fire MODs","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'un Fire MOD ?"},{"type":"texte","style":"p","contenu":"Un **Fire MOD** est un mode de tir qui interagit directement avec votre bouton de tir lorsque vous visez ou tirez :"},{"type":"liste","contenu":"**Arme semi-automatique (pistolet, fusil à coup par coup...) :** le *RapidFire* simule des appuis ultra-rapides pour la transformer en arme automatique (full-auto).\n**Arme automatique (fusil d'assaut, mitraillette...) :** le *BurstFire* permet de convertir un tir continu en rafales contrôlées pour garder le contrôle du recul."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer de Cycle"},{"type":"texte","style":"p","contenu":"Les cadences de tir trop régulières sont la cause principale de détection par les anti-cheats. Pour vous protéger :"},{"type":"liste","contenu":"**Limitation à 360 RPM / 6 RPS :** La cadence maximale est bridée à **360 coups par minute (RPM)** ou **6 coups par seconde (RPS)** dans le script. Spammer le bouton de tir à une fréquence supérieure est humainement quasi impossible. Ce seuil permet à vos tirs de rester crédibles et de **passer sous le radar des anti-cheats**.\n**Humanizer de Cycle :** Ce système modifie constamment les durées de maintien et de relâchement de la touche (*Hold/Release*), tout en respectant scrupuleusement la cadence globale configurée. Vos tirs conservent ainsi un rythme fluide et naturel, éliminant l'effet figé ou automatisé des macros classiques."},{"type":"texte","style":"p","contenu":"**⚙️ Le système de déclenchement :** [**MODs Activator**](page:mods-activator)\n\nLes Fire MODs s'appuient sur le système [**MODs Activator**](page:mods-activator). Il s'agit des conditions nécessaires pour déclencher votre MOD. Vous choisissez exactement *comment* et *quand* votre MOD doit s'activer"},{"type":"texte","style":"h2","contenu":"🎯 Quel Fire MOD choisir ?"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Règle importante :** Vous ne pouvez activer qu’**un seul Fire MOD par profil**."},{"type":"liste","contenu":"**Sur une arme semi-automatique :** Utilisez l'un des modes **RapidFire** pour tirer en continu.\n**Sur une arme automatique :** N'utilisez **jamais** de RapidFire (cela ralentirait votre cadence naturelle). Utilisez plutôt le mode **BurstFire**."},{"type":"texte","style":"h1","contenu":"🛠️ Les différents types de Fire MODs disponibles"},{"type":"texte","style":"h2","contenu":"1. ⚡ RapidFire Dynamic"},{"type":"texte","style":"p","contenu":"Un mode intelligent qui adapte la cadence de tir à la pression exercée sur la gâchette :"},{"type":"liste","contenu":"Plus vous enfoncez la gâchette de tir, plus la cadence augmente.\nUtile pour doser la vitesse de tir à la volée sans ouvrir le menu."},{"type":"texte","style":"h2","contenu":"2. ⏱️ RPM RapidFire"},{"type":"texte","style":"p","contenu":"Mode basé sur le nombre de **Coups par Minute (RPM / BPM)**."},{"type":"liste","contenu":"Si le jeu affiche les caractéristiques de l'arme en RPM ou BPM, choisissez ce mode.\nIl vous suffit d'entrer la valeur exacte du jeu dans le paramètre **Rate of Fire**."},{"type":"texte","style":"h2","contenu":"3. 🎯 RPS RapidFire (ou RapidFire)"},{"type":"texte","style":"p","contenu":"Mode basé sur le nombre de **Coups par Seconde (RPS / BPS)**."},{"type":"liste","contenu":"C'est le format le plus répandu dans les scripts Cronus.\nSi le jeu affiche les caractéristiques de l'arme en RPS ou BPS, choisissez ce mode et réglez la valeur **Rate of Fire** sur le nombre de tirs par seconde souhaité."},{"type":"texte","style":"h2","contenu":"4. 💥 BurstFire (Tir par rafales)"},{"type":"texte","style":"p","contenu":"Ce mode est réservé aux **armes automatiques** pour forcer un tir par petites rafales et conserver une précision maximale à longue distance.\n\nParamètres à régler :"},{"type":"liste","contenu":"**Hold Time :** Durée pendant laquelle le script maintient la touche de tir enfoncée (durée de la rafale).\n**Release Time :** Durée de la pause forcée entre deux rafales."}]},{"id":"aim-assist","titre":"🎯 AIM Assist","blocs":[{"type":"texte","style":"h2","contenu":"⚠️ Avant de commencer : Démystifier l'AIM Assist"},{"type":"texte","style":"p","contenu":"Il est essentiel de casser les idées reçues : **l'AIM Assist n'est en aucun cas un Aimbot PC.**"},{"type":"liste","contenu":"Il ne va **pas** coller automatiquement à la cible.\nIl ne va **pas** suivre l'ennemi tout seul sans action de votre part."},{"type":"texte","style":"p","contenu":"Comme son nom l'indique, il s'agit d'une **assistance** qui exploite et décuple l'aide à la visée native déjà intégrée par les développeurs dans le jeu. L'efficacité du MOD dépend donc directement de la générosité de l'aide à la visée du titre auquel vous jouez."},{"type":"texte","style":"h2","contenu":"🧠 Comment fonctionne l'aide à la visée native d'un jeu ?"},{"type":"texte","style":"p","contenu":"Imaginez une **bulle virtuelle** entourant chaque ennemi. Lorsque le centre de votre écran passe sur cette bulle, le jeu active son aide à la visée interne sous deux conditions très précises :"},{"type":"liste","contenu":"**Déplacement du personnage (Stick Gauche) :** Le jeu détecte un mouvement de votre personnage supérieur à la zone morte (*DeadZone*). C'est le principe exploité par le **LS Assist**.\n**Mouvement de la caméra / visée (Stick Droit) :** Le jeu détecte un mouvement de votre caméra ou de votre viseur supérieure à la zone morte. C'est le principe exploité par l'**AIM Assist**."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Règle d'or :** Si vos deux sticks analogiques sont parfaitement immobiles, l'aide à la visée du jeu **ne s'active pas**, même si un ennemi traverse le centre de votre écran."},{"type":"texte","style":"p","contenu":"Les MODs **AIM Assist** et **LS Assist** simulent en continu de micro-mouvements imperceptibles sur vos sticks pour forcer le jeu à maintenir son aide à la visée active à 100 % du temps, vous permettant de rester plus facilement « aimanté » dans la bulle de l'ennemi."},{"type":"texte","style":"h1","contenu":"🎯 1. AIM Assist (Stick Droit — Visée)"},{"type":"texte","style":"p","contenu":"L'**AIM Assist** applique des micro-trajectoires géométriques autour du stick de visée."},{"type":"texte","style":"h2","contenu":"📐 Les formes géométriques (*Shapes*)"},{"type":"texte","style":"p","contenu":"Chaque joueur et chaque jeu réagit différemment aux trajectoires. Vous pouvez choisir parmi 13 formes géométriques disponibles (classées ici dans l'ordre exact du menu OLED) :"},{"type":"liste","contenu":"**Horiz. Flaire :** Fait des allers-retours horizontaux sur une ligne\n**Circular :** Dessine un cercle régulier et fluide\n**Fig. 8 :** Forme un 8 couché avec deux boucles verticales\n**Flat Infinity :** Dessine un sigle infini (∞) aplati, plus large que haut\n**Round Infinity :** Dessine un sigle infini (∞) équilibré, presque aussi haut que large\n**Losange :** Suit une trajectoire en carré ou losange (→ ↓ ← ↑)\n**Tall Oval :** Forme un ovale vertical (plus haut que large)\n**Wide Oval :** Forme un ovale horizontal (plus large que haut)\n**Spiral :** Dessine un cercle en spirale dont le rayon augmente puis diminue\n**Helix :** Fait tourner un petit carré/losange autour du centre\n**Helix 2 :** Identique à Helix, mais avec une progression plus lente entre les directions\n**Flower :** Dessine une rosace à plusieurs pétales\n**Vert. Flaire :** Fait des allers-retours verticaux sur une ligne","numerote":true},{"type":"texte","style":"h2","contenu":"⚙️ Les paramètres de réglage (*Radius & Step*)"},{"type":"texte","style":"p","contenu":"Chaque configuration repose sur deux variables clés :"},{"type":"liste","contenu":"**Radius (Rad) — Le Rayon :** Définit l'amplitude ou la taille de la forme dessinée.\n> *(⚠️ La valeur du Radius doit impérativement être supérieure à la DeadZone configurée en jeu pour être prise en compte).*\n**Step (Cadence / Vitesse) :** Définit l'incrémentation de l'angle à chaque cycle du script.\n- *Step de 1 :* L'angle augmente de 1° par cycle (dessin très lent et progressif).\n- *Step de 15 :* L'angle augmente de 15° par cycle (balayage rapide)."},{"type":"texte","style":"h2","contenu":"🎛️ Profils de réglage par situation"},{"type":"texte","style":"p","contenu":"Vous pouvez régler le **Radius** et le **Step** indépendamment selon 4 scénarios de combat :"},{"type":"liste","contenu":"**ADS Only :** S'applique lorsque vous visez sans tirer.\n**FIRE Only :** S'applique lorsque vous tirez au jugé sans viser.\n**ADS + FIRE :** S me applique lorsque vous visez et tirez simultanément.\n**NEUTRAL :** S'applique lorsque vous ne visez pas et ne tirez pas (permet de garder l'aide à la visée active en permanence pendant vos déplacements)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Désactivation ciblée :** Si vous ne voulez pas d'assist dans une situation donnée (par exemple au tir au jugé), réglez simplement le **Radius** et le **Step** de ce mode sur **0**."}]},{"id":"ls-assist","titre":"🏃 LS Assist","blocs":[{"type":"texte","style":"p","contenu":"Le **LS Assist** applique le même principe de micro-mouvements que le **AIM Assist**, mais sur le stick de déplacement (gauche). Il force le jeu à détecter votre personnage comme étant en mouvement perpétuel, ce qui déclenche l'aide à la visée native du jeu."},{"type":"texte","style":"h2","contenu":"📐 Formes disponibles pour le LS Assist"},{"type":"texte","style":"p","contenu":"Le LS Assist propose une sélection restreinte de 5 formes optimisées pour le déplacement :"},{"type":"liste","contenu":"**Horiz. Flaire** *(La plus populaire et surement la plus efficace en duel)*\n**Circular**\n**Fig. 8**\n**Flat Infinity**\n**Round Infinity**","numerote":true},{"type":"texte","style":"h2","contenu":"🛑 Coupure automatique du LS Assist"},{"type":"texte","style":"p","contenu":"Contrairement au stick droit, lorsque vous déplacez réellement votre stick gauche pour faire marcher ou courir votre personnage, **le LS Assist s'interrompt automatiquement** dès que la valeur de votre déplacement dépasse le *Radius* configuré. Il reprend instantanément dès que le stick revient au centre."},{"type":"texte","style":"h2","contenu":"🛠️ Comportement dynamique & Dépannage"},{"type":"liste","contenu":"**Centrage dynamique :** La forme géométrique est dessinée en temps réel autour de la position actuelle de votre stick. Si vous poussez votre stick droit à 30 % vers la droite pour suivre une cible, le cercle ou l'ovale se dessinera autour de ce point à 30 %.\n**Réduction en butée :** Plus vous approchez le stick du bord physique de la manette (en butée), plus l'amplitude du MOD se réduit automatiquement pour ne pas altérer votre vitesse de rotation maximale.\n**Écran qui tremble ?** Si votre caméra secoue trop à l'écran, votre **Radius** est trop élevé. Réduisez progressivement la valeur du Radius jusqu'à obtenir un balayage fluide et invisible à l'œil nu."},{"type":"cartelien","affichage":"pleine","titre":"🎥 Démonstration vidéo : AIM Assist & LS Assist en action","destination":"https://www.youtube.com/watch?v=xVhBBF5Q1VU","contenu":"Ouvrir la page dédiée →","icone":"link"}]},{"id":"aim-abuse","titre":"🎯 AIM Abuse","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'AIM Abuse et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**AIM Abuse** est un MOD conçu pour tirer parti de la mécanique d'**Auto-Snap** (le verrouillage automatique de la visée) présente dans certains jeux.\n\nDans ces jeux, appuyer sur la touche de visée lorsque vous êtes proche d'un ennemi « colle » instantanément le viseur sur la cible. Le MOD AIM Abuse automatise ce geste : il relâche et ré-enfonce la gâchette de visée à une fréquence très rapide. Ce rafraîchissement continu réactive l'Auto-Snap en boucle, forçant votre viseur à rester verrouillé sur l'adversaire, même s'il est en mouvement."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Compatibilité des jeux :**\n\nL'Auto-Snap est de moins en moins présent dans les FPS compétitifs modernes, mais il reste extrêmement puissant dans des jeux comme *GTA V*, *Red Dead Redemption 2*, ou certains jeux de tir disposant d'une aide à la visée renforcée."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer de Timing"},{"type":"texte","style":"p","contenu":"Un spam de visée exécuté à des intervalles strictement identiques (à la milliseconde près) constitue une signature mécanique facilement repérable.\n\nPour protéger votre compte, ce MOD est équipé d'un **Humanizer de Timing**. Il génère de micro-variations aléatoires sur les durées de maintien et de relâchement. L'enchaînement conserve ainsi un rythme vivant et naturel, tout en maintenant un rafraîchissement ultra-efficace de l'Auto-Snap.\n\n**⚙️ Le système de déclenchement :** [**MODs Activator**](page:mods-activator)\n\nAIM Abuse s'appuie sur le système [**MODs Activator**](page:mods-activator). Il s'agit des conditions nécessaires pour déclencher votre MOD. Vous choisissez exactement *comment* et *quand* votre MOD doit s'activer"},{"type":"texte","style":"h2","contenu":"🛠️ Les réglages du MOD"},{"type":"texte","style":"p","contenu":"Pour obtenir un verrouillage fluide sans que l'image ne saute à l'écran, le MOD repose sur deux paramètres à ajuster :"},{"type":"liste","contenu":"**Hold Time :** Définit la durée pendant laquelle la touche de visée reste maintenue enfoncée.\n**Release Time :** Définit la durée pendant laquelle la visée est brièvement relâchée avant d'être réenclenchée."},{"type":"carte","couleur":"jaune","contenu":"💡 **Conseil de réglage :**\n\nL'astuce consiste à régler le **Release Time** le plus finement possible :"},{"type":"liste","contenu":"Il doit être **assez court** pour que votre arme ne quitte pas visuellement le mode visée (pas de zoom/dézoom gênant).\nIl doit être **assez long** pour que le jeu enregistre le relâchement et réactive l'Auto-Snap dès la pression suivante.\n> *Le Hold Time peut rester plus long sans altérer l'efficacité.*"}]},{"id":"shot-mods","titre":"🤸 Shot MODs","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'un Shot MOD ?"},{"type":"texte","style":"p","contenu":"Un **Shot MOD** est un module d'action automatique qui déclenche un mouvement tactique (s'accroupir, sauter ou se décaler) lorsque vous visez ou tirez. Son objectif principal est de perturber la visée adverse lors de vos duels (*gunfights*) en vous rendant beaucoup plus difficile à toucher, tout en vous laissant concentré sur votre tir.\n\nChaque profil dispose de son propre Shot MOD paramétrable de manière indépendante."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer de Timing"},{"type":"texte","style":"p","contenu":"Les mouvements répétitifs exécutés à la milliseconde près trahissent immédiatement un comportement automatisé.\n\nLe **Strafe Shot** intègre un **Humanizer de Timing**. Il applique de légères variations aléatoires sur la durée des pas de côté. Vos déplacements conservent ainsi un rythme vivant et naturel, évitant un rendu robotisé pour passer sous le radar des systèmes anti-cheat.\n\n**⚙️ Le système de déclenchement :** [**MODs Activator**](page:mods-activator)\n\nLes Shot MODs s'appuient sur le système [**MODs Activator**](page:mods-activator). Il s'agit des conditions nécessaires pour déclencher votre MOD. Vous choisissez exactement *comment* et *quand* votre MOD doit s'activer"},{"type":"texte","style":"h1","contenu":"🛠️ Les différents Shot MODs disponibles"},{"type":"texte","style":"h2","contenu":"1. ⬇️ Drop Shot"},{"type":"texte","style":"p","contenu":"Fait s'accroupir automatiquement votre personnage lorsque le MOD s'active."},{"type":"liste","contenu":"Réduit subitement votre zone d'impact (*hitbox*), forçant l'adversaire à tirer au-dessus de vous."},{"type":"texte","style":"h2","contenu":"2. ⬆️ Jump Shot"},{"type":"texte","style":"p","contenu":"Fait sauter automatiquement votre personnage dès l'engagement du tir."},{"type":"liste","contenu":"Particulièrement redoutable en combat rapproché pour déstabiliser la visée ennemie et éviter les tirs à la tête (*headshots*)."},{"type":"texte","style":"h2","contenu":"3. ↔️ Strafe Shot"},{"type":"texte","style":"p","contenu":"Fait effectuer à votre personnage des pas alternés de gauche à droite pendant le tir pour vous rendre insaisissable.\n\nParamètres à régler :"},{"type":"liste","contenu":"**Strafe Time :** Définit la durée (en millisecondes) de chaque déplacement latéral avant le changement de direction.\n**Counter Value :** Compensation automatique du viseur. Lorsque votre personnage se déplace vers la droite, le script décale légèrement le stick de visée vers la gauche (et inversement). Cela annule l'impact de vos propres mouvements pour maintenir votre viseur parfaitement calé sur la cible."},{"type":"carte","couleur":"jaune","contenu":"💡 **Conseil pour Counter Value :**\n\nLa valeur de compensation idéale varie en fonction de la distance. Plus l'adversaire est loin, plus le correctif de visée doit être faible pour ne pas dépasser la cible."}]},{"id":"auto-ads-fire","titre":"🔀 Auto ADS & Auto FIRE","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto ADS et l'Auto FIRE ?"},{"type":"texte","style":"p","contenu":"Ces deux MODs simplifient vos actions au combat en supprimant la nécessité d'appuyer sur deux gâchettes en même temps. Ils permettent de réduire votre temps de réaction en combinant la visée et le tir en une seule pression."},{"type":"texte","style":"h1","contenu":"🛠️ Fonctionnement des 2 modes"},{"type":"texte","style":"h2","contenu":"1. 🎯 Auto ADS *(Visée automatique)*"},{"type":"texte","style":"p","contenu":"Appuie automatiquement sur la touche de visée (**ADS**) dès que vous enfoncez la touche de tir (**FIRE**)."},{"type":"liste","contenu":"**Utilité :** Idéal si vous avez tendance à tirer au jugé en panique lors d'un duel imprévu. Le script s'assure que vous passez immédiatement en visée épaulée pour gagner en précision sans devoir presser la gâchette de visée."},{"type":"texte","style":"h2","contenu":"2. 💥 Auto FIRE *(Tir automatique)*"},{"type":"texte","style":"p","contenu":"Appuie automatiquement sur la touche de tir (**FIRE**) dès que vous enfoncez la touche de visée (**ADS**)."},{"type":"liste","contenu":"**Utilité :** Permet d'ouvrir le feu à la milliseconde près dès que vous épaulez votre arme, éliminant tout temps d'hésitation."}]},{"id":"auto-scope","titre":"🔭 Auto Scope & Quick Scope","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto Scope et le Quick Scope ?"},{"type":"texte","style":"p","contenu":"Ces deux MODs sont spécialement développés pour les fusils de précision (Sniper). Ils automatisent les techniques de visée et de tir rapide pour vous donner un avantage décisif lors de vos duels à distance ou à courte portée."},{"type":"texte","style":"h1","contenu":"🛠️ Les 2 MODs disponibles suivant le script utilisé"},{"type":"texte","style":"h2","contenu":"1. 🎯 Auto Scope"},{"type":"texte","style":"p","contenu":"Bascule automatiquement votre arme en mode zoom/lunette dès que vous appuyez sur la touche de visée (**ADS**).\n\nParamètre à régler :"},{"type":"liste","contenu":"**Scope Delay :** Définit le délai d'attente (en millisecondes) avant le déclenchement automatique du zoom après avoir pressé *Viser*."},{"type":"carte","couleur":"jaune","contenu":"💡 **Conseil de réglage :**\n\nNe réglez pas un délai trop court ! Le jeu doit impérativement avoir le temps d'amorcer l'animation de visée avant que le script n'envoie la commande de zoom. Si le délai est trop rapide, l'action sera ignorée par le jeu."},{"type":"texte","style":"h2","contenu":"2. ⚡ Quick Scope"},{"type":"texte","style":"p","contenu":"Déclenche un tir automatique un court instant après avoir pressé la touche de visée (**ADS**), reproduisant à la perfection la célèbre technique du *QuickScope*.\n\nParamètre à régler :"},{"type":"liste","contenu":"**QuickScope Delay :** Définit le temps de pause (en millisecondes) entre le début de la visée et le départ du coup de feu."},{"type":"carte","couleur":"jaune","contenu":"💡 **Conseil de réglage :**\n\nTrouver le bon équilibre est essentiel :"},{"type":"liste","contenu":"**Trop rapide :** La balle partira avant que le jeu ne vous considère en position de visée, transformant votre coup en un tir au jugé (*hip-fire*) imprécis.\n**Trop lent :** Vous perdez tout l'intérêt du QuickScope et laissez le temps à l'adversaire de répliquer."}]},{"id":"headshot-assist","titre":"💀 HeadShot Assist","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le HeadShot Assist et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **HeadShot Assist** est un module d'aide à la visée qui applique une légère impulsion verticale vers le haut lorsque vous épaulez votre arme, afin d'aligner plus rapidement votre réticule sur la tête de l'adversaire."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Mise au point importante (ce n'est PAS un aimbot) :**\n\nCe MOD n'est en aucun cas un *cheat PC* ou un *lock* automatique qui repère la tête de l'ennemi à l'écran. Il s'agit simplement d'une assistance mécanique qui tire votre viseur vers le haut."},{"type":"carte","couleur":"jaune","contenu":"💡 *Remarque : Si votre réticule est déjà positionné à hauteur de tête au moment où le MOD s'active, l'impulsion fera monter votre viseur au dessus de la tête !*"},{"type":"texte","style":"h1","contenu":"⚡ Les 3 modes de déclenchement"},{"type":"texte","style":"h2","contenu":"1. 🚀 Instant"},{"type":"texte","style":"p","contenu":"Le HeadShot Assist se déclenche immédiatement dès que vous appuyez sur la touche de visée (**ADS**)."},{"type":"texte","style":"h2","contenu":"2. 🎯 Press Sensitive"},{"type":"texte","style":"p","contenu":"Le HeadShot Assist s'active uniquement lorsque vous enfoncez la gâchette de visée à fond (en butée)."},{"type":"liste","contenu":"**Utilité :** Permet de viser normalement en appuyant légèrement sur la gâchette, et de ne déclencher le coup de pouce vers la tête que lorsque vous enfoncez la gâchette au maximum."},{"type":"texte","style":"h2","contenu":"3. 🔄 Release Sensitive"},{"type":"texte","style":"p","contenu":"Permet de déclencher l'assistance à tout moment pendant la visée. Vous pouvez maintenir la visée aussi longtemps que vous le souhaitez sans rien activer. Quand vous avez besoin du HeadShot Assist, **relâchez légèrement la gâchette** (sans la lâcher complètement) puis enfoncez-la à nouveau en butée."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Note :** Si vous relâchez totalement la gâchette (à 0 %), le geste est annulé et l'assistance ne se déclenchera pas. Cela évite les déclenchements involontaires lors d'une sortie de visée."},{"type":"texte","style":"h2","contenu":"📏 Préréglages de distance & Mode Custom"},{"type":"texte","style":"p","contenu":"La distance de l'ennemi influe directement sur l'amplitude de mouvement nécessaire : plus l'adversaire est loin, plus l'impulsion doit être légère pour ne pas dépasser la cible.\n\nLe MOD propose **3 pré-réglages optimisés** et un mode **Custom** :"},{"type":"liste","contenu":"🥊 **Close :** Ajusté pour les combats rapprochés (environ **5 à 15 mètres**).\n🎯 **Medium :** Ajusté pour les engagements à moyenne distance (environ **15 à 30 mètres**).\n🔭 **Long :** Ajusté pour les cibles éloignées (**30 mètres et plus**).\n🛠️ **Custom :** Vous permet de régler manuellement une valeur numérique précise pour adapter l'impulsion à vos habitudes de jeu ou à votre sensibilité habituelle."}]},{"id":"deadeye","titre":"👁️ DeadEye","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD DeadEye ?"},{"type":"texte","style":"p","contenu":"Le **MOD DeadEye** est spécialement conçu pour automatiser et optimiser l'utilisation de la mécanique de *DeadEye* (ralenti / visée de précision) présente dans *Red Dead Redemption 2.*\n\nIl permet d'enclencher automatiquement la compétence au moment opportun sans nécessiter d'appui manuel sur le stick, évitant ainsi de perdre du temps ou de gâcher votre jauge de compétence."},{"type":"texte","style":"h1","contenu":"🛠️ Les 2 variantes disponibles"},{"type":"texte","style":"h2","contenu":"1. 🎯 Auto DeadEye"},{"type":"texte","style":"p","contenu":"Enclenche automatiquement le *DeadEye* dès que vous enfoncez la gâchette de visée (**ADS**)."},{"type":"liste","contenu":"**Utilité :** Idéal si vous souhaitez entrer en mode ralenti/précision immédiatement à chaque prise de visée."},{"type":"texte","style":"h2","contenu":"2. ⚡ DeadShot"},{"type":"texte","style":"p","contenu":"Enclenche le *DeadEye* de manière ultra-furtive, juste à l'instant précis où vous appuyez sur la gâchette de tir (**FIRE**)."},{"type":"carte","couleur":"jaune","contenu":"💡 **La particularité du DeadShot (Précision chirurgicale) :**\n\nDans *Red Dead Redemption 2*, déclencher le *DeadEye* juste avant le départ du coup réduit instantanément le cercle de dispersion (le réticule d'impact) au point central."},{"type":"texte","style":"p","contenu":"En activant la compétence uniquement lors de la pression sur la détente, le **DeadShot** force une précision à 100 % au moment exact de l'impact, tout en préservant votre jauge de *DeadEye* le reste du temps."}],"scripts":["rdr2"]},{"id":"hold-breath","titre":"🫁 Hold Breath","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Hold Breath et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Hold Breath** est un MOD conçu pour les fusils de précision (snipers) et les armes équipées de lunettes grossissantes. Il bloque automatiquement le souffle de votre personnage dès que vous passez en visée, éliminant totalement le balancement naturel de l'arme pour un tir parfaitement stable."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu & Déclenchement :"},{"type":"liste","contenu":"**Déclenchement automatique :** Dès que vous maintenez la touche de visée, le script appuie automatiquement sur la touche d'apnée ( {L3 / LS}).\n**Ergonomie accrue :** Vous n'avez plus besoin d'enfoncer physiquement le stick gauche ( {L3 / LS}) en pleine visée, ce qui évite de décaler votre réticule au moment crucial."}],"scripts":["fps-tps"]},{"id":"autorun","titre":"🏃 AutoRun","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'AutoRun et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**AutoRun** est un module d'automatisation des déplacements. Il prend en charge la pression répétée ou le maintien de la touche de course à votre place, évitant ainsi de fatiguer vos doigts et de vous détruire les sticks analogiques."},{"type":"carte","couleur":"jaune","contenu":"💡 **Indicateur visuel :** Lorsque l'AutoRun est actif en jeu, les LEDs du Cronus Zen clignotent rapidement pour vous indiquer son fonctionnement."},{"type":"texte","style":"h1","contenu":"⚙️ Les 2 modes d'AutoRun selon vos jeux"},{"type":"texte","style":"p","contenu":"Le comportement de l'AutoRun est directement adapté au moteur du jeu concerné. Le script intègre automatiquement la version correspondant au titre auquel vous jouez."},{"type":"texte","style":"h2","contenu":"1. 🎯 Mode FPS / TPS (incluant GTA VI)"},{"type":"texte","style":"p","contenu":"Un fonctionnement fluide basé uniquement sur l'inclinaison du stick analogique :"},{"type":"liste","contenu":"**Activation :** Poussez le stick de déplacement vers l'avant à **90 % ou plus** pour déclencher automatiquement la course.\n**Arrêt :** Relâchez le stick sous le seuil des **20 %** pour stopper l'AutoRun et revenir à une marche normale."},{"type":"texte","style":"h2","contenu":"2. 🤠 Mode GTA V / Red Dead Redemption 2"},{"type":"texte","style":"p","contenu":"Les jeux Rockstar nécessitant de maintenir ou de tapoter la touche de course ( {CROSS / A}), ce mode gère un **cycle intelligent à 3 états** dès que le stick est poussé **à plus de 85 %** :"},{"type":"liste","contenu":"**🚶 Marcher :** État de départ lorsque vous poussez le stick vers l'avant.\n**🏃 Courir :** Appuyez **une fois** sur {CROSS / A} : Le script maintient automatiquement la touche pour vous faire courir.\n**⚡ Sprinter :** Appuyez **une seconde fois** sur {CROSS / A} : Le script simule des pressions ultra-rapides (spam) pour vous faire sprinter à vitesse maximale.\n**🚶 Retour à la marche :** Appuyez **une troisième fois** sur{CROSS / A} (ou relâchez le stick **sous les 80 %**) pour réinitialiser le cycle."},{"type":"carte","couleur":"jaune","contenu":"💡 **Gestion automatique de la visée :** Si vous passez en visée (**ADS**) pendant un sprint, le script rétrograde automatiquement le déplacement de *Sprinter* à *Courir*, le moteur du jeu ne permettant pas de sprinter tout en épaulant son arme."}]},{"id":"turbo-boutons","titre":"⚡ Turbo Boutons","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'un Turbo Bouton et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Un **Turbo Bouton** automatise des pressions ultra-rapides (*spam*) sur une touche spécifique à votre place. Il suffit de maintenir le bouton pour que le script simule un martèlement continu, idéal pour ramasser du loot rapidement, recharger à la chaîne ou valider des actions répétitives sans fatiguer vos doigts."},{"type":"carte","couleur":"jaune","contenu":"💡 **Indicateur visuel :** Lorsque le Turbo Bouton est en cours d'exécution, les LEDs du Cronus Zen clignotent rapidement."},{"type":"texte","style":"h3","contenu":"🛡️ Sécurité : Humanizer de Timing"},{"type":"texte","style":"p","contenu":"Un spam de touche parfaitement régulier est une signature mécanique facile à repérer pour les anti-cheats.\n\nCe MOD intègre un **Humanizer de Timing** qui génère de micro-variations aléatoires dans la cadence d'exécution. Cela évite les intervalles figés et répétés à la milliseconde près, donnant au spam de boutons un rythme vivant et 100 % naturel."},{"type":"texte","style":"h2","contenu":"🎮 Les 3 Turbo Boutons disponibles"},{"type":"texte","style":"p","contenu":"Vous pouvez **activer** indépendamment jusqu'à 3 Turbo Boutons dans le menu du script :"},{"type":"etiquettes","contenu":"Turbo CROSS / A | Turbo SQUARE / X | Turbo CIRCLE / B"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Précision d'utilisation :** Vous pouvez laisser les 3 Turbo Boutons activés dans le menu, mais vous ne pouvez pas les **exécuter simultanément** en jeu (le script ne peut pas spammer {CROSS / A} et {CIRCLE / B} en même temps)."},{"type":"texte","style":"h2","contenu":"🛠️ Comment exécuter le Turbo en jeu ?"},{"type":"texte","style":"p","contenu":"L'activation en jeu a été pensée pour ne pas gêner vos pressions simples habituelles :\n\n**Exécution :** Effectuez un **double-tap** (deux pressions rapides) sur le bouton souhaité et **maintenez-le enfoncé** lors de la seconde pression.\n\n**Arrêt :** Relâchez simplement le bouton pour stopper instantanément le Turbo."}]},{"id":"quick-item-gta6","titre":"💊 Quick Item (GTA VI)","blocs":[{"type":"texte","style":"p","contenu":"En développement ..."}]},{"id":"auto-unscope","titre":"🔭 Auto Unscope (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto Unscope et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Redemption 2*, lorsque vous passez en visée à la lunette (en appuyant sur **Viser** puis sur **Flèche du bas / D-Pad Down**), le jeu conserve ce mode de zoom en mémoire. Si vous ne sortez pas manuellement de la lunette, votre personnage repassera automatiquement en visée sniper la prochaine fois que vous appuyez sur la gâchette, ce qui peut vous désorienter en combat rapproché.\n\nL'**Auto Unscope** élimine cette contrainte : il automatise la sortie de la lunette dès que vous relâchez la gâchette de visée (**ADS**)."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Visée classique :** Vous appuyez sur **ADS** pour viser normalement.\n**Passage en lunette :** Vous appuyez sur **Flèche du bas / D-Pad Down** pour zoomer dans la lunette.\n**Réinitialisation automatique :** Dès que vous relâchez la gâchette **ADS**, le script envoie immédiatement la commande de sortie de lunette. Lors de votre prochaine prise de visée, vous revenez systématiquement en visée épaulemé classique."},{"type":"carte","couleur":"jaune","contenu":"💡 **Avantage :** Plus besoin de retenir si votre arme est restée en mode lunette ou non, vous reprenez toujours le contrôle en visée standard."}]},{"id":"auto-reload","titre":"🔄 Auto Reload (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto Reload et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Redemption 2*, après avoir tiré avec un répititeur ou un fusil à levier/verrou, vous devez effectuer une pression supplémentaire sur le bouton de tir pour réarmer manuellement le chien ou engager la cartouche suivante dans le canon.\n\nL'**Auto Reload** prend en charge ce réarmement mécanique à votre place immédiatement après chaque tir."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Automatisation du réarmement :** Dès que vous relâchez la touche de tir (**FIRE**), le script simule une impulsion ultra-rapide sur la détente pour armer le mécanisme.\n**Gain de réactivité :** Votre arme est immédiatement chargée et prête pour le coup suivant, vous évitant ainsi le temps mort d'une pression manuelle oubliée en plein duel."}]},{"id":"skid-stop","titre":"🐎 Skid Stop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Skid Stop et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Redemption 2*, lorsque votre cheval atteint le **Niveau 3 d'affection ou supérieur**, vous débloquez la capacité d'exécuter un dérapage d'arrêt rapide_(Skid Stop)_ . De base, cette manœuvre nécessite de maintenir simultanément {R1 / RB} et {CROSS / A}.\n\nLe MOD **Skid Stop** simplifie l'exécution de ce mouvement technique en l'attribuant à une commande simple à une seule touche."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Déclenchement :** Effectuez un double-tap (deux pressions rapides) sur la touche {R1 / RB} tout en étant à cheval.\n**Action du script :** Le script maintient automatiquement la combinaison de touches nécessaire ( {R1 / RB} + {CROSS / A}) pour faire déraper et stopper net votre monture."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Préréquis :** Ce mouvement nécessite impérativement que votre cheval soit au **niveau 3 ou 4 d'affection** dans le jeu."}]},{"id":"easy-eagle-eye","titre":"👁️ Easy Eagle Eye (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Easy Eagle Eye et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Redemption 2*, la compétence L'Œil de lynx (**Eagle Eye**) vous permet d'analyser votre environnement et de suivre les pistes d'animaux. De base, son activation nécessite d'enfoncer simultanément les deux sticks analogiques ( {L3 / LS} + {R3 / RS}).\n\nL'**Easy Eagle Eye** simplifie cette manipulation en l'attribuant à une unique pression pour ne plus rater la combinaison en plein jeu."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Activation :** Un simple clic sur le stick droit ( {R3 / RS}) suffit pour lancer instantanément l'Œil de lynx."}]},{"id":"horse-galop","titre":"🐎 Horse Gallop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Horse Gallop et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Horse Gallop** automatise le martèlement de la touche de galop tout en gérant le niveau de fatigue de votre monture.\n\nEn plus d'enchaîner les pressions à votre place, le script prend soin de **calmer régulièrement votre cheval** pendant la course. Cela fait remonter sa barre d'endurance au fur et à mesure de votre trajet."},{"type":"carte","couleur":"jaune","contenu":"💡 **Efficacité optimale :** La régénération d'endurance en calmant le cheval est particulièrement puissante à partir du **niveau 3 d'affection**."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Condition préalable :** Vérifiez que la mention « **Horse** » est affichée sur l'écran OLED de votre Zen.\n**Activation :** Effectuez un **double-tap** sur {CROSS / A} et maintenez la touche enfoncée lors de la seconde pression.\n**Indicateur visuel :** Pendant le galop automatique, les LEDs du Cronus Zen clignotent rapidement.\n**Arrêt :** Relâchez simplement {CROSS / A} pour stopper le galop."}]},{"id":"cinema-galop","titre":"🎥 Cinema Gallop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Cinema Gallop et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Cinema Gallop** associe le confort de la caméra cinématique de *Red Dead Redemption 2* à la gestion automatique des déplacements. Il vous permet de faire trotter ou galoper votre cheval sur de longues distances sans toucher à la manette, tout en restaurant continuellement son endurance en le calmant."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"texte","style":"p","contenu":"1️⃣ **Entrer en mode Cinema Gallop :**\nUne fois en selle (écran OLED affichant « **Horse** » et LEDs blanches), maintenez la touche du mode Cinéma enfoncée pendant **1,5 seconde**."},{"type":"texte","style":"h3","contenu":"2️⃣ Sélectionner l'allure :"},{"type":"liste","contenu":"- Appuyez **une fois** sur {CROSS / A} : Votre cheval passe en Trot tout en étant calmé régulièrement.\n- Appuyez **une seconde fois** sur {CROSS / A} : Votre cheval passe en Galop (les LEDs du Zen clignotent rapidement) tout en gérant son endurance.\n- Appuyez **une troisième fois** sur {CROSS / A} : Le déplacement automatique s'arrête."},{"type":"texte","style":"p","contenu":"3️⃣ **Sortir du mode Cinéma :**\nAppuyez à nouveau sur la touche **Cinéma** ou sur la gâchette de visée (**ADS**)."}]},{"id":"quick-item-rdr2","titre":"💊 Quick Item (RDR2 / RD Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Quick Item et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Quick Item** vous permet d'utiliser instantanément un soin de santé, d'endurance ou de DeadEye en exécutant une simple combinaison de touches, sans avoir à naviguer manuellement dans la roue des objets en plein combat."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Prérequis obligatoire :** Avant d'utiliser ce MOD en jeu, ouvrez votre roue des objets (*Items*) et sélectionnez manuellement le tonique/soin spécifique que vous souhaitez attribuer à chaque emplacement."},{"type":"texte","style":"h2","contenu":"🎮 Correspondance des touches dans la roue"},{"type":"texte","style":"p","contenu":"Le script cible trois positions précises dans la roue des objets :"},{"type":"liste","contenu":"{SQUARE / X} (Haut-Gauche) : Soin de **Santé**.\n{TRIANGLE / Y} (Haut) : Soin d'**Endurance**.\n{CIRCLE / B} (Haut-Droite) : Soin de **DeadEye**."},{"type":"texte","style":"p","contenu":"**Pour déclencher un soin :** Maintenez{L1 / LB} puis effectuez un **double-tap** sur la touche correspondant au soin désiré."},{"type":"texte","style":"h1","contenu":"🛠️ Les 2 modes de Quick Item disponibles"},{"type":"texte","style":"h2","contenu":"1. 🧪 Mode Standard"},{"type":"texte","style":"p","contenu":"Consomme normalement le tonique sélectionné dans votre inventaire."},{"type":"texte","style":"h2","contenu":"2. ⚡ Mode Glitch *(Utilisation infinie en mode Histoire seulement)*"},{"type":"texte","style":"p","contenu":"Permet de consommer l'effet du tonique **sans qu'il ne soit retiré de votre inventaire**, vous permettant de réutiliser le même tonique des dizaines de fois."},{"type":"liste","contenu":"**Condition impérative :** Vous devez **impérativement porter une arme longue en main** (fusil, carabine, fusil à pompe). Le glitch ne fonctionne pas avec un revolver, un pistolet ou un arc.\n**Mouvement automatique :** Au moment exact de boire la potion, le script fait sauter votre personnage. Cette interruption de l'animation applique le bonus de soin tout en annulant la déduction de l'objet dans votre inventaire."},{"type":"carte","couleur":"blue","contenu":"ℹ️ Note : Il arrive très rarement que le jeu valide la consommation et retire le tonique malgré le saut, mais le système reste fonctionnel dans la vaste majorité des cas."}]},{"id":"autostop-deadeye","titre":"🛑 AutoStop DeadEye (RD Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'AutoStop DeadEye et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Dans *Red Dead Online*, contrairement au mode histoire, la compétence *DeadEye* reste active même lorsque vous relâchez la gâchette de visée, ce qui vide inutilement votre jauge de compétence si vous oubliez de la couper manuellement.\n\nL'**AutoStop DeadEye** résout ce problème en coupant automatiquement le *DeadEye* dès que vous relâchez la touche de visée (**ADS**)."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Économie de jauge :** Dès que vous relâchez la gâchette **ADS**, le script envoie l'impulsion pour désactiver instantanément le *DeadEye*.\n**Confort :** Vous préservez votre jauge de compétence pour les duels suivants sans aucune manipulation supplémentaire."}]},{"id":"autospin","titre":"🔄 AutoSpin (RD Online - GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'AutoSpin et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**AutoSpin** est un utilitaire simple qui force votre personnage à tourner en boucle sur lui-même de manière continue.\n\nIl est principalement utilisé pour éviter la déconnexion automatique pour inactivité (*kick AFK*) lorsque vous devez vous absenter quelques minutes sans quitter la session."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Activation :** Maintenez enfoncé le stick droit {R3 / RS}.\n**Action du script :** Le personnage pivote en continu jusqu'à ce que vous relâchiez le stick."}]},{"id":"online-boss","titre":"🏢 Online Boss (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Online Boss ?"},{"type":"texte","style":"p","contenu":"Dans *GTA Online*, lorsque vous devenez **PDG (C.E.O)** ou **Président d'un club de motards (MC President)**, le menu d'interaction de votre personnage change légèrement d'organisation.\n\nActiver ces modes dans le script indique à l'interface où vous vous trouvez dans le jeu, permettant au Cronus Zen d'exécuter les séquences exactes de touches dans les menus interactifs pour commander vos véhicules ou compétences en un clin d'œil."},{"type":"texte","style":"h1","contenu":"🛠️ Les 2 statuts disponibles"},{"type":"texte","style":"h2","contenu":"1. 💼 C.E.O (SecuroServ)"},{"type":"texte","style":"p","contenu":"Activez cette option dans le script lorsque vous vous enregistrez comme PDG en jeu."},{"type":"liste","contenu":"**À quoi ça sert ?** Le script adapte les raccourcis des menus d'interaction SecuroServ.\n**Exemples d'actions rapides :** Appeler votre hélicoptère Buzzard en un seul clic ou activer immédiatement l'**Organisation Fantôme** pour disparaître du radar des autres joueurs."},{"type":"texte","style":"h2","contenu":"2. 🏍️ MC President (Club de Motards)"},{"type":"texte","style":"p","contenu":"Activez cette option dans le script lorsque vous êtes Président de votre club de motards."},{"type":"liste","contenu":"**À quoi ça sert ?** Le script adapte les séquences pour le menu de club de motards.\n**Exemples d'actions rapides :** Faire apparaître instantanément votre moto préférée (comme l'Oppressor) à vos pieds en un clic."},{"type":"carte","couleur":"jaune","contenu":"💡 Lien avec les [**Quick Cheats**](/gta5/quick-cheat/) :\n\nUne fois votre statut défini, ces actions peuvent être liées au moteur de [**Quick Cheats**](/gta5/quick-cheat/) pour s'exécuter d'une simple combinaison de touches en plein duel."}]},{"id":"easy-roll","titre":"🔄 Easy Roll (GTA V / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Easy Roll et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"En combat rapproché dans *GTA*, exécuter une roulade est la technique clé pour casser la visée automatique adverse. De base, elle nécessite d'épauler son arme puis d'appuyer sur la touche de saut.\n\nL'**Easy Roll** simplifie la manipulation : un simple clic sur {L3 / LS} déclenche immédiatement la roulade, vous permettant de réagir à la milliseconde près sous le feu ennemi."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Condition :** Équipez une arme en main.\n**Activation :** Pressez simplement {L3 / LS}. Le script gère la transition de visée et le saut pour exécuter la roulade instantanément."}]},{"id":"turbo-rpg","titre":"💣 Turbo RPG (GTA V / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Turbo RPG et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Turbo RPG** permet d'enchaîner les tirs au lance-roquettes standard à une cadence bien supérieure à celle autorisée par le jeu.\n\nLe script exploite la mécanique du *Weapon Switch* (changement d'arme rapide) : dès que la roquette part, le script bascule sur une autre arme puis revient sur le lance-roquettes en une fraction de seconde, annulant ainsi la longue animation de rechargement manuel."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"texte","style":"p","contenu":"1️⃣ Équipez votre lance-roquettes classique (*RPG*).\n\n2️⃣ **Maintenez la touche de tir (FIRE)**.\n\n3️⃣ Le script effectue la séquence de tir et d'annulation d'animation en boucle pour pilonner la zone en continu."}]},{"id":"klaxon-hold","titre":"🎵 Klaxon Hold (GTA V - GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Klaxon Hold et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Klaxon Hold** prend en charge le maintien continu de la touche de klaxon à votre place lorsque vous êtes au volant d'un véhicule.\n\nC'est le module idéal pour faire jouer en boucle vos klaxons musicaux ou personnalisés dans *GTA Online* sans devoir garder le pouce écrasé sur la manette pendant vos trajets."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu"},{"type":"liste","contenu":"**Activation :** En voiture, maintenez la touche de klaxon en roulant pour lancer la boucle automatique.\n**Arrêt :** Appuyez une nouvelle fois sur la touche de klaxon ou sortez simplement de votre véhicule pour couper le son."}]},{"id":"quick-care","titre":"🩹 Quick Care (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Quick Care et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Quick Care** est un MOD exclusif conçu pour **GTA Online**. Il vous permet de restaurer votre armure ou votre santé ultra-rapidement en plein combat, sans avoir à passer par le menu d'interaction."},{"type":"texte","style":"h2","contenu":"⚙️ Fonctionnement en jeu :"},{"type":"texte","style":"p","contenu":"1️⃣ **Maintenez la touche de visée**.\n\n2️⃣ Soins & Armure :"},{"type":"liste","contenu":"- **Flèche GAUCHE (D-Pad LEFT) :** Appui rapide pour restaurer votre **Armure**.\n- **Flèche DROITE (D-Pad RIGHT) :** Appui rapide pour consommer un **En-cas** (Santé)."}]},{"id":"rs-ls-sensitivity","titre":"🕹️ RS & LS Sensitivity (Sensibilité des Sticks)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le RS & LS Sensitivity ?"},{"type":"texte","style":"p","contenu":"Les MODs **RS Sensitivity** *(Right Stick - Viseur)* et **LS Sensitivity** *(Left Stick - Déplacement)* vous permettent d'outrepasser la gestion de sensibilité native de votre jeu pour modifier entièrement la réponse de vos sticks analogiques.\n\nVous pouvez appliquer des réglages de sensibilité complètement différents selon la situation de combat :"},{"type":"liste","contenu":"**ADS Only :** Lorsque vous visez sans tirer.\n**FIRE Only :** Lorsque vous tirez au jugé sans viser.\n**ADS + FIRE :** Lorsque vous visez et tirez en même temps.\n**HIP (Général) :** Lorsque vous vous déplacez sans viser ni tirer."},{"type":"texte","style":"h1","contenu":"🛠️ Les 3 types de sensibilité disponibles:"},{"type":"texte","style":"h2","contenu":"1. 📈 Ballistic (Courbes balistiques)"},{"type":"texte","style":"p","contenu":"Ce mode modifie la réponse physique de votre stick selon une courbe de réponse personnalisée (à l'image des profils disponibles sur la manette *Xbox Elite Series 2* ou des logiciels PC avancés)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Aperçu en direct :** Dans le menu du script, vous pouvez visualiser le tracé de la courbe sur l'écran OLED en maintenant la touche\n{CROSS / A} lors de la sélection."},{"type":"liste","contenu":"📏 **Linear (Par défaut) :** Courbe standard 1:1. La valeur renvoyée au jeu est strictement égale à l'inclinaison physique du stick.\n⏳ **Delay :** Offre une grande précision au centre du stick pour les micro-ajustements (sensibilité adoucie sur les légers mouvements), puis accélère brutalement lorsque vous poussez le stick vers la butée.\n⚡ **Aggressive :** Répond instantanément dès les premiers millimètres d'inclinaison. Idéal pour un gameplay ultra-réactif ou des tirs réflexes (*flicks*).\n🚀 **Instant :** Atteint une sensibilité maximale quasi-immédiatement après avoir franchi la zone morte, supprimant le temps de montée en charge du stick.\n🌊 **Smooth :** Filtre et lisse les micro-tremblements parasites de vos mains pour offrir un suivi de cible (*tracking*) ultra-fluide et sans à-coups."},{"type":"texte","style":"h2","contenu":"2. 🎚️ Custom Sens (Multiplicateur fixe)"},{"type":"texte","style":"p","contenu":"Permet d'amplifier directement la sensibilité de votre stick en lui appliquant un multiplicateur de puissance."},{"type":"liste","contenu":"**Plage de réglage :** De 0 à 327 , 100 étant la valeur par défaut normal (ce qui correspond à un multiplicateur de **x0** à **x3,27**).\n**Exemple concret :** Si vous réglez la valeur à 200 (multiplicateur x2), pousser votre stick à seulement **50 %** de sa course physique enverra une valeur de **100 %** (butée maximale) à votre jeu."},{"type":"texte","style":"h2","contenu":"3. ⚡ Dynamic Sens (Sensibilité dynamique évolutive)"},{"type":"texte","style":"p","contenu":"Le mode le plus pointu et le plus puissant du script. Il fait varier votre sensibilité en temps réel selon la vitesse et l'amplitude de mouvement de votre stick.\n\nLes 5 variables à configurer :"},{"type":"liste","contenu":"🏁 **Initial Sens :** La sensibilité de départ appliquée lorsque le stick commence à bouger.\n🎯 **Limit Point (Seuil d'accélération) :** L'angle d'inclinaison du stick à partir duquel la sensibilité commence à grimper vers son maximum. En dessous de ce seuil, la sensibilité reste à *Initial Sens*.\n🔄 **Restart Point (Seuil de réinitialisation) :** Si l'inclinaison du stick redescend en dessous de cette valeur, le script réinitialise immédiatement la sensibilité à *Initial Sens*.\n🔝 **Max Sens :** La sensibilité plafond maximale que le système dynamique peut atteindre.\n📈 **Increase Rate :** La vitesse (cadence) à laquelle la sensibilité augmente une fois le *Limit Point* franchi."}]},{"id":"stick-drift","titre":"🕹️ Stick Drift Correction","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que la correction du Stick Drift ?"},{"type":"texte","style":"p","contenu":"Avec le temps et l'usure, les potard des sticks analogiques s'usent et provoquent du *Stick Drift* (le curseur ou la caméra bouge tout seul à l'écran sans que vous ne touchiez à la manette).\n\nCe MOD intègre un outil de diagnostic et de calibration de haute précision directement sur l'écran OLED de votre Cronus Zen. Il neutralise la dérive de vos sticks au point mort sans nécessiter d'augmenter la zone morte (*DeadZone*) dans les paramètres du jeu, préservant ainsi toute la réactivité de votre visée."},{"type":"texte","style":"h2","contenu":"⚙️ Comment diagnostiquer et régler le Drift ?"},{"type":"texte","style":"p","contenu":"1️⃣ **Activation :** Activez l'option dans le menu du script, puis appuyez sur {CROSS / A} pour entrer dans le menu de calibration dédié."},{"type":"texte","style":"h3","contenu":"2️⃣ Mesure en temps réel :"},{"type":"liste","contenu":"- 📊 **Real Time RS :** Affiche la dérive physique brute de votre stick droit en temps réel sur l'écran OLED.\n- 📊 **Real Time LS :** Affiche la dérive physique brute de votre stick gauche en temps réel."},{"type":"texte","style":"h3","contenu":"3️⃣ Application de la correction :"},{"type":"liste","contenu":"- 🎯 **RS Correction :** Ajustez la valeur de compensation pour le stick droit jusqu'à neutraliser totalement la dérive.\n- 🎯 **LS Correction :** Ajustez la valeur de compensation pour le stick gauche jusqu'à neutraliser totalement la dérive."}]},{"id":"hair-trigger","titre":"⚡ Hair Trigger","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu' est-ce que le Hair Trigger et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"De base, les gâchettes analogiques ( {L2 / LT} ou {R2 / RT}) possèdent une course longue : vous devez les enfoncer sur plusieurs millimètres avant que le jeu ne détecte l'action de visée ou de tir.\n\nLe MOD **Hair Trigger** transforme vos gâchettes analogiques en clics numériques ultra-réactifs (type « gâchette mur » ou *clicky trigger*). Dès qu'une micro-pression de 1% est détectée sur la gâchette, le script envoie instantanément un signal d'enfoncement maximal à 100% au jeu."},{"type":"texte","style":"h2","contenu":"🎛️ Options d'attribution"},{"type":"texte","style":"p","contenu":"Vous pouvez choisir d'appliquer le Hair Trigger à :"},{"type":"liste","contenu":"**🎯 Visée uniquement** ( {L2 / LT}) : Pour épauler votre arme à la milliseconde près.\n**💥 Tir uniquement** ( {R2 / RT}) : Pour un départ de coup instantané.\n**⚡ Les deux gâchettes** ( {L2 / LT} + {R2 / RT}) : Pour une réactivité maximale sur toutes vos actions de combat."}]},{"id":"rumble-adt","titre":"📳 Rumble & ADT (Vibrations & Gâchettes Adaptatives)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Rumble & ADT ?"},{"type":"texte","style":"p","contenu":"Ce MOD vous permet de contrôler précisément l'activation des moteurs de vibration (*Rumble*) et des gâchettes adaptatives (*ADT* - Adaptive Triggers) de votre manette (notamment sur PS5 DualSense), directement depuis le menu du script sans devoir modifier vos menus de jeu."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Prérequis obligatoire :** Pour que ce MOD fonctionne correctement, les options de **vibrations** et de **gâchettes adaptatives** doivent **impérativement être activées dans les paramètres du jeu** et réglées sur **« Standard » dans les paramètres généraux de votre console**."},{"type":"texte","style":"h2","contenu":"🛠️ Les 4 modes de configuration au choix"},{"type":"liste","contenu":"🚫 **Disabled :** Désactive à la fois les vibrations de la manette et le mécanisme des gâchettes adaptatives.\n✅ **Enabled :** Laisse les vibrations et les gâchettes adaptatives entièrement actives.\n📳 **Rumble Only :** Désactive les gâchettes adaptatives (*ADT*) tout en conservant les vibrations de la manette.\n⚙️ **ADT Only :** Désactive les vibrations de la manette tout en conservant le fonctionnement des gâchettes adaptatives (*ADT*)."}]},{"id":"buttons-layout","titre":"🎮 Button Layout (Remapping des Boutons)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le Button Layout et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le **Button Layout** vous permet de reconfigurer et de personnaliser entièrement la disposition des touches de votre manette directement depuis le script, sans toucher aux options de votre jeu ou de votre console."},{"type":"texte","style":"h2","contenu":"🛠️ Les 2 modes de configuration"},{"type":"liste","contenu":"🎮 **Standard :** Conserve la disposition par défaut des touches de votre manette en jeu.\n🛠️ **Custom :** Active la personnalisation complète de vos boutons selon vos préférences."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Règle absolue du mode Custom :** **1 action = 1 bouton.** Vous ne pouvez pas attribuer la même touche à deux actions différentes."},{"type":"texte","style":"p","contenu":"🔒 **Sécurité anti-erreur :** Si un conflit ou un doublon de touche est détecté lors de votre configuration, le Zen affichera un message d'erreur sur l'écran OLED et verrouillera la sortie du menu tant que la configuration n'est pas valide."},{"type":"texte","style":"h2","contenu":"⚠️ Consignes et avertissements importants"},{"type":"carte","couleur":"rouge","contenu":"🛑 **Réglages du jeu :** Vous devez **impérativement laisser la configuration des touches sur « Standard » dans les options internes du jeu**. Ne modifiez pas non plus l'attribution des boutons dans les paramètres d'accessibilité de votre console (PS5/Xbox)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Navigation dans les menus du jeu :** Pensez à **désactiver le script lorsque vous naviguez dans les menus du jeu** (inventaire, carte, boutique). Sinon, vos réattributions de touches Custom s'appliqueront aussi à la navigation, ce qui peut rendre les déplacements dans les menus déroutants."}]},{"id":"inverted-axes","titre":"🕹️ Inverted RY / LY (Inversion des Axes Y)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Inverted RY / LY ?"},{"type":"texte","style":"p","contenu":"Le MOD **Inverted RY / LY** vous permet d'inverser la réponse de l'axe vertical (axe Y) de vos sticks analogiques directement depuis le script :"},{"type":"liste","contenu":"🎯 **Inverted RY (Right Stick Y) :** Inverse l'axe vertical du stick droit (caméra / visée). Pousser le stick vers le haut fait descendre la caméra, et le tirer vers le bas la fait monter.\n🏃 **Inverted LY (Left Stick Y) :** Inverse l'axe vertical du stick gauche (déplacement du personnage)."},{"type":"texte","style":"p","contenu":"Ce module permet d'appliquer une visée ou un déplacement inversé de manière transparente, tout en conservant la parfaite exécution de tous les autres MODs du script (comme l'AntiRecoil ou l'AIM Assist)."},{"type":"texte","style":"h2","contenu":"⚠️ Consigne importante de configuration"},{"type":"carte","couleur":"rouge","contenu":"🛑 **Paramètres du jeu et de la console :** Dans les options internes de votre jeu ainsi que dans les réglages d'accessibilité de votre console, vous devez **impérativement laisser l'axe Y sur la configuration « Standard » (non inversé)**."},{"type":"texte","style":"p","contenu":"Le script se charge de réaliser l'inversion de l'axe Y de manière logicielle. Si vous activez aussi l'inversion dans le jeu, les deux réglages s'annuleront."},{"type":"carte","couleur":"jaune","contenu":"💡 **Navigation dans les menus du jeu :** Pensez à **désactiver le script lorsque vous naviguez dans les menus du jeu**."}],"titreBrut":true},{"id":"auto-save","titre":"💾 Auto Save (Sauvegarde des Réglages)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que l'Auto Save et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"L'**Auto Save** est une option qui sauvegarde automatiquement la totalité de vos modifications dans la mémoire interne du Cronus Zen dès que vous quittez les menus du script."},{"type":"texte","style":"h1","contenu":"🛠️ Sauvegarde automatique vs Sauvegarde manuelle"},{"type":"texte","style":"h2","contenu":"1. 🔄 Le mode Manuel (Recommandé pour les tests)"},{"type":"texte","style":"p","contenu":"Lorsque l'Auto Save est désactivé, vos réglages restent temporaires tant que vous ne les validez pas explicitement. Pour effectuer une sauvegarde manuelle, entrez dans le menu et appuyez sur la touche {PS / XBOX}."},{"type":"liste","contenu":"**L'avantage stratégique :** Vous pouvez modifier un paramètre (un *Radius*, une sensibilité ou un timing), sortir du menu pour le tester directement en jeu, et si le résultat ne vous convient pas, il vous suffit de changer de *slot* sur votre Cronus Zen puis de revenir sur le script. Vos réglages précédents seront immédiatement restaurés sans altération.\n**Pour valider définitivement :** Si vos tests sont concluants, réouvrez le menu et pressez {PS / XBOX} pour fixer la configuration."},{"type":"texte","style":"h2","contenu":"2. ⚡ Le mode Auto Save"},{"type":"texte","style":"p","contenu":"Chaque modification est écrite immédiatement en mémoire EEPROM dès la fermeture des menus."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Avertissement matériel :** Écrire en permanence dans la mémoire EEPROM de votre Cronus Zen peut accélérer son usure physique à long terme. C'est pourquoi cette option est **désactivée par défaut** dans le script."}]},{"id":"vm-speed","titre":"⏱️ VM Speed (Cadence d'Exécution)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que la VM Speed et comment fonctionne-t-elle ?"},{"type":"texte","style":"p","contenu":"La **VM Speed** (*Virtual Machine Speed*) définit la fréquence de rafraîchissement à laquelle le processeur du Cronus Zen exécute le code de votre script."},{"type":"texte","style":"h2","contenu":"🧠 Idée reçue : Est-ce que « plus rapide » signifie « meilleur » ?"},{"type":"texte","style":"p","contenu":"**Non, pas nécessairement.** Régler la cadence au minimum ne garantit pas une meilleure réactivité et peut parfois surcharger le signal si votre matériel ne suit pas. L'efficacité dépend de trois facteurs clés :\n\n1️⃣ **Votre plateforme :** PC, PS5 ou Xbox Series.\n\n2️⃣ **Le taux de rafraîchissement de votre manette :** Si votre manette transmet ses données à la console toutes les 8 ms (cas classique de nombreuses manettes d'origine), régler la VM Speed du Zen à 2 ms n'apportera aucun gain et créera des doublons de signaux inutiles.\n\n3️⃣ **Le nombre d'images par seconde (FPS) du jeu :** La réactivité réelle en jeu reste bridée par le moteur graphique du titre auquel vous jouez."},{"type":"texte","style":"h2","contenu":"🎛️ Les 4 cadences disponibles dans le menu"},{"type":"liste","contenu":"🟢 **10 ms (Par défaut) :** Stabilité maximale, cadence idéale pour la majorité des jeux et configurations manette standard.\n🔵 **8 ms :** Synchronisation parfaite avec les manettes opérant nativement à 125 Hz (8 ms).\n🟡 **4 ms :** Réactivité accrue pour les configurations compétitives sur PC ou moniteurs à haut rafraîchissement.\n🔴 **2 ms :** Cadence ultra-rapide (500 Hz) réservée aux setups PC très haut de gamme et manettes cadencées à haute fréquence."}]},{"id":"act-ads-fire","titre":"🔀 ADS + FIRE *(Viser + Tirer)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD se déclenche uniquement lorsque vous appuyez sur les deux gâchettes en même temps (**Viser ET Tirer**).\n**Cas d'usage ideal :** Parfait pour l'AntiRecoil ou le Strafe Shot sur les armes automatiques quand vous engagez un duel complet."}]},{"id":"act-ads","titre":"🎯 ADS *(Visée globale)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD s'active dès que vous enfoncez la touche de visée (**ADS**), et reste actif si vous commencez à tirer.\n**Cas d'usage idéal :** Idéal pour l'AIM Abuse ou l'assist de visée qui doivent commencer à fonctionner avant même de presser la détente."}]},{"id":"act-fire","titre":"💥 FIRE *(Tir global)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD s'active dès que vous enfoncez la touche de tir (**FIRE**), que vous soyez en train de viser ou non.\n**Cas d'usage idéal :** Pratique pour le RapidFire sur les pistolets ou fusils à pompe, utilisable aussi bien au jugé qu'en visée."}]},{"id":"act-ads-only","titre":"🎯 ADS Only *(Visée exclusive)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD s'active **uniquement** quand vous maintenez la touche de visée seule. Dès que vous appuyez sur la touche de tir, le MOD se coupe instantanément.\n**Cas d'usage idéal :** Utile pour caler un assist de visée en phase de repérage sans interférer avec le contrôle du recul lors du tir."}]},{"id":"act-fire-only","titre":"💥 FIRE Only *(Tir au jugé exclusif / Hip-fire)*","blocs":[{"type":"liste","contenu":"**Fonctionnement :** Le MOD s'active **uniquement** quand vous tirez au jugé sans viser. Si vous appuyez sur la touche de visée, le MOD s'arrête immédiatement.\n**Cas d'usage idéal :** Parfait pour un Drop Shot ou un Jump Shot destiné uniquement aux combats au jugé au très proche corps-à-corps."}]},{"id":"vibrations-adt","titre":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨","blocs":[{"type":"texte","style":"h2","contenu":"⚠️ Réglages indispensables dans la console / plateforme ET dans le jeu :"},{"type":"texte","style":"p","contenu":"Les vibrations et les gâchettes adaptatives *(réglées sur Standard / Normal)* doivent **obligatoirement être activées** à la fois dans les paramètres système de votre console ou plateforme et dans les menus d'options internes de votre jeu.\n\n*Pourquoi ?* Plusieurs fonctionnalités avancées du script (notamment la détection automatique des véhicules, du tir et des états d'armes) s'appuient directement sur ces signaux pour fonctionner."},{"type":"carte","couleur":"jaune","contenu":"💡 **Astuce si vous n'aimez pas les vibrations :** Si vous ne souhaitez pas ressentir les secousses physiques dans les mains, **ne les coupez pas dans la console ou le jeu** ! Désactivez-les directement depuis le menu OLED **Controller** du script."},{"type":"texte","style":"h1","contenu":"🛠️ Chemins d'accès aux paramètres par plateforme :"},{"type":"texte","style":"h2","contenu":"🎮 PlayStation 5 (PS5)","couleurHex":"#3d9bff","fondCouleur":"#3d9bff","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ **Paramètres de la console :**\n*Paramètres* ➔ *Accessoires* ➔ *Manette (Général)*"},{"type":"texte","style":"h3","contenu":"2️⃣ Réglages à appliquer :"},{"type":"liste","contenu":"- **Intensité des vibrations** ➔ **Standard (forte)**\n- **Intensité de l'effet gâchette** ➔ **Standard (forte)**"},{"type":"texte","style":"p","contenu":"3️⃣ **Dans le jeu :** Rendez-vous dans les paramètres audio/manette de votre jeu et vérifiez que les **Vibrations** et la **Fonction gâchette adaptative** sont réglées sur **Oui / Activé**."},{"type":"texte","style":"h2","contenu":"🎮 Xbox (Xbox Series X/S & Xbox One)","couleurHex":"#4ade5a","fondCouleur":"#4ade5a","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ **Paramètres de la console :**\nAppuyez sur le bouton Xbox ➔ *Profil et système* ➔ *Paramètres* ➔ *Accessibilité* ➔ *Manette* *(ou via l'application accessoires Xbox)*."},{"type":"texte","style":"h3","contenu":"2️⃣ Réglage à appliquer :"},{"type":"liste","contenu":"- Cochez la case **Activer les vibrations**."},{"type":"texte","style":"p","contenu":"3️⃣ **Dans le jeu :** Rendez-vous dans le menu options/manette de votre jeu et activez l'option **Vibrations**."},{"type":"texte","style":"h2","contenu":"💻 PC (Joueurs Steam)","couleurHex":"#ff9f43","fondCouleur":"#ff9f43","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ **Paramètres Steam :**\nOuvrez Steam ➔ En haut à gauche, cliquez sur *Steam* ➔ *Paramètres* (Settings/Preferences) ➔ *Manette* (Controller)."},{"type":"texte","style":"h3","contenu":"2️⃣ Réglages à appliquer :"},{"type":"liste","contenu":"- Activer l'option **Steam Input** pour les manettes associées.\n- Dans *Paramètres généraux de la manette*, assurez-vous que les **Vibrations** (Rumble) sont bien activées."},{"type":"texte","style":"p","contenu":"3️⃣ **Dans le jeu :** Dans les options de votre jeu sur PC, veillez à ce que le **Retour de force / Vibrations** soit sur **Activé**."}]},{"id":"quick-toggle","titre":"⏱️ Le menu Quick Toggle (Raccourcis en Jeu)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les Quick Toggles et comment fonctionnent-ils ?"},{"type":"texte","style":"p","contenu":"Les **Quick Toggles** vous permettent d'attribuer des combinaisons de touches personnalisées sur votre manette pour activer ou désactiver un MOD à la volée en plein combat, sans jamais ouvrir le menu du script sur l'écran OLED."},{"type":"texte","style":"h2","contenu":"🛠️ Configuration dans le menu"},{"type":"texte","style":"p","contenu":"Dans le menu **Quick Toggle**, vous pouvez paramétrer jusqu'à **4 raccourcis indépendants** :"},{"type":"liste","contenu":"**Ligne 1 (Raccourci) :** Choisissez l'une des 4 combinaisons de touches disponibles.\n**Ligne 2 (MOD attribué) :** Sélectionnez le MOD que vous souhaitez lier à ce raccourci parmi la liste des MODs disponibles."},{"type":"texte","style":"h2","contenu":"⚙️ Comment exécuter un Quick Toggle en jeu ?"},{"type":"texte","style":"p","contenu":"1️⃣ **Activation / Désactivation :** En plein jeu, maintenez la combinaison de touches choisie pendant **1 à 2 secondes**.\n\n2️⃣ **Confirmation visuelle :** Maintenez la pression jusqu'à ce que le nouvel état du MOD (*Enabled* ou *Disabled*) s'affiche directement sur l'écran OLED de votre Cronus Zen."}]},{"id":"activity-gta6-fishing","titre":"🎣 Fishing (Pêche automatique)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Fishing et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le MOD **Fishing** automatise l'intégralité du processus de pêche. Il gère le moulinage lent pour attirer le poisson, le ferrage instantané dès la touche, et le ramener rapidement au bord. L'écran OLED du Cronus Zen affiche l'état exact de la pêche en temps réel."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"texte","style":"p","contenu":"1️⃣ **Mise en place :** Équipez votre canne à pêche au bord d'un cours d'eau.\n\n2️⃣ **Lancement :** Ouvrez le menu **Activity** du script et lancez **Fishing** en appuyant sur {CROSS / A}.\n\n3️⃣ **Préparation :** Sélectionnez votre leurre ou votre appât dans le jeu.\n\n4️⃣ **Lancer de ligne** : Maintenez {L2 / LT} puis {R2 / RT}, puis relâchez {R2 / RT} pour jeter la ligne. Relâchez ensuite tous les boutons de la manette."},{"type":"liste","contenu":"*Note : Si le lancer ne vous convient pas, appuyez sur* {CIRCLE / B} *pour annuler et relancez votre ligne.*"},{"type":"texte","style":"h3","contenu":"5️⃣ Gestion automatique par le script :"},{"type":"liste","contenu":"Le script mouline doucement à votre place pour stimuler les poissons.\nDès qu'un poisson mord à l'hameçon, le script le ferre automatiquement.\nLe script bascule en moulinage rapide pour ramener la prise au plus vite."},{"type":"texte","style":"p","contenu":"6️⃣ **Combats avec le poisson :** Lorsque le poisson se débat, le script stoppe automatiquement le moulinage. Orientez simplement votre stick pour contrer les déplacements du poisson. Dès qu'il se calme, le script reprend le moulinage rapide.\n\n7️⃣ **Fin de prise :** Choisissez en jeu de garder le poisson ou de le rejeter à l'eau. Remettez un appât si nécessaire et relancez votre ligne."}],"scripts":["gta6"]},{"id":"activity-gta6-bench-press","titre":"🏋️ Bench Press (Développé couché)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le MOD Bench Press et comment fonctionne-t-il ?"},{"type":"texte","style":"p","contenu":"Le MOD **Bench Press** automatise l'activité de musculation du développé couché dans *GTA VI*.\n\nIl gère un rythme parfait et régulier pour la montée, le maintien et la descente de la barre d’haltères, vous garantissant d'optimiser l'augmentation des statistiques de force de votre personnage sans rater vos répétitions."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure étape par étape"},{"type":"texte","style":"p","contenu":"1️⃣ **Mise en place :** Installez votre personnage sur le banc de musculation en jeu.\n\n2️⃣ **Lancement :** Dans le menu **Activity** du script, naviguez jusqu'à **Bench Press** et validez en appuyant sur {CROSS / A}.\n\n3️⃣ **Démarrage de la série :** Appuyez une fois sur {D-Pad BAS} pour lancer la séquence d'exercices.\n\n4️⃣ **Gestion automatique du rythme :** Le script exécute la boucle parfaite suivante :"},{"type":"liste","contenu":"- ⬆️ **Montée :** Élévation progressive de la barre pendant **2 secondes**.\n- ⏸️ **Pause haute :** Maintien en position haute pendant **2 secondes**.\n- ⬇️ **Descente :** Descente contrôlée de la barre pendant **2 secondes**.\n- ⏸️ **Pause basse :** Temps de repos en bas pendant **2 secondes**, puis reprise du cycle."},{"type":"texte","style":"p","contenu":"5️⃣ **Arrêter l'exercice :** Appuyez sur la touche {D-Pad HAUT} pour stopper immédiatement la boucle automatique à la fin de votre série."}],"scripts":["gta6"]},{"id":"switch-profile","titre":"🔄 Le menu Switch Profile (Script FPS / TPS)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le \"Switch Profile\" ?"},{"type":"texte","style":"p","contenu":"Le **Switch Profile** est un moteur puissant qui vous permet de gérer jusqu'à **3 profils d'armes distincts** en jeu et de définir la méthode exacte pour basculer de l'un à l'autre."},{"type":"texte","style":"h2","contenu":"⚙️ Principe de fonctionnement"},{"type":"texte","style":"p","contenu":"Par défaut, vous commencez avec un seul profil actif (**Primary**).\n\nPour débloquer les profils suivants (**Secondary** et **Custom**), il vous
