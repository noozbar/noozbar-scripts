lapsed.\n**Improved ergonomics:** You no longer need to physically press down the left stick ( {L3 / LS}) while aiming, which avoids shifting your reticle at the crucial moment."},{"type":"texte","style":"h2","contenu":"🛠️ The MOD setting"},{"type":"liste","contenu":"**Breath Time:** How long the breath is held before being released automatically, from **0 to 5000 ms** (e.g. 2000 = 2 seconds)."}],"scripts":["fps-tps"],"fiche":{"colonnes":[{"titre":"Understanding the Hold Breath","liens":[{"titre":"❓ What is the Hold Breath?","de":0,"a":1},{"titre":"⚙️ How it works & Trigger","de":2,"a":3}]},{"titre":"Setting up the Hold Breath","liens":[{"titre":"🎚️ Breath Time","de":4,"a":5}]}]}},{"id":"autorun","titre":"🏃 AutoRun","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is AutoRun and how does it work?"},{"type":"texte","style":"p","contenu":"**AutoRun** is a movement automation MOD. It takes care of repeatedly pressing or holding the run button for you, saving your fingers from fatigue and your analog sticks from wear."},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual indicator:** When AutoRun is active in-game, the Cronus Zen's LEDs blink rapidly to show that it is working."},{"type":"texte","style":"h1","contenu":"⚙️ The 2 AutoRun modes depending on your games"},{"type":"texte","style":"p","contenu":"AutoRun's behavior is directly adapted to the engine of the game in question. The script automatically uses the version matching the title you are playing."},{"type":"texte","style":"h2","contenu":"🎯 FPS / TPS Mode (including GTA 6)"},{"type":"texte","style":"p","contenu":"Smooth operation based solely on the tilt of the analog stick:"},{"type":"liste","contenu":"**Activation:** Push the movement stick forward to **90% or more** to automatically trigger running.\n**Stop:** Release the stick below the **20%** threshold to stop AutoRun and return to normal walking."},{"type":"texte","style":"h2","contenu":"🤠 GTA 5 / Red Dead Redemption II Mode"},{"type":"texte","style":"p","contenu":"Since Rockstar games require holding or tapping the run button ( {CROSS / A}), this mode handles a **smart 3-state cycle** as soon as the stick is pushed **past 85%**:"},{"type":"liste","contenu":"**🚶 Walk:** Starting state when you push the stick forward.\n**🏃 Run:** Press {CROSS / A} **once**: The script automatically holds the button to make you run.\n**⚡ Sprint:** Press {CROSS / A} **a second time**: The script simulates ultra-fast presses (spam) to make you sprint at maximum speed.\n**🚶 Back to walking:** Press {CROSS / A} **a third time** (or release the stick **below 80%**) to reset the cycle."},{"type":"carte","couleur":"jaune","contenu":"💡 **Automatic aim handling:** If you go into aim (**ADS**) during a sprint, the script automatically downgrades movement from *Sprint* to *Run*, since the game engine does not allow sprinting while shouldering your weapon."}],"fiche":{"colonnes":[{"titre":"Understanding the AutoRun","liens":[{"titre":"❓ What is AutoRun?","de":0,"a":4}]},{"titre":"Setting up the AutoRun","liens":[{"titre":"🎯 FPS / TPS Mode","de":5,"a":7},{"titre":"🤠 GTA 5 / Red Dead Redemption II Mode","de":8,"a":11}]}]}},{"id":"turbo-boutons","titre":"⚡ Turbo Buttons","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a Turbo Button and how does it work?"},{"type":"texte","style":"p","contenu":"A **Turbo Button** automates ultra-fast presses (*spam*) on a specific button for you. Just hold the button and the script simulates continuous hammering, ideal for quickly picking up loot, reloading back-to-back or confirming repetitive actions without tiring your fingers."},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual indicator:** While the Turbo Button is running, the Cronus Zen's LEDs blink rapidly."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Timing Humanizer"},{"type":"texte","style":"p","contenu":"Perfectly regular button spamming is a mechanical signature that is easy for anti-cheats to spot.\n\nThis MOD includes a **Timing Humanizer** that generates random micro-variations in the execution rate. This avoids frozen, repeated intervals down to the millisecond, giving button spamming a lively, 100% natural rhythm."},{"type":"texte","style":"h2","contenu":"🎮 The 3 Turbo Buttons available"},{"type":"texte","style":"p","contenu":"You can independently **enable** up to 3 Turbo Buttons in the script menu:"},{"type":"etiquettes","contenu":"Turbo CROSS / A | Turbo SQUARE / X | Turbo CIRCLE / B"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Usage note:** You can leave all 3 Turbo Buttons enabled in the menu, but you cannot **run them simultaneously** in-game (the script cannot spam {CROSS / A} and {CIRCLE / B} at the same time)."},{"type":"texte","style":"h2","contenu":"🛠️ How to run the Turbo in-game?"},{"type":"texte","style":"p","contenu":"In-game activation was designed so as not to interfere with your usual single presses:\n\n**Execution:** Perform a **double-tap** (two quick presses) on the desired button and **keep it held down** on the second press.\n\n**Stop:** Simply release the button to instantly stop the Turbo."}],"fiche":{"colonnes":[{"titre":"Understanding the Turbo Boutons","liens":[{"titre":"❓ What is a Turbo Button?","de":0,"a":2},{"titre":"🛡️ Safety & Timing Humanizer","de":3,"a":4}]},{"titre":"Setting up and using the Turbo Boutons","liens":[{"titre":"🎮 The 3 Turbo Buttons available","de":5,"a":8},{"titre":"🛠️ How to run the Turbo in-game?","de":9,"a":10}]}]}},{"id":"quick-item-gta6","titre":"💊 Quick Item (GTA 6)","blocs":[{"type":"texte","style":"p","contenu":"In development ..."}],"fiche":{"colonnes":[]}},{"id":"auto-unscope","titre":"🔭 Auto Unscope (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto Unscope and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Redemption II*, when you go into scope aim (by pressing **Aim** then **Down arrow / D-Pad Down**), the game keeps this zoom mode in memory. If you do not manually exit the scope, your character will automatically return to sniper aim the next time you press the trigger, which can disorient you in close combat.\n\n**Auto Unscope** removes this constraint: it automates exiting the scope as soon as you release the aim trigger (**ADS**)."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Classic aim:** You press **ADS** to aim normally.\n**Switching to scope:** You press **Down arrow / D-Pad Down** to zoom into the scope.\n**Automatic reset:** As soon as you release the **ADS** trigger, the script immediately sends the exit-scope command. The next time you aim, you consistently return to classic shouldered aim."},{"type":"carte","couleur":"jaune","contenu":"💡 **Advantage:** No more having to remember whether your weapon stayed in scope mode or not, you always regain control in standard aim."}],"fiche":{"colonnes":[{"titre":"Understanding the Auto Unscope","liens":[{"titre":"❓ What is Auto Unscope?","de":0,"a":1}]},{"titre":"Using the Auto Unscope","liens":[{"titre":"⚙️ In-game operation","de":2,"a":4}]}]}},{"id":"auto-reload","titre":"🔄 Auto Reload (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto Reload and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Redemption II*, after firing with a repeater or a lever/bolt-action rifle, you must make an additional press of the fire button to manually re-cock the hammer or chamber the next cartridge.\n\n**Auto Reload** takes care of this mechanical re-cocking for you immediately after each shot."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Re-cocking automation:** As soon as you release the fire button (**FIRE**), the script simulates an ultra-fast pulse on the trigger to cock the mechanism.\n**Gain in responsiveness:** Your weapon is immediately loaded and ready for the next shot, sparing you the dead time of a forgotten manual press in the middle of a duel."}],"fiche":{"colonnes":[{"titre":"Understanding the Auto Reload","liens":[{"titre":"❓ What is Auto Reload?","de":0,"a":1}]},{"titre":"Using the Auto Reload","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"skid-stop","titre":"🐎 Skid Stop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Skid Stop and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Redemption II*, when your horse reaches **Bonding Level 3 or higher**, you unlock the ability to perform a quick stopping skid (**Skid Stop**). By default, this maneuver requires holding {R1 / RB} and {CROSS / A} simultaneously.\n\nThe **Skid Stop** MOD simplifies this technical move by assigning it to a simple single-button command."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Trigger:** Perform a double-tap (two quick presses) on the {R1 / RB} button while on horseback.\n**Script action:** The script automatically holds the required button combination ( {R1 / RB} + {CROSS / A}) to make your mount skid and stop dead."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Prerequisite:** This move absolutely requires your horse to be at **bonding level 3 or 4** in the game."}],"fiche":{"colonnes":[{"titre":"Understanding the Skid Stop","liens":[{"titre":"❓ What is Skid Stop?","de":0,"a":1}]},{"titre":"Using the Skid Stop","liens":[{"titre":"⚙️ In-game operation","de":2,"a":4}]}]}},{"id":"easy-eagle-eye","titre":"👁️ Easy Eagle Eye (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Easy Eagle Eye and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Redemption II*, the Eagle Eye skill lets you analyze your surroundings and follow animal tracks. By default, activating it requires pressing both analog sticks at the same time ( {L3 / LS} + {R3 / RS}).\n\n**Easy Eagle Eye** simplifies this by assigning it to a single press so you no longer miss the combination mid-game."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Activation:** A simple click on the right stick ( {R3 / RS}) is enough to instantly launch Eagle Eye."}],"fiche":{"colonnes":[{"titre":"Understanding the Easy Eagle Eye","liens":[{"titre":"❓ What is Easy Eagle Eye?","de":0,"a":1}]},{"titre":"Using the Easy Eagle Eye","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"horse-galop","titre":"🐎 Horse Gallop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Horse Gallop and how does it work?"},{"type":"texte","style":"p","contenu":"**Horse Gallop** automates the hammering of the gallop button while managing your mount's fatigue level.\n\nIn addition to chaining the presses for you, the script **regularly calms your horse** during the ride. This refills its stamina bar as you travel."},{"type":"carte","couleur":"jaune","contenu":"💡 **Optimal efficiency:** Stamina regeneration by calming the horse is particularly powerful from **bonding level 3**."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Prerequisite:** Check that \"**Horse**\" is displayed on your Zen's OLED screen.\n**Activation:** Perform a **double-tap** on {CROSS / A} and keep the button held on the second press.\n**Visual indicator:** During the automatic gallop, the Cronus Zen's LEDs blink rapidly.\n**Stop:** Simply release {CROSS / A} to stop the gallop."}],"fiche":{"colonnes":[{"titre":"Understanding the Horse Gallop","liens":[{"titre":"❓ What is Horse Gallop?","de":0,"a":2}]},{"titre":"Using the Horse Gallop","liens":[{"titre":"⚙️ In-game operation","de":3,"a":4}]}]}},{"id":"cinema-galop","titre":"🎥 Cinema Gallop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Cinema Gallop and how does it work?"},{"type":"texte","style":"p","contenu":"**Cinema Gallop** combines the comfort of *Red Dead Redemption II*'s cinematic camera with automatic movement handling. It lets you trot or gallop your horse over long distances without touching the controller, while continuously restoring its stamina by calming it."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Entering Cinema Gallop mode","contenu":"Once in the saddle (OLED screen showing \"**Horse**\" and white LEDs), hold the Cinema mode button down for **1.5 seconds**."},{"titre":"Select the pace","blocs":[{"type":"liste","contenu":"- Press {CROSS / A} **once**: Your horse goes into a Trot while being calmed regularly.\n- Press {CROSS / A} **a second time**: Your horse goes into a Gallop (the Zen's LEDs blink rapidly) while its stamina is managed.\n- Press {CROSS / A} **a third time**: The automatic movement stops."}]},{"titre":"Exiting Cinema mode","contenu":"Press the **Cinema** button again or the aim trigger (**ADS**)."}]}],"fiche":{"colonnes":[{"titre":"Understanding the Cinema Gallop","liens":[{"titre":"❓ What is Cinema Gallop?","de":0,"a":1}]},{"titre":"Using the Cinema Gallop","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"quick-item-rdr2","titre":"💊 Quick Item (RDR2 / RD Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Quick Item and how does it work?"},{"type":"texte","style":"p","contenu":"**Quick Item** lets you instantly use a health, stamina or DeadEye remedy by performing a simple button combination, without having to manually navigate the item wheel in the middle of combat."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Mandatory prerequisite:** Before using this MOD in-game, open your item wheel (*Items*) and manually select the specific tonic/remedy you want to assign to each slot."},{"type":"texte","style":"h2","contenu":"🎮 Button mapping in the wheel"},{"type":"texte","style":"p","contenu":"The script targets three precise positions in the item wheel:"},{"type":"liste","contenu":"{SQUARE / X} (Top-Left): **Health** remedy.\n{TRIANGLE / Y} (Top): **Stamina** remedy.\n{CIRCLE / B} (Top-Right): **DeadEye** remedy."},{"type":"texte","style":"p","contenu":"**To trigger a remedy:** Hold {L1 / LB} then perform a **double-tap** on the button corresponding to the desired remedy."},{"type":"texte","style":"h1","contenu":"🛠️ The 2 Quick Item modes available"},{"type":"texte","style":"h2","contenu":"🧪 Standard Mode"},{"type":"texte","style":"p","contenu":"Consumes the selected tonic from your inventory as normal."},{"type":"texte","style":"h2","contenu":"⚡ Glitch Mode *(Infinite use in Story mode only)*"},{"type":"texte","style":"p","contenu":"Lets you consume the tonic's effect **without it being removed from your inventory**, allowing you to reuse the same tonic dozens of times."},{"type":"liste","contenu":"**Mandatory condition:** You **must be holding a long weapon in hand** (rifle, carbine, shotgun). The glitch does not work with a revolver, a pistol or a bow.\n**Automatic movement:** At the exact moment of drinking the potion, the script makes your character jump. This interruption of the animation applies the healing bonus while canceling the item's deduction from your inventory."},{"type":"carte","couleur":"blue","contenu":"ℹ️ Note: Very rarely, the game validates the consumption and removes the tonic despite the jump, but the system remains functional in the vast majority of cases."}],"fiche":{"colonnes":[{"titre":"Understanding the Quick Item","liens":[{"titre":"❓ What is Quick Item?","de":0,"a":2}]},{"titre":"Setting up and using the Quick Item","liens":[{"titre":"🎮 Button mapping\nin the wheel","de":3,"a":6},{"titre":"🧪 Standard Mode","de":8,"a":9},{"titre":"⚡ Glitch Mode","de":10,"a":13}]}]}},{"id":"autostop-deadeye","titre":"🛑 AutoStop DeadEye (RD Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is AutoStop DeadEye and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Online*, unlike story mode, the *DeadEye* skill stays active even when you release the aim trigger, which needlessly drains your skill gauge if you forget to turn it off manually.\n\n**AutoStop DeadEye** solves this problem by automatically turning off *DeadEye* as soon as you release the aim button (**ADS**)."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Gauge saving:** As soon as you release the **ADS** trigger, the script sends the pulse to instantly deactivate *DeadEye*.\n**Comfort:** You preserve your skill gauge for the next duels with no additional input."}],"fiche":{"colonnes":[{"titre":"Understanding the AutoStop DeadEye","liens":[{"titre":"❓ What is AutoStop DeadEye?","de":0,"a":1}]},{"titre":"Using the AutoStop DeadEye","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"autospin","titre":"🔄 AutoSpin (RD Online / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is AutoSpin and how does it work?"},{"type":"texte","style":"p","contenu":"**AutoSpin** is a simple utility that forces your character to spin continuously in circles.\n\nIt is mainly used to avoid being automatically disconnected for inactivity (*AFK kick*) when you need to step away for a few minutes without leaving the session."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Activation:** Hold down the left stick {L3 / LS} for **2 seconds**.\n**Script action:** The character spins continuously on the spot.\n**Deactivation:** Click {L3 / LS} once, or move the left stick beyond 20%."}],"fiche":{"colonnes":[{"titre":"Understanding the AutoSpin","liens":[{"titre":"❓ What is AutoSpin?","de":0,"a":1}]},{"titre":"Using the AutoSpin","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"online-boss","titre":"🏢 Online Boss (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Online Boss?"},{"type":"texte","style":"p","contenu":"In *GTA Online*, when you become a **C.E.O** or a **MC President** (Motorcycle Club President), your character's interaction menu is organized slightly differently.\n\nEnabling these modes in the script tells the interface where you are in the game, allowing the Cronus Zen to run the exact button sequences in the interactive menus to command your vehicles or abilities in the blink of an eye."},{"type":"texte","style":"h1","contenu":"🛠️ The 2 statuses available"},{"type":"texte","style":"h2","contenu":"💼 C.E.O (SecuroServ)"},{"type":"texte","style":"p","contenu":"Enable this option in the script when you register as a C.E.O in-game."},{"type":"liste","contenu":"**What is it for?** The script adapts the SecuroServ interaction menu shortcuts.\n**Quick action examples:** Call your Buzzard helicopter in a single click or instantly activate **Ghost Organization** to disappear from other players' radar."},{"type":"texte","style":"h2","contenu":"🏍️ MC President (Motorcycle Club)"},{"type":"texte","style":"p","contenu":"Enable this option in the script when you are the President of your motorcycle club."},{"type":"liste","contenu":"**What is it for?** The script adapts the sequences for the motorcycle club menu.\n**Quick action examples:** Instantly spawn your favorite bike (like the Oppressor) at your feet in one click."},{"type":"carte","couleur":"jaune","contenu":"💡 Link with [**Quick Actions**](/gta5/quick-cheat/):\n\nOnce your status is set, these actions can be linked to the [**Quick Actions**](/gta5/quick-cheat/) engine to be executed with a simple button combination in the middle of a duel."}],"fiche":{"colonnes":[{"titre":"Understanding the Online Boss","liens":[{"titre":"❓ What is Online Boss?","de":0,"a":1}]},{"titre":"Setting up the Online Boss","liens":[{"titre":"💼 C.E.O","de":3,"a":5},{"titre":"🏍️ MC President","de":6,"a":9}]}]}},{"id":"easy-roll","titre":"🔄 Easy Roll (GTA 5 / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Easy Roll and how does it work?"},{"type":"texte","style":"p","contenu":"In close combat in *GTA*, performing a roll is the key technique for breaking the opponent's auto-aim. By default, it requires shouldering your weapon then pressing the jump button.\n\n**Easy Roll** simplifies the move: a single click on {L3 / LS} immediately triggers the roll, letting you react to the millisecond under enemy fire."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Condition:** Equip a weapon in hand.\n**Activation:** Simply press {L3 / LS}. The script handles the aim transition and the jump to perform the roll instantly."}],"fiche":{"colonnes":[{"titre":"Understanding the Easy Roll","liens":[{"titre":"❓ What is Easy Roll?","de":0,"a":1}]},{"titre":"Using the Easy Roll","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"turbo-rpg","titre":"💣 Turbo RPG (GTA 5 / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Turbo RPG and how does it work?"},{"type":"texte","style":"p","contenu":"**Turbo RPG** lets you chain standard rocket launcher shots at a much higher rate than the game allows.\n\nThe script exploits the *Weapon Switch* mechanic (quick weapon change): as soon as the rocket leaves, the script switches to another weapon then back to the rocket launcher in a fraction of a second, thereby canceling the long manual reload animation."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"Equip your standard rocket launcher (*RPG*)."},{"contenu":"**Hold the fire button (FIRE)**."},{"contenu":"The script loops the firing and animation-cancel sequence to continuously pound the area."}]}],"fiche":{"colonnes":[{"titre":"Understanding the Turbo RPG","liens":[{"titre":"❓ What is Turbo RPG?","de":0,"a":1}]},{"titre":"Using the Turbo RPG","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"klaxon-hold","titre":"🎵 Klaxon Hold (GTA 5 / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Klaxon Hold and how does it work?"},{"type":"texte","style":"p","contenu":"**Klaxon Hold** takes care of continuously holding the horn button for you when you are driving a vehicle.\n\nIt is the ideal MOD for playing your musical or custom horns in a loop in *GTA Online* without having to keep your thumb pressed on the controller during your trips."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Activation:** In a car, hold the horn button while driving to start the automatic loop.\n**Stop:** Press the horn button again or simply get out of your vehicle to cut the sound."}],"fiche":{"colonnes":[{"titre":"Understanding the Klaxon Hold","liens":[{"titre":"❓ What is Klaxon Hold?","de":0,"a":1}]},{"titre":"Using the Klaxon Hold","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"quick-care","titre":"🩹 Quick Care (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Quick Care and how does it work?"},{"type":"texte","style":"p","contenu":"**Quick Care** is an exclusive MOD designed for **GTA Online**. It lets you restore your armor or your health extremely quickly in the middle of combat, without having to go through the interaction menu."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation:"},{"type":"etapes","etiquette":"Step","etapes":[{"contenu":"**Hold the aim button**."},{"contenu":"Healing & Armor:","blocs":[{"type":"liste","contenu":"- **LEFT arrow (D-Pad LEFT):** Quick press to restore your **Armor**.\n- **RIGHT arrow (D-Pad RIGHT):** Quick press to consume a **Snack** (Health)."}]}]}],"fiche":{"colonnes":[{"titre":"Understanding the Quick Care","liens":[{"titre":"❓ What is Quick Care?","de":0,"a":1}]},{"titre":"Using the Quick Care","liens":[{"titre":"⚙️ In-game operation","de":2,"a":3}]}]}},{"id":"rs-sensitivity","titre":"🕹️ RS Sensitivity (Right stick)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is RS Sensitivity?"},{"type":"texte","style":"p","contenu":"The **RS Sensitivity** MOD *(Right Stick - Aim)* lets you override your game's native sensitivity handling to completely change how your aiming stick responds.\n\nYou can apply completely different sensitivity settings depending on the combat situation:"},{"type":"liste","contenu":"**ADS Only:** When you aim without shooting.\n**FIRE Only:** When you hip-fire without aiming.\n**ADS + FIRE:** When you aim and shoot at the same time.\n**NEUTRAL (General):** When you move without aiming or shooting."},{"type":"texte","style":"h2","contenu":"📈 Ballistic (Ballistic curves)"},{"type":"texte","style":"p","contenu":"Changes your stick's physical response according to a custom response curve (like the profiles available on the *Xbox Elite Series 2* controller or advanced PC software)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Live preview:** In the script menu, you can view the curve's shape on the OLED screen by holding the\n{CROSS / A} button during selection."},{"type":"liste","contenu":"📏 **Linear (Default):** Standard 1:1 curve. The value sent to the game is strictly equal to the stick's physical tilt.\n⏳ **Delay:** Offers great precision at the center of the stick for micro-adjustments (softened sensitivity on slight movements), then accelerates sharply when you push the stick toward the limit.\n⚡ **Aggressive:** Responds instantly from the first millimeters of tilt. Ideal for ultra-responsive gameplay or reflex shots (*flicks*).\n🚀 **Instant:** Reaches maximum sensitivity almost immediately after crossing the dead zone, removing the stick's ramp-up time.\n🌊 **Smooth:** Filters and smooths the parasitic micro-tremors of your hands to offer ultra-fluid, jerk-free target tracking (*tracking*)."},{"type":"texte","style":"h2","contenu":"🎚️ Custom Sens (Fixed multiplier)"},{"type":"texte","style":"p","contenu":"Lets you directly amplify your stick's sensitivity by applying a power multiplier to it."},{"type":"liste","contenu":"**Adjustment range:** From 0 to 327, with 100 being the normal default value (which corresponds to a multiplier from **x0** to **x3.27**).\n**Concrete example:** If you set the value to 200 (x2 multiplier), pushing your stick to only **50%** of its physical travel will send a value of **100%** (maximum limit) to your game."},{"type":"texte","style":"h2","contenu":"⚡ Dynamic Sens (Evolving dynamic sensitivity)"},{"type":"texte","style":"p","contenu":"The most refined and most powerful in the script! It varies your sensitivity in real time according to the speed and amplitude of your stick's movement.\n\nThe 5 variables to configure:"},{"type":"liste","contenu":"🏁 **Initial Sens:** The starting sensitivity applied when the stick starts moving.\n🎯 **Limit Point (Acceleration threshold):** The stick tilt angle from which the sensitivity starts climbing toward its maximum. Below this threshold, the sensitivity stays at *Initial Sens*.\n🔄 **Restart Point (Reset threshold):** If the stick tilt drops back below this value, the script immediately resets the sensitivity to *Initial Sens*.\n🔝 **Max Sens:** The maximum ceiling sensitivity that the dynamic system can reach.\n📈 **Increase Rate:** The speed (rate) at which the sensitivity increases once the *Limit Point* is crossed."}],"fiche":{"colonnes":[{"titre":"Understanding RS Sensitivity","liens":[{"titre":"❓ What is RS Sensitivity?","de":0,"a":2}]},{"titre":"Setting up RS Sensitivity","liens":[{"titre":"📈 Ballistic","de":3,"a":6},{"titre":"🎚️ Custom Sens","de":7,"a":9},{"titre":"⚡ Dynamic Sens","de":10,"a":12}]}]}},{"id":"ls-sensitivity","titre":"🕹️ LS Sensitivity (Left stick)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is LS Sensitivity?"},{"type":"texte","style":"p","contenu":"The **LS Sensitivity** MOD *(Left Stick - Movement)* lets you override your game's native sensitivity handling to completely change how your movement stick responds.\n\nYou can apply completely different sensitivity settings depending on the combat situation:"},{"type":"liste","contenu":"**ADS Only:** When you aim without shooting.\n**FIRE Only:** When you hip-fire without aiming.\n**ADS + FIRE:** When you aim and shoot at the same time.\n**NEUTRAL (General):** When you move without aiming or shooting."},{"type":"texte","style":"h2","contenu":"📈 Ballistic (Ballistic curves)"},{"type":"texte","style":"p","contenu":"Changes your stick's physical response according to a custom response curve (like the profiles available on the *Xbox Elite Series 2* controller or advanced PC software)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Live preview:** In the script menu, you can view the curve's shape on the OLED screen by holding the\n{CROSS / A} button during selection."},{"type":"liste","contenu":"📏 **Linear (Default):** Standard 1:1 curve. The value sent to the game is strictly equal to the stick's physical tilt.\n⏳ **Delay:** Offers great precision at the center of the stick for micro-adjustments (softened sensitivity on slight movements), then accelerates sharply when you push the stick toward the limit.\n⚡ **Aggressive:** Responds instantly from the first millimeters of tilt. Ideal for ultra-responsive gameplay or reflex shots (*flicks*).\n🚀 **Instant:** Reaches maximum sensitivity almost immediately after crossing the dead zone, removing the stick's ramp-up time.\n🌊 **Smooth:** Filters and smooths the parasitic micro-tremors of your hands to offer ultra-fluid, jerk-free target tracking (*tracking*)."},{"type":"texte","style":"h2","contenu":"🎚️ Custom Sens (Fixed multiplier)"},{"type":"texte","style":"p","contenu":"Lets you directly amplify your stick's sensitivity by applying a power multiplier to it."},{"type":"liste","contenu":"**Adjustment range:** From 0 to 327, with 100 being the normal default value (which corresponds to a multiplier from **x0** to **x3.27**).\n**Concrete example:** If you set the value to 200 (x2 multiplier), pushing your stick to only **50%** of its physical travel will send a value of **100%** (maximum limit) to your game."},{"type":"texte","style":"h2","contenu":"⚡ Dynamic Sens (Evolving dynamic sensitivity)"},{"type":"texte","style":"p","contenu":"The most refined and most powerful in the script! It varies your sensitivity in real time according to the speed and amplitude of your stick's movement.\n\nThe 5 variables to configure:"},{"type":"liste","contenu":"🏁 **Initial Sens:** The starting sensitivity applied when the stick starts moving.\n🎯 **Limit Point (Acceleration threshold):** The stick tilt angle from which the sensitivity starts climbing toward its maximum. Below this threshold, the sensitivity stays at *Initial Sens*.\n🔄 **Restart Point (Reset threshold):** If the stick tilt drops back below this value, the script immediately resets the sensitivity to *Initial Sens*.\n🔝 **Max Sens:** The maximum ceiling sensitivity that the dynamic system can reach.\n📈 **Increase Rate:** The speed (rate) at which the sensitivity increases once the *Limit Point* is crossed."}],"fiche":{"colonnes":[{"titre":"Understanding LS Sensitivity","liens":[{"titre":"❓ What is LS Sensitivity?","de":0,"a":2}]},{"titre":"Setting up LS Sensitivity","liens":[{"titre":"📈 Ballistic","de":3,"a":6},{"titre":"🎚️ Custom Sens","de":7,"a":9},{"titre":"⚡ Dynamic Sens","de":10,"a":12}]}]}},{"id":"stick-drift","titre":"🕹️ Stick Drift Correction","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Stick Drift correction?"},{"type":"texte","style":"p","contenu":"Over time and with wear, the potentiometers of analog sticks wear out and cause *Stick Drift* (the cursor or camera moves on its own on screen without you touching the controller).\n\nThis MOD includes a high-precision diagnostic and calibration tool directly on your Cronus Zen's OLED screen. It neutralizes your sticks' drift at rest without needing to increase the dead zone (*DeadZone*) in the game settings, thereby preserving all your aim's responsiveness."},{"type":"texte","style":"h2","contenu":"⚙️ How to diagnose and fix the Drift?"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Activation","contenu":"Enable the option in the script menu, then press {CROSS / A} to enter the dedicated calibration menu."},{"titre":"Real-time measurement","blocs":[{"type":"liste","contenu":"- 📊 **Real Time RS:** Displays your right stick's raw physical drift in real time on the OLED screen.\n- 📊 **Real Time LS:** Displays your left stick's raw physical drift in real time."}]},{"titre":"Applying the correction","blocs":[{"type":"liste","contenu":"- 🎯 **RS Correction:** Adjust the compensation value for the right stick until the drift is completely neutralized.\n- 🎯 **LS Correction:** Adjust the compensation value for the left stick until the drift is completely neutralized."}]}]}],"fiche":{"colonnes":[{"titre":"Understanding the Stick Drift Correction","liens":[{"titre":"❓ What is Stick Drift correction?","de":0,"a":1}]},{"titre":"Setting up the Stick Drift Correction","liens":[{"titre":"⚙️ How to diagnose and fix the Drift?","de":2,"a":3}]}]}},{"id":"hair-trigger","titre":"⚡ Hair Trigger","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Hair Trigger and how does it work?"},{"type":"texte","style":"p","contenu":"By default, analog triggers ( {L2 / LT} or {R2 / RT}) have a long travel: you have to press them down several millimeters before the game detects the aim or shoot action.\n\nThe **Hair Trigger** MOD turns your analog triggers into ultra-responsive digital clicks (like a \"wall trigger\" or *clicky trigger*). As soon as a micro-press of 1% is detected on the trigger, the script instantly sends a maximum 100% press signal to the game."},{"type":"texte","style":"h2","contenu":"🎛️ Assignment options"},{"type":"texte","style":"p","contenu":"You can choose to apply the Hair Trigger to:"},{"type":"liste","contenu":"**🎯 Aim only** ( {L2 / LT}): To shoulder your weapon to the millisecond.\n**💥 Fire only** ( {R2 / RT}): For an instant shot.\n**⚡ Both triggers** ( {L2 / LT} + {R2 / RT}): For maximum responsiveness on all your combat actions."}],"fiche":{"colonnes":[{"titre":"Understanding the Hair Trigger","liens":[{"titre":"❓ What is Hair Trigger?","de":0,"a":1}]},{"titre":"Setting up the Hair Trigger","liens":[{"titre":"🎛️ Assignment options","de":2,"a":4}]}]}},{"id":"rumble-adt","titre":"📳 Rumble & ADT (Vibrations & Adaptive Triggers)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Rumble & ADT MOD?"},{"type":"texte","style":"p","contenu":"This MOD lets you precisely control the activation of your controller's vibration motors (*Rumble*) and adaptive triggers (*ADT* - Adaptive Triggers) (notably on the PS5 DualSense), directly from the script menu without having to change your game menus."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Mandatory prerequisite:** For the script and your MODs to work properly, the **vibration** and **adaptive trigger** options must **absolutely be enabled in the game settings** and set to **\"Standard\" in your console's general settings**."},{"type":"texte","style":"h2","contenu":"🛠️ The 4 configuration modes to choose from"},{"type":"liste","contenu":"✅ **Enabled:** Leaves the vibrations and adaptive triggers fully active.\n⚙️ **ADT Only:** Disables the controller's vibrations while keeping the adaptive triggers (*ADT*) working.\n📳 **Rumble Only:** Disables the adaptive triggers (*ADT*) while keeping the controller's vibrations.\n🚫 **Disabled:** Disables both the controller's vibrations and the adaptive triggers mechanism."}],"fiche":{"colonnes":[{"titre":"Understanding the Rumble & ADT","liens":[{"titre":"❓ What is the Rumble & ADT MOD?","de":0,"a":2}]},{"titre":"Setting up the Rumble & ADT","liens":[{"titre":"🛠️ The 4 configuration modes","de":3,"a":4}]}]}},{"id":"buttons-layout","titre":"🎮 Button Layout (Button Remapping)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Button Layout and how does it work?"},{"type":"texte","style":"p","contenu":"**Button Layout** lets you completely reconfigure and customize your controller's button layout directly from the script, without touching your game or console options."},{"type":"texte","style":"h2","contenu":"🛠️ The 2 configuration modes"},{"type":"liste","contenu":"🎮 **Standard:** Keeps the default layout of your controller's buttons in-game.\n🛠️ **Custom:** Enables full customization of your buttons according to your preferences."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Absolute rule of Custom mode:** **1 action = 1 button.** You cannot assign the same button to two different actions."},{"type":"texte","style":"p","contenu":"🔒 **Error-proof safety:** If a conflict or a duplicate button is detected during your setup, the OLED screen displays **INVALID** when you try to exit the menu, and exiting stays blocked until the configuration is valid."},{"type":"carte","couleur":"jaune","contenu":"💡 **Lost in your configuration?** Hold {CIRCLE / B} for **2 seconds**: the **Custom** layout is reset to default and you automatically return to the **Controller** menu.\n\n⏱️ **Automatic exit:** If the configuration is invalid and you stay inactive for **30 seconds**, the script exits the menus on its own and reloads your last saved layout."},{"type":"texte","style":"h2","contenu":"⚠️ Important instructions and warnings"},{"type":"carte","couleur":"rouge","contenu":"🛑 **Game settings:** You must **absolutely leave the button configuration on \"Standard\" in the game's internal options**. Also do not change the button assignment in your console's accessibility settings (PS5/Xbox)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Navigating the game menus:** Remember to **disable the script when navigating the game menus** (inventory, map, shop). Otherwise, your Custom button reassignments will also apply to navigation, which can make moving around the menus confusing."}],"fiche":{"colonnes":[{"titre":"Understanding the Button Layout","liens":[{"titre":"❓ What is Button Layout?","de":0,"a":1}]},{"titre":"Setting up the Button Layout","liens":[{"titre":"🛠️ The 2 configuration modes","de":2,"a":6},{"titre":"⚠️ Important instructions and warnings","de":7,"a":9}]}]}},{"id":"inverted-axes","titre":"🕹️ Inverted RY / LY (Y-Axis Inversion)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Inverted RY / LY MOD?"},{"type":"texte","style":"p","contenu":"The **Inverted RY / LY** MOD lets you invert the response of the vertical axis (Y axis) of your analog sticks directly from the script:"},{"type":"liste","contenu":"🎯 **Inverted RY (Right Stick Y):** Inverts the right stick's vertical axis (camera / aim). Pushing the stick up makes the camera go down, and pulling it down makes it go up.\n🏃 **Inverted LY (Left Stick Y):** Inverts the left stick's vertical axis (character movement)."},{"type":"texte","style":"p","contenu":"This MOD lets you apply inverted aiming or movement seamlessly, while keeping the perfect execution of all the script's other MODs (like AntiRecoil or AIM Assist)."},{"type":"texte","style":"h2","contenu":"⚠️ Important setup instruction"},{"type":"carte","couleur":"rouge","contenu":"🛑 **Game and console settings:** In your game's internal options as well as in your console's accessibility settings, you must **absolutely leave the Y axis on the \"Standard\" (non-inverted) configuration**."},{"type":"texte","style":"p","contenu":"The script handles inverting the Y axis in software. If you also enable inversion in the game, the two settings will cancel each other out."},{"type":"carte","couleur":"jaune","contenu":"💡 **Navigating the game menus:** Remember to **disable the script when navigating the game menus** (inventory, map, shop). Otherwise, the axis inversion will also apply to navigation, which can make moving around the menus confusing."}],"titreBrut":true,"fiche":{"colonnes":[{"titre":"Understanding the Inverted RY / LY","liens":[{"titre":"❓ What is the Inverted RY / LY MOD?","de":0,"a":3}]},{"titre":"Setting up the Inverted RY / LY","liens":[{"titre":"⚠️ Important setup instruction","de":4,"a":7}]}]}},{"id":"auto-save","titre":"💾 Auto Save (Saving Your Settings)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto Save and how does it work?"},{"type":"texte","style":"p","contenu":"**Auto Save** is an option that automatically saves all of your changes to the Cronus Zen's internal memory as soon as you exit the script menus."},{"type":"texte","style":"h1","contenu":"🛠️ Automatic saving vs Manual saving"},{"type":"texte","style":"h2","contenu":"🔄 Manual mode (Recommended for testing)"},{"type":"texte","style":"p","contenu":"When Auto Save is disabled, your settings stay temporary until you explicitly confirm them. To save manually, enter the menu and press the {PS / XBOX} button."},{"type":"liste","contenu":"**The strategic advantage:** You can change a parameter (a *Radius*, a sensitivity or a timing), exit the menu to test it directly in-game, and if the result doesn't suit you, just switch *slot* on your Cronus Zen then come back to the script. Your previous settings will be immediately restored, unaltered.\n**To validate permanently:** If your tests are conclusive, reopen the menu and press {PS / XBOX} to lock in the configuration."},{"type":"texte","style":"h2","contenu":"⚡ Auto Save mode"},{"type":"texte","style":"p","contenu":"Every change is written immediately to EEPROM memory as soon as the menus are closed."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Hardware warning:** Constantly writing to your Cronus Zen's EEPROM memory can speed up its physical wear in the long term. This is why this option is **disabled by default** in the script."}],"fiche":{"colonnes":[{"titre":"Understanding the Auto Save","liens":[{"titre":"❓ What is Auto Save?","de":0,"a":1}]},{"titre":"Setting up the Auto Save","liens":[{"titre":"🔄 Manual mode","de":3,"a":5},{"titre":"⚡ Auto Save mode","de":6,"a":8}]}]}},{"id":"vm-speed","titre":"⏱️ VM Speed (Execution Rate)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is VM Speed and how does it work?"},{"type":"texte","style":"p","contenu":"**VM Speed** (*Virtual Machine Speed*) defines the refresh rate at which the Cronus Zen's processor executes your script's code."},{"type":"texte","style":"h2","contenu":"🧠 Misconception: Does \"faster\" mean \"better\"?"},{"type":"texte","style":"p","contenu":"**No, not necessarily.** Setting the rate to the minimum does not guarantee better responsiveness and can sometimes overload the signal if your hardware can't keep up. Effectiveness depends on three key factors:\n\n1️⃣ **Your platform:** PC, PS5 or Xbox Series.\n\n2️⃣ **Your controller's refresh rate:** If your controller sends its data to the console every 8 ms (the typical case for many stock controllers), setting the Zen's VM Speed to 2 ms will bring no gain and will create useless duplicate signals.\n\n3️⃣ **The game's frames per second (FPS):** Actual in-game responsiveness remains capped by the graphics engine of the title you are playing."},{"type":"texte","style":"h2","contenu":"🎛️ The 4 rates available in the menu"},{"type":"liste","contenu":"🟢 **10 ms (Default):** Maximum stability, ideal rate for most games and standard controller setups.\n🔵 **8 ms:** Perfect synchronization with controllers natively running at 125 Hz (8 ms).\n🟡 **4 ms:** Increased responsiveness for competitive PC setups or high-refresh-rate monitors.\n🔴 **2 ms:** Ultra-fast rate (500 Hz) reserved for very high-end PC setups and high-frequency controllers."}],"fiche":{"colonnes":[{"titre":"Understanding the VM Speed","liens":[{"titre":"❓ What is VM Speed?","de":0,"a":1},{"titre":"🧠 Misconception: Does faster mean better?","de":2,"a":3}]},{"titre":"Setting up the VM Speed","liens":[{"titre":"🎛️ The 4 available rates","de":4,"a":5}]}]}},{"id":"act-ads-fire","titre":"🔀 ADS + FIRE *(Aim + Shoot)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD triggers only when you press both triggers at the same time (**Aim AND Shoot**).\n**Ideal use case:** Perfect for AntiRecoil or Strafe Shot on automatic weapons when you engage in a full duel."}]},{"id":"act-ads","titre":"🎯 ADS *(Global aiming)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD activates as soon as you press the aim button (**ADS**), and stays active if you start shooting.\n**Ideal use case:** Ideal for AIM Abuse or the aim assist, which need to start working even before you pull the trigger."}]},{"id":"act-fire","titre":"💥 FIRE *(Global shooting)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD activates as soon as you press the fire button (**FIRE**), whether you are aiming or not.\n**Ideal use case:** Handy for RapidFire on pistols or shotguns, usable both hip-fire and while aiming."}]},{"id":"act-ads-only","titre":"🎯 ADS Only *(Aiming only)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD activates **only** when you hold the aim button alone. As soon as you press the fire button, the MOD cuts off instantly.\n**Ideal use case:** Useful for setting an aim assist during the spotting phase without interfering with recoil control when shooting."}]},{"id":"act-fire-only","titre":"💥 FIRE Only *(Hip-fire only)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD activates **only** when you hip-fire without aiming. If you press the aim button, the MOD stops immediately.\n**Ideal use case:** Perfect for a Drop Shot or a Jump Shot intended only for hip-fire fights at very close range."}]},{"id":"vibrations-adt","titre":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨","blocs":[{"type":"texte","style":"h2","contenu":"⚠️ Essential settings in the console / platform AND in the game:"},{"type":"texte","style":"p","contenu":"Vibrations and adaptive triggers *(set to Standard / Normal)* **must be enabled** both in your console or platform's system settings and in your game's internal options menus.\n\n*Why?* Several of the script's advanced features (notably automatic detection of vehicles, shooting and weapon states) rely directly on these signals to work."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tip if you don't like vibrations:** If you don't want to feel the physical shaking in your hands, **don't turn them off in the console or the game**! Disable them directly from the script's **Controller** OLED menu."},{"type":"texte","style":"h1","contenu":"🛠️ Settings paths by platform:"},{"type":"texte","style":"h2","contenu":"🎮 PlayStation 5 (PS5)","couleurHex":"#3d9bff","fondCouleur":"#3d9bff","fondOpacite":14},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Console settings","contenu":"*Settings* ➔ *Accessories* ➔ *Controller (General)*"},{"titre":"Settings to apply","blocs":[{"type":"liste","contenu":"- **Vibration Intensity** ➔ **Standard (strong)**\n- **Trigger Effect Intensity** ➔ **Standard (strong)**"}]},{"titre":"In the game","contenu":"Go to your game's audio/controller settings and check that **Vibration** and **Adaptive Trigger function** are set to **Yes / Enabled**."}]},{"type":"texte","style":"h2","contenu":"🎮 Xbox (Xbox Series X/S & Xbox One)","couleurHex":"#4ade5a","fondCouleur":"#4ade5a","fondOpacite":14},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Console settings","contenu":"Press the Xbox button ➔ *Profile & system* ➔ *Settings* ➔ *Accessibility* ➔ *Controller* *(or via the Xbox Accessories app)*."},{"titre":"Setting to apply","blocs":[{"type":"liste","contenu":"- Check the **Enable vibration** box."}]},{"titre":"In the game","contenu":"Go to your game's options/controller menu and enable the **Vibration** option."}]},{"type":"texte","style":"h2","contenu":"💻 PC (Steam players)","couleurHex":"#ff9f43","fondCouleur":"#ff9f43","fondOpacite":14},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Steam settings","contenu":"Open Steam ➔ At the top left, click *Steam* ➔ *Settings* (Settings/Preferences) ➔ *Controller*."},{"titre":"Settings to apply","blocs":[{"type":"liste","contenu":"- Enable the **Steam Input** option for the relevant controllers.\n- In *General Controller Settings*, make sure **Vibration** (Rumble) is enabled."}]},{"titre":"In the game","contenu":"In your PC game's options, make sure **Force Feedback / Vibration** is set to **Enabled**."}]}],"fiche":{"colonnes":[{"titre":"Understanding","liens":[{"titre":"⚠️ Why enable them?","de":0,"a":2}]},{"titre":"Enable them on your platform","liens":[{"titre":"🎮 PlayStation 5","de":4,"a":5},{"titre":"🎮 Xbox","de":6,"a":7},{"titre":"💻 PC (Steam)","de":8,"a":9}]}]}},{"id":"quick-toggle","titre":"⏱️ The Quick Toggle menu (In-game shortcuts)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What are Quick Toggles and how do they work?"},{"type":"texte","style":"p","contenu":"**Quick Toggles** let you assign custom button combinations on your controller to enable or disable a MOD on the fly in the middle of combat, without ever opening the script menu on the OLED screen."},{"type":"texte","style":"h2","contenu":"🛠️ Setup in the menu"},{"type":"texte","style":"p","contenu":"In the **Quick Toggle** menu, you can set up to **4 independent shortcuts**:"},{"type":"liste","contenu":"**Line 1 (Shortcut):** Choose one of the 4 available button combinations.\n**Line 2 (Assigned MOD):** Select the MOD you want to link to this shortcut from the list of available MODs."},{"type":"texte","style":"h2","contenu":"⚙️ How to run a Quick Toggle in-game?"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Enable / Disable","contenu":"In-game, hold the chosen button combination for **1 to 2 seconds**."},{"titre":"Visual confirmation","contenu":"Keep holding until the MOD's new state (*Enabled* or *Disabled*) is displayed directly on your Cronus Zen's OLED screen."}]}],"fiche":{"colonnes":[{"titre":"Understanding the Quick Toggles","liens":[{"titre":"❓ What are Quick Toggles and how do they work?","de":0,"a":1}]},{"titre":"Setting up and using the Quick Toggles","liens":[{"titre":"🛠️ Setup in the menu","de":2,"a":4},{"titre":"⚙️ How to run a Quick Toggle in-game?","de":5,"a":6}]}]}},{"id":"activity-gta6-fishing","titre":"🎣 Fishing (Automatic fishing)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Fishing MOD and how does it work?"},{"type":"texte","style":"p","contenu":"The **Fishing** MOD automates the entire fishing process. It handles the slow reeling to attract the fish, the instant hook-set as soon as it bites, and quickly bringing it back to shore. The Cronus Zen's OLED screen shows the exact fishing state in real time."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Setup","contenu":"Equip your fishing rod at the edge of a body of water."},{"titre":"Launch","contenu":"Open the script's **Activity** menu and start **Fishing** by pressing {CROSS / A}."},{"titre":"Preparation","contenu":"Select your lure or bait in the game."},{"titre":"Casting the line","contenu":"Hold {L2 / LT} then {R2 / RT}, then release {R2 / RT} to cast the line. Then release all the controller buttons.","blocs":[{"type":"liste","contenu":"*Note: If you are not happy with the cast, press* {CIRCLE / B} *to cancel and cast your line again.*"}]},{"titre":"Automatic handling by the script","blocs":[{"type":"liste","contenu":"The script slowly reels for you to stimulate the fish.\nAs soon as a fish bites the hook, the script automatically sets the hook.\nThe script switches to fast reeling to bring the catch in as quickly as possible."}]},{"titre":"Fighting the fish","contenu":"When the fish struggles, the script automatically stops reeling. Simply direct your stick to counter the fish's movements. As soon as it calms down, the script resumes fast reeling."},{"titre":"End of the catch","contenu":"Choose in-game whether to keep the fish or release it back into the water. Re-bait if necessary and cast your line again."}]}],"scripts":["gta6"],"fiche":{"colonnes":[{"titre":"Understanding the Fishing","liens":[{"titre":"❓ What is the Fishing MOD?","de":0,"a":1}]},{"titre":"Using the Fishing","liens":[{"titre":"⚙️ Step-by-step procedure","de":2,"a":3}]}]}},{"id":"activity-gta6-bench-press","titre":"🏋️ Bench Press","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Bench Press MOD and how does it work?"},{"type":"texte","style":"p","contenu":"The **Bench Press** MOD helps you succeed at the bench press workout activity in *GTA 6*.\n\nIn this activity, both triggers must be pressed in exactly the same way, otherwise the bar tilts to the left or to the right. The script therefore **mirrors** the triggers: you press only one, and the other copies exactly the same movement, so the bar always stays perfectly balanced."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Setup","contenu":"Position your character on the weight bench in-game."},{"titre":"Launch","contenu":"In the script's **Activity** menu, navigate to **Bench Press** and confirm by pressing {CROSS / A}."},{"titre":"Mirrored triggers","contenu":"Press either {L2 / LT} or {R2 / RT}. The script automatically presses the opposite trigger, at the same moment and with the same pressure:","blocs":[{"type":"liste","contenu":"- You press {L2 / LT}: {R2 / RT} is pressed at the same time.\n- You press {R2 / RT}: {L2 / LT} is pressed at the same time."}]},{"titre":"On-screen feedback","contenu":"The Cronus Zen OLED screen displays **PUSH** when you press and **LOWER** when you release."}]},{"type":"carte","couleur":"blue","contenu":"ℹ️ **No automatic rhythm for now:** you control the raising and lowering of the bar yourself. The script only makes sure both triggers stay perfectly identical. This MOD will be improved soon."}],"scripts":["gta6"],"fiche":{"colonnes":[{"titre":"Understanding the Bench Press","liens":[{"titre":"❓ What is the Bench Press MOD?","de":0,"a":1}]},{"titre":"Using the Bench Press","liens":[{"titre":"⚙️ Step-by-step procedure","de":2,"a":4}]}]}},{"id":"switch-profile","titre":"🔄 The Switch Profile menu (FPS / TPS script)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is \"Switch Profile\"?"},{"type":"texte","style":"p","contenu":"**Switch Profile** is a powerful engine that lets you manage up to **3 distinct weapon profiles** in-game and define the exact method for switching from one to another."},{"type":"texte","style":"h2","contenu":"⚙️ How it works"},{"type":"texte","style":"p","contenu":"By default, you start with a single active profile (**Primary**).\n\nTo unlock the next profiles (**Secondary** and **Custom**), you just need to configure their switching mode. Once unlocked, each profile has its own independent settings in the **Profile MODs** menu.\n\nThe **Switch Profile** menu contains 3 main options:"},{"type":"texte","style":"h2","contenu":"🔀 Prim/Sec BTN","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Defines the method for going from the **Primary** profile to the **Secondary** profile (or for returning to the last used profile after leaving the Custom profile).\n\n**Note:** Configuring this option automatically unlocks the Secondary profile in the *Profile MODs* menu.\n\nAvailable switching modes:"},{"type":"liste","contenu":"🔘 **Tap BTN:** A simple press of the chosen button.\n🔘🔘 **Dbl-tap BTN:** A quick double press of the chosen button.\n⏱️ **Hold BTN:** A held press of the chosen button.\n🔣 **Combination:** A combination of two buttons (hold one button + press another)."},{"type":"texte","style":"h2","contenu":"🎯 Custom *(available after setting up Prim/Sec)*","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Defines the method for switching from the Primary or Secondary profile to the **Custom** profile (ideal for a pistol, a heavy weapon or a vehicle).\n\n**Note:** Configuring this option automatically unlocks the Custom profile in the *Profile MODs* menu.\n\nAvailable switching modes:"},{"type":"liste","contenu":"🔘🔘 **Dbl-tap BTN:** A quick double press of the chosen button.\n⏱️ **Hold BTN:** A held press of the chosen button.\n🔣 **Combination:** A combination of two buttons (hold one button + press another)."},{"type":"texte","style":"h2","contenu":"🔄 Resync Profile *(available after setting up Prim/Sec)*","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Lets you resynchronize your profiles in-game if an offset occurs (for example, if you pressed the weapon-change button during a cutscene or a loading screen)."},{"type":"liste","contenu":"🔣 **Combination:** Only *Combination* mode is offered. It lets you cycle through the profiles in a loop until you find the profile matching the weapon in your hand."},{"type":"carte","couleur":"orange","titre":"🛡️ Anti-conflict protection (Automatic duplicate handling)","contenu":"","blocs":[{"type":"texte","style":"p","contenu":"To avoid handling mistakes and guarantee perfect in-game compatibility, the menu includes an **active safeguard against button conflicts**: it is impossible to assign the same method **and** the same button to two different profiles.\n\n**How does the menu handle this automatically?** The script filters the options in real time and hides the buttons already in use:"},{"type":"liste","contenu":"**Tap / Dbl-tap / Hold:** Two profiles can use the same method (e.g. *Dbl-tap* for Prim/Sec and Custom), but they cannot use the same button. If you choose *Dbl-tap + Triangle* for *Prim/Sec*, the *Triangle* button will automatically disappear from the list of choices if you select *Dbl-tap* for *Custom*.\n**Combination:** Combinations can share the same held button (*Hold*), provided the tapped button (*Tap*) is different (and vice versa)."},{"type":"texte","style":"p","contenu":"💡 **In summary:** No risk of making a mistake! If a button does not appear in your menu, it is because it is already assigned to an identical method on another profile. This safeguard applies dynamically on **Prim/Sec**, **Custom** and **Resync**."}]}],"scripts":["fps-tps"],"fiche":{"colonnes":[{"titre":"Understanding the Switch Profile","liens":[{"titre":"❓ What is Switch Profile?","de":0,"a":1},{"titre":"⚙️ How it works","de":2,"a":3}]},{"titre":"Setting up the Switch Profile","liens":[{"titre":"🔀 Prim/Sec BTN","de":4,"a":6},{"titre":"🎯 Custom","de":7,"a":9},{"titre":"🔄 Resync Profile","de":10,"a":13}]}]}},{"id":"online-cheat","titre":"🌐 The Online Action menu (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Online Action and how does it work?"},{"type":"texte","style":"p","contenu":"**Online Action** is an interaction-menu automation MOD in *GTA Online*. It groups **9 complex quick manipulations** that you would normally have to perform manually with the {D-Pad} by opening the interaction menu.\n\nThe script reproduces these sequences in a fraction of a second so you can equip yourself, get around or manage your gear without interrupting your fights."},{"type":"texte","style":"h2","contenu":"📋 Examples of automated actions"},{"type":"texte","style":"p","contenu":"Among the 9 shortcuts built into the script, you will find:"},{"type":"liste","contenu":"**🚁 Sparrow:** Automatically calls and spawns a Sparrow helicopter nearby from your inventory.\n🥽 **Thermal Vision:** Toggles the thermal vision helmet in the blink of an eye.\n🚘 **Personal Vehicle:** Requests the delivery driver or respawns your personal vehicle nearby."},{"type":"texte","style":"h2","contenu":"⚙️ How to run an Online Action?"},{"type":"texte","style":"p","contenu":"You have two activation methods to choose from:"},{"type":"liste","contenu":"**From the OLED screen:** Navigate directly in the script's **Online Action** menu, select the desired action and tap {CROSS / A} to launch the desired action.\n**Via a** [**Quick Action**](/gta5/quick-cheat/)*:* Assign the action to a custom controller shortcut in the [**Quick Action**](/gta5/quick-cheat/) menu for an instant launch in the heat of the action."}],"scripts":["gta5"],"fiche":{"colonnes":[{"titre":"Understanding the Online Action menu","liens":[{"titre":"❓ What is Online Action?","de":0,"a":1}]},{"titre":"Using the Online Action menu","liens":[{"titre":"📋 Examples of automated actions","de":2,"a":4},{"titre":"⚙️ How to run an Online Action?","de":5,"a":7}]}]}},{"id":"story-cheat","titre":"👤 The Story Action menu (GTA 5 Story Mode)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Story Action and how does it work?"},{"type":"texte","style":"p","contenu":"**Story Action** includes all the official cheat codes of *GTA 5*'s single-player mode. Instead of memorizing and tapping long button combinations on the controller, the script sends the complete sequence for you as soon as you select it."},{"type":"texte","style":"h2","contenu":"🗂️ Codes organized by category"},{"type":"texte","style":"p","contenu":"All the game's codes are listed and sorted into 4 distinct groups in the script menu:"},{"type":"liste","contenu":"🔫 **Weapon:** Get all weapons, explosive ammo, flaming bullets, etc.\n🏃 **Character:** Temporary invincibility, max health/armor, super jump, explosive punch (*Super Punch*), run/swim faster.\n🚗 **Vehicle:** Spawn any vehicle in the game (Buzzard, Comet, Sanchez, Trashmaster, etc.).\n🌀 **Misc:** Increase or decrease the wanted level, change the weather, low gravity, slow motion (*Slow Motion*)."},{"type":"texte","style":"h2","contenu":"⚙️ How to run a Story Action?"},{"type":"texte","style":"p","contenu":"You have two activation methods to choose from:"},{"type":"liste","contenu":"**From the OLED screen:** Navigate directly in the script's Story Action menu, select the desired action and tap {CROSS / A} to launch the desired action.\n**Via a** [**Quick Action**](/gta5/quick-cheat/)*:* Assign the action to a custom controller shortcut in the [**Quick Action**](/gta5/quick-cheat/) menu for an instant launch in the heat of the action."}],"scripts":["gta5"],"fiche":{"colonnes":[{"titre":"Understanding the Story Action menu","liens":[{"titre":"❓ What is Story Action?","de":0,"a":1}]},{"titre":"Using the Story Action menu","liens":[{"titre":"🗂️ Codes organized by category","de":2,"a":4},{"titre":"⚙️ How to run a Story Action?","de":5,"a":7}]}]}},{"id":"quick-cheat","titre":"🚀 The Quick Action menu (In-game shortcuts)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a Quick Action and how does it work?"},{"type":"texte","style":"p","contenu":"**Quick Action** works on the same principle as [**Quick Toggles**](page:quick-toggle). It lets you assign an action from the **Online Action** or **Story Action** menus to a dedicated button combination on your controller.\n\nInstead of having to open a menu in the middle of a fight, you just perform your shortcut and the action runs automatically in the background."},{"type":"texte","style":"h2","contenu":"🛠️ In-game usage example"},{"type":"liste","contenu":"**In the field:** You need to leave an area quickly in *GTA Online*.\n**Action:** Rather than opening the interaction menu to look for your helicopter, you simply perform your custom **Quick Action** shortcut.\n**Result:** The script instantly spawns your **Sparrow** nearby, while you keep moving."},{"type":"carte","couleur":"jaune","contenu":"💡 **Customization:** You can configure your **Quick Action** shortcuts directly in the script menu to keep your favorite functions (Sparrow, thermal vision, personal vehicle, Super Jump…) at your fingertips.\n\n🩹 Healing and armor are no longer part of the Quick Actions: they are now available with the [**Quick Care**](page:global-mods) MOD."}],"scripts":["gta5"],"fiche":{"colonnes":[{"titre":"Understanding Quick Actions","liens":[{"titre":"❓ What is a Quick Action?","de":0,"a":1}]},{"titre":"Using Quick Actions","liens":[{"titre":"🛠️ In-game usage example","de":2,"a":4}]}]}},{"id":"five-finger-fillet","titre":"🔪 5 Finger Fillet (Knife game)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the 5 Finger Fillet MOD and how does it work?"},{"type":"texte","style":"p","contenu":"This MOD memorizes your opponents' button sequences in the knife game (*Five Finger Fillet*) and runs them automatically with perfect speed and accuracy, guaranteeing you win all your games with no risk of missing."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Setup","contenu":"Approach a game table (for example in Strawberry). In the **Activity** menu, confirm **5 Finger Fillet** with {CROSS / A}, then sit at the table to start the game."},{"titre":"Memorizing the sequence","blocs":[{"type":"liste","contenu":"- Hold {R2 / RT} down during the opponent's demonstration.\n- While holding {R2 / RT}, enter **the last 5 buttons** of the combination (ignore the first button, which is always {CROSS / A})."}]},{"titre":"Starting the turn","contenu":"When it is your turn to play, press the {D-Pad DOWN} button once to trigger the automatic sequence."},{"titre":"Ending the turn","contenu":"As soon as the sequence is finished and the round is won, press {D-Pad UP} to stop the loop."},{"titre":"Following rounds","contenu":"When the opponent offers a new sequence:","blocs":[{"type":"liste","contenu":"- Hold {R2 / RT} and press {L2 / LT} to erase the previous combination.\n- Hold {R2 / RT} again and enter the new 5-button sequence."}]}]}],"scripts":["rdr2"],"fiche":{"colonnes":[{"titre":"Understanding the 5 Finger Fillet","liens":[{"titre":"❓ What is the 5 Finger Fillet MOD?","de":0,"a":1}]},{"titre":"Using the 5 Finger Fillet","liens":[{"titre":"⚙️ Step-by-step procedure","de":2,"a":3}]}]}},{"id":"cooking","titre":"🥩 Cooking (Automatic meat cooking)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Cooking MOD and how does it work?"},{"type":"texte","style":"p","contenu":"The **Cooking** MOD handles the chain cooking of your meats at the campfire. It saves you from having to hold the buttons by hand for long minutes when you need to prepare large stocks of food for your character."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Setup","contenu":"Position your character in front of a campfire so as to open the cooking menu."},{"titre":"Launch","contenu":"In the **Activity** menu, start **Cooking** by pressing {CROSS / A}."},{"titre":"Meat selection","contenu":"Choose the meat you want to prepare and hold {CROSS / A} for 1 second to start the process."},{"titre":"Choosing the save mode","blocs":[{"type":"liste","contenu":"- **Store continuously:** Press {SQUARE / X} so that the script automatically stores each cooked piece in your inventory (default).\n- **Eat continuously:** Press {R2 / RT} so that your character directly consumes each preparation on the spot."}]}]}],"scripts":["rdr2"],"fiche":{"colonnes":[{"titre":"Understanding the Cooking","liens":[{"titre":"❓ What is the Cooking MOD?","de":0,"a":1}]},{"titre":"Using the Cooking","liens":[{"titre":"⚙️ Step-by-step procedure","de":2,"a":3}]}]}},{"id":"gta6-activity-test","titre":"Activities in testing phase","scripts":["gta6"],"blocs":[{"type":"carte","couleur":"rouge","contenu":"🧪 **Activities in testing phase:** for now, all of the script's activities (**Fishing**, **Bench Press** and those to come) are in a testing phase. Their rhythms and button sequences will be refined and optimized as soon as the game is officially released."}]},{"id":"activity-rdr2-fishing","titre":"🎣 Fishing (Automatic fishing)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Fishing MOD and how does it work?"},{"type":"texte","style":"p","contenu":"The **Fishing** MOD automates the entire fishing process. It handles the slow reeling to attract the fish, the instant hook-set as soon as it bites, and quickly bringing it back to shore. The Cronus Zen's OLED screen shows the exact fishing state in real time."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Setup","contenu":"Equip your fishing rod at the edge of a body of water."},{"titre":"Launch","contenu":"Open the script's **Activity** menu and start **Fishing** by pressing {CROSS / A}."},{"titre":"Preparation","contenu":"Select your lure or bait in the game."},{"titre":"Casting the line","contenu":"Hold {L2 / LT} then {R2 / RT}, then release {R2 / RT} to cast the line. Then release all the controller buttons.","blocs":[{"type":"liste","contenu":"*Note: If you are not happy with the cast, press* {CIRCLE / B} *to cancel and cast your line again.*"}]},{"titre":"Automatic handling by the script","blocs":[{"type":"liste","contenu":"The script slowly reels for you to stimulate the fish.\nAs soon as a fish bites the hook, the script automatically sets the hook.\nThe script switches to fast reeling to bring the catch in as quickly as possible."}]},{"titre":"Fighting the fish","contenu":"When the fish struggles, the script automatically stops reeling. Simply direct your stick to counter the fish's movements. As soon as it calms down, the script resumes fast reeling."},{"titre":"End of the catch","contenu":"Choose in-game whether to keep the fish or release it back into the water. Re-bait if necessary and cast your line again."}]}],"scripts":["rdr2"],"fiche":{"colonnes":[{"titre":"Understanding the Fishing","liens":[{"titre":"❓ What is the Fishing MOD?","de":0,"a":1}]},{"titre":"Using the Fishing","liens":[{"titre":"⚙️ Step-by-step procedure","de":2,"a":3}]}]}},{"id":"activity-gta6-intro","titre":"Activity Introduction (GTA 6)","scripts":["gta6"],"blocs":[{"type":"modbody","mod":"gta6-activity-test"},{"type":"texte","style":"h2","contenu":"❓ What is the Activity menu?"},{"type":"texte","style":"p","contenu":"The **Activity** menu groups a set of automation MODs dedicated to the mini-games and side activities of *GTA 6*.\n\nThese MODs simplify or completely take over repetitive manipulations (fishing, bench press) to spare you muscle fatigue and guarantee you 100% success."},{"type":"carte","couleur":"jaune","contenu":"💡 **Exiting an activity:** To exit any activity launched from the Activity menu and return to standard gameplay, hold {CIRCLE / B} for a few seconds."},{"type":"texte","style":"p","contenu":"In addition, **new activities will be added over time** as the game is explored and new mini-games are discovered."}]},{"id":"activity-rdr2-intro","titre":"Activity Introduction (RDR2)","scripts":["rdr2"],"blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Activity menu?"},{"type":"texte","style":"p","contenu":"The **Activity** menu groups a set of automation MODs dedicated to the mini-games and side activities of *Red Dead Redemption II* and *Red Dead Online*.\n\nThese MODs simplify or completely take over repetitive manipulations (fishing, knife game, meat cooking) to spare you muscle fatigue and guarantee you 100% success."},{"type":"carte","couleur":"jaune","contenu":"💡 **Exiting an activity:** To exit any activity launched from the Activity menu and return to standard gameplay, hold {CIRCLE / B} for a few seconds."}]},{"id":"mods-activator","titre":"🔘 MODs Activator","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the \"MODs Activator\"?"},{"type":"texte","style":"p","contenu":"The **MODs Activator** is the script's condition engine. It lets you define with total precision **when** and **how** your MODs should activate in-game.\n\nInstead of imposing a rigid behavior, this system listens to your buttons in real time and only triggers your MODs (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) if the exact condition you chose is met."},{"type":"texte","style":"h2","contenu":"⚙️ How it works"},{"type":"texte","style":"p","contenu":"Every player has their own way of playing, and every weapon has its constraints. By assigning a specific trigger mode to each MOD, you avoid unintended activations (for example: doing a *Drop Shot* when you just wanted to adjust your aim from a distance).\n\nThe system analyzes the combination of your main buttons: the aim trigger (**ADS**) and the fire trigger (**FIRE**)."},{"type":"texte","style":"h2","contenu":"🛠️ Which MODs use the MODs Activator?"},{"type":"texte","style":"p","contenu":"You can assign an independent activation mode to each of the following MODs in your profile:"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"texte","style":"h2","contenu":"🎛️ Trigger modes"},{"type":"texte","style":"p","contenu":"There are **5 trigger modes** available. For each MOD, choose the one that matches the way you play:"},{"type":"texte","style":"h3","contenu":"🔀 ADS + FIRE *(Aim + Shoot)*"},{"type":"modbody","mod":"act-ads-fire"},{"type":"texte","style":"h3","contenu":"💥 FIRE *(Global shooting)*"},{"type":"modbody","mod":"act-fire"},{"type":"texte","style":"h3","contenu":"💥 FIRE Only *(Hip-fire only)*"},{"type":"modbody","mod":"act-fire-only"},{"type":"texte","style":"h3","contenu":"🎯 ADS *(Global aiming)*"},{"type":"modbody","mod":"act-ads"},{"type":"texte","style":"h3","contenu":"🎯 ADS Only *(Aiming only)*"},{"type":"modbody","mod":"act-ads-only"},{"type":"carte","couleur":"jaune","contenu":"💡 **In summary:**\n\nThe MODs Activator offers tailor-made control of your controller. It adapts to your gameplay instead of forcing you to adapt your playstyle to the script."}],"fiche":{"colonnes":[{"titre":"Understanding the MODs Activator","liens":[{"titre":"❓ What is the MODs Activator?","de":0,"a":1},{"titre":"⚙️ How it works","de":2,"a":3},{"titre":"🛠️ Which MODs use the MODs Activator?","de":4,"a":6}]},{"titre":"Setting up the MODs Activator","liens":[{"titre":"🎛️ Trigger modes","de":7,"a":19}]}]}},{"id":"navigation-oled","titre":"🧭 Navigation & OLED Menus","blocs":[{"type":"texte","style":"h2","contenu":"📂 Main Menu structure"},{"type":"texte","style":"h3","contenu":"The features are divided into 6 distinct categories:"},{"type":"liste","contenu":"🔀 **Profile MODs**: Settings specific to a profile or a weapon (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). These values change automatically when you switch profile.\n🌍 **Global MODs**: Options that are always active, whatever the selected profile (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator**: Conditions required to trigger certain *Profile MODs* (e.g. only when aiming *ADS Only*, when shooting *FIRE*, or *ADS + FIRE*).\n🎮 **Controller**: Hardware configuration of your controller (Sensitivity, Dead zone / *Stick Drift*, Y-axis inversion, Button layout).\n⚙️ **Misc**: Script system options (*Auto Save* to save your settings, *VM Speed* for execution speed).\n⏱️ **Quick Toggle**: Quick controller shortcut assignments to enable or disable a MOD on the fly."},{"type":"texte","style":"h2","contenu":"🕹️ Additional game-specific menus"},{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA 6)**: Automation MODs dedicated to in-game mini-games and jobs (*Automatic fishing*, *5 Finger Fillet*, *Cooking*, *Bench Press* and more to come...) to succeed every time with no physical effort.\n🔄 **Switch Profile (FPS / TPS)**: Quick-switch system letting you change weapon profile or configuration (Profile 1, Profile 2, Primary, Secondary...) on the fly mid-game, to instantly adapt your MODs and your *AntiRecoil* to the weapon you are holding.\n🌐 **Online Action (GTA 5)**: Quick actions to instantly run key actions from the Interaction menu in GTA Online (spawning your personal vehicle or a helicopter, enabling passive mode or Ghost Organization...).\n👤 **Story Action (GTA 5)**: Automatic execution of the official cheat code combinations reserved for GTA 5 Story mode (max health/armor, invincibility, weapons, environment effects...).\n🚀 **Quick Action (GTA 5)**: Assignment of quick button combinations on your controller (same principle as *Quick Toggles*) to trigger your favorite GTA 5 actions on the fly mid-game."},{"type":"texte","style":"h2","contenu":"🛑 Safety: the KillSwitch (script cut-off)"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Crucial warning:** Whether you are in a racing game or a shooter, the script blindly executes the instructions it contains. That is why it is **absolutely crucial to disable your script** when you navigate the game or console menus. Since a MOD runs on a simple button press, it would be a shame to delete a rare piece of equipment from your inventory or to buy/sell by mistake because a MOD triggered at the wrong time!"},{"type":"texte","style":"h2","contenu":"💡 How to enable or disable the KillSwitch (total mute of the script's features):"},{"type":"texte","style":"p","contenu":"Each of these buttons **turns the script off or back on**. It turns off automatically when you open a menu, and back on when you close it:"},{"type":"liste","contenu":"{OPTIONS / MENUS}: turns the script off when you open the game's Pause menu, and back on when you close it.\n{PS / XBOX}: turns the script off when you open your console's menu, and back on when you return to the game.\nHold {L2 / LT} + {SHARE / VIEW}: turns the script off or back on whenever you want."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tip:** {CIRCLE / B} never turns the script off: it only turns it **back on**, with a double tap or a long press. It is often the easiest method, since it is the button you already use to leave menus."},{"type":"texte","style":"h2","contenu":"🚪 Entering and leaving the menu"},{"type":"liste","contenu":"**Open the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS}.\n**Close the menu:** Hold {L2 / LT} and press {OPTIONS / MENUS}.\n> If **Auto Save** is enabled (in Misc), your changes are saved automatically.\n> **To save manually**, exit the menu by pressing {PS / XBOX}.\n**AntiRecoil quick access:** Hold {L2 / LT} and press {PS / XBOX} to directly open or close the active profile's AntiRecoil values *(if the AntiRecoil MOD is enabled on that profile)*."},{"type":"texte","style":"h2","contenu":"🎛️ Navigating and editing MOD values"},{"type":"texte","style":"h2","contenu":"🧭 Navigating the menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual help on the OLED screen:**\n\n🧭 **Directional arrows:** *Arrows appear around the parameter to tell you directly which direction to press on the controller.*"},{"type":"texte","style":"p","contenu":"📜 **Instruction line:** *A text scrolls on the last line of the screen to guide you step by step if you are unsure which button to use.*"},{"type":"liste","contenu":"↕️ **Browse a list or a drop-down menu:** Use {D-Pad UP} or {DOWN} *(main menu, actions list, settings choices...)*.\n📥**Enter a menu / sub-menu:** Press {CROSS / A}.\n🔄**Change the profile to edit:** Press {TRIANGLE / Y} *(only in the Profile MODs menu)*.\n↔️**Move between MODs:** Use {D-Pad LEFT} or {RIGHT}.\n⚙️**Enable/Disable a MOD or change its type:** Use {D-Pad UP} or {DOWN}.\n↩️**Go back to the previous menu:** Press {CIRCLE / B}."},{"type":"texte","style":"h2","contenu":"🔢 Editing numerical values *(e.g. AntiRecoil strength, Rapid Fire rate)*"},{"type":"etapes","etiquette":"Step","etapes":[{"titre":"Enable the MOD","contenu":"If the MOD is *OFF*, you do not have access to its adjustable values."},{"titre":"Enter the edit menu","contenu":"Press {CROSS / A}."},{"titre":"Select the parameter","contenu":"Use {D-Pad LEFT} or {RIGHT} to navigate between the different options."},{"titre":"Change the value","contenu":"Hold {R1 / RB} then press {D-Pad RIGHT} (or {UP}) to increase, or {D-Pad LEFT} (or {DOWN}) to decrease."},{"titre":"Go back to the previous menu","contenu":"Press {CIRCLE / B}."}]}],"fiche":{"colonnes":[{"titre":"Understanding the menus","liens":[{"titre":"📂 Main menu structure","de":0,"a":2},{"titre":"🕹️ Additional menus by game","de":3,"a":4}]},{"ti
