<style>/* =========================================================================
   NOOZBAR SCRIPTS — feuille de style
   Même structure que chaton-script.com (menu latéral, cartes, blocs).
   Pour changer l'ambiance du site, modifie uniquement les couleurs
   ci-dessous (section :root). Tout le reste s'adapte automatiquement.
   ========================================================================= */
:root{
  /* Couleur principale (cyan) et secondaire (violet) du site */
  --accent:#3ad1ff;      --accent-rgb:58,209,255;
  --accent-2:#a46bff;    --accent2-rgb:164,107,255;
  --accent-3:#ff6bd6;    /* fin du dégradé du grand titre */

  /* Fonds et textes */
  --bg:#060912;
  --bg-card:rgba(20,30,58,.55);
  --bg-card-2:rgba(12,20,40,.6);
  --line:rgba(90,150,255,.22);
  --txt:#dbe6f7;
  --txt-dim:#8ea6c8;

  /* Couleurs nommées utilisables dans /admin */
  --violet:#7c5cff;--rose:#ff6b8a;--green:#6fe3a1;--blue:#5aa9ff;
  --rouge:#ff4d4d;--orange:#ffb547;--jaune:#ffd34d;--blanc:#ffffff;--gris:#9aa0b5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.65;font-size:16px;background:var(--bg);position:relative;overflow-x:hidden}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none}

.layout{display:flex;min-height:100vh}

/* ---------------- MENU LATÉRAL ---------------- */
aside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;width:270px;min-width:270px;background:rgba(8,12,28,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line);padding:26px 14px 40px;scrollbar-width:thin;scrollbar-color:rgba(var(--accent-rgb),.25) transparent;z-index:50}
aside .brand{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;font-weight:800;font-size:1.5rem;letter-spacing:4px;color:var(--accent);padding:0 10px;text-shadow:0 0 14px rgba(var(--accent-rgb),.5);font-family:inherit}
aside .brand:hover{filter:brightness(1.15)}
aside .brand-sub{font-size:.7rem;color:var(--txt-dim);letter-spacing:1px;text-transform:uppercase;padding:4px 10px 20px;line-height:1.5}
aside .nav-link{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;background:none;border:none;color:var(--txt-dim);font-family:inherit;font-size:.88rem;font-weight:600;padding:9px 11px;border-radius:8px;margin-bottom:2px;border-left:2px solid transparent;transition:.08s;text-decoration:none}
aside .nav-link .ic{color:var(--accent);display:grid;place-items:center;min-width:22px;flex:none}
aside .nav-link .ic svg{width:19px;height:19px}
aside .nav-link:hover{color:var(--txt);background:rgba(var(--accent-rgb),.10)}
aside .nav-link.active{color:#fff;background:rgba(var(--accent-rgb),.16);border-left-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.3),0 0 18px rgba(var(--accent-rgb),.15) inset}
aside .nav-link .ext{margin-left:auto;opacity:.5;font-size:.75rem}
aside .sep{height:1px;background:var(--line);margin:12px 10px}
aside .nav-rubrique{font-size:.66rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent-2);padding:16px 11px 6px;border-top:1px solid var(--line);margin:8px 0 2px;opacity:.9}
.nav-back{color:var(--txt-dim)!important}

/* barre du haut (mobile) + overlay : cachés sur PC */
#topbar{display:none}
#overlay{display:none}

/* ---------------- CARTES DE SCRIPTS (accueil) ---------------- */
.scripts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin:26px 0 34px}
.script-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;text-decoration:none;background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;color:var(--txt);transition:.14s;font-family:inherit;position:relative;overflow:hidden;min-height:200px}
.script-card .card-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
.script-card::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(6,9,18,.15) 0%,rgba(6,9,18,.75) 70%);pointer-events:none}
.script-card > *:not(.card-bg){position:relative;z-index:1}
.script-card:hover{transform:translateY(-4px);border-color:rgba(var(--accent-rgb),.5);box-shadow:0 14px 34px rgba(var(--accent-rgb),.16),0 0 20px rgba(var(--accent-rgb),.10)}
.script-card .sc-ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;margin-bottom:6px}
.script-card .sc-ic svg{width:26px;height:26px}
.script-card .sc-ic .icon-emoji{font-size:27px;line-height:1;color:inherit}
.script-card .sc-jeu{font-size:.7rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-dim)}
.script-card .sc-nom{font-size:1.25rem;font-weight:800;color:var(--sc-name-color,#fff);letter-spacing:1px;text-shadow:0 0 14px var(--sc-name-color,transparent)}
.script-card .sc-desc{font-size:.88rem;color:var(--sc-desc-color,var(--txt));opacity:.92;line-height:1.5}
.script-card .sc-go{margin-top:auto;padding-top:6px;font-size:.85rem;font-weight:700;color:var(--sc-accent,var(--accent))}
.script-card .sc-soon{margin-top:6px;font-size:.8rem;font-weight:700;color:var(--txt-dim);opacity:.8}
.script-card.soon{cursor:not-allowed;opacity:.55}
.script-card.soon:hover{transform:none;border-color:var(--line);box-shadow:none}
.script-card.bd-perso .sc-ic{background:var(--sc-accent,var(--accent))}
.script-card.bd-perso:hover{border-color:var(--sc-accent,var(--accent));box-shadow:0 14px 34px rgba(0,0,0,.35),0 0 22px color-mix(in srgb,var(--sc-accent,var(--accent)) 30%,transparent)}
.script-card .sc-ic.has-logo{width:54px;height:54px;min-width:54px;flex:0 0 54px;padding:0;margin-bottom:6px;border-radius:12px;overflow:hidden;position:relative;display:block;background:transparent;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 3px 12px rgba(0,0,0,.35)}
.script-card .sc-ic.has-logo > img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}

/* ---------------- CONTENU ---------------- */
main{flex:1;max-width:920px;margin:0 auto;padding:40px 46px 90px;min-width:0;position:relative}
.panel{animation:fade .25s ease;position:relative}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel-bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;pointer-events:none}

h1.title{font-size:3rem;font-weight:800;letter-spacing:5px;line-height:1.05;background:linear-gradient(120deg,var(--accent),var(--accent-2) 60%,var(--accent-3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;filter:drop-shadow(0 0 18px rgba(var(--accent-rgb),.35))}
.lead{color:var(--txt-dim);font-size:1rem;letter-spacing:.5px;margin-bottom:10px;max-width:720px}
h1.section{display:flex;align-items:center;gap:13px;font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.25}
h1.section .ic{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:rgba(var(--accent-rgb),.12);color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.25)}
h1.section .ic svg{width:24px;height:24px}
.ic.icon-emoji{font-size:22px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400;white-space:nowrap}
.script-card .sc-ic > .ic.icon-emoji{font-size:28px}
h1.section .ic.icon-emoji{font-size:26px}
.fil{font-size:.78rem;color:var(--txt-dim);margin-bottom:6px;letter-spacing:.4px}
.fil a{color:var(--txt-dim);text-decoration:none}
.fil a:hover{color:var(--accent)}
.page-head{margin-bottom:22px}

/* sommaire "Sur cette page" */
.sommaire{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 26px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg-card-2)}
.sommaire .lb{width:100%;font-size:.68rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-2);margin-bottom:2px}
.sommaire button{font-family:inherit;font-size:.8rem;font-weight:600;color:var(--txt);background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.22);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.1s}
.sommaire button:hover{background:rgba(var(--accent-rgb),.18);border-color:var(--accent);color:#fff}

/* ---------------- BLOCS ---------------- */
.bloc-wrap{display:flow-root}
.bloc-wrap > *{margin-top:0!important;margin-bottom:0!important}
.bloc-wrap.esp-petit{padding-bottom:6px}
.bloc-wrap.esp-normal{padding-bottom:16px}
.bloc-wrap.esp-grand{padding-bottom:34px}
.bloc-wrap.esp-tresgrand{padding-bottom:60px}
.b-text{white-space:pre-wrap}
.b-text.h1{font-size:1.45rem;font-weight:800;color:#fff;padding-top:18px;border-top:1px solid var(--line);scroll-margin-top:80px}
.bloc-wrap:first-child .b-text.h1{border-top:none;padding-top:0}
.b-text.h2{font-size:1.15rem;font-weight:700;color:#fff;padding-top:6px;scroll-margin-top:80px}
.b-text.h3{font-size:1rem;font-weight:700;color:var(--accent)}
.b-text.p{font-size:1rem;line-height:1.7}
.b-text.left{text-align:left}.b-text.center{text-align:center}.b-text.right{text-align:right}
.col-accent{color:var(--accent)}.col-amber{color:var(--accent-2)}.col-violet{color:var(--violet)}
.col-rose{color:var(--rose)}.col-green{color:var(--green)}.col-blue{color:var(--blue)}
.col-rouge{color:var(--rouge)}.col-orange{color:var(--orange)}.col-jaune{color:var(--jaune)}.col-blanc{color:var(--blanc)}.col-gris{color:var(--gris)}
em{color:inherit;opacity:.92}
strong{color:#fff}

.b-card{background:var(--bg-card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:0 8px 30px rgba(0,0,0,.3);position:relative;overflow:hidden}
.b-card .card-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
.b-card.b-card-image{padding:0}
.b-card.b-card-image .card-image-full{display:block;width:100%;max-width:100%;height:auto;object-fit:contain}
.b-card.b-card-image a{display:block}
.b-card .card-inner{position:relative;z-index:1}
.b-card .card-inner > div{white-space:pre-wrap}
.b-card h4{color:#fff;margin-bottom:8px;font-size:1.05rem}
.b-card.bd-accent{border-left:3px solid var(--accent)}.b-card.bd-amber{border-left:3px solid var(--accent-2)}
.b-card.bd-violet{border-left:3px solid var(--violet)}.b-card.bd-rose{border-left:3px solid var(--rose)}
.b-card.bd-green{border-left:3px solid var(--green)}.b-card.bd-blue{border-left:3px solid var(--blue);background:rgba(25,45,85,.45)}
.b-card.bd-rouge{border-left:3px solid var(--rouge);background:rgba(70,18,28,.45)}.b-card.bd-orange{border-left:3px solid var(--orange);background:rgba(70,45,15,.40)}
.b-card.bd-jaune{border-left:3px solid var(--jaune);background:rgba(65,58,15,.35)}.b-card.bd-blanc{border-left:3px solid var(--blanc)}.b-card.bd-gris{border-left:3px solid var(--gris)}

.b-video{margin:0 auto;background:#000;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/9}
.b-video.s{max-width:340px}.b-video.m{max-width:560px}.b-video.l{max-width:780px}.b-video.full{max-width:100%}
.b-video.left{margin-left:0;margin-right:auto}.b-video.center{margin-left:auto;margin-right:auto}.b-video.right{margin-right:0;margin-left:auto}
.b-video iframe,.b-video video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#000}

.b-fix{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg-card)}
.b-fix .fh{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.b-fix .fn{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--rose);color:#2a0808;font-size:1rem}
.b-fix .ft{font-size:1.02rem;font-weight:700;color:#fff;padding-top:4px}
.b-fix .fsol{padding:16px 20px;background:var(--bg-card-2);border-top:1px solid var(--line);font-size:.95rem;white-space:pre-wrap}
.b-fix .fsol .lb{color:var(--accent);font-weight:700;letter-spacing:1px;font-size:.72rem;text-transform:uppercase;display:block;margin-bottom:5px}

.b-keys{line-height:2.1}

/* listes : puces, sous-listes, listes numérotées */
.b-list{list-style:none}
.b-list li{position:relative;padding-left:22px;margin-bottom:8px}
.b-list > li::before{content:"";position:absolute;left:3px;top:.68em;width:7px;height:7px;border-radius:50%;background:var(--puce,var(--accent));box-shadow:0 0 8px var(--puce,rgba(var(--accent-rgb),.6))}
.b-list .sub{list-style:none;margin:6px 0 2px}
.b-list .sub li{padding-left:18px;margin-bottom:5px;color:var(--txt)}
.b-list .sub li::before{content:"";position:absolute;left:3px;top:.72em;width:7px;height:2px;border-radius:2px;background:var(--accent-2)}
/* pastille numerotee unique (listes numerotees ET chiffres dans le texte) */
.num-badge{display:inline-grid;place-items:center;width:26px;height:26px;margin:0 8px 2px 0;border-radius:8px;font-size:.8rem;font-weight:800;line-height:1;vertical-align:middle;color:#06101c;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px rgba(var(--accent-rgb),.35)}
ol.b-list{counter-reset:etape var(--debut,0)}
ol.b-list > li{counter-increment:etape;padding-left:38px;min-height:28px}
ol.b-list > li::before{content:counter(etape);width:26px;height:26px;top:0;left:0;border-radius:8px;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#06101c;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px rgba(var(--accent-rgb),.35)}

/* étiquettes (liste de MODs) */
.b-tags{display:flex;flex-wrap:wrap;gap:8px}
.b-tags .tag{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--txt);background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* touches manette {L2} */
.key{display:inline-block;font-weight:700;font-size:.78rem;padding:1px 8px;border-radius:6px;border:1px solid rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.10);color:#fff;white-space:nowrap;line-height:1.55;vertical-align:baseline;letter-spacing:.5px;margin:0 1px;box-shadow:0 1px 0 rgba(0,0,0,.4)}

/* cartes cliquables (navigation) */
.cartelien-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.key .k-ps{color:#4aa3ff}.key .k-xb{color:#4ade5a}.key .k-sl{color:#fff;font-weight:600;margin:0 1px}
.b-cartelien{display:block;background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--txt);transition:.12s;cursor:pointer;overflow:hidden}
.b-cartelien:hover{border-color:rgba(var(--accent-rgb),.5);transform:translateY(-3px);box-shadow:0 10px 26px rgba(var(--accent-rgb),.15),0 0 18px rgba(var(--accent-rgb),.10)}
.b-cartelien.cl-pleine{display:block;width:100%}

.b-cartelien .cl-thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:.25s}
.b-cartelien:hover .cl-thumb img{transform:scale(1.04)}
.b-cartelien .cl-thumb.cl-carre{aspect-ratio:1/1;background:transparent}
.b-cartelien:hover .cl-thumb.cl-carre img{transform:none}
.b-cartelien .cl-head{display:flex;align-items:center;gap:10px;font-weight:700;color:#fff;font-size:1rem;margin-bottom:6px}
.b-cartelien .cl-head .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;flex:none}
.b-cartelien .cl-head .ic svg{width:17px;height:17px}
.b-cartelien .ic.icon-emoji{font-size:19px;background:rgba(255,255,255,.06)!important}
.b-cartelien .cl-desc{font-size:.86rem;color:var(--txt-dim);line-height:1.5}
.b-cartelien.bd-perso .ic{background:var(--cl-accent,var(--accent))}
.b-cartelien.bd-perso{border-left:3px solid var(--cl-accent,var(--accent))}
.b-cartelien.bd-perso:hover{border-color:var(--cl-accent,var(--accent))}
.b-cartelien.bd-violet .ic{background:var(--violet)}.b-cartelien.bd-rose .ic{background:var(--rose)}
.b-cartelien.bd-green .ic{background:var(--green)}.b-cartelien.bd-blue .ic{background:var(--blue)}
.b-cartelien.bd-rouge .ic{background:var(--rouge)}.b-cartelien.bd-orange .ic{background:var(--orange)}
.b-cartelien.bd-jaune .ic{background:var(--jaune)}

/* média (image/vidéo) intégré dans un bloc */
.bloc-media{margin:12px 0 2px;max-width:100%}
.bloc-media img,.bloc-media video,.bloc-media iframe{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.bloc-media img{object-fit:contain}
.bloc-media.is-video iframe{width:100%;aspect-ratio:16/9;height:auto}
.bloc-media.left{margin-left:0;margin-right:auto}
.bloc-media.center{margin-left:auto;margin-right:auto}

<script>// Fond animé : points lumineux cyan / violet qui dérivent lentement
// (même principe que chaton-script.com, couleurs noozbar).
(function(){
  const cv = document.getElementById('bgfx');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  let W=0, H=0, pts=[];
  const COULEURS = [[58,209,255],[164,107,255],[255,107,214]];
  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    const n = Math.round(W*H/22000);
    pts = [];
    for(let i=0;i<n;i++) pts.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*2+0.5,
      vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
      ph:Math.random()*6,
      c:COULEURS[Math.random()<.6?0:(Math.random()<.75?1:2)]
    });
  }
  resize();
  window.addEventListener('resize', resize);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#060912'; ctx.fillRect(0,0,W,H);
    const g=ctx.createRadialGradient(W*0.3,H*0.3,0,W*0.3,H*0.3,Math.max(W,H)*0.6);
    g.addColorStop(0,'rgba(30,70,140,.25)'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const g2=ctx.createRadialGradient(W*0.85,H*0.85,0,W*0.85,H*0.85,Math.max(W,H)*0.5);
    g2.addColorStop(0,'rgba(110,50,170,.16)'); g2.addColorStop(1,'transparent');
    ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
    pts.forEach(p=>{
      if(!reduce){ p.x+=p.vx; p.y+=p.vy; p.ph+=0.03; }
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      const tw=0.5+0.5*Math.sin(p.ph);
      const [r,gg,b]=p.c;
      ctx.beginPath();
      ctx.fillStyle=`rgba(${r},${gg},${b},${0.22+tw*0.5})`;
      ctx.shadowColor=`rgba(${r},${gg},${b},.9)`; ctx.shadowBlur=8;
      ctx.arc(p.x,p.y,p.r*(0.7+tw*0.5),0,7); ctx.fill();
    });
    ctx.shadowBlur=0;
    if(!reduce) requestAnimationFrame(frame);
  }
  frame();
})();
</script>

e bon fonctionnement de votre Cronus Zen et éviter les déconnexions intempestives ou les erreurs de détection, assurez-vous de respecter ces prérequis matériels essentiels."},{"type":"texte","style":"h2","contenu":"📋 Checklist de vérification préliminaire"},{"type":"liste","contenu":"🔄 **Firmware à jour :** Assurez-vous que votre Cronus Zen est mis à jour avec la dernière version du micrologiciel (voir la section *Mettre à jour son Cronus Zen*).\n🎛️ **Qualité des câbles :** Utilisez exclusivement des **câbles de transfert de données** (*Data Transfer*).\n> ⚠️ **Avertissement câbles :** N'utilisez **jamais de câbles de charge uniquement** (*Charge-Only*). Ces câbles n'acheminent pas les signaux de commande et empêcheront la console ou le PC de détecter votre matériel."}]},{"type":"depliant","titre":"🔌 Schéma d'attribution et rôle des ports du Cronus Zen","blocs":[{"type":"texte","style":"h2","contenu":"1. 🖥️ Port CONSOLE & FIRMWARE *(À l'arrière)*"},{"type":"liste","contenu":"**Utilisation :** Relier le Cronus Zen à votre console (PS5, PS4, Xbox, Switch) ou à votre PC pour jouer.\n**Autre fonction :** Utilisé pour effectuer les mises à jour du firmware via [*Zen Studio Live*](https://zenstudio.collectivemindsstore.com/)."},{"type":"texte","style":"h2","contenu":"2. 💻 Port PROG *(Sur le côté droit)*"},{"type":"liste","contenu":"**Utilisation :** Relier le Cronus Zen à votre ordinateur portable ou PC fixe.\n**Fonction unique :** Sert uniquement à programmer, configurer et transférer vos scripts GPC et GamePacks sur les slots du Cronus Zen depuis [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/)."},{"type":"texte","style":"h2","contenu":"3. 🎮 Port A1 *(Sur le côté gauche)*"},{"type":"liste","contenu":"**Utilisation :** Branchement de votre **manette officielle principale** (DualSense pour PS5, manette Xbox pour Xbox, etc.).\n**Rôle :** Sert de sécurité et d'authentification matérielle auprès de la console."},{"type":"texte","style":"h2","contenu":"4. ⌨️ Ports A2 & A3 *(En façade avant)*"},{"type":"liste","contenu":"**Port A2 (Façade droite) & Port A3 (Façade gauche) :** Servent à brancher une manette tierce (*Crossover Controller* — par exemple une manette Xbox pour jouer sur PlayStation) ou vos périphériques Clavier & Souris."},{"type":"carte","image":"/media/guide/ports-cronus-zen.webp","titre":"","contenu":""}]},{"type":"depliant","titre":"📡 Output Protocol (Protocole de Sortie)","blocs":[{"type":"texte","style":"p","contenu":"Pour jouer l'esprit serein et garantir une compatibilité absolue avec votre plateforme, il est judicieux de configurer manuellement le **Output Protocol** de votre Cronus Zen.\n\nPar défaut, ce paramètre est réglé sur **AUTO**. Bien qu'il fonctionne dans la majorité des cas, il peut parfois échouer à détecter correctement votre matériel et bloquer la communication. Définir manuellement votre protocole est une excellente pratique pour prévenir tout dysfonctionnement."},{"type":"texte","style":"h2","contenu":"⚙️ Procédure de configuration étape par étape"},{"type":"texte","style":"p","contenu":"1️⃣ Reliez votre Cronus Zen à votre ordinateur via le port **PROG** *(situé sur le côté droit du boîtier)*.\n\n2️⃣ Ouvrez l'application [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/).\n\n3️⃣ Cliquez sur l'onglet **Device Management**, puis sélectionnez **Device Settings**.\n\n4️⃣ Dans la fenêtre qui s'ouvre, repérez la ligne **Output Protocol**.\n\n5️⃣ Remplacez le mode **AUTO** en sélectionnant explicitement votre console dans la liste *(PS5, PS4, Xbox Series X/S, PC, Nintendo Switch...)*.\n\n6️⃣ Fermez la fenêtre pour enregistrer automatiquement le réglage, puis reconnectez votre Zen à votre console ou PC."}]},{"type":"depliant","titre":"🎮 Changement de script à la volée (Remote Slot Change)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Procédure de configuration :"},{"type":"texte","style":"p","contenu":"1️⃣ Reliez votre Cronus Zen à votre ordinateur via le **port PROG** *(côté droit)*.\n\n2️⃣ Ouvrez l'application [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/).\n\n3️⃣ Cliquez sur l'onglet **Device Management**, puis sélectionnez **Device Settings**.\n\n4️⃣ Dans la fenêtre, repérez la ligne **Remote Slot Change**.\n\n5️⃣ Sélectionnez l'option souhaitée dans le menu déroulant. *(💡 Survolez l'icône* **« i »** *à côté du champ pour visualiser la manipulation exacte sur votre manette).*\n\n6️⃣ Fermez la fenêtre pour enregistrer votre choix."},{"type":"carte","couleur":"jaune","contenu":"💡 **Utilisation en jeu :** Effectuez la combinaison de touches choisie à tout moment pendant votre session pour passer instantanément au *slot* suivant sans interrompre votre partie."}]},{"type":"depliant","titre":"🏭 Réinitialisation d'usine (Factory Reset / Hard Reset)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Avertissement :** La réinitialisation d'usine efface l'intégralité de la mémoire de votre Cronus Zen. Tous vos scripts enregistrés dans les *slots* ainsi que vos configurations personnelles seront définitivement supprimés."},{"type":"texte","style":"p","contenu":"Vous disposez de **deux méthodes** pour effectuer un *Factory Reset* :"},{"type":"texte","style":"h2","contenu":"🛠️ Méthode 1 : Réinitialisation matérielle (Boutons P1 et P2)","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Déconnectez totalement votre Cronus Zen de toute source d'alimentation.\n\n2️⃣ Maintenez enfoncés simultanément les boutons **P1** et **P2** *(les deux boutons bleus situés sous l'appareil)*.\n\n3️⃣ Tout en maintenant ces deux boutons appuyés, reliez votre Cronus Zen à votre ordinateur *(peu importe le port USB utilisé)*.\n\n4️⃣ Dès qu'une séquence lumineuse **Rouge ➔ Vert ➔ Bleu** s'anime sur le boîtier, vous pouvez relâcher les boutons."},{"type":"texte","style":"h2","contenu":"💻 Méthode 2 : Réinitialisation logicielle (Via [ZEN Studio Live](https://zenstudio.collectivemindsstore.com/))","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Reliez votre Cronus Zen à votre ordinateur à l'aide du câble connecté sur le **port PROG** *(côté droit)*.\n\n2️⃣ Dans [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/), cliquez sur l'onglet **Device Management**, puis sélectionnez **Factory Reset**.\n\n3️⃣ Dans la fenêtre de sécurité qui s'ouvre, tapez le mot **RESET** dans le champ requis puis validez.\n\n4️⃣ La séquence de LED **Rouge ➔ Vert ➔ Bleu** s'anime sur le boîtier pour confirmer l'opération."},{"type":"carte","couleur":"jaune","contenu":"💡 **Vérification :** Après la réinitialisation, l'écran OLED rafraîchit son affichage vers l'écran d'accueil par défaut et tous vos *slots* de mémoire apparaissent de nouveau vides."}]},{"type":"depliant","titre":"🧹 Remise à zéro complète","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Procédure de réinitialisation intégrale (pas à pas) :"},{"type":"texte","style":"p","contenu":"1️⃣ **Connexion au PC :** Reliez votre Cronus Zen à votre ordinateur à l'aide du câble connecté sur le **port PROG** *(côté droit)*.\n\n2️⃣ **Ouverture du logiciel :** Lancez l'application [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/).\n\n3️⃣ **Purge système (Device Management) :** Cliquez sur l’icône **Device Management** et exécutez successivement les 3 opérations suivantes :"},{"type":"liste","contenu":"- 🗑️ **Erase Memory Slots :** Efface tous les scripts et profils enregistrés dans les mémoires du boîtier.\n- 📡 **Clear Bluetooth :** Réinitialise les appairages sans fil et les mémoires d'appareils enregistrés.\n- 🔄 **Factory Reset :** Remet à zéro l'intégralité de la configuration du matériel."},{"type":"texte","style":"h3","contenu":"4️⃣ Réinstallation propre du micrologiciel :"},{"type":"liste","contenu":"- Effectuez un [**Downgrade**](page:mise-a-jour-zen) vers la version la plus ancienne du firmware disponible.\n- Une fois le flash terminé, relancez immédiatement une mise à jour vers la **dernière version** (*Update to latest*)."},{"type":"carte","couleur":"rouge","titre":"🚨 Si le problème persiste après cette procédure :","contenu":"","blocs":[{"type":"liste","contenu":"Assurez-vous d'appliquer la procédure d'installation pas à pas sans sauter d'étape.\nContrôlez vos câbles USB. Seuls les câbles certifiés **Data Transfer** *(données & charge)* permettent un fonctionnement stable.\nChangez de port USB sur votre ordinateur ou votre console. Branchez le boîtier directement sur la carte mère ou la console *(évitez les hubs et rallonges USB)*."}]}]},{"type":"carte","image":"/media/guide/guide-cronus-zen-2.webp","titre":"","contenu":""}],"icone":"terminal","sommaire":false,"titrePage":"Guide technique du Cronus ZEN"},{"id":"bypass-ps5","titre":"Connexion PS5 (Bypass)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que la procédure de Bypass PS5 ?"},{"type":"texte","style":"p","contenu":"En raison des sécurités natives de la PlayStation 5, le Cronus Zen nécessite une procédure spécifique d'authentification (appelée **Bypass**) pour fonctionner correctement sans déconnexion après quelques minutes de jeu."},{"type":"depliant","titre":"⚙️ 1. Paramétrage initial de la console PS5 *(À faire une seule fois)*","blocs":[{"type":"texte","style":"p","contenu":"Avant toute première utilisation, connectez votre manette DualSense ou DualSense Edge directement à la console (sans passer par le Cronus Zen) et effectuez les réglages suivants :"},{"type":"texte","style":"h2","contenu":"A. Activation du Bluetooth","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Allez dans **Paramètres > Accessoires > Général > Paramètres avancés**.\n\n2️⃣ Si le bouton **« Activer le Bluetooth »** est affiché, appuyez sur {CROSS} pour l'activer (votre console va redémarrer)."},{"type":"texte","style":"h2","contenu":"B. Configuration de la méthode de communication","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Allez dans **Paramètres > Accessoires > Manette (Général) > Méthode de communication**.\n\n2️⃣ Sélectionnez **« Utiliser le câble USB »**."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Avertissement :** Pensez à vérifier ce paramétrage après chaque mise à jour du système de la PS5, car la console peut parfois réinitialiser ce choix par défaut."},{"type":"texte","style":"h2","contenu":"C. Empêcher la mise en veille et le mode repos de vos manettes","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Allez dans **Paramètres > Système > Gestion de l'alimentation**\n\n2️⃣ Réglez les 3 paramètres comme ceci :"},{"type":"liste","contenu":"*Définir le délai avant que la PS5 ne passe en mode repos :* Mettez les 2 paramètres sur **Ne pas passer en mode repos**\n*Définir quand les manettes doivent s'éteindre =* **Ne pas éteindre**"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Avertissement :** La mise en veille de votre manette d'authentification peut annuler votre Bypass et causer des déconnections."},{"type":"texte","style":"h2","contenu":"D. Sélection du profil Gearhead","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14,"gros":true},{"type":"texte","style":"p","contenu":"1️⃣ Connectez votre Cronus Zen à la PS5 en utilisant le câble branché sur le port arrière **CONSOLE & FIRMWARE**.\n\n2️⃣ Assurez vous que votre Cronus Zen est sur le profil **Gearhead** *(logo en forme de tête d'alien* 👽*)* : si un script est actuellement chargé, appuyez sur le gros bouton bleu de droite du Cronus Zen jusqu'à faire apparaître le logo Gearhead sur l'écran OLED.\n\n3️⃣ Débranchez ensuite votre Cronus Zen de la PS5."},{"type":"carte","image":"/media/guide/bypass-ps5-1.webp","titre":"","contenu":""}]},{"type":"depliant","titre":"🛡️ 2. Procédure de Bypass PS5 (DualSense Standard)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Quand exécuter cette procédure ?** Vous devez refaire cette manipulation à chaque fois que vous allumez ou redémarrez votre console, si vous débranchez le Cronus Zen de la PS5, ou si vous débranchez la manette d'authentification du port A1."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Avant le premier branchement :** Réglez manuellement l'**Output Protocol** sur **PLAYSTATION 5** dans [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(Device Management > Device Settings)* pour éviter tout dysfonctionnement lié au mode AUTO."},{"type":"liste","contenu":"Branchez votre manette **DualSense** sur le port **A1** *(situé sur le côté gauche de votre Cronus Zen)*.","numerote":true},{"type":"carte","couleur":"orange","contenu":"Important : Le Cronus Zen doit être relié à la PS5."},{"type":"liste","contenu":"Sur votre PS5, allez dans **Paramètres** ➔ **Accessoires** ➔ **Général** et mettez en surbrillance **Éteindre les accessoires**.\n> 🛑 *Ne cliquez pas dessus : l'option doit uniquement rester en surbrillance à l'écran.*\nMaintenez la touche {D-Pad DROITE} (croix directionnelle droite) enfoncée sur votre manette et ne la relâchez sous aucun prétexte pendant la suite de la manipulation.\nTout en maintenant la touche D-Pad DROITE, cliquez sur le bouton **Reset** situé sous votre Cronus Zen.\nPatientez **5 secondes** pendant que le Bypass s'exécute, puis relâchez la touche D-Pad DROITE.\nQuittez les menus de la console en appuyant sur {CIRCLE}. Votre Bypass est actif et opérationnel !","numerote":true,"debut":2},{"type":"carte","couleur":"jaune","contenu":"💡 **Bonne pratique — Activation du script :** Activez votre script uniquement une fois votre partie lancée dans le jeu (évitez de charger le script dans les menus de la console ou du jeu).\n\n**Pourquoi ?** Au démarrage, certains scripts détectent automatiquement l'état des gâchettes adaptatives (ADT). Si vous êtes encore dans les menus de la console, aucune donnée mécanique n'est transmise, ce qui peut bloquer l'initialisation du script."}]},{"type":"depliant","titre":"🛡️ 3. Procédure de Bypass PS5 (DualSense Edge)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Quand exécuter cette procédure ?** Vous devez refaire cette manipulation à chaque fois que vous allumez ou redémarrez votre console, si vous débranchez le Cronus Zen de la PS5, ou si vous débranchez la manette d'authentification du port A1."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Avant le premier branchement :** Réglez manuellement l'**Output Protocol** sur **PLAYSTATION 5** dans [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(Device Management > Device Settings)* pour éviter tout dysfonctionnement lié au mode AUTO."},{"type":"liste","contenu":"Connectez votre manette en Bluetooth à votre console *(vous devez pouvoir naviguer dans les réglages de votre console)*.\nBranchez votre manette **DualSense Edge** sur le **port A1** *(situé sur le côté gauche de votre Cronus Zen)*.","numerote":true},{"type":"carte","couleur":"orange","contenu":"Important : Le Cronus Zen ne doit **pas** être relié à la PS5 pour le moment."},{"type":"liste","contenu":"Sur votre PS5, allez dans **Paramètres > Accessoires > Général** et mettez en surbrillance **Éteindre les accessoires**.\n> 🛑 *Ne cliquez pas dessus : l'option doit uniquement rester en surbrillance à l'écran.*","numerote":true,"debut":3},{"type":"liste","contenu":"Maintenez la touche {D-Pad DROITE} (croix directionnelle droite) enfoncée sur votre manette et **ne la relâchez sous aucun prétexte** pendant la suite de la manipulation.\nTout en maintenant la touche {D-Pad DROITE}, branchez votre Cronus Zen au port USB en façade de votre PS5.\nPatientez **5 secondes** pendant que le Bypass s'exécute, puis relâchez la touche {D-Pad DROITE}.\nQuittez les menus de la console en appuyant sur {CIRCLE}. Votre Bypass est actif et opérationnel !","numerote":true,"debut":4},{"type":"carte","couleur":"jaune","contenu":"💡 **Bonne pratique — Activation du script :** Activez votre script uniquement **une fois votre partie lancée** dans le jeu (évitez de charger le script dans les menus de la console ou du jeu).\n\n**Pourquoi ?** Au démarrage, certains scripts détectent automatiquement l'état des gâchettes adaptatives (*ADT*). Si vous êtes encore dans les menus de la console, aucune donnée mécanique n'est transmise, ce qui peut bloquer l'initialisation du script."}]},{"type":"depliant","titre":"🎮 4. Utilisation d'une manette tierce *(Crossover Controller)* ou Clavier / Souris","blocs":[{"type":"texte","style":"p","contenu":"Si vous préférez jouer avec une autre manette (ex. : manette Xbox ou manette compétition tierce) ou avec un combo Clavier / Souris :"},{"type":"liste","contenu":"**Authentification PS5 :** Laissez votre manette **DualSense / DualSense Edge** branchée en permanence sur le port **A1** *(situé sur le côté gauche de votre Cronus Zen)*. Elle sert d'authentificateur matériel auprès de la console.\nPériphériques de jeu :\n- **Manette tierce (Crossover) :** Branchez-la sur le port **A3** *(façade avant droite)* de votre Cronus Zen.\n- **Clavier & Souris :** Branchez-les sur les ports **A2** *(façade avant gauche)* et **A3** *(façade avant droite)* de votre Cronus Zen.","numerote":true},{"type":"carte","couleur":"rouge","contenu":"🛑 **Avertissement :** Ne débranchez **sous aucun prétexte** la manette DualSense du port A1 pendant votre session de jeu. Si elle est déconnectée, l'authentification sera perdue et vous devrez refaire la procédure de Bypass depuis le début."}]},{"type":"carte","image":"/media/guide/bypass-ps5-2.webp","titre":"","contenu":""}],"icone":"bouclier","sommaire":false,"titrePage":"Connexion PS5 (Bypass)"},{"id":"connexion-xbox-pc","titre":"Connexion autre plateforme","titrePage":"Connexion autre plateforme","icone":"ordinateur","sommaire":false,"descriptionPartage":"Connexion du Cronus ZEN et de la manette sur Xbox, PS4, Switch, PC et autres plateformes.","blocs":[{"type":"texte","style":"p","contenu":"Cette procédure concerne les plateformes **Xbox, PC** et autres consoles *(PS4, Switch)*. Sur **PS5**, la connexion passe par une procédure particulière : voir [**Connexion PS5 (Bypass)**](page:bypass-ps5)."},{"type":"texte","style":"h2","contenu":"🎮 1. Connexion Xbox, PS4, Switch, PC"},{"type":"texte","style":"p","contenu":"1️⃣ Avant le premier branchement, réglez manuellement l'**Output Protocol** sur votre plateforme dans [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(Device Management > Device Settings)* pour éviter tout dysfonctionnement lié au mode AUTO.\n\n2️⃣ Connectez votre Cronus Zen à votre console en utilisant le câble relié au **port arrière CONSOLE & FIRMWARE**.\n\n3️⃣ Branchez votre **manette officielle** *(celle correspondant à votre console)* sur le **port A1** *(situé sur le côté gauche de votre Cronus Zen)*."},{"type":"carte","couleur":"jaune","contenu":"💡 **Bonne pratique — Activation du script :** Activez votre script uniquement **une fois votre partie lancée** dans le jeu (évitez de charger le script dans les menus de la console ou du jeu).\n\n**Pourquoi ?** Au démarrage, certains scripts détectent automatiquement l'état des gâchettes adaptatives (*ADT*). Si vous êtes encore dans les menus de la console, aucune donnée mécanique n'est transmise, ce qui peut bloquer l'initialisation du script."},{"type":"texte","style":"h2","contenu":"🕹️ 2. Utilisation d'une manette tierce *(Third-Party / Crossover)* ou Clavier / Souris"},{"type":"texte","style":"p","contenu":"Si vous préférez jouer avec une autre manette *(ex. : manette PS5 sur Xbox, manette compétition tierce)* ou avec un combo Clavier / Souris :\n\n1️⃣ **Authentification :** Laissez votre **manette officielle** branchée en permanence sur le **port A1** *(elle sert d'authentificateur matériel auprès de la console)*."},{"type":"texte","style":"h3","contenu":"2️⃣ Périphériques de jeu :"},{"type":"liste","contenu":"- **Manette tierce :** Branchez-la sur le **port A3** *(façade avant droite)* de votre Cronus Zen.\n- **Clavier & Souris :** Branchez-les sur les **ports A2 et A3** *(en façade avant)* de votre Cronus Zen."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Avertissement :** Ne débranchez **sous aucun prétexte** la manette officielle du port A1 pendant votre session de jeu. Si elle est déconnectée, l'authentification sera immédiatement perdue et vous devrez refaire toute la procédure de connexion depuis le début"},{"type":"carte","image":"/media/guide/bypass-ps5-2.webp","titre":"","contenu":""}]},{"id":"mise-a-jour-zen","titre":"Mise à jour du Cronus Zen","blocs":[{"type":"texte","style":"h2","contenu":"❓ Pourquoi et comment mettre à jour le firmware ?"},{"type":"texte","style":"p","contenu":"La mise à jour (*Update*) ou le retour à une version antérieure (*Downgrade*) du micrologiciel (firmware) de votre Cronus Zen s'effectue directement depuis votre navigateur web. Cette opération permet de garantir la compatibilité absolue avec les derniers scripts et de résoudre d'éventuels bugs d'affichage ou de détection."},{"type":"texte","style":"h1","contenu":"⚙️ Procédure étape par étape"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Navigateur compatible obligatoire :** Vous devez **impérativement utiliser un navigateur basé sur Chromium** (comme **Microsoft Edge**, **Google Chrome** ou **Brave**)."},{"type":"texte","style":"p","contenu":"1️⃣ **Connexion au PC :** Reliez votre Cronus Zen à votre ordinateur en utilisant le **port CONSOLE & FIRMWARE** *(port situé à l'arrière du boîtier)*"},{"type":"carte","image":"/media/guide/mise-a-jour-1.webp","titre":"","contenu":""},{"type":"texte","style":"p","contenu":"2️⃣ **Passage en mode Bootloader :** Maintenez le petit bouton bleu **sous votre Cronus Zen** enfoncé jusqu'à ce que la mention **« Zen Bootloader »** apparaisse sur l'écran OLED."},{"type":"carte","image":"/media/guide/mise-a-jour-2.webp","titre":"","contenu":""},{"type":"texte","style":"p","contenu":"3️⃣ **Accès au site :** Ouvrez votre navigateur web *(Edge, Chrome ou Brave)* et allez sur cette page : [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/)\n\n4️⃣ Cliquez sur le bouton **Update Firmware** qui se trouve en bas de la fenêtre.\n\n5️⃣ **Connexion du périphérique :** Dans la fenêtre *Firmware Update*, cliquez sur le bouton **« Connect Device »**."},{"type":"carte","image":"/media/guide/mise-a-jour-3.webp","titre":"","contenu":"","largeurMax":380},{"type":"texte","style":"p","contenu":"6️⃣ **Sélection du matériel :** Sélectionnez votre Cronus Zen dans la liste des appareils détectés, puis cliquez sur **« Se connecter »**."},{"type":"carte","image":"/media/guide/mise-a-jour-4.webp","titre":"","contenu":""},{"type":"texte","style":"h3","contenu":"7️⃣ Choix de la version à installer :"},{"type":"liste","contenu":"⬆️ **Pour mettre à jour (Update) :** Cliquez sur le bouton **« Update to latest »**.\n⬇️ **Pour installer une version antérieure (Downgrade) :** Cliquez sur **« Other Versions »**, sélectionnez la version souhaitée dans le menu déroulant, puis cliquez sur **« Download and flash »**."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Avertissement — Erreur matérielle :** Si vous effectuez un *downgrade* pour débloquer votre Cronus Zen suite à un code d'erreur **E3**, **E3001,** **E3002** ou à cause d'un dysfonctionnement , sélectionnez **la version la plus ancienne** du firmware disponible dans le menu déroulant."},{"type":"images","images":[{"image":"/media/guide/mise-a-jour-5.webp"},{"image":"/media/guide/mise-a-jour-6.webp"}]}],"icone":"actualiser","sommaire":true},{"id":"depannage-faq","titre":"Dépannage & FAQ","blocs":[{"type":"depliant","titre":"❓ Quelles sont les principales causes d'erreurs et de problèmes ?","blocs":[{"type":"texte","style":"h2","contenu":"💻 1. Problèmes logiciels et mises à jour (Software)"},{"type":"liste","contenu":"**Mise à jour interrompue ou mal effectuée :**\n> 💡 **Solution :** Le meilleur remède aux dysfonctionnements logiciels est d'effectuer un [**downgrade**](page:mise-a-jour-zen) vers la version la plus **ancienne** du firmware, puis de relancer la mise à jour vers la toute dernière version. Si le problème persiste, réalisez un *Factory Reset (attention : cela efface tous les scripts enregistrés sur le boîtier)*.\n**Mauvaise détection de la plateforme (Output Protocol) :** Même si le mode *AUTO* est censé reconnaître votre console, il arrive que la détection automatique échoue et bloque la communication.\n> 💡 **Solution :** Dans [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/), allez dans l'onglet **Device Management** ➔ **Device Settings**, puis forcez le **Output Protocol** en sélectionnant manuellement votre plateforme de jeu (*PS5, Xbox Series X/S, PS4, PC*...) au lieu de laisser sur *AUTO*.\n**Blocage par l'antivirus ou le pare-feu :**\n> 💡 **Solution :** Désactivez temporairement votre antivirus ou autorisez [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/) dans votre pare-feu Windows si le logiciel refuse de détecter le Zen ou d'appliquer une mise à jour.\n**Script corrompu dans un slot mémoire :**\n> 💡 **Solution :** Si le Zen plante ou redémarre uniquement lorsque vous sélectionnez un profil précis, effacez le *slot* concerné dans [ZEN Studio](https://zenstudio.collectivemindsstore.com/) puis réinstallez le script."},{"type":"texte","style":"h2","contenu":"🔌 2. Problèmes matériels et d'alimentation (Hardware)"},{"type":"liste","contenu":"**Alimentation USB insuffisante :** Les ports USB de votre ordinateur, de votre console ou l'utilisation d'un *hub* USB passif (non alimenté) ne délivrent pas assez d'énergie au Cronus Zen et à ses périphériques.\n> 💡 **Solution :** Branchez le Cronus Zen directement sur les ports USB principaux de votre console ou à l'arrière de votre PC. Évitez les rallonges et les multiprises USB sans alimentation externe.\n**Câbles USB défectueux ou incompatibles :**\n> 💡 **Solution :** Seuls les câbles certifiés **Data Transfer** *(charge & données)* fonctionnent. Les câbles *Charge-Only* (charge uniquement) ne transmettent pas les informations et provoquent des erreurs de détection."},{"type":"texte","style":"h2","contenu":"🎮 3. Problèmes de manette et de compatibilité"},{"type":"liste","contenu":"**Manette déchargée ou non supportée :**\n> 💡 **Solution :** Assurez-vous que votre manette est suffisamment chargée avant de la brancher sur le Zen et vérifiez sa compatibilité matérielle dans la liste officielle.\nVibrations ou Gâchettes Adaptatives (ADT) désactivées :"},{"type":"texte","style":"p","contenu":"Certains scripts (notamment ceux gérant la détection automatique des véhicules ou des profils) utilisent les retours d'information des vibrations et des ADT pour fonctionner correctement."},{"type":"carte","couleur":"jaune","contenu":"💡 **Solution :** Assurez-vous que les **Vibrations** et les **Gâchettes Adaptatives** sont bien activées à la fois dans les **paramètres système de votre console** et dans les **menus d'options de votre jeu**."},{"type":"texte","style":"h2","contenu":"🏎️ 4. Modes système incorrects (*Wheel Mode*, *Tournament Mode*)"},{"type":"liste","contenu":"**Changement de mode accidentel :**\n> 💡 **Solution :** Dans la barre d'état située tout en bas de la fenêtre de [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/) *(à côté du numéro de série et de la version)*, repérez le texte cliquable indiquant le mode actif. S'il est positionné sur **Wheel** ou **Tournament**, cliquez dessus et remettez-le sur **Normal**."}]},{"type":"depliant","titre":"🚨 Résolution des Erreurs (E3, E3001, E3002)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Procédure de résolution (à suivre dans l'ordre) :"},{"type":"texte","style":"p","contenu":"1️⃣ **Redémarrage simple :** Débranchez totalement votre Cronus Zen de toutes ses connexions USB, patientez 5 secondes, puis rebranchez-le.\n\n2️⃣ **Restauration du firmware (Downgrade) :** Si le blocage persiste, suivez la procédure du guide **«** [**Mises à jour du Cronus Zen**](page:mise-a-jour-zen)**»** pour réaliser un **downgrade** en sélectionnant la version la plus **ancienne** disponible du firmware.\n\n3️⃣ **Réinitialisation d'usine (Factory Reset) :** Si l'erreur persiste, effectuez un *Factory Reset* complet de l'appareil afin de remettre à zéro la mémoire système.\n⚠️ **Attention : la réinitialisation d'usine supprime tous les scripts présents sur le Cronus Zen.**"},{"type":"carte","couleur":"jaune","contenu":"💡 **Vérification :** Une fois la réinitialisation ou le flash terminé, le code d'erreur doit disparaître et l'écran OLED doit afficher l'interface de démarrage habituelle."}]},{"type":"depliant","titre":"🎧 Problèmes de Son, Micro ou Chat Vocal (Prise Jack)","blocs":[{"type":"texte","style":"p","contenu":"Vous rencontrez des grésillements, des coupures de son, une perte du canal vocal ou un micro non détecté lorsque votre casque est branché sur la prise jack de la manette reliée au Cronus Zen ?"},{"type":"texte","style":"h2","contenu":"⚡ Procédures de résolution rapide par console"},{"type":"texte","style":"h2","contenu":"🎮 Solution dédiée PS5","couleurHex":"#3d9bff","fondCouleur":"#3d9bff","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ Branchez simplement votre casque sur la prise jack de votre manette **AVANT** d'effectuer la procédure de [**Bypass PS5**](page:bypass-ps5).\n\n2️⃣ Lancez ensuite votre procédure habituelle de [**Bypass PS5**](page:bypass-ps5)."},{"type":"texte","style":"h2","contenu":"🎮 Solution dédiée XBOX","couleurHex":"#4ade5a","fondCouleur":"#4ade5a","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ Reliez votre Cronus Zen à votre Xbox (*aucune manette ne doit être branchée sur le Cronus Zen à cette étape*).\n\n2️⃣ Assurez-vous que votre Cronus Zen est sur l'écran **Gearhead** *(logo en forme de tête d'alien* 👽*)*."},{"type":"carte","couleur":"jaune","contenu":"*💡 Si un script est actuellement chargé sur un slot, appuyez plusieurs fois sur le gros bouton bleu de droite jusqu'à faire apparaître le logo Gearhead sur l'écran OLED.*"},{"type":"texte","style":"p","contenu":"3️⃣ Branchez votre casque jack sur votre manette Xbox.\n\n4️⃣ Branchez ensuite votre manette sur le port **A1** de votre Cronus Zen.\n\n5️⃣ Une fois le casque relié à la manette et la manette branchée au Zen, faites un court appui sur le bouton **Reset** situé sous le boîtier du Cronus Zen."},{"type":"carte","couleur":"orange","contenu":"⚠️ **À savoir :** Le Cronus Zen gère très mal le transit du signal audio à travers la prise jack d'une manette connectée à ses ports USB. Pour conserver une qualité sonore optimale et un micro pleinement fonctionnel, il est fortement recommandé de ne pas faire repasser le flux audio par le boîtier."},{"type":"texte","style":"h2","contenu":"🛠️ Vous avez toujours des problèmes de son ou de micro ? (3 alternatives efficaces)"},{"type":"liste","contenu":"**📶 Option 1 : Casque sans fil (Bluetooth ou Dongle USB 2,4 GHz)**\n> *C'est la solution idéale.* Reliez directement votre casque sans fil à votre console ou PC. Le signal audio contourne totalement le Cronus Zen, garantissant une qualité sonore maximale et un chat vocal sans aucun parasite.\n**🔌 Option 2 : Casque USB (ou Carte son / Adaptateur Jack ➔ USB)**\n> Branchez votre casque USB *(ou votre casque jack via une carte son / adaptateur USB dédié)* directement sur l'un des ports USB de votre console, et non sur le Cronus Zen.\n**🎮 Option 3 : Seconde manette dédiée à l'audio**\n> Branchez une seconde manette en USB directement sur votre console, puis connectez votre casque jack sur cette seconde manette. Elle servira exclusivement de carte son externe pour le jeu et votre chat vocal."},{"type":"carte","couleur":"jaune","contenu":"💡 **Vérification :** Rendez-vous dans les paramètres audio de votre console et vérifiez que les périphériques d'entrée *(micro)* et de sortie *(casque)* sont bien attribués à votre casque ou à la seconde manette, et non au Cronus Zen."}]},{"type":"depliant","titre":"🛞 Votre Cronus affiche \"Wheel\" ou \"Tournament\"","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Procédure de résolution :"},{"type":"texte","style":"p","contenu":"1️⃣ Reliez votre Cronus Zen à votre PC en utilisant le câble branché sur le **port PROG** *(situé sur le côté droit de l'appareil)*.\n\n2️⃣ Ouvrez l'application [**ZEN Studio Live**](https://zenstudio.collectivemindsstore.com/).\n\n3️⃣ Dans la barre d'état située tout en bas de la fenêtre de [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) *(à côté du numéro de série et de la version)*, repérez le texte cliquable indiquant le mode actif. S'il est positionné sur **Wheel** ou **Tournament**, cliquez dessus et remettez-le sur **Normal**."},{"type":"carte","couleur":"jaune","contenu":"💡 **Vérification :** L'écran OLED du Cronus Zen doit à nouveau afficher son menu standard et ne plus mentionner le mode *Wheel*."}]},{"type":"depliant","titre":"📡 Votre Cronus n'est pas reconnu ou ne fonctionne pas sur votre console (Output Protocol)","blocs":[{"type":"texte","style":"h2","contenu":"🛠️ Procédure de résolution :"},{"type":"texte","style":"p","contenu":"1️⃣ **Préalable obligatoire :** Assurez-vous d'avoir testé d'autres câbles USB certifiés **data** *(charge & données)* et d'avoir vérifié l'état de vos ports USB.\n\n2️⃣ Reliez le Cronus Zen à votre ordinateur via le **port PROG** *(côté droit)*.\n\n3️⃣ Allez sur [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/).\n\n4️⃣ Cliquez sur l'onglet **Device Management**, puis sélectionnez **Device Settings**.\n\n5️⃣ Dans la fenêtre qui s'ouvre, repérez la ligne **Output Protocol**.\n\n6️⃣ Remplacez l'option actuelle *(ou le mode AUTO)* en choisissant explicitement votre console dans la liste (*PS5, PS4, Xbox Series X/S, PC, Nintendo Switch*...).\n\n7️⃣ Fermez la fenêtre pour sauvegarder automatiquement le réglage, puis reconnectez votre Zen à la console."}]},{"type":"carte","image":"/media/guide/depannage-1.webp","titre":"","contenu":""}],"icone":"outil","sommaire":false},{"id":"vibrations-adt","titre":"Vibrations & ADT","blocs":[{"type":"texte","style":"h1","contenu":"🚨⚠️ Activez vos vibrations et les gâchettes adaptatives ⚠️🚨"},{"type":"modbody","mod":"vibrations-adt"}],"icone":"attention","couleurOnglet":"#ffb547","commun":true,"rubriqueScript":"Bien démarrer"},{"id":"navigation-oled","titre":"Navigation & Menus OLED","blocs":[{"type":"texte","style":"p","contenu":"Tous les scripts partagent la même architecture de menu et le même système de navigation. Ce guide vous explique comment utiliser le menu OLED, comprendre la structure des menus, leur contenu et régler vos paramètres."},{"type":"texte","style":"h1","contenu":"📖 Guide Général & Fonctionnement de mes Scripts"},{"type":"depliant","titre":"📂 Structure du Menu Principal (Main Menu)","blocs":[{"type":"texte","style":"h3","contenu":"Les fonctionnalités sont réparties en 6 catégories distinctes :"},{"type":"liste","contenu":"🔀 **Profile MODs** : Réglages spécifiques à un profil ou à une arme (*AntiRecoil*, *Fire MODs*, *Shot MODs*...). Ces valeurs changent automatiquement quand vous basculez de profil.\n🌍 **Global MODs** : Options actives en permanence, quel que soit le profil sélectionné (*AutoRun*, *Turbo Buttons*, *Easy Roll*...).\n🔘 **MODs Activator** : Conditions nécessaires pour déclencher certains *Profile MODs* (ex. : uniquement en visée *ADS Only*, en tir *FIRE*, ou *ADS + FIRE*).\n🎮 **Controller** : Configuration matérielle de votre manette (Sensibilité, Zone morte / *Stick Drift*, Inversion axe Y, Disposition des boutons).\n⚙️ **Misc** : Options système du script (*Auto Save* pour sauvegarder les réglages, *VM Speed* pour la vitesse d'exécution).\n⏱️ **Quick Toggle** : Attributions de raccourcis rapides à la manette pour activer ou désactiver un MOD à la volée."}]},{"type":"depliant","titre":"🕹️ Menus additionnels spécifiques selon le jeu","blocs":[{"type":"liste","contenu":"🎣 **Activity (RDR2 / GTA VI)** : Modules d'automatisation dédiés aux mini-jeux et métiers en jeu (*Pêche automatique*, *5 Finger Fillet*, *Cooking*, *Bench Press* et d'autres à venir...) pour réussir à tous les coups sans effort physique.\n🔄 **Switch Profile (FPS / TPS)** : Système de bascule rapide permettant de changer de profil d'arme ou de configuration (Profil 1, Profil 2, Primaire, Secondaire...) à la volée en plein jeu, afin d'adapter instantanément vos MODs et votre *AntiRecoil* à l'arme que vous tenez en main.\n🌐 **Online Cheat (GTA V)** : Manipulations rapides pour exécuter instantanément des actions clés du menu Interaction en GTA Online (consommer des en-cas, équiper une armure lourde, faire réapparaître votre véhicule personnel...).\n👤 **Story Cheat (GTA V)** : Exécution automatique des combinaisons de codes de triche officiels réservés au mode Histoire de GTA V (santé/armure au max, invincibilité, armes, effets d'environnement...).\n🚀 **Quick Cheat (GTA V)** : Attribution de combinaisons de touches rapides sur votre manette (sur le principe des *Quick Toggles*) pour déclencher vos *Cheats* GTA V favoris en plein jeu à la volée."}]},{"type":"texte","style":"h1","contenu":"🧭 Guide de navigation et d'édition"},{"type":"depliant","titre":"🛑 Sécurité : Le KillSwitch (Coupe-circuit du script)","blocs":[{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention cruciale :** Peu importe que vous soyez dans un jeu de course ou dans un jeu de tir, le script exécute aveuglément les instructions qu'il contient. C'est pourquoi il est **absolument crucial de désactiver votre script** lorsque vous naviguez dans les menus du jeu ou de la console. Un MOD s'exécutant lors d'un simple appui sur un bouton, il serait dommage de supprimer un équipement rare dans votre inventaire ou d'acheter/vendre par erreur parce qu'un MOD s'est déclenché au mauvais moment !"},{"type":"texte","style":"h2","contenu":"💡 Comment activer ou désactiver le KillSwitch (mute total des fonctionnalités du script) :"},{"type":"texte","style":"p","contenu":"Appuyez sur l'une de ces combinaisons / touches à tout moment :"},{"type":"liste","contenu":"- Soit sur le bouton {OPTIONS / MENUS} de votre manette.\n- Soit sur le bouton {PS / XBOX}.\n- Soit en maintenant {L2 / LT} + {SHARE / VIEW}."}]},{"type":"depliant","titre":"🚪 Entrer et sortir du menu","blocs":[{"type":"liste","contenu":"🚪 **Ouvrir le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS}.\n🎯 **Accès rapide AntiRecoil :** Maintenez {L2 / LT} et appuyez sur {PS / XBOX} pour ouvrir directement les valeurs AntiRecoil du profil actif *(si le MOD AntiRecoil est activé sur ce profil)*.\n🚪 **Fermer le menu :** Maintenez {L2 / LT} et appuyez sur {OPTIONS / MENUS} *(si l'Auto Save est activé dans Misc, vos réglages sont enregistrés automatiquement)*.\n💾 **Sauvegarder manuellement et quitter :** Appuyez sur {PS / XBOX}."}]},{"type":"depliant","titre":"🎛️ Naviguer et modifier les valeurs des MODs","blocs":[{"type":"texte","style":"h1","contenu":"🧭 Naviguer dans les menus"},{"type":"carte","couleur":"jaune","contenu":"💡 **Aide visuelle sur l'écran OLED :**\n\n🧭 **Flèches directionnelles :** *Des flèches apparaissent autour du paramètre pour vous indiquer directement dans quel sens appuyer sur la manette.*"},{"type":"texte","style":"p","contenu":"📜 **Ligne d'instructions :** *Un texte défile sur la dernière ligne de l'écran pour vous guider pas à pas si vous hésitez sur la touche à utiliser.*"},{"type":"liste","contenu":"↕️ **Parcourir une liste ou un menu déroulant :** Utilisez {D-Pad HAUT} ou {BAS} *(menu principal, liste de Cheats, choix de réglages...)*.\n📥**Entrer dans un menu / sous-menu :** Appuyez sur {CROSS / A}.\n🔄**Changer de profil à modifier :** Appuyez sur {CROSS / A} *(uniquement dans le menu Profile MODs)*.\n↔️**Se déplacer entre les sous-menus / MODs :** Utilisez {D-Pad GAUCHE} ou {DROITE}.\n⚙️**Activer/Désactiver un MOD ou changer son type :** Utilisez {D-Pad HAUT} ou {BAS}.\n↩️**Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."},{"type":"texte","style":"h1","contenu":"🔢 Modifier les valeurs numériques *(ex. : force de l'AntiRecoil, cadence du Rapid Fire)*"},{"type":"texte","style":"p","contenu":"1️⃣ **Activez le MOD :** Si le MOD est sur *OFF*, vous n'avez pas accès à ses valeurs ajustables.\n\n2️⃣ **Entrer dans le menu d'édition :** Appuyez sur {CROSS / A}.\n\n3️⃣ **Sélectionner le paramètre :** Utilisez {D-Pad GAUCHE} ou {DROITE} pour naviguer entre les différentes options.\n\n4️⃣ **Modifier la valeur :** Maintenez {R1 / RB} puis appuyez sur {D-Pad DROITE} (ou {HAUT}) pour augmenter, ou {D-Pad GAUCHE} (ou {BAS}) pour diminuer.\n\n5️⃣ **Revenir au menu précédent :** Appuyez sur {CIRCLE / B}."}]}],"icone":"menu","commun":true,"sommaire":true},{"id":"bibliotheque","titre":"Vue d'ensemble","titrePage":"Bibliothèque des MODs","icone":"dossier","rubrique":"Bibliothèque des MODs","blocs":[{"type":"texte","style":"p","contenu":"⬇️ Retrouvez la description et des conseils de réglages pour chaque MOD, menu par menu ⬇️"},{"type":"texte","style":"h1","contenu":"Menus & MODs communs à tous les scripts"},{"type":"cartelien","titre":"Profile MODs","contenu":"AntiRecoil, Fire MODs, AIM Assist, Shot MODs... : les réglages propres à chaque profil / arme.","destination":"page:profile-mods","image":"/media/bibliotheque/profile-mods.webp"},{"type":"cartelien","titre":"Global MODs","contenu":"AutoRun, Turbo boutons, Easy Roll... : les options actives en permanence.","destination":"page:global-mods","image":"/media/bibliotheque/global-mods.webp"},{"type":"cartelien","titre":"MODs Activator","contenu":"Les conditions de déclenchement de vos MODs (ADS, FIRE, ADS + FIRE...).","destination":"page:mods-activator","image":"/media/bibliotheque/mods-activator.webp"},{"type":"cartelien","titre":"Controller","contenu":"Sensibilité des sticks, Stick Drift, Hair Trigger, vibrations, layout des boutons.","destination":"page:controller","image":"/media/bibliotheque/controller.webp"},{"type":"cartelien","titre":"Misc","contenu":"Auto Save et VM Speed : les options système du script.","destination":"page:misc","image":"/media/bibliotheque/misc.webp"},{"type":"cartelien","titre":"Quick Toggle","contenu":"Activer / désactiver vos MODs préférés à la volée avec un raccourci.","destination":"page:quick-toggle","image":"/media/bibliotheque/quick-toggle.webp"},{"type":"texte","style":"h1","contenu":"Menus & MODs spécifiques à un script"},{"type":"cartelien","titre":"Activity — script GTA VI","contenu":"Pêche automatique, Bench Press... : les automatisations des activités de GTA VI.","destination":"page:gta6-activity","image":"/media/bibliotheque/gta6-activity.webp"},{"type":"cartelien","titre":"Switch Profile — script FPS / TPS","contenu":"Changer de profil d'arme à la volée en plein jeu.","destination":"page:fps-tps-switch-profile","image":"/media/bibliotheque/switch-profile.webp"},{"type":"cartelien","titre":"Activity — script RDR2","contenu":"Pêche, 5 Finger Fillet, Cooking : les automatisations de Red Dead Redemption II.","destination":"page:rdr2-activity","image":"/media/bibliotheque/rdr2-activity.webp"},{"type":"cartelien","titre":"Online Cheat — script GTA V","contenu":"Les actions du menu Interaction de GTA Online en un clic.","destination":"page:gta5-online-cheat","image":"/media/bibliotheque/gta5-online-cheat.webp"},{"type":"cartelien","titre":"Story Cheat — script GTA V","contenu":"Les codes de triche officiels du mode Histoire, exécutés automatiquement.","destination":"page:gta5-story-cheat","image":"/media/bibliotheque/gta5-story-cheat.webp"},{"type":"cartelien","titre":"Quick Cheat — script GTA V","contenu":"Vos cheats favoris sur un raccourci manette.","destination":"page:gta5-quick-cheat","image":"/media/bibliotheque/gta5-quick-cheat.webp"}],"descriptionPartage":"Description et conseils de réglages de tous les MODs des scripts noozbar, menu par menu."},{"id":"profile-mods","titre":"Profile MODs","blocs":[{"type":"texte","style":"h1","contenu":"🔀 Le menu Profile MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Profile MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce menu regroupe l'ensemble des réglages spécifiques à une arme ou à un profil de jeu (**AntiRecoil, Fire MODs, Shot MODs...**). Ces valeurs s'appliquent automatiquement dès que vous changez de profil en jeu.\n\nChaque profil dispose de ses propres réglages indépendants."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention (Script FPS / TPS) :**\n\nTant que vous n'avez pas configuré le menu [**Switch Profile**](/fps-tps/switch-profile/), vous n'aurez accès qu'à un seul profil dans ce menu (et en jeu)."},{"type":"mods","ids":["antirecoil","fire-mods","aim-assist","ls-assist","aim-abuse","shot-mods","auto-ads-fire","auto-scope","headshot-assist","deadeye","hold-breath"]}],"icone":"cible","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/profile-mods.webp","rubriqueScript":"Bibliothèque des MODs"},{"id":"global-mods","titre":"Global MODs","blocs":[{"type":"texte","style":"h1","contenu":"🌍 Le menu Global MODs"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que les \"Global MODs\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des MODs ou des options actives en permanence, quel que soit le profil sélectionné (AutoRun, Turbo Buttons ...)."},{"type":"mods","ids":["autorun","turbo-boutons","quick-item-gta6","auto-unscope","auto-reload","skid-stop","easy-eagle-eye","horse-galop","cinema-galop","quick-item-rdr2","autostop-deadeye","autospin","online-boss","easy-roll","turbo-rpg","klaxon-hold","quick-care"]}],"icone":"globe","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/global-mods.webp"},{"id":"mods-activator","titre":"MODs Activator","blocs":[{"type":"texte","style":"h1","contenu":"🔘 Le menu MODs Activator"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le \"MODs Activator\" ?"},{"type":"texte","style":"p","contenu":"Le **MODs Activator** est le moteur de conditions du script. Il vous permet de définir avec une précision totale **quand** et **comment** vos MODs doivent s'activer en jeu.\n\nAu lieu d'imposer un comportement rigide, ce système écoute vos touches en temps réel et ne déclenche vos modules (**AntiRecoil, Fire MODs, AIM Abuse, Shot MODs**) que si la condition exacte que vous avez choisie est remplie."},{"type":"texte","style":"h2","contenu":"⚙️ Principe de fonctionnement"},{"type":"texte","style":"p","contenu":"Chaque joueur a sa propre façon de jouer, et chaque arme a ses contraintes. En associant un mode de déclenchement spécifique à chaque MOD, vous évitez les activations involontaires (par exemple : faire un *Drop Shot* alors que vous vouliez simplement ajuster votre visée de loin).\n\nLe système analyse la combinaison de vos touches principales : la gâchette de visée (**ADS**) et la gâchette de tir (**FIRE**)."},{"type":"texte","style":"h1","contenu":"🎯 Les 5 modes de déclenchement disponibles"},{"type":"mods","ids":["act-ads-fire","act-ads","act-fire","act-ads-only","act-fire-only"]},{"type":"texte","style":"h2","contenu":"🛠️ Quels MODs utilisent le MODs Activator ?"},{"type":"texte","style":"p","contenu":"Vous pouvez attribuer un mode d'activation indépendant pour chacun des modules suivants dans votre profil :"},{"type":"liste","contenu":"🎯 **AntiRecoil** *(Standard, Progressive, Rumble, Advanced)*\n🔫 **Fire MODs** *(RapidFire Dynamic, RPM, RPS, BurstFire)*\n🎯 **AIM Abuse**\n🤸 **Shot MODs** *(Drop Shot, Jump Shot, Strafe Shot)*"},{"type":"carte","couleur":"jaune","contenu":"💡 **En résumé :**\n\nLe MODs Activator offre un contrôle sur-mesure de votre manette. Il s'adapte à votre gameplay au lieu de vous forcer à adapter votre façon de jouer au script."}],"icone":"eclair","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/mods-activator.webp"},{"id":"controller","titre":"Controller","blocs":[{"type":"texte","style":"h1","contenu":"🎮 Le menu Controller"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Controller\" ?"},{"type":"texte","style":"p","contenu":"C'est tout ce qui a un rapport avec la configuration matérielle de votre manette (Sensibilité, Zone morte / Stick Drift, Inversion axe Y, Disposition des boutons)."},{"type":"mods","ids":["rs-ls-sensitivity","stick-drift","hair-trigger","rumble-adt","buttons-layout","inverted-axes"]}],"icone":"manette","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/controller.webp"},{"id":"misc","titre":"Misc","blocs":[{"type":"texte","style":"h1","contenu":"⚙️ Le menu Misc"},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que le menu \"Misc\" ?"},{"type":"texte","style":"p","contenu":"Ce sont des options système du script (**Auto Save** pour sauvegarder les réglages, **VM Speed** pour la vitesse d'exécution)."},{"type":"mods","ids":["auto-save","vm-speed"]}],"icone":"engrenage","commun":true,"sommaire":false,"imagePartage":"/media/bibliotheque/misc.webp"},{"id":"quick-toggle","titre":"Quick Toggle","blocs":[{"type":"texte","style":"h1","contenu":"⏱️ Le menu Quick Toggle (Raccourcis en Jeu)"},{"type":"modbody","mod":"quick-toggle"}],"icone":"chrono","commun":true,"sommaire":true,"imagePartage":"/media/bibliotheque/quick-toggle.webp"},{"id":"gta6-activity","titre":"GTA VI - Activity","blocs":[{"type":"texte","style":"h1","contenu":"🌴 Le menu Activity - GTA VI"},{"type":"modbody","mod":"activity-gta6-intro"},{"type":"mods","ids":["activity-gta6-fishing","activity-gta6-bench-press"]}],"icone":"palmier","sommaire":false,"imagePartage":"/media/bibliotheque/gta6-activity.webp"},{"id":"fps-tps-switch-profile","titre":"FPS/TPS - Switch Profile","blocs":[{"type":"texte","style":"h1","contenu":"🔄 Le menu Switch Profile (Script FPS / TPS)"},{"type":"modbody","mod":"switch-profile"}],"icone":"actualiser","sommaire":false,"imagePartage":"/media/bibliotheque/switch-profile.webp"},{"id":"rdr2-activity","titre":"RDR2 - Activity","blocs":[{"type":"texte","style":"h1","contenu":"🤠 Le menu Activity - RDR 2"},{"type":"modbody","mod":"activity-rdr2-intro"},{"type":"mods","ids":["activity-rdr2-fishing","five-finger-fillet","cooking"]}],"icone":"cowboy","sommaire":false,"imagePartage":"/media/bibliotheque/rdr2-activity.webp"},{"id":"gta5-online-cheat","titre":"GTA V - Online Cheat","blocs":[{"type":"texte","style":"h1","contenu":"🌐 Le menu Online Cheat (GTA Online)"},{"type":"modbody","mod":"online-cheat"}],"icone":"globe","sommaire":false,"imagePartage":"/media/bibliotheque/gta5-online-cheat.webp"},{"id":"gta5-story-cheat","titre":"GTA V - Story Cheat","blocs":[{"type":"texte","style":"h1","contenu":"👤 Le menu Story Cheat (GTA V Mode Histoire)"},{"type":"modbody","mod":"story-cheat"}],"icone":"livre","sommaire":false,"imagePartage":"/media/bibliotheque/gta5-story-cheat.webp"},{"id":"gta5-quick-cheat","titre":"GTA V - Quick Cheat","blocs":[{"type":"texte","style":"h1","contenu":"🚀 Le menu Quick Cheat (Raccourcis en jeu)"},{"type":"modbody","mod":"quick-cheat"}],"icone":"fusee","sommaire":false,"imagePartage":"/media/bibliotheque/gta5-quick-cheat.webp"},{"id":"comprendre","titre":"Comprendre les Scripts & MODs","blocs":[{"type":"depliant","titre":"💡 Comprendre les MODs & Idées reçues (Anti-cheat, Aimbot...)","blocs":[{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce qu'un MOD ?"},{"type":"texte","style":"p","contenu":"Un **MOD** (ou *Macro On Demand*) est une séquence programmable de commandes (appuis sur des boutons, déplacements des sticks analogiques, etc.) envoyée par la manette à la console.\n\nCes macros sont automatisées à l'aide de scripts Cronus Zen, mais ce principe est aussi utilisé par de nombreux autres équipements de gaming :"},{"type":"liste","contenu":"**Manettes pro :** elles offrent des fonctionnalités de macros grâce à leurs palettes configurables ou leurs réglages de sensibilité.\n**Claviers gamer :** ils disposent souvent de touches dédiées à des macros entièrement programmables via leur logiciel."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **À retenir :** L'utilisation de MODs n'est donc pas réservée aux utilisateurs de Cronus : c'est une pratique très courante dans le jeu vidéo en général."},{"type":"texte","style":"h2","contenu":"❓ Qu'est-ce que je peux faire (et ne pas faire) avec des MODs ?"},{"type":"texte","style":"p","contenu":"Le Cronus Zen est au cœur de beaucoup de fausses croyances. En réalité, ses capacités restent strictement matérielles et émulées :"},{"type":"texte","style":"h2","contenu":"✅ Ce qu'un Cronus Zen peut faire :"},{"type":"liste","contenu":"Automatiser des appuis sur des boutons et des mouvements de stick analogique.\nPermettre de créer et de personnaliser vos macros.\nUtiliser plusieurs macros dans un seul et même script.\nOptimiser l'aide à la visée déjà présente nativement dans le jeu."},{"type":"texte","style":"h2","contenu":"❌ Ce qu'un Cronus Zen ne peut PAS faire :"},{"type":"liste","contenu":"Accéder aux fichiers du jeu ni les modifier.\nDéclencher un Aimbot (lock automatique).\nViser automatiquement la tête (*Headshot auto*).\nVous rendre invincible ou vous faire traverser les murs.\nAugmenter vos dégâts.\nVoir ou analyser ce qu'il se passe sur votre écran."},{"type":"texte","style":"h2","contenu":"💡 Choses importantes à savoir"},{"type":"liste","contenu":"**Respect des limites du jeu :** Les restrictions imposées par les développeurs ne peuvent pas être dépassées. Si le jeu intègre une limite de cadence de tir ou un temps de recharge, un script ne pourra jamais la franchir."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention aux fausses démonstrations en vidéo :** Ne vous fiez pas aux vidéos promettant un tracking parfait, des headshot instantanés ou des armes lasers. Si un vendeur vous garantit ce genre de fonctionnalités, c'est qu'il utilise en réalité un **vrai cheat sur PC** pour tourner sa vidéo, et non un Cronus Zen. Un script évalue uniquement les signaux de votre manette : il ne peut en aucun cas lire ou modifier la mémoire du jeu."},{"type":"texte","style":"h2","contenu":"📋 En résumé"},{"type":"texte","style":"p","contenu":"Une macro ne modifie pas le jeu : elle change simplement la manière dont vos commandes sont transmises. Le jeu continue de recevoir des pressions de boutons et des mouvements de manette ordinaires. Un script ne peut ni accéder au code du jeu, ni contourner ses mécanismes, ni exécuter des actions non prévues par les développeurs.\n\nTout ce qu'il fait, c'est **automatiser ce que vous pourriez déjà faire vous-même**, en répétant les commandes avec un timing et une régularité parfaits. Si une action est réalisable manuellement, un script Cronus Zen peut la reproduire. Il n'ajoute pas de nouvelles capacités, il supprime simplement la pénibilité de l'exécution manuelle."}]},{"type":"depliant","titre":"⚙️ Comment fonctionnent les Scripts","blocs":[{"type":"texte","style":"h2","contenu":"❓Comment fonctionnent réellement les scripts ?"},{"type":"texte","style":"p","contenu":"Les scripts sont faits pour fonctionner avec votre manette de jeu, pas avec un jeu en particulier.\n\nBien que la plupart des scripts prétendent « être fait pour tel jeu », ils s'adaptent en réalité uniquement aux commandes envoyées par votre manette. Un script dédié à un jeu spécifique est simplement un ensemble de MODs configurés pour correspondre aux mécaniques et aux touches de ce jeu. Le script répond aux ordres transmis par vos actions sur la manette (les *inputs*) et non à ce qu'il se passe directement à l'écran.\n\nCes MODs ne font que modifier le signal que la manette envoie à la console (les *outputs*) :"},{"type":"liste","contenu":"**Exemple :** Si vous utilisez le MOD *RapidFire*, le script détecte que vous maintenez la touche de tir enfoncée et envoie en boucle à la console l'ordre de presser ce bouton."},{"type":"carte","couleur":"orange","contenu":"⚠️ Peu importe que vous soyez dans un jeu de course ou dans un jeu de tir : le script exécute aveuglément les instructions qu'il contient. C'est pourquoi il est crucial de **désactiver votre script lorsque vous naviguez dans les menus** du jeu ou de la console. Un MOD s'exécutant lors d'un simple appui sur un bouton, il serait dommage de supprimer un équipement rare dans votre inventaire parce qu'un MOD s'est déclenché par erreur !"}]},{"type":"depliant","titre":"🏆 Quel est le meilleur script ?","blocs":[{"type":"texte","style":"p","contenu":"**Il n'existe pas de « meilleur » script.** Dans le fond, ils accomplissent tous des tâches très similaires. La seule chose qui fait réellement la différence, **ce sont vos réglages**.\n\nVous pouvez regarder des démonstrations impressionnantes sur YouTube ou TikTok, appliquer exactement les mêmes paramètres et trouver le résultat médiocre. De même, copier les configurations partagées sur Discord ne donne souvent que des résultats moyens. Même si un réglage vous semble bon, il existe presque toujours une marge d'amélioration. Les réglages partagés sont d'excellents points de départ, mais ils ne seront jamais parfaitement optimisés pour votre profil."},{"type":"texte","style":"h3","contenu":"Plusieurs facteurs uniques influencent l'efficacité de vos réglages :"},{"type":"liste","contenu":"**Votre matériel :** la zone morte de vos sticks, le niveau de *stick drift*, le temps de réponse de la manette.\n**Votre réseau :** la latence (ping) et la stabilité de votre connexion internet.\n**Vos paramètres en jeu :** la sensibilité globale, les zones mortes configurées *in-game*.\n**Votre style de jeu :** votre façon de manier les sticks analogiques, vos préférences de combat (au corps à corps, à distance, etc.)."},{"type":"texte","style":"p","contenu":"📋 **En résumé**, de bons réglages sont des réglages que vous avez peaufinés vous-même, en prenant le temps nécessaire pour faire vos propres tests."}]},{"type":"depliant","titre":"🎮 Compatibilité & Matériel requis","blocs":[{"type":"texte","style":"h2","contenu":"❓Sur quelles plateformes les scripts fonctionnent-ils ?"},{"type":"texte","style":"p","contenu":"Les scripts sont compatibles avec **PS5, PS4, Xbox Series X|S, Xbox One et PC**."},{"type":"texte","style":"h2","contenu":"📋 Quel est le matériel et la configuration requise ?"},{"type":"liste","contenu":"**Boîtier :** Un **Cronus ZEN** à jour.\n**Ordinateur :** Un PC (Windows) ou un Mac. La gestion se fait directement en ligne sur le site web [**Zen Studio Live**](https://zenstudio.collectivemindsstore.com/) (il n'y a plus de logiciel à installer).\n**Navigateur :** Vous devez utiliser un navigateur basé sur **Chromium** (comme Microsoft Edge, Google Chrome ou Brave)."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Attention :** Désactivez impérativement la traduction automatique de la page sur [Zen Studio Live](https://zenstudio.collectivemindsstore.com/), sous peine d'avoir une interface illisible !"}]}],"icone":"ampoule","sommaire":false},{"id":"lexique","titre":"Lexique","blocs":[{"type":"depliant","titre":"🎯 MODs de Visée & Tir","blocs":[{"type":"liste","contenu":"**AntiRecoil :** Compense automatiquement le recul de l'arme vers le bas ou les côtés lors du tir.\n**Fire MODs :** Modifie le rythme de tir (Rapid Fire, Burst Fire, Dynamic Rapid Fire...).\n**AIM Assist / LS Assist :** Exploite l'aide à la visée native du jeu en appliquant de micro-mouvements discrets sur le stick de visée et/ou sur le stick de déplacement pour renforcer le magnétisme de votre viseur. (⚠️ **n'est PAS un aimbot)**\n**AIM Abuse :** Presse et relâche rapidement la touche de visée (**ADS**) pour forcer le jeu à recentrer constamment le viseur sur l'ennemi. *(Plutôt utilisé sur les jeux dont la visée est automatique comme GTA V ou RDR2)*\n**HeadShot Assist :** Décale automatiquement le viseur vers la tête de la cible lors de la prise de visée. (⚠️ **n'est PAS un aimbot)**"}]},{"type":"depliant
