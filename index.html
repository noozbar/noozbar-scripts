* *or* **Rumble High** *before increasing the Rumble Power value.*"},{"type":"texte","style":"h2","contenu":"4. ⚡ Advanced (Step-based system)"},{"type":"texte","style":"p","contenu":"The most advanced mode, offering surgical precision thanks to a split into **500 ms** slices (0.5 second)."},{"type":"liste","contenu":"Up to **10 Steps** for the Vertical axis and **10 Steps** for the Horizontal axis (i.e. up to 5 seconds of continuous fire).\n**Totally independent** settings for the Vertical and Horizontal axes (e.g. 4 Steps on Y and 6 Steps on X).\n**Smooth interpolation:** The script does not jump violently from one value to another; it calculates a continuous progression between each step (rising or falling, with positive or negative values)."},{"type":"texte","style":"h3","contenu":"📝 Example of how it works (Vertical on 4 Steps / 2000 ms):"},{"type":"texte","style":"p","contenu":"**Configuration:** *Step 1 = 20 | Step 2 = 25 | Step 3 = 30 | Step 4 = 35*"},{"type":"liste","contenu":"**From 0 to 500 ms:** The **Step 1 (20)** value is applied directly from the start of the shot.\n**From 500 to 1000 ms:** The value gradually rises from **20 (Step 1)** until it reaches **25 (Step 2)**.\n**From 1000 to 1500 ms:** The value gradually rises from **25 (Step 2)** until it reaches **30 (Step 3)**.\n**From 1500 to 2000 ms:** The value gradually rises from **30 (Step 3)** until it reaches **35 (Step 4)**, then stays at 35 as long as you hold the trigger."}]},{"id":"fire-mods","titre":"🔫 Fire MODs","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a Fire MOD?"},{"type":"texte","style":"p","contenu":"A **Fire MOD** is a firing mode that interacts directly with your fire button when you aim or shoot:"},{"type":"liste","contenu":"**Semi-automatic weapon (pistol, single-shot rifle...):** *RapidFire* simulates ultra-fast presses to turn it into an automatic (full-auto) weapon.\n**Automatic weapon (assault rifle, submachine gun...):** *BurstFire* converts continuous fire into controlled bursts to keep recoil under control."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Cycle Humanizer"},{"type":"texte","style":"p","contenu":"Overly regular fire rates are the main cause of detection by anti-cheats. To protect you:"},{"type":"liste","contenu":"**Limit of 360 RPM / 6 RPS:** The maximum rate is capped at **360 rounds per minute (RPM)** or **6 rounds per second (RPS)** in the script. Spamming the fire button at a higher frequency is almost humanly impossible. This threshold keeps your shots credible and lets you **fly under the anti-cheats' radar**.\n**Cycle Humanizer:** This system constantly varies the hold and release durations of the button (*Hold/Release*), while strictly respecting the configured overall rate. Your shots keep a smooth, natural rhythm, removing the frozen or automated feel of classic macros."},{"type":"texte","style":"p","contenu":"**⚙️ The trigger system:** [**MODs Activator**](page:mods-activator)\n\nFire MODs rely on the [**MODs Activator**](page:mods-activator) system. These are the conditions required to trigger your MOD. You choose exactly *how* and *when* your MOD should activate"},{"type":"texte","style":"h2","contenu":"🎯 Which Fire MOD should you choose?"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Important rule:** You can only enable **one Fire MOD per profile**."},{"type":"liste","contenu":"**On a semi-automatic weapon:** Use one of the **RapidFire** modes to fire continuously.\n**On an automatic weapon:** **Never** use RapidFire (it would slow down your natural fire rate). Use the **BurstFire** mode instead."},{"type":"texte","style":"h1","contenu":"🛠️ The different Fire MOD types available"},{"type":"texte","style":"h2","contenu":"1. ⚡ RapidFire Dynamic"},{"type":"texte","style":"p","contenu":"A smart mode that adapts the fire rate to the pressure applied on the trigger:"},{"type":"liste","contenu":"The harder you press the fire trigger, the higher the rate.\nUseful for adjusting the firing speed on the fly without opening the menu."},{"type":"texte","style":"h2","contenu":"2. ⏱️ RPM RapidFire"},{"type":"texte","style":"p","contenu":"Mode based on the number of **Rounds Per Minute (RPM / BPM)**."},{"type":"liste","contenu":"If the game displays the weapon's stats in RPM or BPM, choose this mode.\nJust enter the game's exact value in the **Rate of Fire** parameter."},{"type":"texte","style":"h2","contenu":"3. 🎯 RPS RapidFire (or RapidFire)"},{"type":"texte","style":"p","contenu":"Mode based on the number of **Rounds Per Second (RPS / BPS)**."},{"type":"liste","contenu":"This is the most common format in Cronus scripts.\nIf the game displays the weapon's stats in RPS or BPS, choose this mode and set the **Rate of Fire** value to the desired number of shots per second."},{"type":"texte","style":"h2","contenu":"4. 💥 BurstFire (Burst shooting)"},{"type":"texte","style":"p","contenu":"This mode is reserved for **automatic weapons** to force fire in small bursts and keep maximum accuracy at long range.\n\nParameters to adjust:"},{"type":"liste","contenu":"**Hold Time:** How long the script holds the fire button down (burst duration).\n**Release Time:** Duration of the forced pause between two bursts."}]},{"id":"aim-assist","titre":"🎯 AIM Assist","blocs":[{"type":"texte","style":"h2","contenu":"⚠️ Before you start: demystifying AIM Assist"},{"type":"texte","style":"p","contenu":"It is essential to dispel the misconceptions: **AIM Assist is in no way a PC Aimbot.**"},{"type":"liste","contenu":"It will **not** automatically stick to the target.\nIt will **not** follow the enemy on its own without any action on your part."},{"type":"texte","style":"p","contenu":"As its name suggests, it is an **assist** that exploits and amplifies the native aim assist already built into the game by the developers. The MOD's effectiveness therefore depends directly on how generous the aim assist is in the title you are playing."},{"type":"texte","style":"h2","contenu":"🧠 How does a game's native aim assist work?"},{"type":"texte","style":"p","contenu":"Imagine a **virtual bubble** surrounding each enemy. When the center of your screen passes over this bubble, the game activates its internal aim assist under two very specific conditions:"},{"type":"liste","contenu":"**Character movement (Left Stick):** The game detects a movement of your character greater than the dead zone (*DeadZone*). This is the principle exploited by **LS Assist**.\n**Camera / aim movement (Right Stick):** The game detects a movement of your camera or crosshair greater than the dead zone. This is the principle exploited by **AIM Assist**."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Golden rule:** If both of your analog sticks are perfectly still, the game's aim assist **does not activate**, even if an enemy crosses the center of your screen."},{"type":"texte","style":"p","contenu":"The **AIM Assist** and **LS Assist** MODs continuously simulate imperceptible micro-movements on your sticks to force the game to keep its aim assist active 100% of the time, letting you stay more easily \"magnetized\" inside the enemy's bubble."},{"type":"texte","style":"h1","contenu":"🎯 1. AIM Assist (Right Stick — Aiming)"},{"type":"texte","style":"p","contenu":"**AIM Assist** applies geometric micro-trajectories around the aiming stick."},{"type":"texte","style":"h2","contenu":"📐 The geometric shapes (*Shapes*)"},{"type":"texte","style":"p","contenu":"Every player and every game reacts differently to trajectories. You can choose from 13 available geometric shapes (listed here in the exact order of the OLED menu):"},{"type":"liste","contenu":"**Horiz. Flaire:** Moves back and forth horizontally along a line\n**Circular:** Draws a regular, smooth circle\n**Fig. 8:** Forms a sideways 8 with two vertical loops\n**Flat Infinity:** Draws a flattened infinity symbol (∞), wider than tall\n**Round Infinity:** Draws a balanced infinity symbol (∞), almost as tall as wide\n**Diamond:** Follows a square or diamond path (→ ↓ ← ↑)\n**Tall Oval:** Forms a vertical oval (taller than wide)\n**Wide Oval:** Forms a horizontal oval (wider than tall)\n**Spiral:** Draws a spiral circle whose radius increases then decreases\n**Helix:** Spins a small square/diamond around the center\n**Helix 2:** Same as Helix, but with a slower progression between directions\n**Flower:** Draws a multi-petal rosette\n**Vert. Flaire:** Moves back and forth vertically along a line","numerote":true},{"type":"texte","style":"h2","contenu":"⚙️ The adjustment parameters (*Radius & Step*)"},{"type":"texte","style":"p","contenu":"Each configuration relies on two key variables:"},{"type":"liste","contenu":"**Radius (Rad) — The Radius:** Defines the amplitude or size of the drawn shape.\n> *(⚠️ The Radius value must absolutely be greater than the DeadZone configured in-game to be taken into account).*\n**Step (Rate / Speed):** Defines the angle increment at each script cycle.\n- *Step of 1:* The angle increases by 1° per cycle (very slow, gradual drawing).\n- *Step of 15:* The angle increases by 15° per cycle (fast sweep)."},{"type":"texte","style":"h2","contenu":"🎛️ Tuning profiles by situation"},{"type":"texte","style":"p","contenu":"You can adjust the **Radius** and the **Step** independently for 4 combat scenarios:"},{"type":"liste","contenu":"**ADS Only:** Applies when you aim without shooting.\n**FIRE Only:** Applies when you hip-fire without aiming.\n**ADS + FIRE:** Applies when you aim and shoot at the same time.\n**NEUTRAL:** Applies when you are neither aiming nor shooting (keeps the aim assist permanently active while you move)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Targeted deactivation:** If you don't want assist in a given situation (for example hip-fire), simply set the **Radius** and the **Step** of that mode to **0**."}]},{"id":"ls-assist","titre":"🏃 LS Assist","blocs":[{"type":"texte","style":"p","contenu":"**LS Assist** applies the same micro-movement principle as **AIM Assist**, but on the movement stick (left). It forces the game to detect your character as constantly moving, which triggers the game's native aim assist."},{"type":"texte","style":"h2","contenu":"📐 Shapes available for LS Assist"},{"type":"texte","style":"p","contenu":"LS Assist offers a restricted selection of 5 shapes optimized for movement:"},{"type":"liste","contenu":"**Horiz. Flaire** *(The most popular and probably the most effective in duels)*\n**Circular**\n**Fig. 8**\n**Flat Infinity**\n**Round Infinity**","numerote":true},{"type":"texte","style":"h2","contenu":"🛑 LS Assist automatic cut-off"},{"type":"texte","style":"p","contenu":"Unlike the right stick, when you actually move your left stick to make your character walk or run, **LS Assist stops automatically** as soon as your movement value exceeds the configured *Radius*. It resumes instantly as soon as the stick returns to the center."},{"type":"texte","style":"h2","contenu":"🛠️ Dynamic behavior & Troubleshooting"},{"type":"liste","contenu":"**Dynamic centering:** The geometric shape is drawn in real time around your stick's current position. If you push your right stick 30% to the right to follow a target, the circle or oval will be drawn around that 30% point.\n**Reduction at the limit:** The closer you bring the stick to the physical edge of the controller (at the limit), the more the MOD's amplitude automatically shrinks so as not to alter your maximum turning speed.\n**Screen shaking?** If your camera shakes too much on screen, your **Radius** is too high. Gradually reduce the Radius value until you get a smooth sweep that is invisible to the naked eye."},{"type":"cartelien","affichage":"pleine","titre":"🎥 Video demo: AIM Assist & LS Assist in action","destination":"https://www.youtube.com/watch?v=xVhBBF5Q1VU","contenu":"Open the dedicated page →","icone":"link"}]},{"id":"aim-abuse","titre":"🎯 AIM Abuse","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is AIM Abuse and how does it work?"},{"type":"texte","style":"p","contenu":"**AIM Abuse** is a MOD designed to take advantage of the **Auto-Snap** mechanic (automatic aim lock) found in some games.\n\nIn these games, pressing the aim button when you are close to an enemy instantly \"sticks\" the crosshair to the target. The AIM Abuse MOD automates this action: it releases and re-presses the aim trigger at a very fast frequency. This continuous refresh re-triggers Auto-Snap in a loop, forcing your crosshair to stay locked on the opponent, even if they are moving."},{"type":"carte","couleur":"blue","contenu":"ℹ️ **Game compatibility:**\n\nAuto-Snap is increasingly rare in modern competitive FPS games, but it remains extremely powerful in games like *GTA V*, *Red Dead Redemption 2*, or certain shooters with a strengthened aim assist."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Timing Humanizer"},{"type":"texte","style":"p","contenu":"Aim spamming executed at strictly identical intervals (down to the millisecond) is an easily spotted mechanical signature.\n\nTo protect your account, this MOD is equipped with a **Timing Humanizer**. It generates random micro-variations in the hold and release durations. The sequence thus keeps a lively, natural rhythm, while still maintaining an ultra-efficient Auto-Snap refresh.\n\n**⚙️ The trigger system:** [**MODs Activator**](page:mods-activator)\n\nAIM Abuse relies on the [**MODs Activator**](page:mods-activator) system. These are the conditions required to trigger your MOD. You choose exactly *how* and *when* your MOD should activate"},{"type":"texte","style":"h2","contenu":"🛠️ The MOD settings"},{"type":"texte","style":"p","contenu":"To get a smooth lock without the image jumping on screen, the MOD relies on two parameters to adjust:"},{"type":"liste","contenu":"**Hold Time:** Defines how long the aim button stays held down.\n**Release Time:** Defines how long the aim is briefly released before being re-engaged."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tuning tip:**\n\nThe trick is to set the **Release Time** as finely as possible:"},{"type":"liste","contenu":"It must be **short enough** so that your weapon does not visually leave aim mode (no annoying zoom in/out).\nIt must be **long enough** for the game to register the release and re-trigger Auto-Snap on the next press.\n> *The Hold Time can stay longer without affecting effectiveness.*"}]},{"id":"shot-mods","titre":"🤸 Shot MODs","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a Shot MOD?"},{"type":"texte","style":"p","contenu":"A **Shot MOD** is an automatic action module that triggers a tactical movement (crouching, jumping or sidestepping) when you aim or shoot. Its main purpose is to disrupt the opponent's aim during your gunfights by making you much harder to hit, while keeping you focused on your shot.\n\nEach profile has its own independently configurable Shot MOD."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Timing Humanizer"},{"type":"texte","style":"p","contenu":"Repetitive movements executed down to the millisecond immediately betray automated behavior.\n\n**Strafe Shot** includes a **Timing Humanizer**. It applies slight random variations to the duration of the sidesteps. Your movements thus keep a lively, natural rhythm, avoiding a robotic look so as to fly under the radar of anti-cheat systems.\n\n**⚙️ The trigger system:** [**MODs Activator**](page:mods-activator)\n\nShot MODs rely on the [**MODs Activator**](page:mods-activator) system. These are the conditions required to trigger your MOD. You choose exactly *how* and *when* your MOD should activate"},{"type":"texte","style":"h1","contenu":"🛠️ The different Shot MODs available"},{"type":"texte","style":"h2","contenu":"1. ⬇️ Drop Shot"},{"type":"texte","style":"p","contenu":"Automatically makes your character crouch when the MOD activates."},{"type":"liste","contenu":"Suddenly reduces your hit area (*hitbox*), forcing the opponent to shoot above you."},{"type":"texte","style":"h2","contenu":"2. ⬆️ Jump Shot"},{"type":"texte","style":"p","contenu":"Automatically makes your character jump as soon as the shot is engaged."},{"type":"liste","contenu":"Particularly formidable in close combat to destabilize the enemy's aim and avoid headshots."},{"type":"texte","style":"h2","contenu":"3. ↔️ Strafe Shot"},{"type":"texte","style":"p","contenu":"Makes your character take alternating steps from left to right while shooting to make you elusive.\n\nParameters to adjust:"},{"type":"liste","contenu":"**Strafe Time:** Defines the duration (in milliseconds) of each lateral movement before the direction changes.\n**Counter Value:** Automatic crosshair compensation. When your character moves to the right, the script slightly shifts the aiming stick to the left (and vice versa). This cancels out the impact of your own movements to keep your crosshair perfectly locked on the target."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tip for Counter Value:**\n\nThe ideal compensation value varies with distance. The farther the opponent, the lower the aim correction should be so as not to overshoot the target."}]},{"id":"auto-ads-fire","titre":"🔀 Auto ADS & Auto FIRE","blocs":[{"type":"texte","style":"h2","contenu":"❓ What are Auto ADS and Auto FIRE?"},{"type":"texte","style":"p","contenu":"These two MODs simplify your actions in combat by removing the need to press two triggers at the same time. They reduce your reaction time by combining aiming and shooting in a single press."},{"type":"texte","style":"h1","contenu":"🛠️ How the 2 modes work"},{"type":"texte","style":"h2","contenu":"1. 🎯 Auto ADS *(Automatic aiming)*"},{"type":"texte","style":"p","contenu":"Automatically presses the aim button (**ADS**) as soon as you press the fire button (**FIRE**)."},{"type":"liste","contenu":"**Use:** Ideal if you tend to hip-fire in a panic during an unexpected duel. The script makes sure you immediately go into shouldered aim to gain accuracy without having to press the aim trigger."},{"type":"texte","style":"h2","contenu":"2. 💥 Auto FIRE *(Automatic shooting)*"},{"type":"texte","style":"p","contenu":"Automatically presses the fire button (**FIRE**) as soon as you press the aim button (**ADS**)."},{"type":"liste","contenu":"**Use:** Lets you open fire to the millisecond as soon as you shoulder your weapon, eliminating any hesitation time."}]},{"id":"auto-scope","titre":"🔭 Auto Scope & Quick Scope","blocs":[{"type":"texte","style":"h2","contenu":"❓ What are Auto Scope and Quick Scope?"},{"type":"texte","style":"p","contenu":"These two MODs are specially developed for precision rifles (Sniper). They automate quick aiming and shooting techniques to give you a decisive advantage in your long-range or short-range duels."},{"type":"texte","style":"h1","contenu":"🛠️ The 2 MODs available depending on the script used"},{"type":"texte","style":"h2","contenu":"1. 🎯 Auto Scope"},{"type":"texte","style":"p","contenu":"Automatically switches your weapon to zoom/scope mode as soon as you press the aim button (**ADS**).\n\nParameter to adjust:"},{"type":"liste","contenu":"**Scope Delay:** Defines the waiting time (in milliseconds) before the zoom triggers automatically after pressing *Aim*."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tuning tip:**\n\nDo not set too short a delay! The game must absolutely have time to start the aiming animation before the script sends the zoom command. If the delay is too fast, the action will be ignored by the game."},{"type":"texte","style":"h2","contenu":"2. ⚡ Quick Scope"},{"type":"texte","style":"p","contenu":"Triggers an automatic shot a short moment after pressing the aim button (**ADS**), perfectly reproducing the famous *QuickScope* technique.\n\nParameter to adjust:"},{"type":"liste","contenu":"**QuickScope Delay:** Defines the pause time (in milliseconds) between the start of the aim and the moment the shot is fired."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tuning tip:**\n\nFinding the right balance is essential:"},{"type":"liste","contenu":"**Too fast:** The bullet will leave before the game considers you in aiming position, turning your shot into an inaccurate hip-fire.\n**Too slow:** You lose the whole point of the QuickScope and give the opponent time to retaliate."}]},{"id":"headshot-assist","titre":"💀 HeadShot Assist","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is HeadShot Assist and how does it work?"},{"type":"texte","style":"p","contenu":"**HeadShot Assist** is an aim assist module that applies a slight upward vertical impulse when you shoulder your weapon, in order to align your reticle with the opponent's head more quickly."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Important clarification (it is NOT an aimbot):**\n\nThis MOD is in no way a *PC cheat* or an automatic *lock* that spots the enemy's head on screen. It is simply a mechanical assist that pulls your crosshair upward."},{"type":"carte","couleur":"jaune","contenu":"💡 *Note: If your reticle is already positioned at head height when the MOD activates, the impulse will push your crosshair above the head!*"},{"type":"texte","style":"h1","contenu":"⚡ The 3 trigger modes"},{"type":"texte","style":"h2","contenu":"1. 🚀 Instant"},{"type":"texte","style":"p","contenu":"HeadShot Assist triggers immediately as soon as you press the aim button (**ADS**)."},{"type":"texte","style":"h2","contenu":"2. 🎯 Press Sensitive"},{"type":"texte","style":"p","contenu":"HeadShot Assist only activates when you press the aim trigger all the way down (to the limit)."},{"type":"liste","contenu":"**Use:** Lets you aim normally by pressing the trigger lightly, and only triggers the nudge toward the head when you press the trigger to the maximum."},{"type":"texte","style":"h2","contenu":"3. 🔄 Release Sensitive"},{"type":"texte","style":"p","contenu":"Lets you trigger the assist at any time while aiming. You can hold the aim as long as you like without activating anything. When you need HeadShot Assist, **slightly release the trigger** (without letting go completely) then press it all the way down again."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Note:** If you fully release the trigger (to 0%), the gesture is canceled and the assist will not trigger. This avoids unintended triggers when you come out of aim."},{"type":"texte","style":"h2","contenu":"📏 Distance presets & Custom Mode"},{"type":"texte","style":"p","contenu":"The enemy's distance directly affects the amount of movement required: the farther the opponent, the lighter the impulse must be so as not to overshoot the target.\n\nThe MOD offers **3 optimized presets** and a **Custom** mode:"},{"type":"liste","contenu":"🥊 **Close:** Tuned for close-quarters combat (roughly **5 to 15 meters**).\n🎯 **Medium:** Tuned for mid-range engagements (roughly **15 to 30 meters**).\n🔭 **Long:** Tuned for distant targets (**30 meters and beyond**).\n🛠️ **Custom:** Lets you manually set a precise numerical value to adapt the impulse to your playstyle or usual sensitivity."}]},{"id":"deadeye","titre":"👁️ DeadEye","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the DeadEye MOD?"},{"type":"texte","style":"p","contenu":"The **DeadEye MOD** is specially designed to automate and optimize the use of the *DeadEye* mechanic (slow motion / precision aim) found in *Red Dead Redemption 2.*\n\nIt automatically triggers the skill at the right moment without needing a manual stick press, so you don't waste time or waste your skill gauge."},{"type":"texte","style":"h1","contenu":"🛠️ The 2 variants available"},{"type":"texte","style":"h2","contenu":"1. 🎯 Auto DeadEye"},{"type":"texte","style":"p","contenu":"Automatically triggers *DeadEye* as soon as you press the aim trigger (**ADS**)."},{"type":"liste","contenu":"**Use:** Ideal if you want to enter slow-motion/precision mode immediately every time you aim."},{"type":"texte","style":"h2","contenu":"2. ⚡ DeadShot"},{"type":"texte","style":"p","contenu":"Triggers *DeadEye* in an ultra-stealthy way, at the precise instant you press the fire trigger (**FIRE**)."},{"type":"carte","couleur":"jaune","contenu":"💡 **What makes DeadShot special (Surgical precision):**\n\nIn *Red Dead Redemption 2*, triggering *DeadEye* just before the shot instantly shrinks the spread circle (the impact reticle) to the center point."},{"type":"texte","style":"p","contenu":"By activating the skill only when the trigger is pressed, **DeadShot** forces 100% accuracy at the exact moment of impact, while preserving your *DeadEye* gauge the rest of the time."}],"scripts":["rdr2"]},{"id":"hold-breath","titre":"🫁 Hold Breath","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Hold Breath MOD and how does it work?"},{"type":"texte","style":"p","contenu":"**Hold Breath** is a MOD designed for precision rifles (snipers) and weapons equipped with magnifying scopes. It automatically holds your character's breath as soon as you aim, completely eliminating the weapon's natural sway for a perfectly steady shot."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation & Triggering:"},{"type":"liste","contenu":"**Automatic trigger:** As soon as you hold the aim button, the script automatically presses the breath-holding button ( {L3 / LS}).\n**Improved ergonomics:** You no longer need to physically press down the left stick ( {L3 / LS}) while aiming, which avoids shifting your reticle at the crucial moment."}],"scripts":["fps-tps"]},{"id":"autorun","titre":"🏃 AutoRun","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is AutoRun and how does it work?"},{"type":"texte","style":"p","contenu":"**AutoRun** is a movement automation module. It takes care of repeatedly pressing or holding the run button for you, saving your fingers from fatigue and your analog sticks from wear."},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual indicator:** When AutoRun is active in-game, the Cronus Zen's LEDs blink rapidly to show that it is working."},{"type":"texte","style":"h1","contenu":"⚙️ The 2 AutoRun modes depending on your games"},{"type":"texte","style":"p","contenu":"AutoRun's behavior is directly adapted to the engine of the game in question. The script automatically uses the version matching the title you are playing."},{"type":"texte","style":"h2","contenu":"1. 🎯 FPS / TPS Mode (including GTA VI)"},{"type":"texte","style":"p","contenu":"Smooth operation based solely on the tilt of the analog stick:"},{"type":"liste","contenu":"**Activation:** Push the movement stick forward to **90% or more** to automatically trigger running.\n**Stop:** Release the stick below the **20%** threshold to stop AutoRun and return to normal walking."},{"type":"texte","style":"h2","contenu":"2. 🤠 GTA V / Red Dead Redemption 2 Mode"},{"type":"texte","style":"p","contenu":"Since Rockstar games require holding or tapping the run button ( {CROSS / A}), this mode handles a **smart 3-state cycle** as soon as the stick is pushed **past 85%**:"},{"type":"liste","contenu":"**🚶 Walk:** Starting state when you push the stick forward.\n**🏃 Run:** Press {CROSS / A} **once**: The script automatically holds the button to make you run.\n**⚡ Sprint:** Press {CROSS / A} **a second time**: The script simulates ultra-fast presses (spam) to make you sprint at maximum speed.\n**🚶 Back to walking:** Press {CROSS / A} **a third time** (or release the stick **below 80%**) to reset the cycle."},{"type":"carte","couleur":"jaune","contenu":"💡 **Automatic aim handling:** If you go into aim (**ADS**) during a sprint, the script automatically downgrades movement from *Sprint* to *Run*, since the game engine does not allow sprinting while shouldering your weapon."}]},{"id":"turbo-boutons","titre":"⚡ Turbo Buttons","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a Turbo Button and how does it work?"},{"type":"texte","style":"p","contenu":"A **Turbo Button** automates ultra-fast presses (*spam*) on a specific button for you. Just hold the button and the script simulates continuous hammering, ideal for quickly picking up loot, reloading back-to-back or confirming repetitive actions without tiring your fingers."},{"type":"carte","couleur":"jaune","contenu":"💡 **Visual indicator:** While the Turbo Button is running, the Cronus Zen's LEDs blink rapidly."},{"type":"texte","style":"h3","contenu":"🛡️ Safety: Timing Humanizer"},{"type":"texte","style":"p","contenu":"Perfectly regular button spamming is a mechanical signature that is easy for anti-cheats to spot.\n\nThis MOD includes a **Timing Humanizer** that generates random micro-variations in the execution rate. This avoids frozen, repeated intervals down to the millisecond, giving button spamming a lively, 100% natural rhythm."},{"type":"texte","style":"h2","contenu":"🎮 The 3 Turbo Buttons available"},{"type":"texte","style":"p","contenu":"You can independently **enable** up to 3 Turbo Buttons in the script menu:"},{"type":"etiquettes","contenu":"Turbo CROSS / A | Turbo SQUARE / X | Turbo CIRCLE / B"},{"type":"carte","couleur":"orange","contenu":"⚠️ **Usage note:** You can leave all 3 Turbo Buttons enabled in the menu, but you cannot **run them simultaneously** in-game (the script cannot spam {CROSS / A} and {CIRCLE / B} at the same time)."},{"type":"texte","style":"h2","contenu":"🛠️ How to run the Turbo in-game?"},{"type":"texte","style":"p","contenu":"In-game activation was designed so as not to interfere with your usual single presses:\n\n**Execution:** Perform a **double-tap** (two quick presses) on the desired button and **keep it held down** on the second press.\n\n**Stop:** Simply release the button to instantly stop the Turbo."}]},{"id":"quick-item-gta6","titre":"💊 Quick Item (GTA VI)","blocs":[{"type":"texte","style":"p","contenu":"In development ..."}]},{"id":"auto-unscope","titre":"🔭 Auto Unscope (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto Unscope and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Redemption 2*, when you go into scope aim (by pressing **Aim** then **Down arrow / D-Pad Down**), the game keeps this zoom mode in memory. If you do not manually exit the scope, your character will automatically return to sniper aim the next time you press the trigger, which can disorient you in close combat.\n\n**Auto Unscope** removes this constraint: it automates exiting the scope as soon as you release the aim trigger (**ADS**)."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Classic aim:** You press **ADS** to aim normally.\n**Switching to scope:** You press **Down arrow / D-Pad Down** to zoom into the scope.\n**Automatic reset:** As soon as you release the **ADS** trigger, the script immediately sends the exit-scope command. The next time you aim, you consistently return to classic shouldered aim."},{"type":"carte","couleur":"jaune","contenu":"💡 **Advantage:** No more having to remember whether your weapon stayed in scope mode or not, you always regain control in standard aim."}]},{"id":"auto-reload","titre":"🔄 Auto Reload (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto Reload and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Redemption 2*, after firing with a repeater or a lever/bolt-action rifle, you must make an additional press of the fire button to manually re-cock the hammer or chamber the next cartridge.\n\n**Auto Reload** takes care of this mechanical re-cocking for you immediately after each shot."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Re-cocking automation:** As soon as you release the fire button (**FIRE**), the script simulates an ultra-fast pulse on the trigger to cock the mechanism.\n**Gain in responsiveness:** Your weapon is immediately loaded and ready for the next shot, sparing you the dead time of a forgotten manual press in the middle of a duel."}]},{"id":"skid-stop","titre":"🐎 Skid Stop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Skid Stop and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Redemption 2*, when your horse reaches **Bonding Level 3 or higher**, you unlock the ability to perform a quick stopping skid _(Skid Stop)_. By default, this maneuver requires holding {R1 / RB} and {CROSS / A} simultaneously.\n\nThe **Skid Stop** MOD simplifies this technical move by assigning it to a simple single-button command."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Trigger:** Perform a double-tap (two quick presses) on the {R1 / RB} button while on horseback.\n**Script action:** The script automatically holds the required button combination ( {R1 / RB} + {CROSS / A}) to make your mount skid and stop dead."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Prerequisite:** This move absolutely requires your horse to be at **bonding level 3 or 4** in the game."}]},{"id":"easy-eagle-eye","titre":"👁️ Easy Eagle Eye (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Easy Eagle Eye and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Redemption 2*, the Eagle Eye skill lets you analyze your surroundings and follow animal tracks. By default, activating it requires pressing both analog sticks at the same time ( {L3 / LS} + {R3 / RS}).\n\n**Easy Eagle Eye** simplifies this by assigning it to a single press so you no longer miss the combination mid-game."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Activation:** A simple click on the right stick ( {R3 / RS}) is enough to instantly launch Eagle Eye."}]},{"id":"horse-galop","titre":"🐎 Horse Gallop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Horse Gallop and how does it work?"},{"type":"texte","style":"p","contenu":"**Horse Gallop** automates the hammering of the gallop button while managing your mount's fatigue level.\n\nIn addition to chaining the presses for you, the script **regularly calms your horse** during the ride. This refills its stamina bar as you travel."},{"type":"carte","couleur":"jaune","contenu":"💡 **Optimal efficiency:** Stamina regeneration by calming the horse is particularly powerful from **bonding level 3**."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Prerequisite:** Check that \"**Horse**\" is displayed on your Zen's OLED screen.\n**Activation:** Perform a **double-tap** on {CROSS / A} and keep the button held on the second press.\n**Visual indicator:** During the automatic gallop, the Cronus Zen's LEDs blink rapidly.\n**Stop:** Simply release {CROSS / A} to stop the gallop."}]},{"id":"cinema-galop","titre":"🎥 Cinema Gallop (RDR2)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Cinema Gallop and how does it work?"},{"type":"texte","style":"p","contenu":"**Cinema Gallop** combines the comfort of *Red Dead Redemption 2*'s cinematic camera with automatic movement handling. It lets you trot or gallop your horse over long distances without touching the controller, while continuously restoring its stamina by calming it."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"texte","style":"p","contenu":"1️⃣ **Entering Cinema Gallop mode:**\nOnce in the saddle (OLED screen showing \"**Horse**\" and white LEDs), hold the Cinema mode button down for **1.5 seconds**."},{"type":"texte","style":"h3","contenu":"2️⃣ Select the pace:"},{"type":"liste","contenu":"- Press {CROSS / A} **once**: Your horse goes into a Trot while being calmed regularly.\n- Press {CROSS / A} **a second time**: Your horse goes into a Gallop (the Zen's LEDs blink rapidly) while its stamina is managed.\n- Press {CROSS / A} **a third time**: The automatic movement stops."},{"type":"texte","style":"p","contenu":"3️⃣ **Exiting Cinema mode:**\nPress the **Cinema** button again or the aim trigger (**ADS**)."}]},{"id":"quick-item-rdr2","titre":"💊 Quick Item (RDR2 / RD Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Quick Item and how does it work?"},{"type":"texte","style":"p","contenu":"**Quick Item** lets you instantly use a health, stamina or DeadEye remedy by performing a simple button combination, without having to manually navigate the item wheel in the middle of combat."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Mandatory prerequisite:** Before using this MOD in-game, open your item wheel (*Items*) and manually select the specific tonic/remedy you want to assign to each slot."},{"type":"texte","style":"h2","contenu":"🎮 Button mapping in the wheel"},{"type":"texte","style":"p","contenu":"The script targets three precise positions in the item wheel:"},{"type":"liste","contenu":"{SQUARE / X} (Top-Left): **Health** remedy.\n{TRIANGLE / Y} (Top): **Stamina** remedy.\n{CIRCLE / B} (Top-Right): **DeadEye** remedy."},{"type":"texte","style":"p","contenu":"**To trigger a remedy:** Hold {L1 / LB} then perform a **double-tap** on the button corresponding to the desired remedy."},{"type":"texte","style":"h1","contenu":"🛠️ The 2 Quick Item modes available"},{"type":"texte","style":"h2","contenu":"1. 🧪 Standard Mode"},{"type":"texte","style":"p","contenu":"Consumes the selected tonic from your inventory as normal."},{"type":"texte","style":"h2","contenu":"2. ⚡ Glitch Mode *(Infinite use in Story mode only)*"},{"type":"texte","style":"p","contenu":"Lets you consume the tonic's effect **without it being removed from your inventory**, allowing you to reuse the same tonic dozens of times."},{"type":"liste","contenu":"**Mandatory condition:** You **must be holding a long weapon in hand** (rifle, carbine, shotgun). The glitch does not work with a revolver, a pistol or a bow.\n**Automatic movement:** At the exact moment of drinking the potion, the script makes your character jump. This interruption of the animation applies the healing bonus while canceling the item's deduction from your inventory."},{"type":"carte","couleur":"blue","contenu":"ℹ️ Note: Very rarely, the game validates the consumption and removes the tonic despite the jump, but the system remains functional in the vast majority of cases."}]},{"id":"autostop-deadeye","titre":"🛑 AutoStop DeadEye (RD Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is AutoStop DeadEye and how does it work?"},{"type":"texte","style":"p","contenu":"In *Red Dead Online*, unlike story mode, the *DeadEye* skill stays active even when you release the aim trigger, which needlessly drains your skill gauge if you forget to turn it off manually.\n\n**AutoStop DeadEye** solves this problem by automatically turning off *DeadEye* as soon as you release the aim button (**ADS**)."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Gauge saving:** As soon as you release the **ADS** trigger, the script sends the pulse to instantly deactivate *DeadEye*.\n**Comfort:** You preserve your skill gauge for the next duels with no additional input."}]},{"id":"autospin","titre":"🔄 AutoSpin (RD Online - GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is AutoSpin and how does it work?"},{"type":"texte","style":"p","contenu":"**AutoSpin** is a simple utility that forces your character to spin continuously in circles.\n\nIt is mainly used to avoid being automatically disconnected for inactivity (*AFK kick*) when you need to step away for a few minutes without leaving the session."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Activation:** Hold down the right stick {R3 / RS}.\n**Script action:** The character spins continuously until you release the stick."}]},{"id":"online-boss","titre":"🏢 Online Boss (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Online Boss?"},{"type":"texte","style":"p","contenu":"In *GTA Online*, when you become a **C.E.O** or a **MC President** (Motorcycle Club President), your character's interaction menu is organized slightly differently.\n\nEnabling these modes in the script tells the interface where you are in the game, allowing the Cronus Zen to run the exact button sequences in the interactive menus to command your vehicles or abilities in the blink of an eye."},{"type":"texte","style":"h1","contenu":"🛠️ The 2 statuses available"},{"type":"texte","style":"h2","contenu":"1. 💼 C.E.O (SecuroServ)"},{"type":"texte","style":"p","contenu":"Enable this option in the script when you register as a C.E.O in-game."},{"type":"liste","contenu":"**What is it for?** The script adapts the SecuroServ interaction menu shortcuts.\n**Quick action examples:** Call your Buzzard helicopter in a single click or instantly activate **Ghost Organization** to disappear from other players' radar."},{"type":"texte","style":"h2","contenu":"2. 🏍️ MC President (Motorcycle Club)"},{"type":"texte","style":"p","contenu":"Enable this option in the script when you are the President of your motorcycle club."},{"type":"liste","contenu":"**What is it for?** The script adapts the sequences for the motorcycle club menu.\n**Quick action examples:** Instantly spawn your favorite bike (like the Oppressor) at your feet in one click."},{"type":"carte","couleur":"jaune","contenu":"💡 Link with [**Quick Cheats**](/gta5/quick-cheat/):\n\nOnce your status is set, these actions can be linked to the [**Quick Cheats**](/gta5/quick-cheat/) engine to be executed with a simple button combination in the middle of a duel."}]},{"id":"easy-roll","titre":"🔄 Easy Roll (GTA V / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Easy Roll and how does it work?"},{"type":"texte","style":"p","contenu":"In close combat in *GTA*, performing a roll is the key technique for breaking the opponent's auto-aim. By default, it requires shouldering your weapon then pressing the jump button.\n\n**Easy Roll** simplifies the move: a single click on {L3 / LS} immediately triggers the roll, letting you react to the millisecond under enemy fire."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Condition:** Equip a weapon in hand.\n**Activation:** Simply press {L3 / LS}. The script handles the aim transition and the jump to perform the roll instantly."}]},{"id":"turbo-rpg","titre":"💣 Turbo RPG (GTA V / GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Turbo RPG and how does it work?"},{"type":"texte","style":"p","contenu":"**Turbo RPG** lets you chain standard rocket launcher shots at a much higher rate than the game allows.\n\nThe script exploits the *Weapon Switch* mechanic (quick weapon change): as soon as the rocket leaves, the script switches to another weapon then back to the rocket launcher in a fraction of a second, thereby canceling the long manual reload animation."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"texte","style":"p","contenu":"1️⃣ Equip your standard rocket launcher (*RPG*).\n\n2️⃣ **Hold the fire button (FIRE)**.\n\n3️⃣ The script loops the firing and animation-cancel sequence to continuously pound the area."}]},{"id":"klaxon-hold","titre":"🎵 Klaxon Hold (GTA V - GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Klaxon Hold and how does it work?"},{"type":"texte","style":"p","contenu":"**Klaxon Hold** takes care of continuously holding the horn button for you when you are driving a vehicle.\n\nIt is the ideal module for playing your musical or custom horns in a loop in *GTA Online* without having to keep your thumb pressed on the controller during your trips."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation"},{"type":"liste","contenu":"**Activation:** In a car, hold the horn button while driving to start the automatic loop.\n**Stop:** Press the horn button again or simply get out of your vehicle to cut the sound."}]},{"id":"quick-care","titre":"🩹 Quick Care (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Quick Care and how does it work?"},{"type":"texte","style":"p","contenu":"**Quick Care** is an exclusive MOD designed for **GTA Online**. It lets you restore your armor or your health extremely quickly in the middle of combat, without having to go through the interaction menu."},{"type":"texte","style":"h2","contenu":"⚙️ In-game operation:"},{"type":"texte","style":"p","contenu":"1️⃣ **Hold the aim button**.\n\n2️⃣ Healing & Armor:"},{"type":"liste","contenu":"- **LEFT arrow (D-Pad LEFT):** Quick press to restore your **Armor**.\n- **RIGHT arrow (D-Pad RIGHT):** Quick press to consume a **Snack** (Health)."}]},{"id":"rs-ls-sensitivity","titre":"🕹️ RS & LS Sensitivity (Stick Sensitivity)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is RS & LS Sensitivity?"},{"type":"texte","style":"p","contenu":"The **RS Sensitivity** *(Right Stick - Crosshair)* and **LS Sensitivity** *(Left Stick - Movement)* MODs let you override your game's native sensitivity handling to completely change the response of your analog sticks.\n\nYou can apply completely different sensitivity settings depending on the combat situation:"},{"type":"liste","contenu":"**ADS Only:** When you aim without shooting.\n**FIRE Only:** When you hip-fire without aiming.\n**ADS + FIRE:** When you aim and shoot at the same time.\n**HIP (General):** When you move without aiming or shooting."},{"type":"texte","style":"h1","contenu":"🛠️ The 3 sensitivity types available:"},{"type":"texte","style":"h2","contenu":"1. 📈 Ballistic (Ballistic curves)"},{"type":"texte","style":"p","contenu":"This mode changes your stick's physical response according to a custom response curve (like the profiles available on the *Xbox Elite Series 2* controller or advanced PC software)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Live preview:** In the script menu, you can view the curve's shape on the OLED screen by holding the\n{CROSS / A} button during selection."},{"type":"liste","contenu":"📏 **Linear (Default):** Standard 1:1 curve. The value sent to the game is strictly equal to the stick's physical tilt.\n⏳ **Delay:** Offers great precision at the center of the stick for micro-adjustments (softened sensitivity on slight movements), then accelerates sharply when you push the stick toward the limit.\n⚡ **Aggressive:** Responds instantly from the first millimeters of tilt. Ideal for ultra-responsive gameplay or reflex shots (*flicks*).\n🚀 **Instant:** Reaches maximum sensitivity almost immediately after crossing the dead zone, removing the stick's ramp-up time.\n🌊 **Smooth:** Filters and smooths the parasitic micro-tremors of your hands to offer ultra-fluid, jerk-free target tracking."},{"type":"texte","style":"h2","contenu":"2. 🎚️ Custom Sens (Fixed multiplier)"},{"type":"texte","style":"p","contenu":"Lets you directly amplify your stick's sensitivity by applying a power multiplier to it."},{"type":"liste","contenu":"**Adjustment range:** From 0 to 327, with 100 being the normal default value (which corresponds to a multiplier from **x0** to **x3.27**).\n**Concrete example:** If you set the value to 200 (x2 multiplier), pushing your stick to only **50%** of its physical travel will send a value of **100%** (maximum limit) to your game."},{"type":"texte","style":"h2","contenu":"3. ⚡ Dynamic Sens (Evolving dynamic sensitivity)"},{"type":"texte","style":"p","contenu":"The most refined and most powerful mode in the script. It varies your sensitivity in real time according to the speed and amplitude of your stick's movement.\n\nThe 5 variables to configure:"},{"type":"liste","contenu":"🏁 **Initial Sens:** The starting sensitivity applied when the stick starts moving.\n🎯 **Limit Point (Acceleration threshold):** The stick tilt angle from which the sensitivity starts climbing toward its maximum. Below this threshold, the sensitivity stays at *Initial Sens*.\n🔄 **Restart Point (Reset threshold):** If the stick tilt drops back below this value, the script immediately resets the sensitivity to *Initial Sens*.\n🔝 **Max Sens:** The maximum ceiling sensitivity that the dynamic system can reach.\n📈 **Increase Rate:** The speed (rate) at which the sensitivity increases once the *Limit Point* is crossed."}]},{"id":"stick-drift","titre":"🕹️ Stick Drift Correction","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Stick Drift correction?"},{"type":"texte","style":"p","contenu":"Over time and with wear, the potentiometers of analog sticks wear out and cause *Stick Drift* (the cursor or camera moves on its own on screen without you touching the controller).\n\nThis MOD includes a high-precision diagnostic and calibration tool directly on your Cronus Zen's OLED screen. It neutralizes your sticks' drift at rest without needing to increase the dead zone (*DeadZone*) in the game settings, thereby preserving all your aim's responsiveness."},{"type":"texte","style":"h2","contenu":"⚙️ How to diagnose and fix the Drift?"},{"type":"texte","style":"p","contenu":"1️⃣ **Activation:** Enable the option in the script menu, then press {CROSS / A} to enter the dedicated calibration menu."},{"type":"texte","style":"h3","contenu":"2️⃣ Real-time measurement:"},{"type":"liste","contenu":"- 📊 **Real Time RS:** Displays your right stick's raw physical drift in real time on the OLED screen.\n- 📊 **Real Time LS:** Displays your left stick's raw physical drift in real time."},{"type":"texte","style":"h3","contenu":"3️⃣ Applying the correction:"},{"type":"liste","contenu":"- 🎯 **RS Correction:** Adjust the compensation value for the right stick until the drift is completely neutralized.\n- 🎯 **LS Correction:** Adjust the compensation value for the left stick until the drift is completely neutralized."}]},{"id":"hair-trigger","titre":"⚡ Hair Trigger","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Hair Trigger and how does it work?"},{"type":"texte","style":"p","contenu":"By default, analog triggers ( {L2 / LT} or {R2 / RT}) have a long travel: you have to press them down several millimeters before the game detects the aim or shoot action.\n\nThe **Hair Trigger** MOD turns your analog triggers into ultra-responsive digital clicks (like a \"wall trigger\" or *clicky trigger*). As soon as a micro-press of 1% is detected on the trigger, the script instantly sends a maximum 100% press signal to the game."},{"type":"texte","style":"h2","contenu":"🎛️ Assignment options"},{"type":"texte","style":"p","contenu":"You can choose to apply the Hair Trigger to:"},{"type":"liste","contenu":"**🎯 Aim only** ( {L2 / LT}): To shoulder your weapon to the millisecond.\n**💥 Fire only** ( {R2 / RT}): For an instant shot.\n**⚡ Both triggers** ( {L2 / LT} + {R2 / RT}): For maximum responsiveness on all your combat actions."}]},{"id":"rumble-adt","titre":"📳 Rumble & ADT (Vibrations & Adaptive Triggers)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Rumble & ADT MOD?"},{"type":"texte","style":"p","contenu":"This MOD lets you precisely control the activation of your controller's vibration motors (*Rumble*) and adaptive triggers (*ADT* - Adaptive Triggers) (notably on the PS5 DualSense), directly from the script menu without having to change your game menus."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Mandatory prerequisite:** For this MOD to work properly, the **vibration** and **adaptive trigger** options must **absolutely be enabled in the game settings** and set to **\"Standard\" in your console's general settings**."},{"type":"texte","style":"h2","contenu":"🛠️ The 4 configuration modes to choose from"},{"type":"liste","contenu":"🚫 **Disabled:** Disables both the controller's vibrations and the adaptive triggers mechanism.\n✅ **Enabled:** Leaves the vibrations and adaptive triggers fully active.\n📳 **Rumble Only:** Disables the adaptive triggers (*ADT*) while keeping the controller's vibrations.\n⚙️ **ADT Only:** Disables the controller's vibrations while keeping the adaptive triggers (*ADT*) working."}]},{"id":"buttons-layout","titre":"🎮 Button Layout (Button Remapping)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Button Layout and how does it work?"},{"type":"texte","style":"p","contenu":"**Button Layout** lets you completely reconfigure and customize your controller's button layout directly from the script, without touching your game or console options."},{"type":"texte","style":"h2","contenu":"🛠️ The 2 configuration modes"},{"type":"liste","contenu":"🎮 **Standard:** Keeps the default layout of your controller's buttons in-game.\n🛠️ **Custom:** Enables full customization of your buttons according to your preferences."},{"type":"carte","couleur":"rouge","contenu":"🛑 **Absolute rule of Custom mode:** **1 action = 1 button.** You cannot assign the same button to two different actions."},{"type":"texte","style":"p","contenu":"🔒 **Error-proof safety:** If a conflict or a duplicate button is detected during your setup, the Zen will display an error message on the OLED screen and lock the menu exit until the configuration is valid."},{"type":"texte","style":"h2","contenu":"⚠️ Important instructions and warnings"},{"type":"carte","couleur":"rouge","contenu":"🛑 **Game settings:** You must **absolutely leave the button configuration on \"Standard\" in the game's internal options**. Also do not change the button assignment in your console's accessibility settings (PS5/Xbox)."},{"type":"carte","couleur":"jaune","contenu":"💡 **Navigating the game menus:** Remember to **disable the script when navigating the game menus** (inventory, map, shop). Otherwise, your Custom button reassignments will also apply to navigation, which can make moving around the menus confusing."}]},{"id":"inverted-axes","titre":"🕹️ Inverted RY / LY (Y-Axis Inversion)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Inverted RY / LY MOD?"},{"type":"texte","style":"p","contenu":"The **Inverted RY / LY** MOD lets you invert the response of the vertical axis (Y axis) of your analog sticks directly from the script:"},{"type":"liste","contenu":"🎯 **Inverted RY (Right Stick Y):** Inverts the right stick's vertical axis (camera / aim). Pushing the stick up makes the camera go down, and pulling it down makes it go up.\n🏃 **Inverted LY (Left Stick Y):** Inverts the left stick's vertical axis (character movement)."},{"type":"texte","style":"p","contenu":"This module lets you apply inverted aiming or movement seamlessly, while keeping the perfect execution of all the script's other MODs (like AntiRecoil or AIM Assist)."},{"type":"texte","style":"h2","contenu":"⚠️ Important setup instruction"},{"type":"carte","couleur":"rouge","contenu":"🛑 **Game and console settings:** In your game's internal options as well as in your console's accessibility settings, you must **absolutely leave the Y axis on the \"Standard\" (non-inverted) configuration**."},{"type":"texte","style":"p","contenu":"The script handles inverting the Y axis in software. If you also enable inversion in the game, the two settings will cancel each other out."},{"type":"carte","couleur":"jaune","contenu":"💡 **Navigating the game menus:** Remember to **disable the script when navigating the game menus**."}],"titreBrut":true},{"id":"auto-save","titre":"💾 Auto Save (Saving Your Settings)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Auto Save and how does it work?"},{"type":"texte","style":"p","contenu":"**Auto Save** is an option that automatically saves all of your changes to the Cronus Zen's internal memory as soon as you exit the script menus."},{"type":"texte","style":"h1","contenu":"🛠️ Automatic saving vs Manual saving"},{"type":"texte","style":"h2","contenu":"1. 🔄 Manual mode (Recommended for testing)"},{"type":"texte","style":"p","contenu":"When Auto Save is disabled, your settings stay temporary until you explicitly confirm them. To save manually, enter the menu and press the {PS / XBOX} button."},{"type":"liste","contenu":"**The strategic advantage:** You can change a parameter (a *Radius*, a sensitivity or a timing), exit the menu to test it directly in-game, and if the result doesn't suit you, just switch *slot* on your Cronus Zen then come back to the script. Your previous settings will be immediately restored, unaltered.\n**To validate permanently:** If your tests are conclusive, reopen the menu and press {PS / XBOX} to lock in the configuration."},{"type":"texte","style":"h2","contenu":"2. ⚡ Auto Save mode"},{"type":"texte","style":"p","contenu":"Every change is written immediately to EEPROM memory as soon as the menus are closed."},{"type":"carte","couleur":"orange","contenu":"⚠️ **Hardware warning:** Constantly writing to your Cronus Zen's EEPROM memory can speed up its physical wear in the long term. This is why this option is **disabled by default** in the script."}]},{"id":"vm-speed","titre":"⏱️ VM Speed (Execution Rate)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is VM Speed and how does it work?"},{"type":"texte","style":"p","contenu":"**VM Speed** (*Virtual Machine Speed*) defines the refresh rate at which the Cronus Zen's processor executes your script's code."},{"type":"texte","style":"h2","contenu":"🧠 Misconception: Does \"faster\" mean \"better\"?"},{"type":"texte","style":"p","contenu":"**No, not necessarily.** Setting the rate to the minimum does not guarantee better responsiveness and can sometimes overload the signal if your hardware can't keep up. Effectiveness depends on three key factors:\n\n1️⃣ **Your platform:** PC, PS5 or Xbox Series.\n\n2️⃣ **Your controller's refresh rate:** If your controller sends its data to the console every 8 ms (the typical case for many stock controllers), setting the Zen's VM Speed to 2 ms will bring no gain and will create useless duplicate signals.\n\n3️⃣ **The game's frames per second (FPS):** Actual in-game responsiveness remains capped by the graphics engine of the title you are playing."},{"type":"texte","style":"h2","contenu":"🎛️ The 4 rates available in the menu"},{"type":"liste","contenu":"🟢 **10 ms (Default):** Maximum stability, ideal rate for most games and standard controller setups.\n🔵 **8 ms:** Perfect synchronization with controllers natively running at 125 Hz (8 ms).\n🟡 **4 ms:** Increased responsiveness for competitive PC setups or high-refresh-rate monitors.\n🔴 **2 ms:** Ultra-fast rate (500 Hz) reserved for very high-end PC setups and high-frequency controllers."}]},{"id":"act-ads-fire","titre":"🔀 ADS + FIRE *(Aim + Shoot)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD triggers only when you press both triggers at the same time (**Aim AND Shoot**).\n**Ideal use case:** Perfect for AntiRecoil or Strafe Shot on automatic weapons when you engage in a full duel."}]},{"id":"act-ads","titre":"🎯 ADS *(Global aiming)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD activates as soon as you press the aim button (**ADS**), and stays active if you start shooting.\n**Ideal use case:** Ideal for AIM Abuse or the aim assist, which need to start working even before you pull the trigger."}]},{"id":"act-fire","titre":"💥 FIRE *(Global shooting)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD activates as soon as you press the fire button (**FIRE**), whether you are aiming or not.\n**Ideal use case:** Handy for RapidFire on pistols or shotguns, usable both hip-fire and while aiming."}]},{"id":"act-ads-only","titre":"🎯 ADS Only *(Aiming only)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD activates **only** when you hold the aim button alone. As soon as you press the fire button, the MOD cuts off instantly.\n**Ideal use case:** Useful for setting an aim assist during the spotting phase without interfering with recoil control when shooting."}]},{"id":"act-fire-only","titre":"💥 FIRE Only *(Hip-fire only)*","blocs":[{"type":"liste","contenu":"**How it works:** The MOD activates **only** when you hip-fire without aiming. If you press the aim button, the MOD stops immediately.\n**Ideal use case:** Perfect for a Drop Shot or a Jump Shot intended only for hip-fire fights at very close range."}]},{"id":"vibrations-adt","titre":"🚨⚠️ Enable your vibrations and adaptive triggers ⚠️🚨","blocs":[{"type":"texte","style":"h2","contenu":"⚠️ Essential settings in the console / platform AND in the game:"},{"type":"texte","style":"p","contenu":"Vibrations and adaptive triggers *(set to Standard / Normal)* **must be enabled** both in your console or platform's system settings and in your game's internal options menus.\n\n*Why?* Several of the script's advanced features (notably automatic detection of vehicles, shooting and weapon states) rely directly on these signals to work."},{"type":"carte","couleur":"jaune","contenu":"💡 **Tip if you don't like vibrations:** If you don't want to feel the physical shaking in your hands, **don't turn them off in the console or the game**! Disable them directly from the script's **Controller** OLED menu."},{"type":"texte","style":"h1","contenu":"🛠️ Settings paths by platform:"},{"type":"texte","style":"h2","contenu":"🎮 PlayStation 5 (PS5)","couleurHex":"#3d9bff","fondCouleur":"#3d9bff","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ **Console settings:**\n*Settings* ➔ *Accessories* ➔ *Controller (General)*"},{"type":"texte","style":"h3","contenu":"2️⃣ Settings to apply:"},{"type":"liste","contenu":"- **Vibration Intensity** ➔ **Standard (strong)**\n- **Trigger Effect Intensity** ➔ **Standard (strong)**"},{"type":"texte","style":"p","contenu":"3️⃣ **In the game:** Go to your game's audio/controller settings and check that **Vibration** and **Adaptive Trigger function** are set to **Yes / Enabled**."},{"type":"texte","style":"h2","contenu":"🎮 Xbox (Xbox Series X/S & Xbox One)","couleurHex":"#4ade5a","fondCouleur":"#4ade5a","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ **Console settings:**\nPress the Xbox button ➔ *Profile & system* ➔ *Settings* ➔ *Accessibility* ➔ *Controller* *(or via the Xbox Accessories app)*."},{"type":"texte","style":"h3","contenu":"2️⃣ Setting to apply:"},{"type":"liste","contenu":"- Check the **Enable vibration** box."},{"type":"texte","style":"p","contenu":"3️⃣ **In the game:** Go to your game's options/controller menu and enable the **Vibration** option."},{"type":"texte","style":"h2","contenu":"💻 PC (Steam players)","couleurHex":"#ff9f43","fondCouleur":"#ff9f43","fondOpacite":14},{"type":"texte","style":"p","contenu":"1️⃣ **Steam settings:**\nOpen Steam ➔ At the top left, click *Steam* ➔ *Settings* (Settings/Preferences) ➔ *Controller*."},{"type":"texte","style":"h3","contenu":"2️⃣ Settings to apply:"},{"type":"liste","contenu":"- Enable the **Steam Input** option for the relevant controllers.\n- In *General Controller Settings*, make sure **Vibration** (Rumble) is enabled."},{"type":"texte","style":"p","contenu":"3️⃣ **In the game:** In your PC game's options, make sure **Force Feedback / Vibration** is set to **Enabled**."}]},{"id":"quick-toggle","titre":"⏱️ The Quick Toggle menu (In-game shortcuts)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What are Quick Toggles and how do they work?"},{"type":"texte","style":"p","contenu":"**Quick Toggles** let you assign custom button combinations on your controller to enable or disable a MOD on the fly in the middle of combat, without ever opening the script menu on the OLED screen."},{"type":"texte","style":"h2","contenu":"🛠️ Setup in the menu"},{"type":"texte","style":"p","contenu":"In the **Quick Toggle** menu, you can set up to **4 independent shortcuts**:"},{"type":"liste","contenu":"**Line 1 (Shortcut):** Choose one of the 4 available button combinations.\n**Line 2 (Assigned MOD):** Select the MOD you want to link to this shortcut from the list of available MODs."},{"type":"texte","style":"h2","contenu":"⚙️ How to run a Quick Toggle in-game?"},{"type":"texte","style":"p","contenu":"1️⃣ **Enable / Disable:** In-game, hold the chosen button combination for **1 to 2 seconds**.\n\n2️⃣ **Visual confirmation:** Keep holding until the MOD's new state (*Enabled* or *Disabled*) is displayed directly on your Cronus Zen's OLED screen."}]},{"id":"activity-gta6-fishing","titre":"🎣 Fishing (Automatic fishing)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Fishing MOD and how does it work?"},{"type":"texte","style":"p","contenu":"The **Fishing** MOD automates the entire fishing process. It handles the slow reeling to attract the fish, the instant hook-set as soon as it bites, and quickly bringing it back to shore. The Cronus Zen's OLED screen shows the exact fishing state in real time."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"texte","style":"p","contenu":"1️⃣ **Setup:** Equip your fishing rod at the edge of a body of water.\n\n2️⃣ **Launch:** Open the script's **Activity** menu and start **Fishing** by pressing {CROSS / A}.\n\n3️⃣ **Preparation:** Select your lure or bait in the game.\n\n4️⃣ **Casting the line**: Hold {L2 / LT} then {R2 / RT}, then release {R2 / RT} to cast the line. Then release all the controller buttons."},{"type":"liste","contenu":"*Note: If you are not happy with the cast, press* {CIRCLE / B} *to cancel and cast your line again.*"},{"type":"texte","style":"h3","contenu":"5️⃣ Automatic handling by the script:"},{"type":"liste","contenu":"The script slowly reels for you to stimulate the fish.\nAs soon as a fish bites the hook, the script automatically sets the hook.\nThe script switches to fast reeling to bring the catch in as quickly as possible."},{"type":"texte","style":"p","contenu":"6️⃣ **Fighting the fish:** When the fish struggles, the script automatically stops reeling. Simply direct your stick to counter the fish's movements. As soon as it calms down, the script resumes fast reeling.\n\n7️⃣ **End of the catch:** Choose in-game whether to keep the fish or release it back into the water. Re-bait if necessary and cast your line again."}],"scripts":["gta6"]},{"id":"activity-gta6-bench-press","titre":"🏋️ Bench Press","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Bench Press MOD and how does it work?"},{"type":"texte","style":"p","contenu":"The **Bench Press** MOD automates the bench press workout activity in *GTA VI*.\n\nIt handles a perfect, steady rhythm for raising, holding and lowering the barbell, guaranteeing you optimize the increase of your character's strength stats without missing your reps."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"texte","style":"p","contenu":"1️⃣ **Setup:** Position your character on the weight bench in-game.\n\n2️⃣ **Launch:** In the script's **Activity** menu, navigate to **Bench Press** and confirm by pressing {CROSS / A}.\n\n3️⃣ **Starting the set:** Press {D-Pad DOWN} once to start the exercise sequence.\n\n4️⃣ **Automatic rhythm handling:** The script runs the following perfect loop:"},{"type":"liste","contenu":"- ⬆️ **Lift:** Gradual raising of the bar over **2 seconds**.\n- ⏸️ **Top pause:** Holding at the top position for **2 seconds**.\n- ⬇️ **Lowering:** Controlled lowering of the bar over **2 seconds**.\n- ⏸️ **Bottom pause:** Rest time at the bottom for **2 seconds**, then the cycle resumes."},{"type":"texte","style":"p","contenu":"5️⃣ **Stopping the exercise:** Press the {D-Pad UP} button to immediately stop the automatic loop at the end of your set."}],"scripts":["gta6"]},{"id":"switch-profile","titre":"🔄 The Switch Profile menu (FPS / TPS script)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is \"Switch Profile\"?"},{"type":"texte","style":"p","contenu":"**Switch Profile** is a powerful engine that lets you manage up to **3 distinct weapon profiles** in-game and define the exact method for switching from one to another."},{"type":"texte","style":"h2","contenu":"⚙️ How it works"},{"type":"texte","style":"p","contenu":"By default, you start with a single active profile (**Primary**).\n\nTo unlock the next profiles (**Secondary** and **Custom**), you just need to configure their switching mode. Once unlocked, each profile has its own independent settings in the **Profile MODs** menu.\n\nThe **Switch Profile** menu contains 3 main options:"},{"type":"texte","style":"h2","contenu":"1. 🔀 Prim/Sec BTN","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Defines the method for going from the **Primary** profile to the **Secondary** profile (or for returning to the last used profile after leaving the Custom profile).\n\n**Note:** Configuring this option automatically unlocks the Secondary profile in-game and in the *Profile MODs* menu.\n\nAvailable switching modes:"},{"type":"liste","contenu":"🔘 **Tap BTN:** A simple press of the chosen button.\n🔘🔘 **Dbl-tap BTN:** A quick double press of the chosen button.\n⏱️ **Hold BTN:** A held press of the chosen button.\n🔣 **Combination:** A combination of two buttons (hold one button + press another)."},{"type":"texte","style":"h2","contenu":"2. 🎯 Custom *(available after setting up Prim/Sec)*","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Defines the method for switching from the Primary or Secondary profile to the **Custom** profile (ideal for a pistol, a heavy weapon or a vehicle).\n\n**Note:** Configuring this option automatically unlocks the Custom profile in-game and in the *Profile MODs* menu.\n\nAvailable switching modes:"},{"type":"liste","contenu":"🔘🔘 **Dbl-tap BTN:** A quick double press of the chosen button.\n⏱️ **Hold BTN:** A held press of the chosen button.\n🔣 **Combination:** A combination of two buttons (hold one button + press another)."},{"type":"texte","style":"h2","contenu":"3. 🔄 Resync Profile *(available after setting up Prim/Sec)*","couleurHex":"#3ad1ff","fondCouleur":"#3ad1ff","fondOpacite":14},{"type":"texte","style":"p","contenu":"Lets you resynchronize your profiles in-game if an offset occurs (for example, if you pressed the weapon-change button during a cutscene or a loading screen)."},{"type":"liste","contenu":"🔣 **Combination:** Only *Combination* mode is offered. It lets you cycle through the profiles in a loop until you find the profile matching the weapon in your hand."},{"type":"carte","couleur":"orange","titre":"🛡️ Anti-conflict protection (Automatic duplicate handling)","contenu":"","blocs":[{"type":"texte","style":"p","contenu":"To avoid handling mistakes and guarantee perfect in-game compatibility, the menu includes an **active safeguard against button conflicts**: it is impossible to assign the same method **and** the same button to two different profiles.\n\n**How does the menu handle this automatically?** The script filters the options in real time and hides the buttons already in use:"},{"type":"liste","contenu":"**Tap / Dbl-tap / Hold:** Two profiles can use the same method (e.g. *Dbl-tap* for Prim/Sec and Custom), but they cannot use the same button. If you choose *Dbl-tap + Triangle* for *Prim/Sec*, the *Triangle* button will automatically disappear from the list of choices if you select *Dbl-tap* for *Custom*.\n**Combination:** Combinations can share the same held button (*Hold*), provided the tapped button (*Tap*) is different (and vice versa)."},{"type":"texte","style":"p","contenu":"💡 **In summary:** No risk of making a mistake! If a button does not appear in your menu, it is because it is already assigned to an identical method on another profile. This safeguard applies dynamically on **Prim/Sec**, **Custom** and **Resync**."}]}],"scripts":["fps-tps"]},{"id":"online-cheat","titre":"🌐 The Online Cheat menu (GTA Online)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Online Cheat and how does it work?"},{"type":"texte","style":"p","contenu":"**Online Cheat** is an interaction-menu automation module in *GTA Online*. It groups around **10 complex quick manipulations** that you would normally have to perform manually with the {D-Pad} by opening the interaction menu.\n\nThe script reproduces these sequences in a fraction of a second so you can equip yourself, heal or manage your gear without interrupting your fights."},{"type":"texte","style":"h2","contenu":"📋 Examples of automated actions"},{"type":"texte","style":"p","contenu":"Among the dozen shortcuts built into the script, you will find:"},{"type":"liste","contenu":"**🚁 Sparrow:** Automatically calls and spawns a Sparrow helicopter nearby from your inventory.\n🥽 **Thermal Vision:** Toggles the thermal vision helmet in the blink of an eye.\n🚘 **Personal Vehicle:** Requests the delivery driver or respawns your personal vehicle nearby."},{"type":"texte","style":"h2","contenu":"⚙️ How to run an Online Cheat?"},{"type":"texte","style":"p","contenu":"You have two activation methods to choose from:\n\n1️⃣ **From the OLED screen:** Navigate directly in the script's **Online Cheat** menu, select the desired Cheat and tap {CROSS / A} to launch the desired action.\n\n2️⃣ **Via a** [**Quick Cheat**](/gta5/quick-cheat/)*:* Assign the action to a custom controller shortcut in the [**Quick Cheat**](/gta5/quick-cheat/) menu for an instant launch in the heat of the action."}],"scripts":["gta5"]},{"id":"story-cheat","titre":"👤 The Story Cheat menu (GTA V Story Mode)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is Story Cheat and how does it work?"},{"type":"texte","style":"p","contenu":"**Story Cheat** includes all the official cheat codes of *GTA V*'s single-player mode. Instead of memorizing and tapping long button combinations on the controller, the script sends the complete sequence for you as soon as you select it."},{"type":"texte","style":"h2","contenu":"🗂️ Codes organized by category"},{"type":"texte","style":"p","contenu":"All the game's codes are listed and sorted into 4 distinct groups in the script menu:"},{"type":"liste","contenu":"🔫 **Weapon:** Get all weapons, explosive ammo, flaming bullets, etc.\n🏃 **Character:** Temporary invincibility, max health/armor, super jump, explosive punch (*Super Punch*), run/swim faster.\n🚗 **Vehicle:** Spawn any vehicle in the game (Buzzard, Comet, Sanchez, Trashmaster, etc.).\n🌀 **Misc:** Increase or decrease the wanted level, change the weather, low gravity, slow motion (*Slow Motion*)."},{"type":"texte","style":"h2","contenu":"⚙️ How to run a Story Cheat?"},{"type":"texte","style":"p","contenu":"You have two activation methods to choose from:\n\n1️⃣ **From the OLED screen:** Navigate directly in the script's Story Cheat menu, select the desired Cheat and tap {CROSS / A} to launch the desired action.\n\n2️⃣ **Via a** [**Quick Cheat**](/gta5/quick-cheat/)*:* Assign the action to a custom controller shortcut in the [**Quick Cheat**](/gta5/quick-cheat/) menu for an instant launch in the heat of the action."}],"scripts":["gta5"]},{"id":"quick-cheat","titre":"🚀 The Quick Cheat menu (In-game shortcuts)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is a Quick Cheat and how does it work?"},{"type":"texte","style":"p","contenu":"**Quick Cheat** works on the same principle as [**Quick Toggles**](page:quick-toggle). It lets you assign an action from the **Online Cheat** or **Story Cheat** menus to a dedicated button combination on your controller.\n\nInstead of having to open a menu in the middle of a fight, you just perform your shortcut and the action runs automatically in the background."},{"type":"texte","style":"h2","contenu":"🛠️ In-game usage example"},{"type":"liste","contenu":"**In the field:** You are being shot at in *GTA Online*.\n**Action:** Rather than opening the interaction menu to look for your armor, you simply perform your custom **Quick Cheat** shortcut.\n**Result:** The script puts your heavy armor back on instantly, while you keep moving and shooting."},{"type":"carte","couleur":"jaune","contenu":"💡 **Customization:** You can configure your **Quick Cheat** shortcuts directly in the script menu to keep your favorite functions (healing, armor, thermal vision or vehicle) at your fingertips."}],"scripts":["gta5"]},{"id":"five-finger-fillet","titre":"🔪 5 Finger Fillet (Knife game)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the 5 Finger Fillet MOD and how does it work?"},{"type":"texte","style":"p","contenu":"This MOD memorizes your opponents' button sequences in the knife game (*Five Finger Fillet*) and runs them automatically with perfect speed and accuracy, guaranteeing you win all your games with no risk of missing."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"texte","style":"p","contenu":"1️⃣ **Setup:** Approach a game table (for example in Strawberry). In the **Activity** menu, confirm **5 Finger Fillet** with {CROSS / A}, then sit at the table to start the game."},{"type":"texte","style":"h3","contenu":"2️⃣ Memorizing the sequence:"},{"type":"liste","contenu":"- Hold {R2 / RT} down during the opponent's demonstration.\n- While holding {R2 / RT}, enter **the last 5 buttons** of the combination (ignore the first button, which is always {CROSS / A})."},{"type":"texte","style":"p","contenu":"3️⃣ **Starting the turn:** When it is your turn to play, press the {D-Pad DOWN} button once to trigger the automatic sequence.\n\n4️⃣ **Ending the turn:** As soon as the sequence is finished and the round is won, press {D-Pad UP} to stop the loop.\n\n5️⃣ **Following rounds:** When the opponent offers a new sequence:"},{"type":"liste","contenu":"- Hold {R2 / RT} and press {L2 / LT} to erase the previous combination.\n- Hold {R2 / RT} again and enter the new 5-button sequence."}],"scripts":["rdr2"]},{"id":"cooking","titre":"🥩 Cooking (Automatic meat cooking)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Cooking MOD and how does it work?"},{"type":"texte","style":"p","contenu":"The **Cooking** MOD handles the chain cooking of your meats at the campfire. It saves you from having to hold the buttons by hand for long minutes when you need to prepare large stocks of food for your character."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"texte","style":"p","contenu":"1️⃣ **Setup:** Position your character in front of a campfire so as to open the cooking menu.\n\n2️⃣ **Launch:** In the **Activity** menu, start **Cooking** by pressing {CROSS / A}.\n\n3️⃣ **Meat selection:** Choose the meat you want to prepare and hold {CROSS / A} for 1 second to start the process."},{"type":"texte","style":"h3","contenu":"4️⃣ Choosing the save mode:"},{"type":"liste","contenu":"- **Store continuously:** Press {SQUARE / X} so that the script automatically stores each cooked piece in your inventory (default).\n- **Eat continuously:** Press {R2 / RT} so that your character directly consumes each preparation on the spot."}],"scripts":["rdr2"]},{"id":"gta6-activity-test","titre":"Activities in testing phase","scripts":["gta6"],"blocs":[{"type":"carte","couleur":"rouge","contenu":"🧪 **Activities in testing phase:** for now, all of the script's activities (**Fishing**, **Bench Press** and those to come) are in a testing phase. Their rhythms and button sequences will be refined and optimized as soon as the game is officially released."}]},{"id":"activity-rdr2-fishing","titre":"🎣 Fishing (Automatic fishing)","blocs":[{"type":"texte","style":"h2","contenu":"❓ What is the Fishing MOD and how does it work?"},{"type":"texte","style":"p","contenu":"The **Fishing** MOD automates the entire fishing process. It handles the slow reeling to attract the fish, the instant hook-set as soon as it bites, and quickly bringing it back to shore. The Cronus Zen's OLED screen shows the exact fishing state in real time."},{"type":"texte","style":"h2","contenu":"⚙️ Step-by-step procedure"},{"type":"texte","style":"p","contenu":"1️⃣ **Setup:** Equip your fishing rod at the edge of a body of water.\n\n2️⃣ **Launch:** Open the script's **Activity** menu and start **Fishing** by pre
